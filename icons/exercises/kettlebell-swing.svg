<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Kettlebell swing: hinge at the hips with a flat back, then snap the hips forward so the bell floats to chest height with straight arms">
  <!-- floor -->
  <line x1="16" y1="216" x2="224" y2="216" stroke-width="3" opacity=".5"/>
  <!-- start: hinged at the hips, flat back, bell swung back between the legs (faded, left) -->
  <g opacity=".3">
    <circle cx="36" cy="98" r="11"/>
    <path d="M46 106 L84 128"/>
    <path d="M84 128 L74 170 L72 212"/>
    <path d="M60 214 L86 214"/>
    <path d="M48 110 L86 166"/>
    <circle cx="94" cy="180" r="11"/>
    <path d="M86 172 C88 162 100 162 102 172"/>
  </g>
  <!-- finish: standing tall, hips through, straight arms, bell at chest height -->
  <circle cx="134" cy="44" r="11"/>
  <path d="M134 56 L136 126"/>
  <path d="M136 126 L128 170 L128 212 M136 126 L144 170 L146 212"/>
  <path d="M116 214 L140 214 M136 214 L158 214"/>
  <!-- straight arms forward -->
  <path d="M134 64 L194 76"/>
  <!-- kettlebell -->
  <circle cx="210" cy="86" r="12"/>
  <path d="M200 78 C202 66 218 66 220 78"/>
  <!-- movement arc from the hinge to the top -->
  <path d="M112 182 C150 176 186 150 200 112" stroke-width="3" opacity=".7"/>
  <path d="M192 120 L201 108 L206 122" stroke-width="3" opacity=".7"/>
</svg>
