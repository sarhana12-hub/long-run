<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Exercise drawings</title>
<style>
body{margin:0; background:#101511; color:#EAEFE9; font-family:Manrope,-apple-system,sans-serif; padding:16px;}
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:12px;}
.card{background:#1A211C; border:1px solid #2B342D; border-radius:14px; padding:10px;}
.card svg{width:100%; height:auto; display:block;}
.card .t{font-weight:700; font-size:12.5px; margin-top:6px;}
.card .s{font-size:11px; color:#8B9790; margin-top:2px; line-height:1.35;}
h1{font-size:16px; margin:0 0 12px;}
</style></head><body>
<h1>Exercise library drawings</h1>
<div class="grid" id="grid"></div>
<script src="../../engine.js"></script>
<script src="../../library.js"></script>
<script>
const grid = document.getElementById('grid');
Object.keys(EXERCISE_LIBRARY).forEach(name=>{
  const e = EXERCISE_LIBRARY[name];
  const add = (art, label) => { const d = document.createElement('div'); d.className='card'; d.innerHTML = exerciseSvg(art, name) + `<div class="t">${name}${label?' · '+label:''}</div><div class="s">${e.summary}</div>`; grid.appendChild(d); };
  add(e.art, e.art.view==='front' ? 'front' : 'side');
  if(e.art2) add(e.art2, e.art2.view==='front' ? 'front' : 'side');
});
</script>
</body></html>
