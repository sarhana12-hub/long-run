        else if(diff>0 && diff<=2){ days[i] = {...days[i], type:diff===1?'rest':'easy', km:diff===1?0:round1(Math.min(3,achievablePeakLongKm*0.15)), strength:false, strides:false, easyRole:null, label:diff===1?'Rest':'Shakeout Jog'}; }
        else if(diff<0){ days[i] = {...days[i], type:'rest', km:0, strength:false, strides:false, easyRole:null, label:'Rest'}; }
      }
    }

    days.forEach(day=>{ Object.assign(day, buildWorkoutMeta(day, raceKm)); });

    weeks.push({weekIndex:w, phase, isCutback: w<buildWeeksCount && !!cutbackFlags[w], weekStart:fmtDate(weekStart), targetKm:round1(days.reduce((s,d)=>s+d.km,0)), paces:weekPaces, days});
  }

  return {
    generatedAt:new Date().toISOString(), raceDate:setup.raceDate, raceDistanceKm:raceKm, totalWeeks,
    startVdot, endVdot, buildWeeksCount, rampWeeks,
    goalRacePerKm: (setup.goalTimeSec && raceKm) ? setup.goalTimeSec/raceKm : null,
    paces:weeks[0].paces, weeks,
  };
}

/* ============================= general (non-race) plans ============================= */
// Four goal-driven plan kinds for runners not training toward a specific race. Each
// produces the exact same plan/week/day shape generatePlan() does (so every existing
// render/progress/pace-tracker/milestone codepath works unmodified) but through its own,
// much simpler week-by-week logic — deliberately NOT threaded through generatePlan()
// itself, since that function's taper/race-week/emphasis-dial machinery doesn't apply
// here and forcing it through would risk the working race path for no benefit.
const PLAN_KIND_META = {
  speed:      { label:'Build Speed',    weeksMin:4, weeksMax:16, weeksDefault:8,  hint:'6–12 weeks is the typical effective window for a focused speed block.' },
  distance:   { label:'Build Distance', weeksMin:4, weeksMax:52, weeksDefault:10, hint:'Longer, patient ramps are safer than short aggressive ones.' },
  maintenance:{ label:'Maintenance',    weeksMin:1, weeksMax:52, weeksDefault:6,  hint:'No natural end point — regenerate to keep going whenever you like.' },
  recovery:   { label:'Recovery',       weeksMin:1, weeksMax:6,  weeksDefault:2,  hint:'Past 4 weeks this stops being "recovery" — consider Maintenance or Build Distance instead.' },
};

// Shared by all four: builds one week's 7 days from a target weekly volume and an already-
// decided long-run km, splitting whatever's left over evenly across easy days (a simpler
// split than the race generator's recovery/aerobic distinction — appropriate here since
// these plans don't have a single race-specific long run to protect the day after).
function buildGeneralWeekDays(weekStart, weeklyKm, longKm, longDow, quality, strengthDows, strengthPerWeek, runsPerWeek, addStrides){
  const days = [];
  for(let d=0; d<7; d++){
    const date = addDays(weekStart, d);
    days.push({id:uid(), date:fmtDate(date), dow:date.getDay(), type:'rest', km:0, strength:false, label:'Rest'});
  }
  const longIdx = days.findIndex(x=>x.dow===longDow);
  let remaining = Math.max(0, weeklyKm-longKm);

  const qualityIdxs = [];
  quality.forEach(q=>{
    let idx = days.findIndex((x,i)=>x.dow===q.dow && x.type==='rest' && !qualityIdxs.includes(i));
    if(idx!==-1 && idx!==longIdx){
      // Same guaranteed-warm-up treatment as race plans (see WARMUP_ELIGIBLE_TYPES) -
      // funded from this week's easy-day distance, q.km itself stays the calibrated
      // quality-only budget. General plans have no single race distance, so 10 matches
      // the same placeholder already used for buildWorkoutMeta calls below.
      const warmupKm = warmupFundingKm(q.type, q.km, 10);
      const km = round1(q.km + warmupKm);
      days[idx] = {...days[idx], type:q.type, km, label:TYPE_META[q.type].label, warmupKm};
      qualityIdxs.push(idx);
      remaining = Math.max(0, remaining-km);
    }
  });

  const usedRunDays = 1 + qualityIdxs.length;
  const easyDaysNeeded = Math.max(0, runsPerWeek-usedRunDays);
  const candidateIdxs = days.map((x,i)=>i).filter(i=>i!==longIdx && !qualityIdxs.includes(i));
  const easyIdxs = candidateIdxs.slice(0, easyDaysNeeded);
  // Same strides-funding treatment as race plans - trimmed from the shared easy-day pool
  // before it's split up, credited back onto whichever single easy day (n===0) actually
  // gets strides.
  if(addStrides) remaining = Math.max(0, remaining - STRIDES_EXTRA_KM);
  const easyKmEach = easyIdxs.length ? round1(remaining/easyIdxs.length) : 0;
  easyIdxs.forEach((i,n)=>{ const hasStrides = addStrides && n===0; days[i] = {...days[i], type:'easy', km: hasStrides ? round1(easyKmEach+STRIDES_EXTRA_KM) : easyKmEach, label:'Easy Run', easyRole:'easy', strides: hasStrides}; });

  days[longIdx] = {...days[longIdx], type:'long', km:round1(longKm), label:'Long Run'};

  let strengthLeft = strengthPerWeek;
  strengthDows.forEach(dw=>{
    if(strengthLeft<=0) return;
    const idx = days.findIndex(x=>x.dow===dw && !QUALITY_TYPES.includes(x.type));
    if(idx!==-1){
      days[idx].strength = true;
      if(isLegDemandingDay(days[idx]) || isLegDemandingDay(days[(idx+1)%7])) days[idx].strengthFocus = 'upper';
      strengthLeft--;
    }
  });

  return days;
}

function finishGeneralPlan(setup, weeks, startVdot, endVdot){
  const lastDay = weeks[weeks.length-1].days[6];
  return {
    generatedAt:new Date().toISOString(), planKind:setup.planKind,
    raceDate:lastDay.date, raceDistanceKm:null, totalWeeks:weeks.length,
    startVdot, endVdot, buildWeeksCount:weeks.length, rampWeeks:Math.max(weeks.length-1,1),
    goalRacePerKm:null, paces:weeks[0].paces, weeks,
  };
}

// Build Speed: block/wave periodization (3 weeks progressive build + 1 cutback,
// repeating) rather than one long linear ramp — real speed-development blocks show
// diminishing returns past ~8-12 weeks of continuous escalation, and an unbroken ramp
// with no unloading week is how overuse injuries happen. Each new 4-week cycle starts a
// little higher than the last (a net upward wave), not a full reset. Two quality sessions
// a week plus 2x/week strength (heavy compound lifts / plyometrics) - the evidence-backed
// dose for running-economy gains without crowding out the running itself.
// Picks whichever remaining day sits at least 48h from every day already in `hardDows`
// (ties broken toward the first/lowest-index candidate) - used both for the second
// quality session (avoiding the long run and primary speed day) and for strength
// placement (avoiding all three hard days at once, not just the two the generic
// deriveScheduleFromLongDow helper knows about).
function furthestDow(hardDows, exclude){
  let best = null, bestScore = -1;
  for(let dow=0; dow<7; dow++){
    if(hardDows.includes(dow) || (exclude||[]).includes(dow)) continue;
    const score = Math.min(...hardDows.map(h=>circularDayDist(dow,h)));
    if(score>bestScore){ bestScore=score; best=dow; }
  }
  return best;
}

function generateSpeedPlan(setup){
  const currentKm = setup.currentWeeklyKm;
  const weeks = setup.weeks;
  const longDow = setup.longDow ?? 0;
  const speedDow = setup.speedDow ?? 3;
  const runsPerWeek = setup.runsPerWeek || runsPerWeekFor(currentKm);
  const startVdot = baseVdot(setup);
  const endVdot = startVdot * (1 + clamp(weeks*0.006, 0, 0.06));
  const weekStart0 = startOfWeek(todayDate());

  // Constant across the whole plan (a function of longDow/speedDow only), so computed
  // once rather than re-derived every week.
  const secondDow = furthestDow([longDow, speedDow]);
  const hardDows = [longDow, speedDow, secondDow];
  // With three hard-effort days already claiming/flanking most of the week, a strength
  // day fully 48h clear of all three isn't always possible - same tension the "high"
  // speed-emphasis race plans already accept. Prefer the day right after a hard day
  // (pairs with its own recovery, the ideal placement) before falling back to whatever's
  // least-bad; buildGeneralWeekDays' strengthFocus still catches anything left over and
  // marks it upper body/core instead of leaving it as an unaddressed conflict.
  const idealOrder = hardDows.map(h=>(h+1)%7);
  const badDows = new Set([...hardDows, ...hardDows.map(h=>(h+6)%7)]);
  const strengthDows = [];
  idealOrder.forEach(dw=>{ if(strengthDows.length<2 && !strengthDows.includes(dw) && !badDows.has(dw)) strengthDows.push(dw); });
  for(let offset=0; offset<7 && strengthDows.length<2; offset++){
    const dw=(longDow+offset)%7;
    if(!strengthDows.includes(dw) && !badDows.has(dw)) strengthDows.push(dw);
  }
  for(let offset=0; offset<7 && strengthDows.length<2; offset++){
    const dw=(longDow+offset)%7;
    if(!strengthDows.includes(dw) && !hardDows.includes(dw)) strengthDows.push(dw);
  }

  const weekList = [];
  for(let w=0; w<weeks; w++){
    const weekStart = addDays(weekStart0, w*7);
    const cycleIdx = Math.floor(w/4), weekInCycle = w%4;
    const isCutback = weekInCycle===3;
    const cycleBonus = clamp(cycleIdx*0.04, 0, 0.16);
    const weeklyKm = isCutback
      ? round1(currentKm*(1+cycleBonus)*0.85)
      : round1(currentKm*(1+cycleBonus)*(1+0.05*(weekInCycle/2)));

    const frac = weeks<=1 ? 1 : clamp(w/(weeks-1), 0, 1);
    const weekVdot = startVdot + (endVdot-startVdot)*frac;
    const weekPaces = paceZonesFromVdot(weekVdot);

    const longKm = round1(Math.min(weeklyKm*0.25, currentKm*0.30));
    const primaryType = BUILD_ROTATION[w % BUILD_ROTATION.length];
    const primaryKm = round1(Math.min((weeklyKm-longKm)*0.35, 8));
    const quality = [{dow:speedDow, type:primaryType, km:primaryKm}];
    if(!isCutback){
      const secondType = BUILD_ROTATION[(w+1) % BUILD_ROTATION.length];
      quality.push({dow:secondDow, type:secondType, km:round1(primaryKm*0.6)});
    }

    const days = buildGeneralWeekDays(weekStart, weeklyKm, longKm, longDow, quality, strengthDows, 2, runsPerWeek, true);
    days.forEach(day=>{ Object.assign(day, buildWorkoutMeta(day, 10)); });
    weekPaces.racePerKm = null;
    weekList.push({weekIndex:w, phase:isCutback?'cutback':'build', isCutback, weekStart:fmtDate(weekStart), targetKm:round1(days.reduce((s,d)=>s+d.km,0)), paces:weekPaces, days});
  }
  return finishGeneralPlan(setup, weekList, startVdot, endVdot);
}

// Build Distance: ramps whichever metric the user cares about (weekly mileage or
// longest run) from their current value to a target by a chosen week, using a smooth
// compound growth curve (so the final week lands exactly on target rather than
// approaching it asymptotically) with the usual every-4th-week cutback dipping below
// that curve, not resetting it. The metric NOT chosen as primary still moves in step
// underneath it - a long run can't grow in isolation from weekly volume, and vice versa.
const DISTANCE_LONG_FRACTION = 0.28;
function generateDistancePlan(setup){
  const weeks = setup.weeks;
  const longDow = setup.longDow ?? 0;
  const strengthDows = setup.strengthDows ?? [1,4];
  const startVdot = baseVdot(setup);
  const weekStart0 = startOfWeek(todayDate());
  const metric = setup.distanceGoalMetric;
  const fromKm = setup.distanceGoalCurrentKm, toKm = setup.distanceGoalTargetKm;

  const weekList = [];
  for(let w=0; w<weeks; w++){
    const weekStart = addDays(weekStart0, w*7);
    const t = weeks<=1 ? 1 : w/(weeks-1);
    const smoothTargetVal = fromKm * Math.pow(toKm/fromKm, t);
    const isCutback = w>0 && w<weeks-1 && (w%4===3);
    const targetVal = isCutback ? Math.max(fromKm, smoothTargetVal*0.82) : smoothTargetVal;

    let weeklyKm, longKm;
    if(metric==='longest'){
      longKm = round1(targetVal);
      weeklyKm = round1(longKm/DISTANCE_LONG_FRACTION);
    } else {
      weeklyKm = round1(targetVal);
      longKm = round1(weeklyKm*DISTANCE_LONG_FRACTION);
    }
    const runsPerWeek = setup.runsPerWeek || runsPerWeekFor(weeklyKm);

    const days = buildGeneralWeekDays(weekStart, weeklyKm, longKm, longDow, [], strengthDows, 1, runsPerWeek, true);
    days.forEach(day=>{ Object.assign(day, buildWorkoutMeta(day, 10)); });
    const weekPaces = paceZonesFromVdot(startVdot);
    weekPaces.racePerKm = null;
    weekList.push({weekIndex:w, phase:isCutback?'cutback':'base', isCutback, weekStart:fmtDate(weekStart), targetKm:round1(days.reduce((s,d)=>s+d.km,0)), paces:weekPaces, days});
  }
  return finishGeneralPlan(setup, weekList, startVdot, startVdot);
}
// Whether a weekly-mileage or longest-run goal is a safe ask for the given number of
// weeks, using the standard ~10%/week safe-progression guideline. Returns null when
// fine, or a message to show inline (the explicit-warning behavior, not a silent clamp).
function distanceGoalWarning(fromKm, toKm, weeks){
  if(!fromKm || !toKm || !weeks || toKm<=fromKm) return null;
  const weeksNeeded = Math.ceil(Math.log(toKm/fromKm)/Math.log(1.10));
  if(weeks < weeksNeeded){
    return `That's a bigger jump than is safe in ${weeks} week${weeks===1?'':'s'} — try at least ${weeksNeeded} weeks, or a lower target.`;
  }
  return null;
}

// Maintenance: deliberately flat, not progressive - the point is holding fitness
// steady, so weekly volume doesn't ramp and there's no cutback week (nothing being
// built up that needs unloading). One moderate tempo session a week keeps fitness
// markers from eroding without asking for anything new.
function generateMaintenancePlan(setup){
  const weeks = setup.weeks;
  const currentKm = setup.currentWeeklyKm;
  const longDow = setup.longDow ?? 0;
  const speedDow = setup.speedDow ?? 3;
  const strengthDows = setup.strengthDows ?? [1,4];
  const runsPerWeek = setup.runsPerWeek || runsPerWeekFor(currentKm);
  const startVdot = baseVdot(setup);
  const weekStart0 = startOfWeek(todayDate());
  const longKm = round1(currentKm*DISTANCE_LONG_FRACTION);
  const weekPaces = paceZonesFromVdot(startVdot);
  weekPaces.racePerKm = null;

  const weekList = [];
  for(let w=0; w<weeks; w++){
    const weekStart = addDays(weekStart0, w*7);
    const quality = [{dow:speedDow, type:'tempo', km:round1(Math.min((currentKm-longKm)*0.3, 6))}];
    const days = buildGeneralWeekDays(weekStart, currentKm, longKm, longDow, quality, strengthDows, 1, runsPerWeek, false);
    days.forEach(day=>{ Object.assign(day, buildWorkoutMeta(day, 10)); });
    weekList.push({weekIndex:w, phase:'maintenance', isCutback:false, weekStart:fmtDate(weekStart), targetKm:round1(days.reduce((s,d)=>s+d.km,0)), paces:weekPaces, days});
  }
  return finishGeneralPlan(setup, weekList, startVdot, startVdot);
}

// Recovery: meaningfully reduced volume and zero hard efforts - no intervals, tempo,
// hills, or fartlek, just easy running (including the "long" day, deliberately run at
// easy pace here rather than this app's usual marathon-adjacent long-run pace). Starts
// around 55% of pre-recovery mileage and steps gently back up toward ~75% by the end,
// rather than staying flat the whole block or ramping back to full volume - the point is
// full recovery, not a compressed return-to-training plan.
function generateRecoveryPlan(setup){
  const weeks = setup.weeks;
  const baselineKm = setup.currentWeeklyKm;
  const longDow = setup.longDow ?? 0;
  const startVdot = baseVdot(setup);
  const weekStart0 = startOfWeek(todayDate());
  const runsPerWeek = clamp((setup.runsPerWeek || runsPerWeekFor(baselineKm))-1, 3, 4);
  const weekPaces = paceZonesFromVdot(startVdot);
  weekPaces.racePerKm = null;

  const weekList = [];
  for(let w=0; w<weeks; w++){
    const weekStart = addDays(weekStart0, w*7);
    const t = weeks<=1 ? 1 : w/(weeks-1);
    const weeklyKm = round1(baselineKm*(0.55+0.20*t));
    const longKm = round1(weeklyKm*DISTANCE_LONG_FRACTION);
    const days = buildGeneralWeekDays(weekStart, weeklyKm, longKm, longDow, [], [], 0, runsPerWeek, false);
    days.forEach(day=>{
      if(day.type==='long') day.paceKeyOverride = true; // easy-pace long run, not marathon-adjacent
      Object.assign(day, buildWorkoutMeta(day, 10));
      if(day.paceKeyOverride) day.paceKey = 'easyPerKm';
    });
    weekList.push({weekIndex:w, phase:'recovery', isCutback:false, weekStart:fmtDate(weekStart), targetKm:round1(days.reduce((s,d)=>s+d.km,0)), paces:weekPaces, days});
  }
  return finishGeneralPlan(setup, weekList, startVdot, startVdot);
}

function generateGeneralPlan(setup){
  if(setup.planKind==='speed') return generateSpeedPlan(setup);
  if(setup.planKind==='distance') return generateDistancePlan(setup);
  if(setup.planKind==='maintenance') return generateMaintenancePlan(setup);
  if(setup.planKind==='recovery') return generateRecoveryPlan(setup);
  return generatePlan(setup);
}

/* ============================= storage layer (local only) ============================= */
const Store = {
  _get(key, fallback){ try{ const v = localStorage.getItem(key); return v==null? fallback : JSON.parse(v); }catch(e){ return fallback; } },
  _set(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} },

  getName(){ return this._get('lr_name', ''); },
  setName(name){ this._set('lr_name', name); },
  getPaceFormat(){ return this._get('lr_pace_format', 'pace'); },
  setPaceFormat(fmt){ this._set('lr_pace_format', fmt); },
  getSetup(){ return this._get('lr_setup', null); },
  setSetup(setup){ this._set('lr_setup', setup); },
  getPlan(){ return this._get('lr_plan', null); },
  setPlan(plan){ this._set('lr_plan', plan); },
  getLogs(){ return this._get('lr_logs', []); },
  addLog(entry){
    const logs = this.getLogs();
    const item = {id:'l_'+uid(), ...entry};
    logs.unshift(item);
    this._set('lr_logs', logs);
    return item;
  },
  deleteLog(id){
    const logs = this.getLogs().filter(l=>l.id!==id);
    this._set('lr_logs', logs);
  },
  setLogs(logs){ this._set('lr_logs', logs); },
  // Legacy boolean-flag milestone tracker, superseded by getAchievementLog below - kept
  // only so loadState can migrate a device that already has one into the new system
  // without re-firing popups for things already celebrated once.
  getMilestonesShown(){ return this._get('lr_milestones', {halfway:false, arrived:false, firstRun:false, weeksHit:[]}); },
  // Dates (YYYY-MM-DD) the user has explicitly marked a strength session as actually
  // completed - day.strength on the plan itself only ever means "scheduled," this is the
  // separate "did it happen" record, since a strength day (including a rest day with
  // strength attached) has no run to log against.
  getStrengthDone(){ return this._get('lr_strength_done', []); },
  setStrengthDone(v){ this._set('lr_strength_done', v); },
  // One entry per time an achievement fires: {key, date, detail?}. Repeatable
  // achievements (a new PR, a new week hit) simply get another entry with the same key -
  // this is a log, not a set, so the gallery can show full history if it ever wants to.
  getAchievementLog(){ return this._get('lr_achievement_log', []); },
  setAchievementLog(v){ this._set('lr_achievement_log', v); },
  getStravaAuth(){ return this._get('lr_strava_auth', null); },
  setStravaAuth(auth){ this._set('lr_strava_auth', auth); },
  clearStravaAuth(){ localStorage.removeItem('lr_strava_auth'); },
  resetAll(){
    localStorage.removeItem('lr_name');
    localStorage.removeItem('lr_setup');
    localStorage.removeItem('lr_plan');
    localStorage.removeItem('lr_logs');
    localStorage.removeItem('lr_milestones');
    localStorage.removeItem('lr_strength_done');
    localStorage.removeItem('lr_achievement_log');
    localStorage.removeItem('lr_strava_auth');
  }
};

/* ============================= bootstrap ============================= */
function boot(){
  if('serviceWorker' in navigator){
    // updateViaCache:'none' bypasses GitHub Pages' Cache-Control: max-age=600
    // when checking sw.js for changes; reg.update() forces an immediate
    // check; auto-reload on controllerchange applies an update as soon as
    // it activates, instead of requiring a manual reopen.
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg)=>{
      reg.update();
      let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', ()=>{
        if (reloaded) return;
        reloaded = true;
        location.reload();
      });
    }).catch(()=>{});
  }
  state.name = Store.getName();
  state.paceFormat = Store.getPaceFormat();
  const setup = Store.getSetup();
  const plan = Store.getPlan();
  state.logs = Store.getLogs();
  state.strengthDone = Store.getStrengthDone();
  state.achievementLog = Store.getAchievementLog();
  // One-time migration from the old boolean-flag milestone tracker: a device that already
  // celebrated these under the old system shouldn't see them pop up again just because the
  // new achievement log starts empty. Backfilled entries use today's date as a stand-in
  // since the old system never recorded when something was actually earned.
  if(state.achievementLog.length===0){
    const legacy = Store.getMilestonesShown();
    const todayStr = fmtDate(todayDate());
    const migrated = [];
    if(legacy.firstRun) migrated.push({key:'first-run', date:todayStr});
    if(legacy.halfway) migrated.push({key:'halfway', date:todayStr});
    if(legacy.arrived) migrated.push({key:'plan-complete', date:todayStr});
    (legacy.weeksHit||[]).forEach(ws=>migrated.push({key:'week-fully-hit', date:ws}));
    if(migrated.length){ state.achievementLog = migrated; Store.setAchievementLog(migrated); }
  }
  state.stravaAuth = Store.getStravaAuth();
  if(setup && plan){
    state.setup = setup; state.plan = plan;
    const today = todayDate();
    let idx = plan.weeks.findIndex(w=>{ const ws=parseDate(w.weekStart); return today>=ws && today<addDays(ws,7); });
    state.currentWeekIndex = idx===-1?0:idx;
    state.view = 'app'; state.tab='plan';
  } else {
    state.view = 'onboarding';
    state.onboardDraft = defaultDraft();
    state.onboardStep = 1;
  }
  render();
  handleStravaRedirect();
}

/* ============================= strava ============================= */
function stravaConnectUrl(){
  const params = new URLSearchParams({
    client_id: STRAVA_CLIENT_ID,
    redirect_uri: STRAVA_REDIRECT_URI,
    response_type: 'code',
    approval_prompt: 'auto',
    scope: STRAVA_SCOPE,
  });
  return `https://www.strava.com/oauth/authorize?${params.toString()}`;
}

async function stravaTokenRequest(body){
  const res = await fetch(STRAVA_WORKER_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(()=>null);
  if(!res.ok || !data || !data.access_token) throw new Error((data && data.error) || 'Strava connection failed');
  return {access_token:data.access_token, refresh_token:data.refresh_token, expires_at:data.expires_at};
}

// After Strava redirects back with ?code=..., exchange it via the worker and store the
// result exactly like any other local data — nothing about a connected account lives
// anywhere but this browser.
async function handleStravaRedirect(){
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  if(!code) return;
  window.history.replaceState({}, '', window.location.origin + window.location.pathname);
  try{
    const auth = await stravaTokenRequest({action:'exchange', code});
    state.stravaAuth = auth;
    Store.setStravaAuth(auth);
    showToast('Connected to Strava');
  }catch(e){
    showToast('Could not connect to Strava — try again');
  }
}

// Returns a usable access token, silently refreshing first if the stored one has
// expired (or is about to) - the only network round trip the user should ever notice
// is the one this piggybacks on (opening the import list).
async function ensureStravaToken(){
  const auth = state.stravaAuth;
  if(!auth) return null;
  const nowSec = Math.floor(Date.now()/1000);
  if(auth.expires_at && auth.expires_at > nowSec+60) return auth.access_token;
  try{
    const fresh = await stravaTokenRequest({action:'refresh', refresh_token:auth.refresh_token});
    state.stravaAuth = fresh;
    Store.setStravaAuth(fresh);
    return fresh.access_token;
  }catch(e){
    return null;
  }
}

// Recent running activities from Strava, mapped into this app's own log shape and
// filtered to runs not already imported (by stravaId) so a picked run can't be
// double-logged just by showing up in the list twice.
async function fetchStravaRuns(){
  const token = await ensureStravaToken();
  if(!token) throw new Error('not-connected');
  const res = await fetch('https://www.strava.com/api/v3/athlete/activities?per_page=15', {
    headers:{ Authorization:`Bearer ${token}` },
  });
  if(!res.ok) throw new Error('strava-request-failed');
  const activities = await res.json();
  const importedIds = new Set(state.logs.map(l=>l.stravaId).filter(Boolean));
  return activities
    .filter(a => (a.type==='Run' || a.sport_type==='Run') && !importedIds.has(a.id))
    .map(a => ({
      id: a.id,
      name: a.name,
      date: a.start_date_local.slice(0,10), // local wall-clock date, no timezone math needed
      distanceKm: a.distance/1000,
      durationSec: a.moving_time,
    }));
}

// Reverse of submitOnboarding's setup-building - rebuilds an onboarding draft from an
// existing setup, for the "Change plan" flow (re-enter onboarding prefilled with current
// values rather than starting from scratch, and without touching state.logs at all).
function draftFromSetup(setup){
  const matchedRecent = RACE_PRESETS.slice(0,5).find(r=>setup.recentDistanceKm && Math.abs(r.km-setup.recentDistanceKm)<0.05);
  const common = {
    ...defaultDraft(),
    units: setup.units,
    currentWeeklyMi: round1(kmToUnit(setup.currentWeeklyKm, setup.units)),
    recentDistanceKey: matchedRecent ? matchedRecent.key : '5k',
    recentTime: setup.recentTimeSec ? secToClock(setup.recentTimeSec) : '',
    longDow: setup.longDow,
    restDays: clamp(7 - (setup.runsPerWeek || runsPerWeekFor(setup.currentWeeklyKm)), 1, 4),
  };
  if(isGeneralPlan(setup)){
    const draft = {...common, goalMode:'general', planKind:setup.planKind, weeks:setup.weeks};
    if(setup.planKind==='distance'){
      draft.distanceGoalMetric = setup.distanceGoalMetric;
      draft.distanceGoalCurrentMi = round1(kmToUnit(setup.distanceGoalCurrentKm, setup.units));
      draft.distanceGoalTargetMi = round1(kmToUnit(setup.distanceGoalTargetKm, setup.units));
    }
    return draft;
  }
  return {
    ...common, goalMode:'race',
    raceKey: setup.raceKey, raceDistanceKm: setup.raceDistanceKm, raceDate: setup.raceDate,
    goalTime: setup.goalTimeSec ? secToClock(setup.goalTimeSec) : '',
    maxLongRunMi: setup.maxLongRunKm ? round1(kmToUnit(setup.maxLongRunKm,setup.units)) : '',
    maxWeeklyMi: setup.maxWeeklyKm ? round1(kmToUnit(setup.maxWeeklyKm,setup.units)) : '',
    longRunEmphasis: setup.longRunEmphasis || 'balanced', speedEmphasis: setup.speedEmphasis || 'balanced',
    strengthPerWeek: setup.strengthPerWeek==null ? 2 : setup.strengthPerWeek,
    hillsMode: setup.hillsMode || 'flat',
    skipBase: !!setup.skipBase,
  };
}
const LONG_DISTANCE_CAP_THRESHOLD_KM = 21.0975; // half marathon and up get optional long-run/volume caps

// Same required-field checks submitOnboarding() makes at the end, run per-step so
// "Next" catches a missing name/date on step 1 instead of bouncing back from step 3.
function onboardStepError(step){
  const d = state.onboardDraft;
  if(step===1){
    if(!d.name || !d.name.trim()) return 'Enter your name';
    if(d.goalMode==='race'){
      if(!d.raceDate) return 'Pick a race date first';
    } else {
      const meta = PLAN_KIND_META[d.planKind];
      const weeks = Number(d.weeks);
      if(!weeks || weeks<meta.weeksMin) return `Enter at least ${meta.weeksMin} week${meta.weeksMin===1?'':'s'}`;
    }
  }
  if(step===2 && d.goalMode==='general' && d.planKind==='distance'){
    if(!d.distanceGoalTargetMi) return 'Enter a target to build toward';
  }
  return null;
}

/* ============================= onboarding submit ============================= */
function submitOnboarding(){
  const d = state.onboardDraft;
  if(!d.name || !d.name.trim()){ showToast('Enter your name'); return; }
  const recentPreset = RACE_PRESETS.find(r=>r.key===d.recentDistanceKey);
  const recentSec = parseDurationToSec(d.recentTime);
  let setup, plan;

  if(d.goalMode==='general'){
    const weeks = clamp(Number(d.weeks)||PLAN_KIND_META[d.planKind].weeksDefault, PLAN_KIND_META[d.planKind].weeksMin, PLAN_KIND_META[d.planKind].weeksMax);
    setup = {
      planKind: d.planKind, units: d.units, weeks,
      currentWeeklyKm: unitToKm(Number(d.currentWeeklyMi)||0, d.units),
      recentDistanceKm: recentPreset? recentPreset.km : null,
      recentTimeSec: recentSec,
      longDow: d.longDow, ...deriveScheduleFromLongDow(d.longDow, d.planKind==='speed'?2:1),
      runsPerWeek: clamp(7 - d.restDays, 3, 6),
    };
    if(d.planKind==='distance'){
      if(!d.distanceGoalTargetMi){ showToast('Enter a target to build toward'); return; }
      const currentVal = d.distanceGoalMetric==='weekly' ? d.currentWeeklyMi : d.distanceGoalCurrentMi;
      setup.distanceGoalMetric = d.distanceGoalMetric;
      setup.distanceGoalCurrentKm = unitToKm(Number(currentVal)||0, d.units);
      setup.distanceGoalTargetKm = unitToKm(Number(d.distanceGoalTargetMi)||0, d.units);
    }
    plan = generateGeneralPlan(setup);
  } else {
    if(!d.raceDate){ showToast('Pick a race date first'); return; }
    const goalSec = parseDurationToSec(d.goalTime);
    setup = {
      units: d.units,
      raceKey: d.raceKey,
      raceDistanceKm: d.raceDistanceKm,
      raceDate: d.raceDate,
      currentWeeklyKm: unitToKm(Number(d.currentWeeklyMi)||0, d.units),
      recentDistanceKm: recentPreset? recentPreset.km : null,
      recentTimeSec: recentSec,
      goalTimeSec: goalSec,
      longDow: d.longDow, ...deriveScheduleFromLongDow(d.longDow, d.strengthPerWeek),
      runsPerWeek: clamp(7 - d.restDays, 3, 6), strengthPerWeek: d.strengthPerWeek,
      maxLongRunKm: (d.raceDistanceKm>=LONG_DISTANCE_CAP_THRESHOLD_KM && d.maxLongRunMi) ? unitToKm(Number(d.maxLongRunMi), d.units) : null,
      maxWeeklyKm: (d.raceDistanceKm>=LONG_DISTANCE_CAP_THRESHOLD_KM && d.maxWeeklyMi) ? unitToKm(Number(d.maxWeeklyMi), d.units) : null,
      longRunEmphasis: d.longRunEmphasis, speedEmphasis: d.speedEmphasis,
      hillsMode: d.hillsMode, skipBase: d.skipBase,
    };
    plan = generatePlan(setup);
  }
  state.name = d.name.trim();
  Store.setName(state.name);
  Store.setSetup(setup);
  Store.setPlan(plan);
  state.setup = setup; state.plan = plan;
  const today = todayDate();
  let idx = plan.weeks.findIndex(w=>{ const ws=parseDate(w.weekStart); return today>=ws && today<addDays(ws,7); });
  state.currentWeekIndex = idx===-1?0:idx;
  // Switching plans (not a first-time/Start-over onboarding) keeps every logged run as-is -
  // nothing above touches state.logs or Store's saved logs. Plan-scoped achievements (see
  // isAchievementEarned) naturally become re-earnable against the new plan without any
  // reset here, since they're checked against entries dated on/after the new plan's own
  // generatedAt - "first run logged" and every other lifetime achievement stay earned,
  // since that's genuinely already happened regardless of which plan is active.
  const wasSwitch = state.onboardMode==='switch';
  state.onboardMode = 'new';
  state.view='app'; state.tab='plan';
  window.scrollTo(0,0);
  if(wasSwitch) showToast('Plan updated — your logged runs are still here');
  else render();
}

/* ============================= render: root ============================= */
function render(){
  const app = document.getElementById('app');
  let html;
  if(state.view==='loading') html = renderLoading();
  else if(state.view==='onboarding') html = renderOnboarding();
  else html = renderApp();
  if(state.view!=='loading'){
    html += (state.modal ? renderModal() : '') + (state.toast ? `<div class="toast">${esc(state.toast)}</div>` : '');
  }
  app.innerHTML = html;
  bindGlobal();
  if(state.view==='app' && state.tab==='plan') keepActiveWeekTabVisible();
}
// The week strip is its own horizontal scroller, freshly re-rendered (and reset to
// scrollLeft 0) on every render — so without this, jumping to a week beyond what fits on
// screen (goto-week, reopening the app mid-plan, switching tabs and back) leaves the
// active week's tab scrolled off to the right with no indication anything is selected.
// Only nudges the scroll when the active tab genuinely isn't visible, and only ever
// touches the strip's own horizontal scroll — never the page's vertical position.
function keepActiveWeekTabVisible(){
  const strip = document.querySelector('.week-strip');
  const activeBtn = strip && strip.querySelector('.week-tab.active');
  if(!strip || !activeBtn) return;
  const stripRect = strip.getBoundingClientRect();
  const activeRect = activeBtn.getBoundingClientRect();
  if(activeRect.left>=stripRect.left && activeRect.right<=stripRect.right) return;
  const targetScrollLeft = strip.scrollLeft + (activeRect.left-stripRect.left) - (stripRect.width-activeRect.width)/2;
  strip.scrollLeft = Math.max(0, targetScrollLeft);
}

// Works for either kind of plan: a real race's distance label, or the general plan's
// kind name (Build Speed, Maintenance, etc.) - the one thing every setup has a name for.
function planLabel(setup){

}
function isGeneralPlan(setup){ return !!(setup && setup.planKind); }
function raceLabel(setup){
  const preset = RACE_PRESETS.find(r=>r.key===setup.raceKey);
  if(preset && Math.abs(preset.km-setup.raceDistanceKm)<0.05) return preset.label;
  return fmtDist(setup.raceDistanceKm, setup.units||'mi',1);
}
// Distance + time for the "recent race" the user entered at onboarding, in the same
// preset-matching style raceLabel/draftFromSetup already use - null when none was given.

  const distLabel = preset ? preset.label : fmtDist(setup.recentDistanceKm, unit, 1);
  return setup.recentTimeSec ? `${distLabel} — ${secToClock(setup.recentTimeSec)}` : distLabel;
}

// Auto-inserts colons as the user types digits, so "2230" becomes "22:30" and
// "34500" becomes "3:45:00" without anyone having to type ':' themselves.
function formatDurationDigits(raw){
  const digits = String(raw).replace(/\D/g,'').slice(0,6);
  if(digits.length<=2) return digits;
  if(digits.length<=4){
    const mmLen = digits.length-2;
    return digits.slice(0,mmLen)+':'+digits.slice(mmLen);
  }
  const hhLen = digits.length-4;
  return digits.slice(0,hhLen)+':'+digits.slice(hhLen,hhLen+2)+':'+digits.slice(hhLen+2);
}

// Picks from among the closest few matches (not always the single nearest) so entering a
// similar pace twice doesn't always name the same thing.
function animalPaceComparison(mph){
  if(!mph || mph<=0) return '';
  const closest = ANIMAL_PACES_MPH.map(a=>({...a, diff:Math.abs(a.mph-mph)})).sort((a,b)=>a.diff-b.diff);
  const pool = closest.slice(0, Math.min(3, closest.length));
  const pick = pool[Math.floor(Math.random()*pool.length)];
  return `about the running pace of ${pick.name}. ${pick.quip}`;
}
function recentPaceHint(d){
  const preset = RACE_PRESETS.find(r=>r.key===d.recentDistanceKey);
  const sec = parseDurationToSec(d.recentTime);
  if(!preset || !sec) return 'Enter a finish time to see your pace per mile.';
  const secPerKm = sec/preset.km;
  const mph = 3600/(secPerKm*KM_PER_MI);
  return `That's about ${paceStr(secPerKm,'mi')} pace — ${animalPaceComparison(mph)}`;
}

function renderOnboarding(){
  const d = state.onboardDraft;
  const step = state.onboardStep || 1;
  const meta = onboardStepMeta(step, d);
  const stepHtml = step===1 ? renderOnboardStep1(d) : step===2 ? renderOnboardStep2(d) : renderOnboardStep3(d);
  const dotsHtml = ONBOARD_STEPS.map((s,i)=>`<span class="step-dot ${i+1<=step?'active':''}"></span>`).join('');
  const isSwitch = state.onboardMode==='switch';
  const backOrCancelHtml = step>1
    ? '<button class="btn btn-block" style="padding:14px;" data-act="onboard-back">Back</button>'
    : (isSwitch ? '<button class="btn btn-block" style="padding:14px;" data-act="cancel-switch-plan">Cancel</button>' : '');
  const navHtml = step<3 ? `
    <div class="row" style="margin:22px 0 30px;">
      ${backOrCancelHtml}
      <button class="btn btn-primary btn-block" style="padding:14px;" data-act="onboard-next">Next</button>
    </div>
  ` : `
    <div class="row" style="margin:22px 0 30px;">
      ${backOrCancelHtml}
      <button class="btn btn-primary btn-block" style="padding:14px;" data-act="generate-plan">${isSwitch?'Update my plan':'Generate my plan'}</button>
    </div>
  `;

  return `
  <div class="topbar">
    <div class="brand"><div class="brand-mark">${ICONS.peak}</div><div class="brand-name">Peak</div></div>
  </div>
  <div class="container">
    <div class="eyebrow" style="margin-top:6px;">Training plans, tailored to race day</div>
    <h1 style="font-size:24px; margin:6px 0 4px;">${meta.title}</h1>
    <div class="hint" style="margin-bottom:14px;">${meta.hint}</div>
    ${isSwitch ? `<div class="hint" style="margin:-8px 0 14px; color:var(--accent-strong); font-weight:600;">Changing your plan — your logged runs stay exactly as they are.</div>` : ''}
    <div class="step-indicator">
      <span class="step-label">Step ${step} of ${ONBOARD_STEPS.length}</span>
      <div class="step-dots">${dotsHtml}</div>

    ${navHtml}
  </div>
  `;
}

/* ============================= render: main app ============================= */
function renderApp(){
  const plan = state.plan;
  const week = plan.weeks[state.currentWeekIndex];

  let body = '';
  if(state.tab==='plan') body = renderPlanTab(week, plan);
  else if(state.tab==='progress') body = renderProgressTab();
  else body = renderSettingsTab();

  return `
  <div class="topbar">
    <div class="brand"><div class="brand-mark">${ICONS.peak}</div><div class="brand-name">Peak</div></div>
    <div style="font-weight:700; font-size:13.5px; color:var(--muted);">${esc(state.name)}</div>
  </div>
  ${body}
  <button class="fab" data-act="open-log">${ICONS.plus} Log a run</button>
  <div class="tabbar"><div class="tabbar-inner">
    ${tabBtn('plan', ICONS.route, 'Plan')}
    ${tabBtn('progress', ICONS.chart, 'Progress')}
    ${tabBtn('settings', ICONS.gear, 'Settings')}
  </div></div>
  `;
}
function tabBtn(key,icon,label){
  return `<button class="tab-btn ${state.tab===key?'active':''}" data-act="set-tab" data-tab="${key}">${icon}<span>${label}</span></button>`;
}

function phaseColorVar(phase){
  return phase==='taper' ? 'var(--z-race)' : phase==='peak' ? 'var(--z-intervals)' : phase==='build' ? 'var(--z-tempo)' : 'var(--z-easy)';
}
function phaseLabel(phase){ return {base:'Base', build:'Build', peak:'Peak', taper:'Taper', maintenance:'Maintenance', recovery:'Recovery'}[phase]||phase; }
// Cutback weeks display as their own label/color rather than whatever phase they fall
// in — the underlying phase still drives workout selection, this is display-only. The
// very last week (the one race day actually falls in) displays as "Race Week" rather
// than "Taper" even though it's still internally the taper phase.
function weekDisplayLabel(week, totalWeeks, planKind){
  if(!planKind && week.weekIndex===totalWeeks-1) return 'Race Week';
  return week.isCutback ? 'Cutback' : phaseLabel(week.phase);
}
function weekColorVar(week){ return week.isCutback ? 'var(--z-rest)' : phaseColorVar(week.phase); }

function renderPlanTab(week, plan){
  const unit = state.setup.units;
  const fmt = state.paceFormat;
  const weekPaces = getWeekPaces(plan, week, state.logs);
  const raceDate = parseDate(plan.raceDate);
  const weekStartDate = parseDate(week.weekStart);
  const daysToRaceForWeek = daysBetween(weekStartDate, raceDate);
  const strip = plan.weeks.map((w,i)=>`
    <button class="week-tab ${i===state.currentWeekIndex?'active':''}" style="--phase-color:${weekColorVar(w)}" data-act="goto-week" data-i="${i}">
      <div class="wk">${weekDisplayLabel(w, plan.totalWeeks, plan.planKind)}</div>
      <div class="wn">${i+1}</div>
    </button>`).join('');

  const loggedThisWeek = logsInWeek(week);
  const loggedKm = loggedThisWeek.reduce((s,l)=>s+l.distanceKm,0);

  const dayCards = week.days.map((day,di)=>{
    const meta = TYPE_META[day.type];
    const isToday = fmtDate(todayDate())===day.date;
    const match = loggedThisWeek.find(l=>l.date===day.date);
    const isMoveSrc = state.moveFrom && state.moveFrom.weekIndex===state.currentWeekIndex && state.moveFrom.dayIndex===di;
    const isMoveTarget = state.moveFrom && state.moveFrom.weekIndex===state.currentWeekIndex && state.moveFrom.dayIndex!==di;
    const dt = parseDate(day.date);
    return `
    <button class="card day-card ${match?'logged':''} ${isMoveSrc?'move-source':''} ${isMoveTarget?'move-target':''}" data-act="${state.moveFrom? 'move-target':'open-day'}" data-i="${di}" style="${isToday?'border-color:var(--accent-strong)':''}">
      <div class="day-date"><div class="dow">${DOW_LABELS[day.dow]}</div><div class="dom mono">${dt.getDate()}</div></div>
      <div class="day-main">
        <div class="day-top">
          <span class="pill" style="background:var(--${meta.bg}); color:var(--${meta.fg})">${day.label}</span>
          ${day.strength?`<span class="strength-badge">+ Strength${day.strengthFocus==='upper'?' (upper/core)':''}</span>`:''}
          ${day.terrain==='hilly'?`<span class="strength-badge" style="color:var(--z-hill); background:var(--z-hill-bg);">⛰ Hilly</span>`:''}
        </div>
        <div class="day-desc">${esc(dayDisplayText(day, weekPaces, unit, fmt))}</div>
      </div>
      <div class="day-side">
        ${match?`<div class="day-check">${ICONS.check}</div>`:''}
        ${day.km>0?`<div class="day-dist mono">${fmtDist(day.km,unit)}</div>`:''}
      </div>
    </button>`;
  }).join('');

  return `
  ${state.moveFrom!=null && state.moveFrom.weekIndex===state.currentWeekIndex ? `<div class="banner">${ICONS.move}<span>Choose a day to swap with "${week.days[state.moveFrom.dayIndex].label}". <a class="link-btn" data-act="cancel-move" style="color:inherit">Cancel</a></span></div>`:''}
  <div class="week-strip">${strip}</div>
  <div class="week-header">
    <div>
      <h2>${weekDisplayLabel(week, plan.totalWeeks, plan.planKind)} · Week ${week.weekIndex+1}</h2>
      <div class="week-meta">${niceDate(weekStartDate)} – ${niceDate(addDays(weekStartDate,6))} · ${plan.planKind
        ? (week.weekIndex===plan.totalWeeks-1?'Final week':`${plan.totalWeeks-week.weekIndex-1} week${plan.totalWeeks-week.weekIndex-1===1?'':'s'} left`)
        : (daysToRaceForWeek>0?daysToRaceForWeek+' days to race':(week.weekIndex===plan.totalWeeks-1?'Race week':'Race day has passed'))}</div>
    </div>
    <div class="week-stat">
      <div class="v">${fmtDist(loggedKm,unit,1)} <span style="color:var(--muted); font-weight:600; font-size:12px;">/ ${fmtDist(week.targetKm,unit,1)}</span></div>
      <div class="l">logged this week</div>
    </div>
  </div>
  <div class="day-list">${dayCards}</div>
  <div style="height:20px"></div>
  `;
}

function logsInWeek(week){
  const ws = parseDate(week.weekStart), we = addDays(ws,7);
  return state.logs.filter(l=>{ const d=parseDate(l.date); return d>=ws && d<we; });
}

// All four Progress stat-tile numbers in one place, so the tiles themselves and their
// tap-to-see-the-math detail views can never drift apart from computing things twice.
function computeProgressStats(){
  const plan = state.plan, unit = state.setup.units;
  const totalLoggedKm = state.logs.reduce((s,l)=>s+l.distanceKm,0);
  const totalLoggedCount = state.logs.length;
  // "Behind/ahead of plan" and adherence both compare against a single as-of date, not
  // necessarily today - if nothing's logged for today yet, today gets the benefit of the
  // doubt (it's not "missed" just because it's still morning) and the cutoff holds at
  // yesterday; the moment today has a log, the cutoff advances to today and BOTH sides
  // (what's logged, what's planned) update together, so a logged run is never compared
  // against a stale "planned through yesterday" total - todayDate() itself is a valid
  // fallback since a plan never schedules dates before it, guarding future-dated logs the
  // same way the old today-only cutoff did.
  const today = todayDate();
  const hasLoggedToday = state.logs.some(l=>parseDate(l.date).getTime()===today.getTime());
  const statusCutoff = hasLoggedToday ? today : addDays(today,-1);
  const loggedKmToDate = state.logs.filter(l=>parseDate(l.date)<=statusCutoff).reduce((s,l)=>s+l.distanceKm,0);
  const plannedToDateWeeks = plan.weeks.filter(w=>parseDate(w.weekStart) <= statusCutoff);
  const plannedToDateKm = plannedToDateWeeks.reduce((s,w)=>{
    return s + w.days.filter(d=>parseDate(d.date)<=statusCutoff).reduce((s2,d)=>s2+d.km,0);
  },0);
  // Positive means behind (planned more than you've logged); negative means you've
  // logged more than the plan called for so far — genuinely possible (extra volume, or
  // catching up after a missed week) and worth showing as "ahead", not just floored at 0.
  const mileageDeltaKm = plannedToDateKm - loggedKmToDate;
  const mileageStatusLabel = mileageDeltaKm > 0.1 ? 'behind plan' : (mileageDeltaKm < -0.1 ? 'ahead of plan' : 'on plan');
  // "Runs completed" is the fraction of already-past planned run days that have at
  // least one log against that specific date — not a raw log-entry count, which would
  // double-count a day logged in two pieces and would also count logs against future or
  // rest days that were never part of what "completed so far" should be measuring. Same
  // statusCutoff as plannedToDateKm above.
  const plannedRunDatesToDate = [];
  plannedToDateWeeks.forEach(w=>w.days.forEach(d=>{ if(parseDate(d.date)<=statusCutoff && d.km>0) plannedRunDatesToDate.push(d.date); }));
  const loggedDates = new Set(state.logs.map(l=>l.date));
  const completedPlannedRuns = plannedRunDatesToDate.filter(date=>loggedDates.has(date)).length;
  const adherence = plannedRunDatesToDate.length>0 ? Math.round(100*completedPlannedRuns/plannedRunDatesToDate.length) : 0;
  // Separate from adherence (did you run on the days the plan called for): what fraction
  // of the whole plan's training mileage — every week, not just the ones behind you —
  // have you actually logged. Race day itself isn't "training" so it's excluded.
  const totalPlanTrainingKm = plan.weeks.reduce((s,w)=> s + w.days.filter(d=>d.type!=='race').reduce((s2,d)=>s2+d.km,0), 0);
  const pctPlanMilesLogged = totalPlanTrainingKm>0 ? Math.round(100*Math.min(1, totalLoggedKm/totalPlanTrainingKm)) : 0;

  // "What would I run right now" vs "what would I have run on day one" — current fitness
  // compared to starting fitness, not the plan's own future goal. Race plans headline their
  // actual race distance; general plans have no single race, so they project three fixed
  // reference distances instead.
  const currentVdot = currentEffectiveVdot(plan, state.logs);
  const goalVdot = goalEffectiveVdot(plan, state.logs);
  // Only worth showing as a third number when it's actually different from the start - for
  // Build Distance/Maintenance/Recovery, endVdot equals startVdot by design (those plans
  // don't project a speed improvement, only race plans and Build Speed do), so this stays
  // null there rather than repeating the same value a third time.
  const hasGoal = goalVdot!=null && plan.startVdot!=null && Math.abs(goalVdot-plan.startVdot) > 0.05;
  const raceProjection = (!isGeneralPlan(state.setup) && plan.startVdot!=null && currentVdot!=null)
    ? { km: plan.raceDistanceKm, start: raceProjectionFor(plan.startVdot, plan.raceDistanceKm), current: raceProjectionFor(currentVdot, plan.raceDistanceKm), goal: hasGoal ? raceProjectionFor(goalVdot, plan.raceDistanceKm) : null }
    : null;
  const generalProjections = (isGeneralPlan(state.setup) && plan.startVdot!=null && currentVdot!=null)
    ? PROJECTION_DISTANCES.map(d=>({ ...d, start: raceProjectionFor(plan.startVdot, d.km), current: raceProjectionFor(currentVdot, d.km), goal: hasGoal ? raceProjectionFor(goalVdot, d.km) : null }))
    : null;

  return {
    unit, totalLoggedKm, totalLoggedCount,
    loggedKmToDate, plannedToDateKm, mileageDeltaKm, mileageStatusLabel,
    plannedRunDatesToDateCount: plannedRunDatesToDate.length, completedPlannedRuns, adherence,
    totalPlanTrainingKm, pctPlanMilesLogged,
    raceProjection, generalProjections,
  };
}

// Shared by manual entry and Strava import — both end up with the same log shape, so
// both should go through the same save + achievement check rather than duplicating it.
function commitLogEntry(logData){
  const item = Store.addLog(logData);
  state.logs = [item, ...state.logs];
  state.modal = null;
  const fired = evaluateAndTriggerAchievements(item);
  if(fired) render(); else showToast('Run logged');
}

// The full catalog of every earnable achievement - the single source of truth for both
// the popup celebrations and the persistent gallery (renderAchievementsScreen).
// tier: 'summit' (rare, plan-defining, the big hero illustration) or 'badge' (frequent,
// small icon - see badgeGlyph()).
// scope: 'plan' (only counts as earned using log entries dated on/after the CURRENT
// plan's own generatedAt, so switching plans - Change plan in Settings - makes these
// re-earnable against the new one without deleting history) or 'lifetime' (counts
// forever regardless of plan changes, since it's really about the runner's own history -
// PRs, streaks, and totals all fall here).
// repeatable: can fire more than once (a new week hit, a new PR) - tracked by a distinct
// `instance` value per occurrence, rather than "has this key ever fired."
const ACHIEVEMENTS = [
  {key:'plan-complete', tier:'summit', scope:'plan', hero:'summitArrived', title:'Plan complete', locked:'Reach the end of this plan.'},
  {key:'beat-goal', tier:'summit', scope:'plan', hero:'summitArrived', title:'Beat your goal', locked:'Beat your stated goal pace on race day.'},
  {key:'halfway', tier:'summit', scope:'plan', hero:'summitHalfway', title:'Halfway up the mountain', locked:"Log half of this plan's training miles."},
  {key:'base-complete', tier:'summit', scope:'plan', hero:'summitBadge', title:'Base phase complete', locked:'Finish every week of your base phase.'},
  {key:'build-complete', tier:'summit', scope:'plan', hero:'summitBadge', title:'Build phase complete', locked:'Finish every week of your build phase.'},
  {key:'peak-complete', tier:'summit', scope:'plan', hero:'summitBadge', title:'Peak phase complete', locked:'Finish every week of your peak phase.'},
  {key:'peak-long-run', tier:'summit', scope:'plan', hero:'summitBadge', title:'Peak long run conquered', locked:"Complete this plan's single longest scheduled long run."},
  {key:'full-house', tier:'summit', scope:'plan', hero:'summitBadge', title:'Full house', locked:'Log at least one of every workout type this plan uses.'},

  {key:'first-run', tier:'badge', scope:'lifetime', glyph:'flag', title:'First run logged', locked:'Log your very first run.'},
  {key:'week-fully-hit', tier:'badge', scope:'plan', repeatable:true, glyph:'calendarCheck', title:'Week fully hit', locked:"Log at least as much as a completed week's mileage target."},
  {key:'perfect-week', tier:'badge', scope:'plan', repeatable:true, glyph:'calendarCheck', title:'Perfect week', locked:'Run every single day the plan scheduled a run, for one full week.'},
  {key:'fastest-tempo', tier:'badge', scope:'lifetime', repeatable:true, glyph:'medal', title:'New fastest tempo run', locked:'Beat your own best tempo pace.'},
  {key:'fastest-long-run', tier:'badge', scope:'lifetime', repeatable:true, glyph:'medal', title:'New fastest long run', locked:'Beat your own best long run pace.'},
  {key:'longest-run', tier:'badge', scope:'lifetime', repeatable:true, glyph:'medal', title:'New longest run', locked:'Log a run longer than any you have logged before.'},
  {key:'double-digit-run', tier:'badge', scope:'lifetime', glyph:'flag', title:'First double-digit run', locked:'Log a run of 10+ miles (about 16km).'},
  {key:'miles-50', tier:'badge', scope:'lifetime', glyph:'trophy', title:'50 miles logged', locked:'Log 50 lifetime miles.'},
  {key:'miles-100', tier:'badge', scope:'lifetime', glyph:'trophy', title:'100 miles logged', locked:'Log 100 lifetime miles.'},
  {key:'miles-250', tier:'badge', scope:'lifetime', glyph:'trophy', title:'250 miles logged', locked:'Log 250 lifetime miles.'},
  {key:'miles-500', tier:'badge', scope:'lifetime', glyph:'trophy', title:'500 miles logged', locked:'Log 500 lifetime miles.'},
  {key:'streak-7', tier:'badge', scope:'lifetime', glyph:'flame', title:'7-day streak', locked:'Log a run on 7 consecutive days.'},
  {key:'hill-climber', tier:'badge', scope:'lifetime', glyph:'peak', title:'Hill climber', locked:'Complete your first Hill Repeats session.'},
  {key:'bounced-back', tier:'badge', scope:'lifetime', repeatable:true, glyph:'flame', title:'Bounced back', locked:'Log a run within 2 days of missing a scheduled one.'},
  {key:'fitness-gains', tier:'badge', scope:'plan', glyph:'chart', title:'Fitness gains', locked:"Improve your current fitness meaningfully since this plan's start."},
  {key:'strength-logged', tier:'badge', scope:'lifetime', glyph:'dumbbell', title:'Strength session logged', locked:'Mark a strength session as completed.'},
  {key:'strength-streak', tier:'badge', scope:'lifetime', repeatable:true, glyph:'dumbbell', title:'Strength streak', locked:'Complete 4 scheduled strength sessions in a row.'},
];
const ACHIEVEMENTS_BY_KEY = Object.fromEntries(ACHIEVEMENTS.map(a=>[a.key,a]));
function badgeGlyph(key){ return ICONS[ACHIEVEMENTS_BY_KEY[key] && ACHIEVEMENTS_BY_KEY[key].glyph || 'summitBadge']; }

function isAchievementEarned(key){
  const def = ACHIEVEMENTS_BY_KEY[key];
  if(!def) return false;
  const entries = state.achievementLog.filter(e=>e.key===key);
  if(!entries.length) return false;
  if(def.scope!=='plan') return true;
  const planStart = state.plan && state.plan.generatedAt ? state.plan.generatedAt.slice(0,10) : null;
  return planStart==null || entries.some(e=>e.date>=planStart);
}
// Most recent qualifying date for a key, honoring the same plan-scope rule as
// isAchievementEarned - used by the gallery to show "earned Sep 14" under a badge.
function achievementEarnedDate(key){
  const def = ACHIEVEMENTS_BY_KEY[key];
  let entries = state.achievementLog.filter(e=>e.key===key);
  if(def && def.scope==='plan' && state.plan && state.plan.generatedAt){
    const planStart = state.plan.generatedAt.slice(0,10);
    entries = entries.filter(e=>e.date>=planStart);
  }
  if(!entries.length) return null;
  return entries.map(e=>e.date).sort().slice(-1)[0];
}
function recordAchievement(key, date, message, instance){
  state.achievementLog = [...state.achievementLog, {key, date, message, instance: instance || date}];
  Store.setAchievementLog(state.achievementLog);
}

// Longest run of consecutive calendar days with at least one log - powers the 7-day
// streak badge.
function longestLoggingStreakDays(){
  const dates = [...new Set(state.logs.map(l=>l.date))].map(d=>parseDate(d)).sort((a,b)=>a-b);
  let best=0, cur=0, prev=null;
  for(const d of dates){
    cur = (prev && daysBetween(prev,d)===1) ? cur+1 : 1;
    best = Math.max(best,cur);
    prev = d;
  }
  return best;
}
function findWeekForLog(log){
  return state.plan.weeks.find(w=>{
    const ws = parseDate(w.weekStart);
    return parseDate(log.date) >= ws && parseDate(log.date) < addDays(ws,7);
  });
}
// A completed week (its date range has fully passed) whose phase is `phaseName`, or null
// if that phase hasn't finished yet - or the plan never has one (general plans have no
// 'peak' phase, for instance, so this naturally never fires for them).
function phaseCompleteCheck(phaseName, message){
  const weeksInPhase = state.plan.weeks.filter(w=>w.phase===phaseName);
  if(!weeksInPhase.length) return null;
  const lastWeek = weeksInPhase[weeksInPhase.length-1];
  if(todayDate() < addDays(parseDate(lastWeek.weekStart),7)) return null;
  return {message};
}

// Each check takes the just-logged run (null when triggered by something else, like
// marking strength done) and returns null or {message, date?} when its condition newly
// holds - `date` is only needed for repeatable achievements, as the instance key that
// tells a later, different occurrence apart from this one.
const ACHIEVEMENT_CHECKS = {
  'plan-complete': (newLog)=>{
    const plan = state.plan;
    if(!newLog || !plan.raceDate || parseDate(newLog.date) < parseDate(plan.raceDate)) return null;
    return plan.planKind
      ? {message:"You made it through every week. However this stretch went, you earned this."}
      : {message:"Every training week led here. However today went, you earned this."};
  },
  'beat-goal': (newLog)=>{
    const setup = state.setup, plan = state.plan;
    if(!newLog || isGeneralPlan(setup) || !setup.goalTimeSec || !plan.raceDate || newLog.date!==plan.raceDate) return null;
    if(!(newLog.distanceKm>0)) return null;
    const actualPace = newLog.durationSec/newLog.distanceKm;
    const goalPace = setup.goalTimeSec/plan.raceDistanceKm;
    if(actualPace>=goalPace) return null;
    return {message:`You crossed the line at ${paceOrSpeedStr(actualPace,setup.units,state.paceFormat)} — faster than the goal pace you set out with.`};
  },
  'halfway': ()=>{
    if(computeProgressStats().pctPlanMilesLogged<50) return null;
    return {message:"You've logged half of this plan's training miles. The summit is closer than the trailhead now."};
  },
  'base-complete': ()=>phaseCompleteCheck('base', "Every base week, done — the real building starts now."),
  'build-complete': ()=>phaseCompleteCheck('build', "Build phase complete — peak weeks are next."),
  'peak-complete': ()=>phaseCompleteCheck('peak', "Peak phase complete. Taper time — the hard work is already banked."),
  'peak-long-run': ()=>{
    const longRuns = state.plan.weeks.flatMap(w=>w.days).filter(d=>d.type==='long' && d.km>0);
    if(!longRuns.length) return null;
    const maxKm = Math.max(...longRuns.map(d=>d.km));
    const peakDay = longRuns.find(d=>d.km===maxKm);
    if(!state.logs.some(l=>l.date===peakDay.date)) return null;
    return {message:`You completed this plan's longest scheduled long run — ${fmtDist(maxKm,state.setup.units,1)}.`};
  },
  'full-house': ()=>{
    const planTypes = new Set();
    state.plan.weeks.forEach(w=>w.days.forEach(d=>{ if(d.type!=='rest' && d.km>0) planTypes.add(d.type); }));
    if(planTypes.size<2) return null;
    const loggedDates = new Set(state.logs.map(l=>l.date));
    const loggedTypes = new Set();
    state.plan.weeks.forEach(w=>w.days.forEach(d=>{ if(loggedDates.has(d.date)) loggedTypes.add(d.type); }));
    if(![...planTypes].every(t=>loggedTypes.has(t))) return null;
    return {message:"You've now logged every workout type this plan calls for."};
  },
  'first-run': ()=>{
    if(state.logs.length!==1) return null;
    return {message:"You've started tracking. Every run from here builds toward the plan."};
  },
  'week-fully-hit': (newLog)=>{
    if(!newLog) return null;
    const week = findWeekForLog(newLog);
    if(!week || todayDate() < addDays(parseDate(week.weekStart),7)) return null;
    const actual = weekActualKm(week);
    if(actual < week.targetKm) return null;
    return {message:`You logged ${fmtDist(actual,state.setup.units,1)} against a ${fmtDist(week.targetKm,state.setup.units,1)} target for the week of ${niceDate(parseDate(week.weekStart))}.`, date: week.weekStart};
  },
  'perfect-week': (newLog)=>{
    if(!newLog) return null;
    const week = findWeekForLog(newLog);
    if(!week || todayDate() < addDays(parseDate(week.weekStart),7)) return null;
    const scheduledDates = week.days.filter(d=>d.km>0).map(d=>d.date);
    if(!scheduledDates.length) return null;
    const loggedDates = new Set(state.logs.map(l=>l.date));
    if(!scheduledDates.every(d=>loggedDates.has(d))) return null;
    return {message:`You ran every single scheduled day for the week of ${niceDate(parseDate(week.weekStart))} — nothing skipped.`, date: week.weekStart};
  },
  // A "new fastest"/"new longest" requires an earlier run of the same kind to beat - the
  // very first one ever logged has nothing to compare against, so it's excluded rather
  // than trivially counted as a PR.
  'fastest-tempo': (newLog)=>{
    if(!newLog) return null;
    const week = findWeekForLog(newLog);
    const day = week ? week.days.find(d=>d.date===newLog.date) : null;
    if(!day || day.type!=='tempo' || !day.paceKey) return null;
    const runs = paceRunsForType('tempo');
    const todayRun = runs.find(r=>r.date===newLog.date);
    const priorRuns = runs.filter(r=>r.date!==newLog.date);
    if(!todayRun || !priorRuns.length) return null;
    const bestPrior = Math.min(...priorRuns.map(r=>r.actualPaceSecPerKm));
    if(todayRun.actualPaceSecPerKm>=bestPrior) return null;
    return {message:`You ran today's tempo effort at ${paceOrSpeedStr(todayRun.actualPaceSecPerKm,state.setup.units,state.paceFormat)} — your best yet.`, date: newLog.date};
  },
  'fastest-long-run': (newLog)=>{
    if(!newLog) return null;
    const week = findWeekForLog(newLog);
    const day = week ? week.days.find(d=>d.date===newLog.date) : null;
    if(!day || day.type!=='long' || !day.paceKey) return null;
    const runs = paceRunsForType('long');
    const todayRun = runs.find(r=>r.date===newLog.date);
    const priorRuns = runs.filter(r=>r.date!==newLog.date);
    if(!todayRun || !priorRuns.length) return null;
    const bestPrior = Math.min(...priorRuns.map(r=>r.actualPaceSecPerKm));
    if(todayRun.actualPaceSecPerKm>=bestPrior) return null;
    return {message:`You ran today's long run at ${paceOrSpeedStr(todayRun.actualPaceSecPerKm,state.setup.units,state.paceFormat)} — your best yet.`, date: newLog.date};
  },
  'longest-run': (newLog)=>{
    if(!newLog || !(newLog.distanceKm>0)) return null;
    const priorMax = Math.max(0, ...state.logs.filter(l=>l.id!==newLog.id).map(l=>l.distanceKm));
    if(!priorMax || newLog.distanceKm<=priorMax) return null;
    return {message:`${fmtDist(newLog.distanceKm,state.setup.units,1)} — longer than anything you've logged before.`, date: newLog.date};
  },
  'double-digit-run': (newLog)=>{
    if(!newLog || !(newLog.distanceKm>0)) return null;
    if(newLog.distanceKm < unitToKm(10,'mi')) return null;
    return {message:`You logged ${fmtDist(newLog.distanceKm,state.setup.units,1)} — your first double-digit-mile run.`};
  },
  'miles-500': ()=>mileageMilestoneCheck(500),
  'miles-250': ()=>mileageMilestoneCheck(250),
  'miles-100': ()=>mileageMilestoneCheck(100),
  'miles-50': ()=>mileageMilestoneCheck(50),
  'streak-7': ()=>{
    if(longestLoggingStreakDays()<7) return null;
    return {message:"Seven days in a row, logged. That's a real habit forming."};
  },
  'hill-climber': ()=>{
    const loggedDates = new Set(state.logs.map(l=>l.date));
    const hillDay = state.plan.weeks.flatMap(w=>w.days).find(d=>d.type==='hills' && loggedDates.has(d.date));
    if(!hillDay) return null;
    return {message:"You completed your first dedicated Hill Repeats session."};
  },
  'bounced-back': (newLog)=>{
    if(!newLog) return null;
    const loggedDates = new Set(state.logs.map(l=>l.date));
    // Only a genuine "miss" if a run was already logged before it - otherwise this fires
    // trivially on day one of a brand-new plan (the very first scheduled day almost never
    // gets logged, since the plan didn't exist yet when that day started), which isn't a
    // real bounce-back, just onboarding timing.
    const missedDays = state.plan.weeks.flatMap(w=>w.days).filter(d=>
      d.km>0 && parseDate(d.date)<todayDate() && !loggedDates.has(d.date)
      && state.logs.some(l=>l.date<d.date)
    );
    for(const d of missedDays){
      for(let offset=1; offset<=2; offset++){
        if(fmtDate(addDays(parseDate(d.date),offset))===newLog.date){
          return {message:'A day got missed, and you got right back to it within two days. That consistency is what actually builds fitness.', date: newLog.date};
        }
      }
    }
    return null;
  },
  'fitness-gains': ()=>{
    const plan = state.plan;
    if(plan.startVdot==null) return null;
    const currentVdot = currentEffectiveVdot(plan, state.logs);
    if(currentVdot==null || currentVdot < plan.startVdot*1.03) return null;
    return {message:"Your current fitness has meaningfully improved since this plan's first day."};
  },
  'strength-logged': ()=>{
    if(!state.strengthDone.length) return null;
    return {message:"You marked a strength session complete. The unglamorous work counts too."};
  },
  'strength-streak': ()=>{
    const strengthDays = state.plan.weeks.flatMap(w=>w.days).filter(d=>d.strength).map(d=>d.date).sort();
    const done = new Set(state.strengthDone);
    let best=0, cur=0, endDate=null;
    for(const date of strengthDays){
      if(parseDate(date)>=todayDate()) break;
      if(done.has(date)){ cur++; if(cur>=4) endDate=date; } else cur=0;
      best = Math.max(best,cur);
    }
    if(best<4 || !endDate) return null;
    return {message:'Four scheduled strength sessions in a row, completed. That consistency is what actually prevents injury.', date: endDate};
  },
};
function mileageMilestoneCheck(miles){
  if(computeProgressStats().totalLoggedKm < unitToKm(miles,'mi')) return null;
  return {message:`You've logged ${miles} lifetime miles across every run you've tracked in this app.`};
}

// Runs every achievement check in catalog order (biggest/rarest first), records every one
// that newly qualifies (so nothing is ever silently lost even if one action satisfies
// several at once), but only pops up a celebration for the first - the rest are still
// earned and visible in the gallery, just without their own modal this time.
function evaluateAndTriggerAchievements(newLog){
  const earned = [];
  for(const def of ACHIEVEMENTS){
    const check = ACHIEVEMENT_CHECKS[def.key];
    if(!check) continue;
    if(!def.repeatable && isAchievementEarned(def.key)) continue;
    const result = check(newLog);
    if(!result) continue;
    const instance = result.date || fmtDate(todayDate());
    if(def.repeatable && state.achievementLog.some(e=>e.key===def.key && e.instance===instance)) continue;
    recordAchievement(def.key, fmtDate(todayDate()), result.message, instance);
    earned.push({def, message: result.message});
  }
  if(!earned.length) return false;
  const top = earned[0];
  state.modal = {type:'milestone', data:{
    hero: top.def.tier==='summit' ? ICONS[top.def.hero] : null,
    icon: top.def.tier==='badge' ? badgeGlyph(top.def.key) : null,
    title: top.def.title,
    message: top.message,
  }};
  return true;
}

// "X faster/slower than at the start" — shared phrasing for every current-vs-start
// comparison below, both the race-plan tile and each general-plan distance row.
function projectionDeltaText(startTimeSec, currentTimeSec){
  const deltaSec = startTimeSec - currentTimeSec; // positive = current is the faster (lower) time
  if(Math.abs(deltaSec) < 5) return 'about the same as at the start';
  return `${secToClock(Math.abs(deltaSec))} ${deltaSec>0?'faster':'slower'} than at the start`;
}
// Race plans headline their one actual race distance as a tappable tile, matching the
// existing 4-tile stat pattern; general plans show three fixed reference distances as
// compact rows instead, since there's no single race to headline. Returns '' for legacy
// plans saved before the vdot model existed (no startVdot to compare against).
function renderRaceProjectionSection(stats, unit, fmt){
  if(stats.raceProjection){
    const p = stats.raceProjection;
    return `
    <div class="section-title" style="padding:0; margin-top:0;">Projected race performance</div>
    <button class="card stat-tile" data-act="open-stat-detail" data-stat="race-projection" style="padding:16px; margin-bottom:16px;">
      <div class="v">${secToClock(p.current.timeSec)}</div>
      <div class="l">projected finish today (${paceOrSpeedStr(p.current.paceSecPerKm,unit,fmt)})</div>
      <div class="hint" style="margin-top:6px;">${projectionDeltaText(p.start.timeSec, p.current.timeSec)}</div>
      ${p.goal ? `<div class="hint" style="margin-top:2px; color:var(--accent-strong);">On pace for ${secToClock(p.goal.timeSec)} (${paceOrSpeedStr(p.goal.paceSecPerKm,unit,fmt)}) if you complete the rest of the plan</div>` : ''}
    </button>`;
  }
  if(stats.generalProjections){
    const rows = stats.generalProjections.map(p=>`
      <div class="settings-row" data-act="open-stat-detail" data-stat="general-projection-${p.key}" style="cursor:pointer;">
        <div><div class="lbl">${p.label}</div><div class="sub">${projectionDeltaText(p.start.timeSec, p.current.timeSec)}${p.goal ? `<br>On pace for ${secToClock(p.goal.timeSec)} (${paceOrSpeedStr(p.goal.paceSecPerKm,unit,fmt)}) by plan's end` : ''}</div></div>
        <div style="text-align:right;">
          <div class="mono" style="font-weight:700;">${secToClock(p.current.timeSec)}</div>
          <div class="hint" style="margin:0;">${paceOrSpeedStr(p.current.paceSecPerKm,unit,fmt)}</div>
        </div>
      </div>`).join('');
    return `
    <div class="section-title" style="padding:0; margin-top:0;">Projected race performance</div>
    <div class="card" style="padding:0 16px; margin-bottom:16px;">${rows}</div>`;
  }
  return '';
}

    <button class="card stat-tile" data-act="open-stat-detail" data-stat="mileage-delta"><div class="v">${fmtDist(Math.abs(stats.mileageDeltaKm),unit,0)}</div><div class="l">${stats.mileageStatusLabel}</div></button>

function weekActualKm(week){
  return logsInWeek(week).reduce((s,l)=>s+l.distanceKm,0);
}
function chartWeekLabel(week){
  const dt = parseDate(week.weekStart);
  return `${dt.getMonth()+1}/${dt.getDate()}`;
}

// Every logged-vs-planned pace pairing for `type`, oldest first — the raw material for
// the pace tracker's trend line. Only long/tempo (each with one clean, structured target
// pace) are shown in the UI — easy/hills/fartlek are intentionally run by feel with no
// single "right" pace, and rest/race aren't training-pace days at all. actualPaceSecPerKm
// already backs out any warm-up/cool-down portion via qualityEffortPaceSecPerKm, so a
// tempo day's trend point reflects the tempo effort itself, not a blend with easy miles.
function paceRunsForType(type){
  const matches = [];
  for(const week of state.plan.weeks){
    for(const day of week.days){
      if(day.type!==type || !day.paceKey) continue;
      // Logging two runs against the same plan day (a split effort, or a correction)
      // shouldn't silently drop one of them — combine every log on that date into a
      // single actual pace for the day, rather than matching only the first found.
      const dayLogs = state.logs.filter(l=>l.date===day.date);
      if(!dayLogs.length) continue;
      const totalKm = dayLogs.reduce((s,l)=>s+l.distanceKm,0);
      const totalSec = dayLogs.reduce((s,l)=>s+l.durationSec,0);
      if(totalKm<=0) continue;
      const weekPaces = getWeekPaces(state.plan, week, state.logs);
      const plannedPaceSecPerKm = day.paceOverrideSecPerKm!=null ? day.paceOverrideSecPerKm : weekPaces[day.paceKey];
      if(plannedPaceSecPerKm==null) continue;
      const actualPaceSecPerKm = qualityEffortPaceSecPerKm(day, totalKm, totalSec, state.plan);
      matches.push({date:day.date, actualPaceSecPerKm, plannedPaceSecPerKm});
    }
  }
  matches.sort((a,b)=> a.date<b.date?-1:1);
  return matches;
}
// A delta this big (12% of that run's own target pace) or more maxes out the trend
// line's vertical scale, so one outlier can't flatten the rest of the chart.
const PACE_TREND_CAP_FRAC = 0.12;
const PACE_ON_TARGET_SEC_PER_KM = 2;
function paceRunColor(run){
  const deltaSecPerKm = run.actualPaceSecPerKm - run.plannedPaceSecPerKm;
  if(Math.abs(deltaSecPerKm)<PACE_ON_TARGET_SEC_PER_KM) return 'var(--muted)';
  return deltaSecPerKm>=0 ? 'var(--z-tempo)' : 'var(--accent-strong)';
}
// Same pace formatting as paceOrSpeedStr, minus the /mi or /km suffix — the unit is
// already implied by context, and every character counts in a tiny chart label.
function compactPaceLabel(secPerKm, unit, fmt){
  const secPerUnit = unit==='mi' ? secPerKm*KM_PER_MI : secPerKm;
  return fmt==='speed' ? (3600/secPerUnit).toFixed(1) : secToClock(secPerUnit);
}
// A small line chart of pace delta over time — up (green) is faster than that day's
// target, down (amber) is slower, the dashed center line is on pace. Plotting each run
// individually (rather than one blended average) is the point: it shows whether recent
// runs are trending toward target, not just where the average happens to land. Each
// point is labeled with its own date and pace, colored the same as the dot, alternating
// above/below by index so neighboring labels don't stack on top of each other.
function paceSparklineSvg(runs){
  const W = 280, H = 108, PAD_X = 10;
  const CENTER_Y = 54, USABLE_H = 22, LABEL_OFFSET = 15;
  const unit = state.setup.units, fmt = state.paceFormat;
  const n = runs.length;
  const pts = runs.map((r,i)=>{
    const x = n===1 ? W/2 : PAD_X + (i/(n-1))*(W-PAD_X*2);
    const deltaFrac = clamp((r.actualPaceSecPerKm-r.plannedPaceSecPerKm)/r.plannedPaceSecPerKm, -PACE_TREND_CAP_FRAC, PACE_TREND_CAP_FRAC);
    const y = CENTER_Y + (deltaFrac/PACE_TREND_CAP_FRAC)*USABLE_H;
    return {x, y, color:paceRunColor(r), run:r};
  });
  const pathD = pts.map((p,i)=> `${i===0?'M':'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
  const dots = pts.map(p=> `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.2" style="fill:${p.color};"/>`).join('');
  const labels = pts.map((p,i)=>{
    const above = i%2===0;
    const ty = above ? p.y-LABEL_OFFSET : p.y+LABEL_OFFSET+7;
    const anchor = i===0 ? 'start' : (i===n-1 ? 'end' : 'middle');
    const dt = parseDate(p.run.date);
    const dateStr = `${dt.getMonth()+1}/${dt.getDate()}`;
    const paceLabel = compactPaceLabel(p.run.actualPaceSecPerKm, unit, fmt);
    return `<text x="${p.x.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="${anchor}" style="font-size:8.5px; font-family:var(--font-body); fill:${p.color};">${esc(dateStr)} ${esc(paceLabel)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block; overflow:visible;">
    <line x1="0" y1="${CENTER_Y}" x2="${W}" y2="${CENTER_Y}" style="stroke:var(--line); stroke-width:1; stroke-dasharray:3,3;"/>
    <path d="${pathD}" style="fill:none; stroke:var(--ink-soft); stroke-width:1.5;"/>
    ${dots}
    ${labels}
  </svg>`;
}
function paceTrackerRowHtml(type, label){
  const unit = state.setup.units, fmt = state.paceFormat;
  const allRuns = paceRunsForType(type);
  if(!allRuns.length){
    return `<div style="padding:14px 0; border-bottom:1px solid var(--line-soft);">
      <div style="font-weight:700; font-size:14px;">${label}</div>
      <div class="hint" style="margin:2px 0 0;">No logged ${label.toLowerCase()} yet.</div>
    </div>`;
  }
  const runs = allRuns.slice(-8);
  const mostRecent = runs[runs.length-1];
  const deltaLineFull = paceDeltaLine(mostRecent.actualPaceSecPerKm, mostRecent.plannedPaceSecPerKm, unit, fmt);
  const deltaShort = deltaLineFull==='right on target pace' ? 'On pace' : deltaLineFull.replace(' than planned','');
  const recentColor = paceRunColor(mostRecent);

  return `<div style="padding:14px 0; border-bottom:1px solid var(--line-soft);">
    <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px;">
      <span style="font-weight:700; font-size:14px;">${label}</span>
      <span class="mono" style="font-size:11px; color:var(--muted);">${allRuns.length} logged</span>
    </div>
    ${paceSparklineSvg(runs)}
    <div style="display:flex; justify-content:space-between; margin-top:2px; font-size:11.5px;">
      <span class="mono" style="color:var(--muted);">Target ${paceOrSpeedStr(mostRecent.plannedPaceSecPerKm,unit,fmt)}</span>
      <span style="font-weight:700; color:${recentColor};">Most recent: ${deltaShort}</span>
    </div>
  </div>`;
}
