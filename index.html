/* ============================= modals ============================= */
function renderModal(){
  const m = state.modal;
  if(m.type==='day-detail') return renderDayDetail();
  if(m.type==='log-run') return modalLogRun();
  if(m.type==='edit-day') return modalEditDay();
  if(m.type==='confirm-reset') return modalConfirmReset();
  if(m.type==='confirm-import') return modalConfirmImport(m.data);
  if(m.type==='stat-detail') return renderStatDetailModal(m.stat);
  if(m.type==='milestone') return modalMilestone(m.data);
  if(m.type==='achievements') return renderAchievementsScreen();
  return '';
}

// Badge-tier celebrations (frequent, small) pass no `hero` and get the 84px badge-ring
// with a category glyph (see badgeGlyph) instead of always the plain mountain icon, so a
// streak feels visually distinct from a PR or a strength badge even in the popup, not
// just in the gallery; summit-tier celebrations (rare, plan-defining) pass a hero
// illustration shown larger in its place. Same sheet either way.
function modalMilestone(data){
  const { hero, icon, title, message } = data;
  const artHtml = hero
    ? `<div class="milestone-hero">${hero}</div>`
    : `<div class="badge-ring">${icon || ICONS.summitBadge}</div>`;
  return `<div class="overlay" data-act="close-modal-overlay">
    <div class="sheet milestone" data-stop="1">
      <div class="sheet-handle"></div>
      <button class="sheet-close" data-act="close-modal">${ICONS.close}</button>
      ${artHtml}
      <div class="sheet-title milestone">${esc(title)}</div>
      <div class="sheet-body">${esc(message)}</div>
      <button class="btn btn-primary btn-block" data-act="close-modal">Nice!</button>
    </div>
  </div>`;
}

// The persistent gallery of every achievement - earned ones show their date, locked ones
// show how to earn them, so nothing that pops up once is ever gone for good afterward.
function renderAchievementsScreen(){
  const summit = ACHIEVEMENTS.filter(a=>a.tier==='summit');
  const badges = ACHIEVEMENTS.filter(a=>a.tier==='badge');
  const earnedCount = ACHIEVEMENTS.filter(a=>isAchievementEarned(a.key)).length;
  const rowFor = (a, i, arr, big) => {
    const earned = isAchievementEarned(a.key);
    const date = earned ? achievementEarnedDate(a.key) : null;
    const icon = big ? (ICONS[a.hero] || ICONS.summitBadge) : badgeGlyph(a.key);
    const size = big ? 50 : 38, iconSize = big ? 26 : 20;
    return `<div style="display:flex; align-items:center; gap:12px; padding:12px 0; ${i<arr.length-1?'border-bottom:1px solid var(--line-soft);':''} opacity:${earned?1:0.5};">
      <div style="width:${size}px; height:${size}px; border-radius:50%; background:${earned?'var(--accent)':'var(--surface-2)'}; color:${earned?'var(--accent-ink)':'var(--muted)'}; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <div style="width:${iconSize}px; height:${iconSize}px;">${icon}</div>
      </div>
      <div style="flex:1; min-width:0;">
        <div style="font-weight:700; font-size:14px;">${esc(a.title)}</div>
        <div style="font-size:12.5px; color:var(--muted);">${earned ? `Earned${date?' '+niceDate(parseDate(date)):''}` : esc(a.locked)}</div>
      </div>
    </div>`;
  };
  return modalShell('Milestones &amp; badges', `
    <div class="hint" style="margin:-8px 0 16px;">${earnedCount} of ${ACHIEVEMENTS.length} earned so far.</div>
    <div class="section-title" style="margin-top:0;">Summit milestones</div>
    <div class="card" style="padding:0 16px;">${summit.map((a,i)=>rowFor(a,i,summit,true)).join('')}</div>
    <div class="section-title">Badges</div>
    <div class="card" style="padding:0 16px;">${badges.map((a,i)=>rowFor(a,i,badges,false)).join('')}</div>
    <div style="height:12px"></div>
  `);
}

// A big number with a small caption under it — the building block for the stat detail
// graphics below (numbers first, not sentences).
function statNumberHtml(value, label, opts){
  opts = opts || {};
  const size = opts.size || 26;
  const color = opts.color || 'var(--ink)';
  return `<div style="text-align:center;">
    <div class="mono" style="font-size:${size}px; font-weight:800; color:${color}; line-height:1.1;">${value}</div>
    <div class="hint" style="margin-top:3px;">${label}</div>
  </div>`;
}
// Two input numbers side by side with "vs" between them.
function statCompareRowHtml(leftVal, leftLabel, rightVal, rightLabel, connector){
  return `<div style="display:flex; align-items:center; justify-content:center; gap:16px;">
    ${statNumberHtml(leftVal, leftLabel)}
    <div style="font-size:13px; color:var(--muted); font-weight:700;">${connector||'vs'}</div>
    ${statNumberHtml(rightVal, rightLabel)}
  </div>`;
}
// The derived result, set off below the comparison with a divider so it visually reads
// as "= this" rather than a third unrelated number.
function statResultHtml(value, label, color){
  return `<div style="text-align:center; margin-top:18px; padding-top:16px; border-top:1px solid var(--line-soft);">
    ${statNumberHtml(value, label, {size:32, color})}
  </div>`;
}

// The "show your work" behind each Progress stat tile — the exact numbers that produced
// the tile, as a graphic (big numbers + small captions) rather than a sentence.
function renderStatDetailModal(statKey){
  const s = computeProgressStats();
  const unit = s.unit;
  let title, content, footnote = '';
  if(statKey==='total-logged'){
    title = 'Total logged';
    content = statCompareRowHtml(
      fmtDist(s.totalLoggedKm,unit,1), 'miles logged',
      s.totalLoggedCount, `run${s.totalLoggedCount===1?'':'s'} logged`, 'in'
    );
    footnote = 'Every logged run counts here — any workout type, any date.';
  } else if(statKey==='training-miles'){
    title = 'Training miles logged';
    content = statCompareRowHtml(
      fmtDist(s.totalLoggedKm,unit,1), 'logged',
      fmtDist(s.totalPlanTrainingKm,unit,0), 'total plan training'
    ) + statResultHtml(`${s.pctPlanMilesLogged}%`, 'of training miles logged', 'var(--accent-strong)');
    footnote = "Race day itself isn't counted — that's the event, not training.";
  } else if(statKey==='adherence'){
    title = 'Plan adherence';
    content = statCompareRowHtml(
      s.completedPlannedRuns, 'days with a run completed',
      s.plannedRunDatesToDateCount, 'days with a run scheduled'
    ) + statResultHtml(`${s.adherence}%`, 'plan adherence', 'var(--accent-strong)');
    footnote = "Counts through yesterday until you log something today — once you do, today counts too, both what was scheduled and what you ran.";
  } else if(statKey==='mileage-delta'){
    title = s.mileageStatusLabel==='behind plan' ? 'Behind plan' : s.mileageStatusLabel==='ahead of plan' ? 'Ahead of plan' : 'On plan';
    const resultColor = s.mileageStatusLabel==='behind plan' ? 'var(--z-tempo)' : (s.mileageStatusLabel==='ahead of plan' ? 'var(--accent-strong)' : 'var(--muted)');
    content = statCompareRowHtml(
      fmtDist(s.plannedToDateKm,unit,1), 'planned to date',
      fmtDist(s.loggedKmToDate,unit,1), 'logged to date'
    ) + statResultHtml(fmtDist(Math.abs(s.mileageDeltaKm),unit,1), s.mileageStatusLabel, resultColor);
    footnote = "Compares through yesterday until you log a run today — the moment you do, today's own planned distance and logged distance both count too, so it's always an apples-to-apples comparison.";
  } else if(statKey==='race-projection' || (statKey && statKey.startsWith('general-projection-'))){
    const p = statKey==='race-projection' ? s.raceProjection : s.generalProjections.find(x=>statKey===`general-projection-${x.key}`);
    title = statKey==='race-projection' ? 'Projected race performance' : `Projected ${p.label} performance`;
    content = statCompareRowHtml(
      secToClock(p.start.timeSec), 'at plan start',
      secToClock(p.current.timeSec), 'today'
    ) + statResultHtml(projectionDeltaText(p.start.timeSec, p.current.timeSec), 'change since you started', 'var(--accent-strong)');
    if(p.goal){
      content += `<div style="border-top:1px solid var(--line-soft); margin:18px 0 16px;"></div>` +
        statNumberHtml(secToClock(p.goal.timeSec), `goal pace (${paceOrSpeedStr(p.goal.paceSecPerKm,unit,state.paceFormat)}) if you complete the rest of the plan`, {color:'var(--accent-strong)'});
    }
    footnote = `Pace: ${paceOrSpeedStr(p.start.paceSecPerKm,unit,state.paceFormat)} at the start vs ${paceOrSpeedStr(p.current.paceSecPerKm,unit,state.paceFormat)} today. Based on your training paces, not a specific logged race result.`;
  }
  return modalShell(title, `${content}${footnote?`<div class="hint" style="text-align:center; margin-top:16px;">${footnote}</div>`:''}`);
}

function modalShell(title, innerHtml, headerButtonHtml){
  return `<div class="overlay" data-act="close-modal-overlay">
    <div class="sheet" data-stop="1">
      <div class="sheet-handle"></div>
      ${headerButtonHtml || ''}
      <button class="sheet-close" data-act="close-modal" aria-label="Close">${ICONS.close}</button>
      <h3 class="sheet-title">${title}</h3>
      ${innerHtml}
    </div>
  </div>`;
}

// The plan day (and its own week, for pace lookup) matching a given date, if any.
function plannedWorkoutForDate(dateStr){
  if(!state.plan || !dateStr) return null;
  for(const week of state.plan.weeks){
    const day = week.days.find(x=>x.date===dateStr);
    if(day) return {day, week};
  }
  return null;
}
// Same lookup, but returning the indices the day-detail modal needs to address the day.
function planDayIndexForDate(dateStr){
  if(!state.plan || !dateStr) return null;
  for(let wi=0; wi<state.plan.weeks.length; wi++){
    const di = state.plan.weeks[wi].days.findIndex(x=>x.date===dateStr);
    if(di!==-1) return {weekIndex:wi, dayIndex:di};
  }
  return null;
}
function plannedWorkoutHtml(dateStr){
  const found = plannedWorkoutForDate(dateStr);
  if(!found){
    return `<div class="field"><label class="field-label">Planned for this day</label><div class="input" style="color:var(--ink-soft);">No planned workout for this date.</div></div>`;
  }
  const {day, week} = found;
  const meta = TYPE_META[day.type];
  const unit = state.setup.units, fmt = state.paceFormat;
  const weekPaces = getWeekPaces(state.plan, week, state.logs);
  const desc = dayDisplayText(day, weekPaces, unit, fmt);
  return `<div class="field">
    <label class="field-label">Planned for this day</label>
    <div class="input" style="height:auto; display:flex; flex-direction:column; gap:6px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="pill" style="background:var(--${meta.bg}); color:var(--${meta.fg})">${day.label}</span>
        ${day.km>0?`<span class="mono" style="font-size:12.5px; color:var(--ink-soft);">${fmtDist(day.km,unit)}</span>`:''}
      </div>
      ${desc?`<div style="color:var(--ink-soft); font-size:13px;">${esc(desc)}</div>`:''}
    </div>
  </div>`;
}
function logPaceHint(d, unit){
  const distV = Number(d.dist);
  const durSec = parseDurationToSec(d.time);
  if(!distV || !durSec) return 'Enter distance and time to see your pace per mile.';
  const paceSecPerKm = durSec/unitToKm(distV, unit);
  return `That's about ${paceStr(paceSecPerKm,'mi')} pace.`;
}

function modalLogRun(){
  const m = state.modal;
  if(!m.data) m.data = {date:fmtDate(todayDate()), dist:'', time:'', notes:''};
  if(!m.mode) m.mode = state.stravaAuth ? 'strava' : 'manual';

  // Kicks off exactly once per modal open — switching modes back and forth afterward
  // reuses the same fetched list rather than re-requesting it.
  if(m.mode==='strava' && !m.strava){
    m.strava = {loading:true, error:null, items:null};
    fetchStravaRuns().then(items=>{
      if(state.modal && state.modal.type==='log-run' && state.modal.strava){
        state.modal.strava = {loading:false, error:null, items};
        render();
      }
    }).catch(()=>{
      if(state.modal && state.modal.type==='log-run' && state.modal.strava){
        state.modal.strava = {loading:false, error:"Couldn't load your Strava runs.", items:null};
        render();
      }
    });
  }

  const switcher = state.stravaAuth ? `
    <div class="chip-select" style="margin-bottom:16px;">

// Shared "how does actual pace compare to planned" phrasing — used both for a single
// logged run and for the aggregated pace tracker in Progress.
function paceDeltaLine(actualPaceSecPerKm, plannedPaceSecPerKm, unit, fmt){
  if(plannedPaceSecPerKm==null || actualPaceSecPerKm==null) return '';
  const deltaSecPerKm = actualPaceSecPerKm-plannedPaceSecPerKm;
  const deltaDisplayPerUnit = unit==='mi' ? deltaSecPerKm*KM_PER_MI : deltaSecPerKm;
  if(Math.abs(deltaDisplayPerUnit)<3) return 'right on target pace';
  if(fmt==='speed'){
    const actualSpeed = 3600/(unit==='mi'?actualPaceSecPerKm*KM_PER_MI:actualPaceSecPerKm);
    const plannedSpeed = 3600/(unit==='mi'?plannedPaceSecPerKm*KM_PER_MI:plannedPaceSecPerKm);
    return `${Math.abs(actualSpeed-plannedSpeed).toFixed(1)} ${unit==='mi'?'mph':'km/h'} ${actualSpeed<plannedSpeed?'slower':'faster'} than planned`;
  }
  return `${secToClock(Math.abs(deltaDisplayPerUnit))}/${unit} ${deltaDisplayPerUnit>0?'slower':'faster'} than planned`;
}

function renderLoggedComparisonHtml(day, log, plan, week, logs, unit, fmt){
  const plannedKm = day.km;
  const plannedPaceSecPerKm = day.paceKey ? (day.paceOverrideSecPerKm!=null ? day.paceOverrideSecPerKm : getWeekPaces(plan, week, logs)[day.paceKey]) : null;
  // The pace shown next to duration is always the plain logged average (matches the
  // distance/time the runner actually entered) - but for a day with a warm-up baked in,
  // comparing THAT blended average directly against the pure quality-pace target would
  // make the runner look slower than they were during the quality portion itself. The
  // comparison line uses the warm-up-backed-out estimate instead, and says so explicitly
  // so the two numbers on screen don't look like they're contradicting each other.
  const actualPaceSecPerKm = log.distanceKm>0 ? log.durationSec/log.distanceKm : null;
  const totalEasyKm = (day.warmupKm||0) + (day.cooldownKm||0);
  const warmupAdjusted = totalEasyKm>0.15 && log.distanceKm>totalEasyKm;
  const comparisonPaceSecPerKm = warmupAdjusted ? qualityEffortPaceSecPerKm(day, log.distanceKm, log.durationSec, plan) : actualPaceSecPerKm;

  const distLine = plannedKm>0
    ? `${fmtDist(log.distanceKm,unit)} logged vs ${fmtDist(plannedKm,unit)} planned`
    : `${fmtDist(log.distanceKm,unit)} logged — nothing was planned this day`;

  const paceCompareLine = paceDeltaLine(comparisonPaceSecPerKm, plannedPaceSecPerKm, unit, fmt);

  const NONELIGIBLE_NOUNS = {easy:'easy runs', long:'long runs', rest:'rest days', hills:'hill repeats', fartlek:'fartlek runs', progression:'progression runs', racepace:'race-pace runs', race:'race-day runs'};
  const eligible = RECALIBRATION_TYPES.includes(day.type) && day.paceKey && RECALIBRATION_PCT[day.paceKey];
  let impactLine;
  if(!eligible){
    const noun = NONELIGIBLE_NOUNS[day.type];
    impactLine = noun ? `No impact on future pacing — ${noun} aren't used to recalibrate paces.` : `No impact on future pacing — this run type isn't used to recalibrate paces.`;
  } else {
    const withPaces = getWeekPaces(plan, week, logs);
    const withoutPaces = getWeekPaces(plan, week, logs.filter(l=>l.id!==log.id));
    const deltaSecPerKm = withPaces.tempoPerKm - withoutPaces.tempoPerKm;
    const deltaPerUnit = unit==='mi' ? deltaSecPerKm*KM_PER_MI : deltaSecPerKm;
    if(Math.abs(deltaPerUnit)<1){
      impactLine = `No meaningful change to future pacing from this run alone.`;
    } else {
      impactLine = `This run nudged your upcoming training paces about ${Math.round(Math.abs(deltaPerUnit))} sec/${unit} ${deltaPerUnit>0?'slower':'faster'}.`;
    }
  }

  return `<div class="card" style="padding:14px 16px; margin-bottom:16px; background:var(--accent-soft); border-color:var(--accent-strong);">
    <div style="display:flex; align-items:center; gap:6px; font-weight:800; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink); margin-bottom:8px;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      Logged
    </div>
    <div style="font-weight:700; font-size:14.5px;">${esc(distLine)}</div>
    <div style="font-size:13px; color:var(--ink-soft); margin-top:2px;">${secToClock(log.durationSec)}${actualPaceSecPerKm!=null?' · '+paceOrSpeedStr(actualPaceSecPerKm,unit,fmt):''}${paceCompareLine?' · '+(warmupAdjusted?'excluding warm-up, ':'')+paceCompareLine:''}</div>
    <div class="hint" style="margin-top:8px; color:var(--ink-soft);">${impactLine}</div>
    <button class="btn btn-ghost btn-sm" data-act="delete-log" data-id="${log.id}" style="margin-top:10px; color:#C4432E;">Remove this log</button>
  </div>`;
}

/* ============================= backup / restore ============================= */
// Exports everything needed to pick back up on a fresh install: the onboarding inputs
// (to rebuild the plan, since the plan itself is a derived, regeneratable artifact) plus
// every logged run and small bits of profile state. Deliberately NOT the generated plan
// object itself - regenerating from setup means an import always rebuilds against the
// app's current plan-generation logic rather than replaying a possibly-outdated one.
function exportBackupData(){
  const payload = {
    schema: 'peak-backup-v1',
    exportedAt: new Date().toISOString(),
    name: state.name,
    paceFormat: state.paceFormat,
    setup: state.setup,
    logs: state.logs,
    strengthDone: state.strengthDone,
    achievementLog: state.achievementLog,
  };
  const json = JSON.stringify(payload, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `peak-backup-${fmtDate(todayDate())}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function handleImportFile(file){
  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){ showToast('That file is not valid backup data'); return; }
    const hasValidSetup = parsed && parsed.setup && parsed.setup.units && (parsed.setup.raceDate || (parsed.setup.planKind && parsed.setup.weeks));
    if(!hasValidSetup || !Array.isArray(parsed.logs)){
      showToast('That file is not a Peak backup'); return;
    }
    state.modal = {type:'confirm-import', data:parsed};
    render();
  };
  reader.onerror = () => showToast("Couldn't read that file");
  reader.readAsText(file);
}

function doImportBackup(data){
  const plan = generateGeneralPlan(data.setup);
  state.name = data.name || '';
  state.paceFormat = data.paceFormat || 'pace';
  state.setup = data.setup;
  state.plan = plan;
  state.logs = data.logs;
  state.strengthDone = data.strengthDone || [];
  state.achievementLog = data.achievementLog || [];
  Store.setName(state.name);
  Store.setPaceFormat(state.paceFormat);
  Store.setSetup(state.setup);
  Store.setPlan(state.plan);
  Store.setLogs(state.logs);
  Store.setStrengthDone(state.strengthDone);
  Store.setAchievementLog(state.achievementLog);
  const today = todayDate();
  const idx = plan.weeks.findIndex(w=>{ const ws=parseDate(w.weekStart); return today>=ws && today<addDays(ws,7); });
  state.currentWeekIndex = idx===-1?0:idx;
  state.view = 'app'; state.tab = 'plan';
  state.modal = null;
  showToast('Backup imported');
  window.scrollTo(0,0);
}

/* ============================= events ============================= */
function bindGlobal(){
  const app = document.getElementById('app');
  app.onclick = onClick;
  app.oninput = onInput;
  app.onchange = onChange;
}

function findAct(el){
  while(el && el!==document){ if(el.dataset && el.dataset.act) return el; el = el.parentElement; }
  return null;
}

function onClick(e){
  if(e.target.classList && e.target.classList.contains('overlay')){
    state.modal=null; render(); return;
  }
  const el = findAct(e.target);
  if(!el) return;
  const act = el.dataset.act;

  if(act==='set-tab'){ state.tab = el.dataset.tab; render(); return; }
  if(act==='goto-week'){ state.currentWeekIndex = Number(el.dataset.i); state.moveFrom=null; render(); return; }

  if(act==='pick-race'){
    const preset = RACE_PRESETS.find(r=>r.key===el.dataset.key);
    state.onboardDraft.raceKey = preset.key; state.onboardDraft.raceDistanceKm = preset.km;
    render(); return;
  }
  if(act==='pick-unit'){ state.onboardDraft.units = el.dataset.u; render(); return; }
  if(act==='pick-recent'){ state.onboardDraft.recentDistanceKey = el.dataset.key; render(); return; }
  if(act==='pick-goal-mode'){ state.onboardDraft.goalMode = el.dataset.mode; render(); return; }
  if(act==='pick-hills-mode'){ state.onboardDraft.hillsMode = el.dataset.mode; render(); return; }
  if(act==='pick-skip-base'){ state.onboardDraft.skipBase = el.dataset.mode==='1'; render(); return; }
  if(act==='pick-plan-kind'){
    const kind = el.dataset.kind;
    state.onboardDraft.planKind = kind;
    state.onboardDraft.weeks = PLAN_KIND_META[kind].weeksDefault;
    render(); return;
  }
  if(act==='pick-distance-metric'){ state.onboardDraft.distanceGoalMetric = el.dataset.m; render(); return; }
  if(act==='pick-restdays'){ state.onboardDraft.restDays = Number(el.dataset.n); render(); return; }
  if(act==='pick-long-emphasis'){ state.onboardDraft.longRunEmphasis = el.dataset.key; render(); return; }
  if(act==='pick-speed-emphasis'){ state.onboardDraft.speedEmphasis = el.dataset.key; render(); return; }
  if(act==='pick-strength-count'){ state.onboardDraft.strengthPerWeek = Number(el.dataset.n); render(); return; }
  if(act==='pick-dow'){
    const name = el.dataset.name, i = Number(el.dataset.i), multi = el.dataset.multi==='1';
    if(multi){
      const arr = state.onboardDraft[name];
      const idx = arr.indexOf(i);
      if(idx===-1) arr.push(i); else arr.splice(idx,1);
    } else {
      state.onboardDraft[name] = i;
    }
    render(); return;
  }
  if(act==='onboard-back'){ state.onboardStep = Math.max(1, state.onboardStep-1); render(); window.scrollTo(0,0); return; }
  if(act==='onboard-next'){
    const err = onboardStepError(state.onboardStep);
    if(err){ showToast(err); return; }
    state.onboardStep = Math.min(3, state.onboardStep+1);
    render(); window.scrollTo(0,0); return;
  }
  if(act==='generate-plan'){ submitOnboarding(); return; }

  if(act==='open-log'){
    state.modal = {
      type:'log-run',
      mode: state.stravaAuth ? 'strava' : 'manual',
      data:{date:fmtDate(todayDate()), dist:'', time:'', notes:''},
    };
    render(); return;
  }
  if(act==='log-mode-manual'){ state.modal.mode='manual'; render(); return; }
  if(act==='log-mode-strava'){ state.modal.mode='strava'; render(); return; }
  if(act==='connect-strava'){ window.location.href = stravaConnectUrl(); return; }
  if(act==='disconnect-strava'){
    Store.clearStravaAuth();
    state.stravaAuth = null;
    showToast('Disconnected from Strava');
    return;
  }
  if(act==='save-log'){
    const unit = state.setup.units;
    const d = state.modal.data;
    const durSec = parseDurationToSec(d.time);
    const distV = Number(d.dist);
    if(!d.date || !distV || !durSec){ showToast('Enter date, distance and time'); return; }
    commitLogEntry({date:d.date, distanceKm:unitToKm(distV,unit), durationSec:durSec, notes:d.notes, createdAt:new Date().toISOString()});
    return;
  }
  if(act==='import-strava-activity'){
    const id = Number(el.dataset.id);
    const items = (state.modal.strava && state.modal.strava.items) || [];
    const a = items.find(x=>x.id===id);
    if(!a) return;
    commitLogEntry({date:a.date, distanceKm:a.distanceKm, durationSec:a.durationSec, notes:a.name||'', createdAt:new Date().toISOString(), stravaId:a.id});
    return;
  }
  if(act==='delete-log'){
    const id = el.dataset.id;
    Store.deleteLog(id);
    state.logs = state.logs.filter(l=>l.id!==id);
    render(); return;
  }
  if(act==='open-day-for-log-date'){
    const found = planDayIndexForDate(el.dataset.date);
    if(!found){ showToast("That date isn't in your current plan"); return; }
    state.modal={type:'day-detail', weekIndex:found.weekIndex, dayIndex:found.dayIndex};
    render(); return;
  }
  if(act==='open-stat-detail'){
    state.modal={type:'stat-detail', stat: el.dataset.stat};
    render(); return;
  }
  if(act==='open-achievements'){
    state.modal={type:'achievements'};
    render(); return;
  }

  if(act==='open-day'){
    const di = Number(el.dataset.i);
    state.modal={type:'day-detail', weekIndex:state.currentWeekIndex, dayIndex:di};
    render(); return;
  }
  if(act==='open-day-edit'){
    const {weekIndex, dayIndex} = state.modal;
    const day = state.plan.weeks[weekIndex].days[dayIndex];
    state.modal={type:'edit-day', weekIndex, dayIndex, draft:{
      type: day.type, km: day.km, strength: day.strength, strides: !!day.strides, easyRole: day.easyRole ?? null,
      paceOverrideSecPerKm: day.paceOverrideSecPerKm ?? null, progressionEasy: !!day.progressionEasy,
      warmupKm: day.warmupKm ?? 0, cooldownKm: day.cooldownKm ?? 0,
    }};
    render(); return;
  }
  if(act==='open-log-for-day'){
    const {weekIndex, dayIndex} = state.modal;
    const day = state.plan.weeks[weekIndex].days[dayIndex];
    state.modal={type:'log-run', data:{date:day.date, dist:'', time:'', notes:''}};
    render(); return;
  }
  if(act==='toggle-strength-done'){
    const date = el.dataset.date;
    state.strengthDone = state.strengthDone.includes(date)
      ? state.strengthDone.filter(d=>d!==date)
      : [...state.strengthDone, date];
    Store.setStrengthDone(state.strengthDone);
    // Marking done (not un-marking) can itself earn an achievement (Strength Session
    // Logged, Strength Streak) - checked the same way a logged run is, just with no
    // specific run to pass through. evaluateAndTriggerAchievements sets state.modal to
    // the celebration when something fires, which the render() below then shows in place
    // of this day-detail view - exactly like logging a run does.
    if(state.strengthDone.includes(date)) evaluateAndTriggerAchievements(null);
    render();
    return;
  }
  if(act==='reset-day-pace'){
    state.modal.draft.paceOverrideSecPerKm = null;
    render(); return;
  }
  if(act==='move-target'){
    const di = Number(el.dataset.i);
    if(state.moveFrom && state.moveFrom.weekIndex===state.currentWeekIndex){
      const a = state.moveFrom.dayIndex, b = di;
      if(a===b){ state.moveFrom=null; render(); return; }
      const week = state.plan.weeks[state.currentWeekIndex];
      const da = week.days[a], db_ = week.days[b];
      const keepA = {date:da.date, dow:da.dow, id:da.id}, keepB = {date:db_.date, dow:db_.dow, id:db_.id};
      week.days[a] = {...db_, ...keepA};
      week.days[b] = {...da, ...keepB};
      Store.setPlan(state.plan);
      state.moveFrom=null;
      showToast('Swapped');
    }
    return;
  }
  if(act==='cancel-move'){ state.moveFrom=null; render(); return; }
  if(act==='start-move'){
    state.moveFrom = {weekIndex:state.currentWeekIndex, dayIndex:Number(el.dataset.di)};
    state.modal=null; render(); return;
  }
  if(act==='save-day'){
    const wi = Number(el.dataset.wi), di = Number(el.dataset.di);
    const draft = state.modal.draft;
    const day = state.plan.weeks[wi].days[di];
    const strides = STRIDES_ELIGIBLE_TYPES.includes(draft.type) && !!draft.strides;
    const progressionEasy = draft.type==='progression' && !!draft.progressionEasy;
    const meta = buildWorkoutMeta({type:draft.type, km:draft.km, strength:draft.strength, easyRole:draft.easyRole, progressionEasy, warmupKm:draft.warmupKm, cooldownKm:draft.cooldownKm}, state.plan.raceDistanceKm);
    // terrain/hillStrides are generatePlan-assigned, role-based fields (the long run, and
    // the week's "aerobic" easy day - see easyIdxs.forEach), not something the edit modal
    // lets the user set directly. Only keep them when the day's (possibly just-changed)
    // type is still one where they'd apply - easyRole itself can't change here, so a day
    // edited away from Long/aerobic-Easy into anything else drops its stale terrain note
    // instead of carrying it forward onto a workout it no longer describes.
    const terrainEligible = draft.type==='long' || (draft.type==='easy' && day.easyRole==='aerobic');
    const hillStridesEligible = draft.type==='easy' && day.easyRole==='aerobic' && strides;
    state.plan.weeks[wi].days[di] = {...day, type:draft.type, km:round1(draft.km), label:TYPE_META[draft.type].label, strength:draft.strength, strides, progressionEasy, paceOverrideSecPerKm: meta.paceKey?draft.paceOverrideSecPerKm:null, ...meta, warmupKm: meta.warmupKm||0, cooldownKm: meta.cooldownKm||0, easyVariety:false, terrain: terrainEligible ? day.terrain : null, hillStrides: hillStridesEligible ? day.hillStrides : false};
    const week = state.plan.weeks[wi];
    week.targetKm = round1(week.days.reduce((s,d)=>s+d.km,0));
    Store.setPlan(state.plan);
    state.modal=null; showToast('Day updated'); return;
  }

  if(act==='set-unit'){
    const u = el.dataset.u;
    if(u===state.setup.units) return;
    state.setup.units = u;
    Store.setSetup(state.setup);
    render(); return;
  }
  if(act==='set-pace-format'){
    const f = el.dataset.f;
    if(f===state.paceFormat) return;
    state.paceFormat = f;
    Store.setPaceFormat(f);
    render(); return;
  }
  if(act==='open-switch-plan'){
    state.onboardMode = 'switch';
    state.onboardDraft = draftFromSetup(state.setup);
    state.onboardStep = 1;
    state.view = 'onboarding';
    render(); window.scrollTo(0,0); return;
  }
  if(act==='cancel-switch-plan'){
    state.onboardMode = 'new';
    state.onboardDraft = null;
    state.view = 'app'; state.tab = 'settings';
    render(); window.scrollTo(0,0); return;
  }
  if(act==='confirm-reset'){ state.modal={type:'confirm-reset'}; render(); return; }
  if(act==='do-reset'){
    Store.resetAll();
    state.name=''; state.setup=null; state.plan=null; state.logs=[]; state.modal=null;
    state.strengthDone = []; state.achievementLog = [];
    state.stravaAuth = null;
    state.view='onboarding'; state.onboardDraft = defaultDraft(); state.onboardStep = 1;
    render(); window.scrollTo(0,0); return;
  }
  if(act==='close-modal'){ state.modal=null; state.moveFrom=null; render(); return; }

  if(act==='export-data'){ exportBackupData(); return; }
  if(act==='import-data'){ document.getElementById('import-file-input').click(); return; }
  if(act==='do-import-backup'){ doImportBackup(state.modal.data); return; }
}

function onInput(e){
  if(e.target.id==='in-name'){
    state.onboardDraft.name = e.target.value;
    const n = e.target.value.trim().toLowerCase();
    if(n==='lexi' || n==='lexi willis') showNameBadge("That's a hot girl name 💋");
  }
  if(e.target.id==='in-custom-dist'){
    const v = Number(e.target.value);
    if(v>0){
      state.onboardDraft.raceKey='custom'; state.onboardDraft.raceDistanceKm = unitToKm(v, state.onboardDraft.units);
      document.querySelectorAll('[data-act="pick-race"]').forEach(c=>c.classList.remove('active'));
    }
  }
  if(e.target.id==='in-recent-time'){
    const formatted = formatDurationDigits(e.target.value);
    e.target.value = formatted;
    state.onboardDraft.recentTime = formatted;
    // Debounced: a partial value like "2:23" mid-type into "22:30" parses as a real
    // (wrong) duration, so showing the derived pace/animal on every keystroke flashes
    // nonsense. Wait for a short pause in typing before computing it for real.
    const hintEl = document.getElementById('recent-pace-hint');
    if(hintEl){
      hintEl.textContent = 'Enter a finish time to see your pace per mile.';
      clearTimeout(recentPaceHintTimer);
      recentPaceHintTimer = setTimeout(()=>{
        const el2 = document.getElementById('recent-pace-hint');
        if(el2) el2.textContent = recentPaceHint(state.onboardDraft);
      }, PACE_HINT_DEBOUNCE_MS);
    }
  }
  if(state.modal && state.modal.type==='log-run'){
    const d = state.modal.data;
    if(e.target.id==='lr-time'){
      const formatted = formatDurationDigits(e.target.value);
      e.target.value = formatted;
      d.time = formatted;
    }
    if(e.target.id==='lr-dist'){ d.dist = e.target.value; }
    if(e.target.id==='lr-notes'){ d.notes = e.target.value; }
    if(e.target.id==='lr-time' || e.target.id==='lr-dist'){
      const hintEl = document.getElementById('lr-pace-hint');
      if(hintEl){
        hintEl.textContent = 'Enter distance and time to see your pace per mile.';
        clearTimeout(lrPaceHintTimer);
        lrPaceHintTimer = setTimeout(()=>{
          const el2 = document.getElementById('lr-pace-hint');
          if(el2) el2.textContent = logPaceHint(d, state.setup.units);
        }, PACE_HINT_DEBOUNCE_MS);
      }
    }
  }
}
function onChange(e){
  if(e.target.id==='import-file-input'){
    const file = e.target.files[0];
    e.target.value = '';
    if(file) handleImportFile(file);
    return;
  }
  if(e.target.id==='in-race-date'){
    state.onboardDraft.raceDate = e.target.value;
    // Deliberately not render() here: this app re-renders by regenerating innerHTML, which
    // destroys and recreates the date input itself. On iOS, opening an empty date field
    // fires a premature change event with today's date the instant the picker appears,
    // before the user has actually chosen anything - re-rendering right then yanks the
    // input out from under the still-open native picker and forcibly closes it. Patching
    // just the two small bits of UI that depend on raceDate, and leaving the input node
    // itself untouched, keeps the picker open through that spurious event so the user's
    // real selection (the change event that follows) lands normally.
    const placeholder = document.getElementById('race-date-placeholder');
    if(placeholder) placeholder.style.display = e.target.value ? 'none' : 'flex';
    const hintEl = document.getElementById('race-date-hint');
    if(hintEl){
      const weeksToRace = e.target.value ? Math.max(1,Math.ceil((parseDate(e.target.value)-todayDate())/86400000/7)) : null;
      hintEl.style.display = weeksToRace ? '' : 'none';
      hintEl.textContent = weeksToRace ? `${weeksToRace} week${weeksToRace===1?'':'s'} from today.` : '';
    }
    return;
  }
  if(e.target.id==='in-weekly'){ state.onboardDraft.currentWeeklyMi = e.target.value; render(); return; }
  if(e.target.id==='in-goal-time'){ state.onboardDraft.goalTime = e.target.value; }
  if(e.target.id==='in-max-long'){ state.onboardDraft.maxLongRunMi = e.target.value; }
  if(e.target.id==='in-max-weekly'){ state.onboardDraft.maxWeeklyMi = e.target.value; }
  if(e.target.id==='in-weeks'){ state.onboardDraft.weeks = e.target.value; render(); return; }
  if(e.target.id==='in-distance-current'){ state.onboardDraft.distanceGoalCurrentMi = e.target.value; render(); return; }
  if(e.target.id==='in-distance-target'){ state.onboardDraft.distanceGoalTargetMi = e.target.value; render(); return; }
  if(state.modal && state.modal.type==='log-run' && e.target.id==='lr-date'){
    state.modal.data.date = e.target.value;
    render(); return;
  }
  if(state.modal && state.modal.type==='edit-day'){
    const draft = state.modal.draft;
    const unit = state.setup.units;
    if(e.target.id==='ed-type'){ draft.type = e.target.value; render(); return; }
    if(e.target.id==='ed-km'){ draft.km = unitToKm(Number(e.target.value)||0, unit); render(); return; }
    if(e.target.id==='ed-strength'){ draft.strength = e.target.checked; render(); return; }
    if(e.target.id==='ed-strides'){ draft.strides = e.target.checked; render(); return; }
    if(e.target.id==='ed-progression-easy'){ draft.progressionEasy = e.target.checked; render(); return; }
    if(e.target.id==='ed-pace'){
      const secPerKm = parsePaceInput(e.target.value, unit, state.paceFormat);
      if(secPerKm!=null) draft.paceOverrideSecPerKm = secPerKm;
      render(); return;
    }
  }
}

boot();
})();
</script>
</body>
</html>
