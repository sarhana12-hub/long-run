    return `
    <button class="card day-card ${match?'logged':''} ${isMoveSrc?'move-source':''} ${isMoveTarget?'move-target':''}" data-act="${state.moveFrom? 'move-target':'open-day'}" data-i="${di}" style="${isToday?'border-color:var(--accent-strong)':''}">
      <div class="day-date"><div class="dow">${DOW_LABELS[day.dow]}</div><div class="dom mono">${dt.getDate()}</div></div>
      <div class="day-main">
        <div class="day-top">
          <span class="pill" style="background:var(--${meta.bg}); color:var(--${meta.fg})">${day.label}</span>
          ${day.strength?`<span class="strength-badge">+ Strength</span>`:''}
        </div>
        <div class="day-desc">${esc(dayDisplayText(day, weekPaces, unit, fmt))}</div>
      </div>
      <div class="day-side">
        ${match?`<div class="day-check">${ICONS.check}</div>`:''}
        ${day.km>0?`<div class="day-dist mono">${fmtDist(day.km,unit)}</div>`:''}
      </div>
    </button>`;
  }).join('');

  return `
  ${state.moveFrom!=null && state.moveFrom.weekIndex===state.currentWeekIndex ? `<div class="banner">${ICONS.move}<span>Choose a day to swap with "${week.days[state.moveFrom.dayIndex].label}". <a class="link-btn" data-act="cancel-move" style="color:inherit">Cancel</a></span></div>`:''}
  ${warnings.length ? `<div class="banner">${ICONS.bolt}<span>${warnings.map(w=>esc(w)).join('<br>')}</span></div>` : ''}
  <div class="week-strip">${strip}</div>
  <div class="week-header">
    <div>
      <h2>${weekDisplayLabel(week, plan.totalWeeks)} · Week ${week.weekIndex+1}</h2>
      <div class="week-meta">${niceDate(weekStartDate)} – ${niceDate(addDays(weekStartDate,6))} · ${daysToRaceForWeek>0?daysToRaceForWeek+' days to race':(week.weekIndex===plan.totalWeeks-1?'Race week':'Race day has passed')}</div>
    </div>
    <div class="week-stat">
      <div class="v">${fmtDist(loggedKm,unit,1)} <span style="color:var(--muted); font-weight:600; font-size:12px;">/ ${fmtDist(week.targetKm,unit,1)}</span></div>
      <div class="l">logged this week</div>
    </div>
  </div>
  <div class="day-list">${dayCards}</div>
  <div style="height:20px"></div>
  `;
}

function logsInWeek(week){
  const ws = parseDate(week.weekStart), we = addDays(ws,7);
  return state.logs.filter(l=>{ const d=parseDate(l.date); return d>=ws && d<we; });
}

// All four Progress stat-tile numbers in one place, so the tiles themselves and their
// tap-to-see-the-math detail views can never drift apart from computing things twice.
function computeProgressStats(){
  const plan = state.plan, unit = state.setup.units;
  const totalLoggedKm = state.logs.reduce((s,l)=>s+l.distanceKm,0);
  const totalLoggedCount = state.logs.length;
  // Scoped to logs dated today or earlier — otherwise a run logged ahead of schedule (or
  // just entered against the wrong date) silently erases "behind plan", since it would
  // count toward miles done without the corresponding day having actually happened yet.
  const loggedKmToDate = state.logs.filter(l=>parseDate(l.date)<=todayDate()).reduce((s,l)=>s+l.distanceKm,0);
  const plannedToDateWeeks = plan.weeks.filter(w=>parseDate(w.weekStart) <= todayDate());
  const plannedToDateKm = plannedToDateWeeks.reduce((s,w)=>{
    return s + w.days.filter(d=>parseDate(d.date)<=todayDate()).reduce((s2,d)=>s2+d.km,0);
  },0);
  // Positive means behind (planned more than you've logged); negative means you've
  // logged more than the plan called for so far — genuinely possible (extra volume, or
  // catching up after a missed week) and worth showing as "ahead", not just floored at 0.
  const mileageDeltaKm = plannedToDateKm - loggedKmToDate;
  const mileageStatusLabel = mileageDeltaKm > 0.1 ? 'behind plan' : (mileageDeltaKm < -0.1 ? 'ahead of plan' : 'on plan');
  // "Runs completed" is the fraction of already-past planned run days that have at
  // least one log against that specific date — not a raw log-entry count, which would
  // double-count a day logged in two pieces and would also count logs against future or
  // rest days that were never part of what "completed so far" should be measuring.
  const plannedRunDatesToDate = [];
  plannedToDateWeeks.forEach(w=>w.days.forEach(d=>{ if(parseDate(d.date)<=todayDate() && d.km>0) plannedRunDatesToDate.push(d.date); }));
  const loggedDates = new Set(state.logs.map(l=>l.date));
  const completedPlannedRuns = plannedRunDatesToDate.filter(date=>loggedDates.has(date)).length;
  const adherence = plannedRunDatesToDate.length>0 ? Math.round(100*completedPlannedRuns/plannedRunDatesToDate.length) : 0;
  // Separate from adherence (did you run on the days the plan called for): what fraction
  // of the whole plan's training mileage — every week, not just the ones behind you —
  // have you actually logged. Race day itself isn't "training" so it's excluded.
  const totalPlanTrainingKm = plan.weeks.reduce((s,w)=> s + w.days.filter(d=>d.type!=='race').reduce((s2,d)=>s2+d.km,0), 0);
  const pctPlanMilesLogged = totalPlanTrainingKm>0 ? Math.round(100*Math.min(1, totalLoggedKm/totalPlanTrainingKm)) : 0;
  return {
    unit, totalLoggedKm, totalLoggedCount,
    loggedKmToDate, plannedToDateKm, mileageDeltaKm, mileageStatusLabel,
    plannedRunDatesToDateCount: plannedRunDatesToDate.length, completedPlannedRuns, adherence,
    totalPlanTrainingKm, pctPlanMilesLogged,
  };
}

// Shared by manual entry and Strava import — both end up with the same log shape, so
// both should go through the same save + milestone/badge check rather than duplicating it.
function commitLogEntry(logData){
  const item = Store.addLog(logData);
  state.logs = [item, ...state.logs];
  state.modal = null;
  const milestoneFired = checkAndTriggerMilestones(item) || checkAndTriggerBadges(item);
  if(milestoneFired) render(); else showToast('Run logged');
}

// Checks the two summit-tier milestones (50% of plan volume logged, race day reached)
// against the run just saved. Each fires at most once per plan — the "already shown"
// flags persist so re-opening the app or logging more runs afterward never repeats them.
// Race day takes priority over the halfway mark on the rare chance both would fire off
// the same log (e.g. a big last-minute catch-up logged on race day itself).
function checkAndTriggerMilestones(newLog){
  const shown = state.milestonesShown;
  const plan = state.plan;
  if(!shown.arrived && plan && plan.raceDate && parseDate(newLog.date) >= parseDate(plan.raceDate)){
    shown.arrived = true;
    Store.setMilestonesShown(shown);
    state.modal = {type:'milestone', data:{
      hero: ICONS.summitArrived,
      title:'You made it to race day',
      message:"Every training week led here. However today went, you earned this."
    }};
    return true;
  }
  const stats = computeProgressStats();
  if(!shown.halfway && stats.pctPlanMilesLogged >= 50){
    shown.halfway = true;
    Store.setMilestonesShown(shown);
    state.modal = {type:'milestone', data:{
      hero: ICONS.summitHalfway,
      title:'Halfway up the mountain',
      message:"You've logged half of this plan's training miles. The summit is closer than the trailhead now."
    }};
    return true;
  }
  return false;
}

// Badge-tier celebrations (frequent, small — the badge-ring icon, not a hero illustration).
// Unlike the summit milestones these can recur across a single plan (a new week hit, a new
// tempo PR), with two exceptions that are naturally one-shot: "first run logged" can only
// ever be true once, and each individual week can only be credited for hitting its target
// once (tracked by weekStart date in shown.weeksHit).
function checkAndTriggerBadges(newLog){
  const shown = state.milestonesShown;
  const unit = state.setup.units;

  if(!shown.firstRun && state.logs.length===1){
    shown.firstRun = true;
    Store.setMilestonesShown(shown);
    state.modal = {type:'milestone', data:{
      title:'First run logged',
      message:"You've started tracking. Every run from here builds toward the plan."
    }};
    return true;
  }

  // "Completed week" means the week's date range has fully passed — not the week in
  // progress, even if this week's mileage already happens to be on target.
  const week = state.plan.weeks.find(w=>{
    const ws = parseDate(w.weekStart);
    return parseDate(newLog.date) >= ws && parseDate(newLog.date) < addDays(ws,7);
  });
  if(week && !shown.weeksHit.includes(week.weekStart) && todayDate() >= addDays(parseDate(week.weekStart),7)){
    const actual = weekActualKm(week);
    if(actual >= week.targetKm){
      shown.weeksHit.push(week.weekStart);
      Store.setMilestonesShown(shown);
      state.modal = {type:'milestone', data:{
        title:'Week fully hit',
        message:`You logged ${fmtDist(actual,unit,1)} against a ${fmtDist(week.targetKm,unit,1)} target for the week of ${niceDate(parseDate(week.weekStart))}.`
      }};
      return true;
    }
  }

  // A "new fastest" requires an earlier tempo run to beat — the very first one ever
  // logged has nothing to compare against yet, so it's excluded rather than trivially
  // counted as a PR.
  const day = week ? week.days.find(d=>d.date===newLog.date) : null;
  if(day && day.type==='tempo' && day.paceKey){
    const tempoRuns = paceRunsForType('tempo');
    const todayRun = tempoRuns.find(r=>r.date===newLog.date);
    const priorRuns = tempoRuns.filter(r=>r.date!==newLog.date);
    if(todayRun && priorRuns.length){
      const bestPriorSecPerKm = Math.min(...priorRuns.map(r=>r.actualPaceSecPerKm));
      if(todayRun.actualPaceSecPerKm < bestPriorSecPerKm){
        state.modal = {type:'milestone', data:{
          title:'New fastest tempo run',
          message:`You ran today's tempo effort at ${paceOrSpeedStr(todayRun.actualPaceSecPerKm,unit,state.paceFormat)} — your best yet.`
        }};
        return true;
      }
    }
  }

  return false;
}

function renderProgressTab(){
  const plan = state.plan, unit = state.setup.units;
  const raceDate = parseDate(plan.raceDate);
  const daysToRace = daysBetween(todayDate(), raceDate);
  const stats = computeProgressStats();

  const chartWeeks = plan.weeks.filter(w=>parseDate(w.weekStart)<=addDays(todayDate(),7)).slice(-8);
  const maxKm = Math.max(1, ...chartWeeks.map(w=>Math.max(w.targetKm, weekActualKm(w))));
  const bars = chartWeeks.map(w=>{
    const actual = weekActualKm(w);
    const plannedPct = clamp((w.targetKm/maxKm)*100,2,100);
    const actualPct = clamp((actual/maxKm)*100,0,100);
    return `<div class="chart-col">
      <div class="bar-label mono"><span style="color:var(--accent-strong);">${Math.round(kmToUnit(actual,unit))}</span><span style="color:var(--muted);">/${Math.round(kmToUnit(w.targetKm,unit))}${unit}</span></div>
      <div class="bar-track">
        <div class="bar-planned" style="height:${plannedPct}%"></div>
        <div class="bar-actual" style="height:${actualPct}%"></div>
      </div>
      <div class="wl">${chartWeekLabel(w)}</div>
    </div>`;
  }).join('');

  const recentLogs = state.logs.slice(0,12);
  const logRows = recentLogs.length ? recentLogs.map(l=>{
    const pace = l.durationSec/l.distanceKm;
    return `<div class="log-row" data-act="open-day-for-log-date" data-date="${l.date}">
      <div class="log-date">${niceDate(parseDate(l.date))}</div>
      <div class="log-mid"><div class="d">${fmtDist(l.distanceKm,unit)} · ${secToClock(l.durationSec)}</div>${l.notes?`<div class="t">${esc(l.notes)}</div>`:''}</div>
      <div class="log-pace mono">${paceOrSpeedStr(pace,unit,state.paceFormat)}</div>
      <button class="btn btn-ghost btn-sm" data-act="delete-log" data-id="${l.id}" style="color:var(--muted)" aria-label="Delete this run">${ICONS.close}</button>
    </div>`;
  }).join('') : `<div class="empty">No runs logged yet — tap "Log a run" to start tracking.</div>`;

  return `
  <div class="container" style="padding-top:14px;">
    <h2 style="font-size:20px; margin-bottom:2px;">${esc(state.name)}'s progress</h2>
    <div class="hint" style="margin-bottom:16px;">${daysToRace>=0? daysToRace+' days until '+raceLabel(state.setup) : 'Race day has passed — nice work.'}</div>
  </div>
  <div class="stat-grid" style="margin-bottom:16px;">
    <button class="card stat-tile" data-act="open-stat-detail" data-stat="total-logged"><div class="v">${fmtDist(stats.totalLoggedKm,unit,0)}</div><div class="l">total logged</div></button>
    <button class="card stat-tile" data-act="open-stat-detail" data-stat="training-miles"><div class="v">${stats.pctPlanMilesLogged}%</div><div class="l">training miles logged</div></button>
    <button class="card stat-tile" data-act="open-stat-detail" data-stat="adherence"><div class="v">${stats.adherence}%</div><div class="l">plan adherence</div></button>
    <button class="card stat-tile" data-act="open-stat-detail" data-stat="mileage-delta"><div class="v">${fmtDist(Math.abs(stats.mileageDeltaKm),unit,0)}</div><div class="l">${stats.mileageStatusLabel}</div></button>
  </div>
  <div class="section-title" style="padding:0 20px;">Weekly mileage — planned vs. actual</div>
  <div class="card chart-card">
    <div class="chart-rows">${bars}</div>
    <div class="legend"><span><i style="background:var(--line)"></i>Planned</span><span><i style="background:var(--accent-strong)"></i>Logged</span></div>
  </div>
  <div class="section-title" style="padding:0 20px;">Pace tracker</div>
  <div class="card" style="padding:6px 16px 14px; margin:0 18px 24px;">
    ${paceTrackerRowHtml('long','Long runs')}
    ${paceTrackerRowHtml('tempo','Tempo runs')}
    <div class="hint" style="margin-top:10px;">Each line tracks pace vs. that day's target over your last several runs — the dashed line is on pace, above is faster, below is slower.</div>
  </div>
  <div class="section-title" style="padding:0 20px;">Recent runs</div>
  <div class="card" style="margin:0 18px 24px;">${logRows}</div>
  `;
}

function weekActualKm(week){
  return logsInWeek(week).reduce((s,l)=>s+l.distanceKm,0);
}
function chartWeekLabel(week){
  const dt = parseDate(week.weekStart);
  return `${dt.getMonth()+1}/${dt.getDate()}`;
}

// Every logged-vs-planned pace pairing for `type`, oldest first — the raw material for
// the pace tracker's trend line. Only long/tempo (each with one clean, structured target
// pace) are shown in the UI — easy/hills/fartlek are intentionally run by feel with no
// single "right" pace, and rest/race aren't training-pace days at all.
function paceRunsForType(type){
  const matches = [];
  for(const week of state.plan.weeks){
    for(const day of week.days){
      if(day.type!==type || !day.paceKey) continue;
      // Logging two runs against the same plan day (a split effort, or a correction)
      // shouldn't silently drop one of them — combine every log on that date into a
      // single actual pace for the day, rather than matching only the first found.
      const dayLogs = state.logs.filter(l=>l.date===day.date);
      if(!dayLogs.length) continue;
      const totalKm = dayLogs.reduce((s,l)=>s+l.distanceKm,0);
      const totalSec = dayLogs.reduce((s,l)=>s+l.durationSec,0);
      if(totalKm<=0) continue;
      const weekPaces = getWeekPaces(state.plan, week, state.logs);
      const plannedPaceSecPerKm = day.paceOverrideSecPerKm!=null ? day.paceOverrideSecPerKm : weekPaces[day.paceKey];
      if(plannedPaceSecPerKm==null) continue;
      matches.push({date:day.date, actualPaceSecPerKm: totalSec/totalKm, plannedPaceSecPerKm});
    }
  }
  matches.sort((a,b)=> a.date<b.date?-1:1);
  return matches;
}
// A delta this big (12% of that run's own target pace) or more maxes out the trend
// line's vertical scale, so one outlier can't flatten the rest of the chart.
const PACE_TREND_CAP_FRAC = 0.12;
const PACE_ON_TARGET_SEC_PER_KM = 2;
function paceRunColor(run){
  const deltaSecPerKm = run.actualPaceSecPerKm - run.plannedPaceSecPerKm;
  if(Math.abs(deltaSecPerKm)<PACE_ON_TARGET_SEC_PER_KM) return 'var(--muted)';
  return deltaSecPerKm>=0 ? 'var(--z-tempo)' : 'var(--accent-strong)';
}
// Same pace formatting as paceOrSpeedStr, minus the /mi or /km suffix — the unit is
// already implied by context, and every character counts in a tiny chart label.
function compactPaceLabel(secPerKm, unit, fmt){
  const secPerUnit = unit==='mi' ? secPerKm*KM_PER_MI : secPerKm;
  return fmt==='speed' ? (3600/secPerUnit).toFixed(1) : secToClock(secPerUnit);
}
// A small line chart of pace delta over time — up (green) is faster than that day's
// target, down (amber) is slower, the dashed center line is on pace. Plotting each run
// individually (rather than one blended average) is the point: it shows whether recent
// runs are trending toward target, not just where the average happens to land. Each
// point is labeled with its own date and pace, colored the same as the dot, alternating
// above/below by index so neighboring labels don't stack on top of each other.
function paceSparklineSvg(runs){
  const W = 280, H = 108, PAD_X = 10;
  const CENTER_Y = 54, USABLE_H = 22, LABEL_OFFSET = 15;
  const unit = state.setup.units, fmt = state.paceFormat;
  const n = runs.length;
  const pts = runs.map((r,i)=>{
    const x = n===1 ? W/2 : PAD_X + (i/(n-1))*(W-PAD_X*2);
    const deltaFrac = clamp((r.actualPaceSecPerKm-r.plannedPaceSecPerKm)/r.plannedPaceSecPerKm, -PACE_TREND_CAP_FRAC, PACE_TREND_CAP_FRAC);
    const y = CENTER_Y + (deltaFrac/PACE_TREND_CAP_FRAC)*USABLE_H;
    return {x, y, color:paceRunColor(r), run:r};
  });
  const pathD = pts.map((p,i)=> `${i===0?'M':'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
  const dots = pts.map(p=> `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.2" style="fill:${p.color};"/>`).join('');
  const labels = pts.map((p,i)=>{
    const above = i%2===0;
    const ty = above ? p.y-LABEL_OFFSET : p.y+LABEL_OFFSET+7;
    const anchor = i===0 ? 'start' : (i===n-1 ? 'end' : 'middle');
    const dt = parseDate(p.run.date);
    const dateStr = `${dt.getMonth()+1}/${dt.getDate()}`;
    const paceLabel = compactPaceLabel(p.run.actualPaceSecPerKm, unit, fmt);
    return `<text x="${p.x.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="${anchor}" style="font-size:8.5px; font-family:var(--font-body); fill:${p.color};">${esc(dateStr)} ${esc(paceLabel)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block; overflow:visible;">
    <line x1="0" y1="${CENTER_Y}" x2="${W}" y2="${CENTER_Y}" style="stroke:var(--line); stroke-width:1; stroke-dasharray:3,3;"/>
    <path d="${pathD}" style="fill:none; stroke:var(--ink-soft); stroke-width:1.5;"/>
    ${dots}
    ${labels}
  </svg>`;
}
function paceTrackerRowHtml(type, label){
  const unit = state.setup.units, fmt = state.paceFormat;
  const allRuns = paceRunsForType(type);
  if(!allRuns.length){
    return `<div style="padding:14px 0; border-bottom:1px solid var(--line-soft);">
      <div style="font-weight:700; font-size:14px;">${label}</div>
      <div class="hint" style="margin:2px 0 0;">No logged ${label.toLowerCase()} yet.</div>
    </div>`;
  }
  const runs = allRuns.slice(-8);
  const mostRecent = runs[runs.length-1];
  const deltaLineFull = paceDeltaLine(mostRecent.actualPaceSecPerKm, mostRecent.plannedPaceSecPerKm, unit, fmt);
  const deltaShort = deltaLineFull==='right on target pace' ? 'On pace' : deltaLineFull.replace(' than planned','');
  const recentColor = paceRunColor(mostRecent);

  return `<div style="padding:14px 0; border-bottom:1px solid var(--line-soft);">
    <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px;">
      <span style="font-weight:700; font-size:14px;">${label}</span>
      <span class="mono" style="font-size:11px; color:var(--muted);">${allRuns.length} logged</span>
    </div>
    ${paceSparklineSvg(runs)}
    <div style="display:flex; justify-content:space-between; margin-top:2px; font-size:11.5px;">
      <span class="mono" style="color:var(--muted);">Target ${paceOrSpeedStr(mostRecent.plannedPaceSecPerKm,unit,fmt)}</span>
      <span style="font-weight:700; color:${recentColor};">Most recent: ${deltaShort}</span>
    </div>
  </div>`;
}

  const currentWeek = state.plan.weeks[state.currentWeekIndex];
  const cw = getWeekPaces(state.plan, currentWeek, state.logs);

  return `

        <div class="chip-select"><button class="chip ${unit==='mi'?'active':''}" data-act="set-unit" data-u="mi">Miles</button><button class="chip ${unit==='km'?'active':''}" data-act="set-unit" data-u="km">Kilometers</button></div>
      </div>

      </div>
    </div>

    <div class="section-title">Race</div>
    <div class="card" style="padding:6px 16px;">
      <div class="settings-row"><div><div class="lbl">${raceLabel(s)}</div><div class="sub">${niceDateFull(parseDate(s.raceDate))}</div></div></div>
      <div class="settings-row"><div><div class="lbl">Weekly mileage used to build plan</div><div class="sub">${fmtDist(s.currentWeeklyKm,unit,1)}/week</div></div></div>
      <div class="settings-row"><div><div class="lbl">This week's paces</div><div class="sub">Easy ${paceOrSpeedStr(cw.easyPerKm,unit,fmt)} · Tempo ${paceOrSpeedStr(cw.tempoPerKm,unit,fmt)} · Goal race pace ${paceOrSpeedStr(cw.racePerKm,unit,fmt)}</div></div></div>
      <div class="hint" style="padding:0 0 12px;">Training paces gradually get faster as your plan builds toward peak fitness, then hold steady through the taper.${recal ? ` Right now they're also adjusted based on your last ${recal.count} logged tempo/interval/over-under run${recal.count===1?'':'s'}.` : ''}</div>
    </div>

    <div class="section-title">Strava</div>
    <div class="card" style="padding:14px 16px; display:flex; flex-direction:column; gap:10px;">
      ${state.stravaAuth ? `
        <div class="settings-row"><div><div class="lbl">Connected</div><div class="sub">Import a run's distance and time instead of typing them in.</div></div></div>
        <button class="btn btn-block" data-act="disconnect-strava">Disconnect</button>

        <button class="btn btn-primary btn-block" data-act="connect-strava">Connect to Strava</button>
      `}
    </div>

    <div class="section-title">Plan controls</div>
    <div class="card" style="padding:14px 16px; display:flex; flex-direction:column; gap:10px;">
      <div class="hint">Regenerating rebuilds every week of your plan from today's inputs. Your logged runs are kept — only the plan itself changes.</div>
      <button class="btn btn-block" data-act="open-edit-setup">Edit inputs & regenerate plan</button>
    </div>

    <div class="section-title">Danger zone</div>
    <div class="card" style="padding:14px 16px;">
      <button class="btn btn-danger btn-block" data-act="confirm-reset">Start over (erase this device's data)</button>
    </div>
    <div style="height:24px"></div>
  </div>`;
}

/* ============================= modals ============================= */
function renderModal(){
  const m = state.modal;
  if(m.type==='day-detail') return renderDayDetail();
  if(m.type==='log-run') return modalLogRun();
  if(m.type==='edit-day') return modalEditDay();
  if(m.type==='edit-setup') return modalEditSetup();
  if(m.type==='confirm-reset') return modalConfirmReset();
  if(m.type==='stat-detail') return renderStatDetailModal(m.stat);
  if(m.type==='milestone') return modalMilestone(m.data);
  return '';
}

// Badge-tier celebrations (frequent, small) pass no `hero` and get the 84px badge-ring
// with the line-icon summitBadge; summit-tier celebrations (rare, plan-defining) pass a
// hero illustration shown larger in its place. Same sheet either way.
function modalMilestone(data){
  const { hero, title, message } = data;
  const artHtml = hero
    ? `<div class="milestone-hero">${hero}</div>`
    : `<div class="badge-ring">${ICONS.summitBadge}</div>`;
  return `<div class="overlay" data-act="close-modal-overlay">
    <div class="sheet milestone" data-stop="1">
      <div class="sheet-handle"></div>
      <button class="sheet-close" data-act="close-modal">${ICONS.close}</button>
      ${artHtml}
      <div class="sheet-title milestone">${esc(title)}</div>
      <div class="sheet-body">${esc(message)}</div>
      <button class="btn btn-primary btn-block" data-act="close-modal">Nice!</button>
    </div>
  </div>`;
}

// A big number with a small caption under it — the building block for the stat detail
// graphics below (numbers first, not sentences).
function statNumberHtml(value, label, opts){
  opts = opts || {};
  const size = opts.size || 26;
  const color = opts.color || 'var(--ink)';
  return `<div style="text-align:center;">
    <div class="mono" style="font-size:${size}px; font-weight:800; color:${color}; line-height:1.1;">${value}</div>
    <div class="hint" style="margin-top:3px;">${label}</div>
  </div>`;
}
// Two input numbers side by side with "vs" between them.
function statCompareRowHtml(leftVal, leftLabel, rightVal, rightLabel, connector){
  return `<div style="display:flex; align-items:center; justify-content:center; gap:16px;">
    ${statNumberHtml(leftVal, leftLabel)}
    <div style="font-size:13px; color:var(--muted); font-weight:700;">${connector||'vs'}</div>
    ${statNumberHtml(rightVal, rightLabel)}
  </div>`;
}
// The derived result, set off below the comparison with a divider so it visually reads
// as "= this" rather than a third unrelated number.
function statResultHtml(value, label, color){
  return `<div style="text-align:center; margin-top:18px; padding-top:16px; border-top:1px solid var(--line-soft);">
    ${statNumberHtml(value, label, {size:32, color})}
  </div>`;
}

// The "show your work" behind each Progress stat tile — the exact numbers that produced
// the tile, as a graphic (big numbers + small captions) rather than a sentence.
function renderStatDetailModal(statKey){
  const s = computeProgressStats();
  const unit = s.unit;
  let title, content, footnote = '';
  if(statKey==='total-logged'){
    title = 'Total logged';
    content = statCompareRowHtml(
      fmtDist(s.totalLoggedKm,unit,1), 'miles logged',
      s.totalLoggedCount, `run${s.totalLoggedCount===1?'':'s'} logged`, 'in'
    );
    footnote = 'Every logged run counts here — any workout type, any date.';
  } else if(statKey==='training-miles'){
    title = 'Training miles logged';
    content = statCompareRowHtml(
      fmtDist(s.totalLoggedKm,unit,1), 'logged',
      fmtDist(s.totalPlanTrainingKm,unit,0), 'total plan training'
    ) + statResultHtml(`${s.pctPlanMilesLogged}%`, 'of training miles logged', 'var(--accent-strong)');
    footnote = "Race day itself isn't counted — that's the event, not training.";
  } else if(statKey==='adherence'){
    title = 'Plan adherence';
    content = statCompareRowHtml(
      s.completedPlannedRuns, 'days with a run completed',
      s.plannedRunDatesToDateCount, 'days with a run scheduled'
    ) + statResultHtml(`${s.adherence}%`, 'plan adherence', 'var(--accent-strong)');
    footnote = 'Only counts days on or before today that the plan actually scheduled a run.';
  } else {
    title = s.mileageStatusLabel==='behind plan' ? 'Behind plan' : s.mileageStatusLabel==='ahead of plan' ? 'Ahead of plan' : 'On plan';
    const resultColor = s.mileageStatusLabel==='behind plan' ? 'var(--z-tempo)' : (s.mileageStatusLabel==='ahead of plan' ? 'var(--accent-strong)' : 'var(--muted)');
    content = statCompareRowHtml(
      fmtDist(s.plannedToDateKm,unit,1), 'planned to date',
      fmtDist(s.loggedKmToDate,unit,1), 'logged to date'
    ) + statResultHtml(fmtDist(Math.abs(s.mileageDeltaKm),unit,1), s.mileageStatusLabel, resultColor);
  }
  return modalShell(title, `${content}${footnote?`<div class="hint" style="text-align:center; margin-top:16px;">${footnote}</div>`:''}`);
}

function modalShell(title, innerHtml, headerButtonHtml){
  return `<div class="overlay" data-act="close-modal-overlay">
    <div class="sheet" data-stop="1">
      <div class="sheet-handle"></div>
      ${headerButtonHtml || ''}
      <button class="sheet-close" data-act="close-modal" aria-label="Close">${ICONS.close}</button>
      <h3 class="sheet-title">${title}</h3>
      ${innerHtml}
    </div>
  </div>`;
}

// The plan day (and its own week, for pace lookup) matching a given date, if any.
function plannedWorkoutForDate(dateStr){
  if(!state.plan || !dateStr) return null;
  for(const week of state.plan.weeks){
    const day = week.days.find(x=>x.date===dateStr);
    if(day) return {day, week};
  }
  return null;
}
// Same lookup, but returning the indices the day-detail modal needs to address the day.
function planDayIndexForDate(dateStr){
  if(!state.plan || !dateStr) return null;
  for(let wi=0; wi<state.plan.weeks.length; wi++){
    const di = state.plan.weeks[wi].days.findIndex(x=>x.date===dateStr);
    if(di!==-1) return {weekIndex:wi, dayIndex:di};
  }
  return null;
}
function plannedWorkoutHtml(dateStr){
  const found = plannedWorkoutForDate(dateStr);
  if(!found){
    return `<div class="field"><label class="field-label">Planned for this day</label><div class="input" style="color:var(--ink-soft);">No planned workout for this date.</div></div>`;
  }
  const {day, week} = found;
  const meta = TYPE_META[day.type];
  const unit = state.setup.units, fmt = state.paceFormat;
  const weekPaces = getWeekPaces(state.plan, week, state.logs);
  const desc = dayDisplayText(day, weekPaces, unit, fmt);
  return `<div class="field">
    <label class="field-label">Planned for this day</label>
    <div class="input" style="height:auto; display:flex; flex-direction:column; gap:6px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="pill" style="background:var(--${meta.bg}); color:var(--${meta.fg})">${day.label}</span>
        ${day.km>0?`<span class="mono" style="font-size:12.5px; color:var(--ink-soft);">${fmtDist(day.km,unit)}</span>`:''}
      </div>
      ${desc?`<div style="color:var(--ink-soft); font-size:13px;">${esc(desc)}</div>`:''}
    </div>
  </div>`;
}
function logPaceHint(d, unit){
  const distV = Number(d.dist);
  const durSec = parseDurationToSec(d.time);
  if(!distV || !durSec) return 'Enter distance and time to see your pace per mile.';
  const paceSecPerKm = durSec/unitToKm(distV, unit);
  return `That's about ${paceStr(paceSecPerKm,'mi')} pace.`;
}

function modalLogRun(){
  const m = state.modal;
  if(!m.data) m.data = {date:fmtDate(todayDate()), dist:'', time:'', notes:''};
  if(!m.mode) m.mode = state.stravaAuth ? 'strava' : 'manual';

  // Kicks off exactly once per modal open — switching modes back and forth afterward
  // reuses the same fetched list rather than re-requesting it.
  if(m.mode==='strava' && !m.strava){
    m.strava = {loading:true, error:null, items:null};
    fetchStravaRuns().then(items=>{
      if(state.modal && state.modal.type==='log-run' && state.modal.strava){
        state.modal.strava = {loading:false, error:null, items};
        render();
      }
    }).catch(()=>{
      if(state.modal && state.modal.type==='log-run' && state.modal.strava){
        state.modal.strava = {loading:false, error:"Couldn't load your Strava runs.", items:null};
        render();
      }
    });
  }

  const switcher = state.stravaAuth ? `
    <div class="chip-select" style="margin-bottom:16px;">
      <button class="chip ${m.mode==='strava'?'active':''}" data-act="log-mode-strava">From Strava</button>
      <button class="chip ${m.mode==='manual'?'active':''}" data-act="log-mode-manual">Manual entry</button>
    </div>` : '';

  const body = m.mode==='strava' ? modalLogFromStravaHtml(m.strava) : modalLogManualHtml(m.data);
  return modalShell('Log a run', switcher + body);
}

function modalLogManualHtml(d){
  const unit = state.setup.units;
  return `
    <div class="field"><label class="field-label">Date</label><input class="input" type="date" id="lr-date" value="${d.date}"></div>
    <div id="lr-planned">${plannedWorkoutHtml(d.date)}</div>
    <div class="row">
      <div class="field"><label class="field-label">Distance (${unit})</label><input class="input" type="number" step="0.01" min="0" id="lr-dist" value="${d.dist}" placeholder="e.g. 5.2"></div>
      <div class="field"><label class="field-label">Time (h:mm:ss)</label><input class="input" type="text" inputmode="numeric" id="lr-time" value="${d.time}" placeholder="Just type digits, e.g. 4530"></div>
    </div>
    <div class="hint" id="lr-pace-hint" style="margin-bottom:14px;">${logPaceHint(d, unit)}</div>
    <div class="field"><label class="field-label">Notes (optional)</label><input class="input" type="text" id="lr-notes" value="${esc(d.notes)}" placeholder="How did it feel?"></div>

  `;
}

function modalLogFromStravaHtml(strava){
  const unit = state.setup.units;
  if(!strava || strava.loading){
    return `<div class="hint" style="padding:24px 0; text-align:center;">Loading your recent Strava runs…</div>`;
  }
  if(strava.error){
    return `<div class="hint" style="padding:6px 0 16px;">${esc(strava.error)}</div>
      <button class="btn btn-block" data-act="log-mode-manual">Enter manually instead</button>`;
  }
  if(!strava.items.length){
    return `<div class="hint" style="padding:6px 0 16px;">No new runs found on Strava — anything recent may already be imported.</div>
      <button class="btn btn-block" data-act="log-mode-manual">Enter manually instead</button>`;
  }
  const rows = strava.items.map(a=>{
    const paceSecPerKm = a.distanceKm>0 ? a.durationSec/a.distanceKm : null;
    return `<div class="log-row" data-act="import-strava-activity" data-id="${a.id}">
      <div class="log-date">${niceDate(parseDate(a.date))}</div>
      <div class="log-mid"><div class="d">${fmtDist(a.distanceKm,unit)} · ${secToClock(a.durationSec)}</div>${a.name?`<div class="t">${esc(a.name)}</div>`:''}</div>
      <div class="log-pace mono">${paceSecPerKm!=null?paceOrSpeedStr(paceSecPerKm,unit,state.paceFormat):''}</div>
    </div>`;
  }).join('');
  return `<div style="border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; margin-bottom:14px;">${rows}</div>
    <button class="btn btn-block" data-act="log-mode-manual">Enter manually instead</button>`;
}

// Shared "how does actual pace compare to planned" phrasing — used both for a single
// logged run and for the aggregated pace tracker in Progress.
function paceDeltaLine(actualPaceSecPerKm, plannedPaceSecPerKm, unit, fmt){
  if(plannedPaceSecPerKm==null || actualPaceSecPerKm==null) return '';
  const deltaSecPerKm = actualPaceSecPerKm-plannedPaceSecPerKm;
  const deltaDisplayPerUnit = unit==='mi' ? deltaSecPerKm*KM_PER_MI : deltaSecPerKm;
  if(Math.abs(deltaDisplayPerUnit)<3) return 'right on target pace';
  if(fmt==='speed'){
    const actualSpeed = 3600/(unit==='mi'?actualPaceSecPerKm*KM_PER_MI:actualPaceSecPerKm);
    const plannedSpeed = 3600/(unit==='mi'?plannedPaceSecPerKm*KM_PER_MI:plannedPaceSecPerKm);
    return `${Math.abs(actualSpeed-plannedSpeed).toFixed(1)} ${unit==='mi'?'mph':'km/h'} ${actualSpeed<plannedSpeed?'slower':'faster'} than planned`;
  }
  return `${secToClock(Math.abs(deltaDisplayPerUnit))}/${unit} ${deltaDisplayPerUnit>0?'slower':'faster'} than planned`;
}

function renderLoggedComparisonHtml(day, log, plan, week, logs, unit, fmt){
  const plannedKm = day.km;
  const plannedPaceSecPerKm = day.paceKey ? (day.paceOverrideSecPerKm!=null ? day.paceOverrideSecPerKm : getWeekPaces(plan, week, logs)[day.paceKey]) : null;
  const actualPaceSecPerKm = log.distanceKm>0 ? log.durationSec/log.distanceKm : null;

  const distLine = plannedKm>0
    ? `${fmtDist(log.distanceKm,unit)} logged vs ${fmtDist(plannedKm,unit)} planned`
    : `${fmtDist(log.distanceKm,unit)} logged — nothing was planned this day`;

  const paceCompareLine = paceDeltaLine(actualPaceSecPerKm, plannedPaceSecPerKm, unit, fmt);

  const NONELIGIBLE_NOUNS = {easy:'easy runs', long:'long runs', rest:'rest days', hills:'hill repeats', fartlek:'fartlek runs', race:'race-day runs'};
  const eligible = RECALIBRATION_TYPES.includes(day.type) && day.paceKey && RECALIBRATION_PCT[day.paceKey];
  let impactLine;
  if(!eligible){
    const noun = NONELIGIBLE_NOUNS[day.type];
    impactLine = noun ? `No impact on future pacing — ${noun} aren't used to recalibrate paces.` : `No impact on future pacing — this run type isn't used to recalibrate paces.`;
  } else {
    const withPaces = getWeekPaces(plan, week, logs);
    const withoutPaces = getWeekPaces(plan, week, logs.filter(l=>l.id!==log.id));
    const deltaSecPerKm = withPaces.tempoPerKm - withoutPaces.tempoPerKm;
    const deltaPerUnit = unit==='mi' ? deltaSecPerKm*KM_PER_MI : deltaSecPerKm;
    if(Math.abs(deltaPerUnit)<1){
      impactLine = `No meaningful change to future pacing from this run alone.`;
    } else {
      impactLine = `This run nudged your upcoming training paces about ${Math.round(Math.abs(deltaPerUnit))} sec/${unit} ${deltaPerUnit>0?'slower':'faster'}.`;
    }
  }

  return `<div class="card" style="padding:14px 16px; margin-bottom:16px; background:var(--accent-soft); border-color:var(--accent-strong);">
    <div style="display:flex; align-items:center; gap:6px; font-weight:800; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink); margin-bottom:8px;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      Logged
    </div>
    <div style="font-weight:700; font-size:14.5px;">${esc(distLine)}</div>
    <div style="font-size:13px; color:var(--ink-soft); margin-top:2px;">${secToClock(log.durationSec)}${actualPaceSecPerKm!=null?' · '+paceOrSpeedStr(actualPaceSecPerKm,unit,fmt):''}${paceCompareLine?' · '+paceCompareLine:''}</div>
    <div class="hint" style="margin-top:8px; color:var(--ink-soft);">${impactLine}</div>
    <button class="btn btn-ghost btn-sm" data-act="delete-log" data-id="${log.id}" style="margin-top:10px; color:#C4432E;">Remove this log</button>
  </div>`;
}

// Tapping a day opens this read-only view first — pace, purpose, and effort for the run,
// plus how it actually went if it's already logged. Editing (type, distance, pace override,
// swap) lives behind the Edit button so a casual "what's today's run again?" tap never risks
// accidentally changing the plan.
function renderDayDetail(){
  const {weekIndex, dayIndex} = state.modal;
  const week = state.plan.weeks[weekIndex];
  const day = week.days[dayIndex];
  const unit = state.setup.units, fmt = state.paceFormat;
  const matchedLogs = state.logs.filter(l=>l.date===day.date);
  const meta = TYPE_META[day.type];
  const weekPaces = getWeekPaces(state.plan, week, state.logs);
  const description = dayDisplayText(day, weekPaces, unit, fmt);
  const purpose = WORKOUT_PURPOSE[day.type];
  const editBtn = `<button class="btn" data-act="open-day-edit" style="position:absolute; top:14px; right:62px; padding:9px 16px; font-size:13.5px;">Edit</button>`;

  return modalShell(`${DOW_LABELS[day.dow]}, ${niceDate(parseDate(day.date))}`, `
    <div style="display:flex; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:14px;">
      <span class="pill" style="background:var(--${meta.bg}); color:var(--${meta.fg}); font-size:13px; padding:6px 14px;">${day.label}</span>
      ${day.km>0?`<span class="mono" style="font-size:15px; font-weight:700;">${fmtDist(day.km,unit)}</span>`:''}
      ${day.strength?`<span class="strength-badge">+ Strength</span>`:''}
    </div>
    ${description ? `<div style="font-size:14.5px; color:var(--ink-soft); margin-bottom:16px;">${esc(description)}</div>` : ''}
    ${matchedLogs.map(log=>renderLoggedComparisonHtml(day, log, state.plan, week, state.logs, unit, fmt)).join('')}
    ${purpose ? `
    <div class="field">
      <label class="field-label">Purpose</label>
      <div class="input" style="height:auto; color:var(--ink-soft);">${esc(purpose.purpose)}</div>
    </div>
    <div class="field">
      <label class="field-label">Effort</label>
      <div class="input" style="height:auto; color:var(--ink-soft);">${esc(purpose.effort)}</div>
    </div>` : ''}
    <button class="btn btn-primary btn-block" data-act="open-log-for-day" style="padding:13px; margin-top:6px;">${ICONS.plus} Log ${matchedLogs.length?'another':'a'} run</button>
  `, editBtn);
}

function modalEditDay(){
  const {weekIndex, dayIndex, draft} = state.modal;
  const week = state.plan.weeks[weekIndex];
  const day = week.days[dayIndex];
  const unit = state.setup.units, fmt = state.paceFormat;
  const matchedLogs = state.logs.filter(l=>l.date===day.date);
  const typeOpts = Object.keys(TYPE_META).map(t=>`<option value="${t}" ${draft.type===t?'selected':''}>${TYPE_META[t].label}</option>`).join('');
  const weekPaces = getWeekPaces(state.plan, week, state.logs);
  const meta = buildWorkoutMeta({type:draft.type, km:draft.km, strength:draft.strength, easyRole:draft.easyRole}, state.plan.raceDistanceKm);
  const previewDay = {...meta, paceOverrideSecPerKm: draft.paceOverrideSecPerKm, strides:draft.strides};
  const description = renderWorkoutText(previewDay, weekPaces, unit, fmt) || 'No planned distance for this day.';
  const recommendedSecPerKm = meta.paceKey ? weekPaces[meta.paceKey] : null;
  const effectiveSecPerKm = draft.paceOverrideSecPerKm!=null ? draft.paceOverrideSecPerKm : recommendedSecPerKm;
  const speedUnitLabel = unit==='mi' ? 'mph' : 'km/h';
  const previewDays = week.days.map((wd,i)=> i===dayIndex ? {...wd, type:draft.type, strength:draft.strength, label:TYPE_META[draft.type].label} : wd);

  return modalShell(`Edit ${DOW_LABELS[day.dow]}, ${niceDate(parseDate(day.date))}`, `
    ${matchedLogs.map(log=>renderLoggedComparisonHtml(day, log, state.plan, week, state.logs, unit, fmt)).join('')}

    <div class="field"><label class="field-label">Distance (${unit})</label><input class="input" type="number" step="0.1" min="0" id="ed-km" value="${round1(kmToUnit(draft.km,unit))}"></div>

    </div>
    ${meta.paceKey ? `
    <div class="field">
      <label class="field-label">Target ${fmt==='speed'?`speed (${speedUnitLabel})`:'pace'}</label>

      <div class="hint">Recommended: ${recommendedSecPerKm!=null?paceOrSpeedStr(recommendedSecPerKm,unit,fmt):'—'}${draft.paceOverrideSecPerKm!=null?' · <a class="link-btn" data-act="reset-day-pace" style="cursor:pointer;">Reset to recommended</a>':''}</div>
    </div>` : ''}

      <label class="field-label" style="margin:0;">Add strength session</label>
      <input type="checkbox" id="ed-strength" ${draft.strength?'checked':''} style="width:20px; height:20px;">
    </div>
    ${draft.type==='easy' ? `
    <div class="field" style="display:flex; align-items:center; justify-content:space-between;">
      <label class="field-label" style="margin:0;">Add strides</label>
      <input type="checkbox" id="ed-strides" ${draft.strides?'checked':''} style="width:20px; height:20px;">
    </div>` : ''}
    ${previewWarnings.length ? `<div class="banner" style="margin:0 0 16px;">${ICONS.bolt}<span>${previewWarnings.map(w=>esc(w)).join('<br>')}</span></div>` : ''}
    <div class="row" style="margin-top:6px;">

function modalEditSetup(){

  return modalShell('Edit inputs & regenerate', `
    <div class="field"><label class="field-label">Race distance</label><div class="chip-select" style="margin-bottom:8px;">${presetChips}</div>
      <input class="input" type="number" step="0.1" min="1" id="es-custom-dist" placeholder="Custom distance (${d.units})" value="${d.raceKey==='custom'?round1(kmToUnit(d.raceDistanceKm,d.units)):''}">
    </div>
    <div class="field"><label class="field-label">Race date</label><input class="input" type="date" id="es-date" value="${d.raceDate}"></div>
    <div class="field"><label class="field-label">Current weekly mileage (${d.units})</label><input class="input" type="number" min="0" id="es-weekly" value="${round1(kmToUnit(d.currentWeeklyKm,d.units))}"></div>
    <div class="field">
      <label class="field-label">Most recent race (calibrates your paces)</label>
      <div class="chip-select" style="margin-bottom:10px;">${recentChips}</div>
      <input class="input" type="text" id="es-recent-time" value="${d.recentTimeStr||''}" placeholder="Finish time, e.g. 24:30">
    </div>
    <div class="field"><label class="field-label">Goal time (optional)</label><input class="input" type="text" id="es-goal-time" value="${d.goalTimeStr||''}"></div>

    ${d.raceDistanceKm>=LONG_DISTANCE_CAP_THRESHOLD_KM ? `
    <div class="section-title">Caps (optional)</div>
    <div class="row">
      <div class="field">
        <label class="field-label">Max long run (${d.units})</label>
        <input class="input" type="number" min="0" step="0.5" id="es-max-long" placeholder="no cap" value="${d.maxLongRunMi}">
      </div>
      <div class="field">
        <label class="field-label">Max weekly mileage (${d.units})</label>
        <input class="input" type="number" min="0" step="1" id="es-max-weekly" placeholder="no cap" value="${d.maxWeeklyMi}">
      </div>
    </div>
    <div class="hint" style="margin-top:-8px; margin-bottom:16px;">If the plan would otherwise go higher, it scales back down to stay under whichever caps you set here.</div>
    ` : ''}

    <div class="section-title">Training style</div>
    <div class="field">
      <label class="field-label">Long run emphasis</label>
      <div class="chip-select">${emphasisChipsHtml(d.longRunEmphasis, 'es-pick-long-emphasis')}</div>
    </div>
    <div class="field">
      <label class="field-label">Speed work emphasis</label>
      <div class="chip-select">${emphasisChipsHtml(d.speedEmphasis, 'es-pick-speed-emphasis')}</div>
    </div>
    <div class="field">
      <label class="field-label">Strength days per week</label>
      <div class="chip-select">${strengthCountChipsHtml(d.strengthPerWeek, 'es-pick-strength-count')}</div>
    </div>

    <div class="section-title" style="margin-top:16px;">Weekly rhythm</div>
    <div class="field">
      <label class="field-label">Rest days per week</label>
      <div class="chip-select">${restDaysChipsHtml(d.restDays, 'es-pick-restdays')}</div>
      <div class="hint">${runDaysPerWeek} running day${runDaysPerWeek===1?'':'s'} per week (long run, speed/tempo, and easy runs).</div>
    </div>
    <div class="field">
      <label class="field-label">Long run day</label>
      <div class="dow-grid">${dowGridHtml('longDow', d.longDow, false, 'es-pick-dow')}</div>
      <div class="hint">Speed work and strength days are placed automatically for proper recovery spacing — move any day later from the plan itself if you'd rather.</div>
    </div>

    <button class="btn btn-primary btn-block" data-act="regenerate-plan" style="padding:13px;">Regenerate plan</button>
  `);
}

function modalConfirmReset(){
  return modalShell('Start over?', `
    <div class="hint" style="margin-bottom:18px;">This erases your plan and logged runs on this device. This can't be undone.</div>
    <div class="row"><button class="btn btn-block" data-act="close-modal">Cancel</button><button class="btn btn-danger btn-block" data-act="do-reset">Erase & start over</button></div>
  `);
}

/* ============================= events ============================= */
function bindGlobal(){
  const app = document.getElementById('app');
  app.onclick = onClick;
  app.oninput = onInput;
  app.onchange = onChange;
}

function findAct(el){
  while(el && el!==document){ if(el.dataset && el.dataset.act) return el; el = el.parentElement; }
  return null;
}

function onClick(e){
  if(e.target.classList && e.target.classList.contains('overlay')){
    state.modal=null; render(); return;
  }
  const el = findAct(e.target);
  if(!el) return;
  const act = el.dataset.act;

  if(act==='set-tab'){ state.tab = el.dataset.tab; render(); return; }
  if(act==='goto-week'){ state.currentWeekIndex = Number(el.dataset.i); state.moveFrom=null; render(); return; }

  if(act==='pick-race'){
    const preset = RACE_PRESETS.find(r=>r.key===el.dataset.key);
    state.onboardDraft.raceKey = preset.key; state.onboardDraft.raceDistanceKm = preset.km;
    render(); return;
  }
  if(act==='pick-unit'){ state.onboardDraft.units = el.dataset.u; render(); return; }
  if(act==='pick-recent'){ state.onboardDraft.recentDistanceKey = el.dataset.key; render(); return; }
  if(act==='pick-restdays'){ state.onboardDraft.restDays = Number(el.dataset.n); render(); return; }
  if(act==='pick-long-emphasis'){ state.onboardDraft.longRunEmphasis = el.dataset.key; render(); return; }
  if(act==='pick-speed-emphasis'){ state.onboardDraft.speedEmphasis = el.dataset.key; render(); return; }
  if(act==='pick-strength-count'){ state.onboardDraft.strengthPerWeek = Number(el.dataset.n); render(); return; }
  if(act==='pick-dow'){
    const name = el.dataset.name, i = Number(el.dataset.i), multi = el.dataset.multi==='1';
    if(multi){
      const arr = state.onboardDraft[name];
      const idx = arr.indexOf(i);
      if(idx===-1) arr.push(i); else arr.splice(idx,1);
    } else {
      state.onboardDraft[name] = i;
    }
    render(); return;
  }
  if(act==='onboard-back'){ state.onboardStep = Math.max(1, state.onboardStep-1); render(); window.scrollTo(0,0); return; }
  if(act==='onboard-next'){
    const err = onboardStepError(state.onboardStep);
    if(err){ showToast(err); return; }
    state.onboardStep = Math.min(3, state.onboardStep+1);
    render(); window.scrollTo(0,0); return;
  }
  if(act==='generate-plan'){ submitOnboarding(); return; }

  if(act==='open-log'){
    state.modal = {
      type:'log-run',
      mode: state.stravaAuth ? 'strava' : 'manual',
      data:{date:fmtDate(todayDate()), dist:'', time:'', notes:''},
    };
    render(); return;
  }
  if(act==='log-mode-manual'){ state.modal.mode='manual'; render(); return; }
  if(act==='log-mode-strava'){ state.modal.mode='strava'; render(); return; }
  if(act==='connect-strava'){ window.location.href = stravaConnectUrl(); return; }
  if(act==='disconnect-strava'){
    Store.clearStravaAuth();
    state.stravaAuth = null;
    showToast('Disconnected from Strava');
    return;
  }
  if(act==='save-log'){
    const unit = state.setup.units;
    const d = state.modal.data;
    const durSec = parseDurationToSec(d.time);
    const distV = Number(d.dist);
    if(!d.date || !distV || !durSec){ showToast('Enter date, distance and time'); return; }
    commitLogEntry({date:d.date, distanceKm:unitToKm(distV,unit), durationSec:durSec, notes:d.notes, createdAt:new Date().toISOString()});
    return;
  }
  if(act==='import-strava-activity'){
    const id = Number(el.dataset.id);
    const items = (state.modal.strava && state.modal.strava.items) || [];
    const a = items.find(x=>x.id===id);
    if(!a) return;
    commitLogEntry({date:a.date, distanceKm:a.distanceKm, durationSec:a.durationSec, notes:a.name||'', createdAt:new Date().toISOString(), stravaId:a.id});
    return;
  }
  if(act==='delete-log'){
    const id = el.dataset.id;
    Store.deleteLog(id);
    state.logs = state.logs.filter(l=>l.id!==id);
    render(); return;
  }
  if(act==='open-day-for-log-date'){
    const found = planDayIndexForDate(el.dataset.date);
    if(!found){ showToast("That date isn't in your current plan"); return; }
    state.modal={type:'day-detail', weekIndex:found.weekIndex, dayIndex:found.dayIndex};
    render(); return;
  }
  if(act==='open-stat-detail'){
    state.modal={type:'stat-detail', stat: el.dataset.stat};
    render(); return;
  }

  if(act==='open-day'){
    const di = Number(el.dataset.i);
    state.modal={type:'day-detail', weekIndex:state.currentWeekIndex, dayIndex:di};
    render(); return;
  }
  if(act==='open-day-edit'){
    const {weekIndex, dayIndex} = state.modal;
    const day = state.plan.weeks[weekIndex].days[dayIndex];
    state.modal={type:'edit-day', weekIndex, dayIndex, draft:{
      type: day.type, km: day.km, strength: day.strength, strides: !!day.strides, easyRole: day.easyRole ?? null,
      paceOverrideSecPerKm: day.paceOverrideSecPerKm ?? null,
    }};
    render(); return;
  }
  if(act==='open-log-for-day'){
    const {weekIndex, dayIndex} = state.modal;
    const day = state.plan.weeks[weekIndex].days[dayIndex];
    state.modal={type:'log-run', data:{date:day.date, dist:'', time:'', notes:''}};
    render(); return;
  }
  if(act==='reset-day-pace'){
    state.modal.draft.paceOverrideSecPerKm = null;
    render(); return;
  }
  if(act==='move-target'){
    const di = Number(el.dataset.i);
    if(state.moveFrom && state.moveFrom.weekIndex===state.currentWeekIndex){
      const a = state.moveFrom.dayIndex, b = di;
      if(a===b){ state.moveFrom=null; render(); return; }
      const week = state.plan.weeks[state.currentWeekIndex];
      const da = week.days[a], db_ = week.days[b];
      const keepA = {date:da.date, dow:da.dow, id:da.id}, keepB = {date:db_.date, dow:db_.dow, id:db_.id};
      week.days[a] = {...db_, ...keepA};
      week.days[b] = {...da, ...keepB};
      Store.setPlan(state.plan);
      state.moveFrom=null;
      showToast('Swapped');
    }
    return;
  }
  if(act==='cancel-move'){ state.moveFrom=null; render(); return; }
  if(act==='start-move'){
    state.moveFrom = {weekIndex:state.currentWeekIndex, dayIndex:Number(el.dataset.di)};
    state.modal=null; render(); return;
  }
  if(act==='save-day'){
    const wi = Number(el.dataset.wi), di = Number(el.dataset.di);
    const draft = state.modal.draft;
    const day = state.plan.weeks[wi].days[di];
    const strides = draft.type==='easy' && !!draft.strides;
    const meta = buildWorkoutMeta({type:draft.type, km:draft.km, strength:draft.strength, easyRole:draft.easyRole}, state.plan.raceDistanceKm);
    state.plan.weeks[wi].days[di] = {...day, type:draft.type, km:round1(draft.km), label:TYPE_META[draft.type].label, strength:draft.strength, strides, paceOverrideSecPerKm: meta.paceKey?draft.paceOverrideSecPerKm:null, ...meta};
    const week = state.plan.weeks[wi];
    week.targetKm = round1(week.days.reduce((s,d)=>s+d.km,0));
    Store.setPlan(state.plan);
    state.modal=null; showToast('Day updated'); return;
  }

  if(act==='set-unit'){
    const u = el.dataset.u;
    if(u===state.setup.units) return;
    state.setup.units = u;
    Store.setSetup(state.setup);
    render(); return;
  }
  if(act==='set-pace-format'){
    const f = el.dataset.f;
    if(f===state.paceFormat) return;
    state.paceFormat = f;
    Store.setPaceFormat(f);
    render(); return;
  }
  if(act==='open-edit-setup'){
    const s = state.setup;
    const matchedRecent = RACE_PRESETS.slice(0,5).find(r=>s.recentDistanceKm && Math.abs(r.km-s.recentDistanceKm)<0.05);
    state.modal = {type:'edit-setup', draft:{
      raceKey:s.raceKey, raceDistanceKm:s.raceDistanceKm, raceDate:s.raceDate, units:s.units,
      currentWeeklyKm:s.currentWeeklyKm,
      recentDistanceKey: matchedRecent ? matchedRecent.key : '5k',
      recentTimeStr: s.recentTimeSec? secToClock(s.recentTimeSec):'',
      goalTimeStr: s.goalTimeSec? secToClock(s.goalTimeSec):'',
      longDow:s.longDow,
      restDays: clamp(7 - (s.runsPerWeek || runsPerWeekFor(s.currentWeeklyKm)), 1, 4),
      maxLongRunMi: s.maxLongRunKm ? round1(kmToUnit(s.maxLongRunKm,s.units)) : '',
      maxWeeklyMi: s.maxWeeklyKm ? round1(kmToUnit(s.maxWeeklyKm,s.units)) : '',
      longRunEmphasis: s.longRunEmphasis || 'balanced', speedEmphasis: s.speedEmphasis || 'balanced',
      strengthPerWeek: s.strengthPerWeek==null ? 2 : s.strengthPerWeek,
    }};
    render(); return;
  }
  if(act==='es-pick-race'){
    const preset = RACE_PRESETS.find(r=>r.key===el.dataset.key);
    state.modal.draft.raceKey = preset.key; state.modal.draft.raceDistanceKm = preset.km;
    render(); return;
  }
  if(act==='es-pick-recent'){ state.modal.draft.recentDistanceKey = el.dataset.key; render(); return; }
  if(act==='es-pick-restdays'){ state.modal.draft.restDays = Number(el.dataset.n); render(); return; }
  if(act==='es-pick-long-emphasis'){ state.modal.draft.longRunEmphasis = el.dataset.key; render(); return; }
  if(act==='es-pick-speed-emphasis'){ state.modal.draft.speedEmphasis = el.dataset.key; render(); return; }
  if(act==='es-pick-strength-count'){ state.modal.draft.strengthPerWeek = Number(el.dataset.n); render(); return; }
  if(act==='es-pick-dow'){
    const name = el.dataset.name, i = Number(el.dataset.i), multi = el.dataset.multi==='1';
    const draft = state.modal.draft;
    if(multi){
      const arr = draft[name];
      const idx = arr.indexOf(i);
      if(idx===-1) arr.push(i); else arr.splice(idx,1);
    } else {
      draft[name] = i;
    }
    render(); return;
  }
  if(act==='regenerate-plan'){
    const d = state.modal.draft;
    const customDist = document.getElementById('es-custom-dist').value;
    if(customDist){ d.raceKey='custom'; d.raceDistanceKm = unitToKm(Number(customDist), d.units); }
    d.raceDate = document.getElementById('es-date').value;
    d.currentWeeklyKm = unitToKm(Number(document.getElementById('es-weekly').value)||0, d.units);
    const recentPreset = RACE_PRESETS.find(r=>r.key===d.recentDistanceKey);
    const maxLongEl = document.getElementById('es-max-long');
    const maxWeeklyEl = document.getElementById('es-max-weekly');
    const setup = {...state.setup, raceKey:d.raceKey, raceDistanceKm:d.raceDistanceKm, raceDate:d.raceDate,
      currentWeeklyKm:d.currentWeeklyKm,
      recentDistanceKm: recentPreset ? recentPreset.km : null,
      recentTimeSec: parseDurationToSec(document.getElementById('es-recent-time').value) || state.setup.recentTimeSec,
      goalTimeSec: parseDurationToSec(document.getElementById('es-goal-time').value),
      longDow:d.longDow, ...deriveScheduleFromLongDow(d.longDow, d.strengthPerWeek),
      runsPerWeek: clamp(7 - d.restDays, 3, 6), strengthPerWeek: d.strengthPerWeek,
      maxLongRunKm: (maxLongEl && maxLongEl.value) ? unitToKm(Number(maxLongEl.value), d.units) : null,
      maxWeeklyKm: (maxWeeklyEl && maxWeeklyEl.value) ? unitToKm(Number(maxWeeklyEl.value), d.units) : null,
      longRunEmphasis: d.longRunEmphasis, speedEmphasis: d.speedEmphasis};
    const plan = generatePlan(setup);
    Store.setSetup(setup); Store.setPlan(plan);
    state.setup = setup; state.plan = plan;
    const today = todayDate();
    let idx = plan.weeks.findIndex(w=>{ const ws=parseDate(w.weekStart); return today>=ws && today<addDays(ws,7); });
    state.currentWeekIndex = idx===-1?0:idx;
    state.modal=null; showToast('Plan regenerated'); window.scrollTo(0,0); return;
  }
  if(act==='confirm-reset'){ state.modal={type:'confirm-reset'}; render(); return; }
  if(act==='do-reset'){
    Store.resetAll();
    state.name=''; state.setup=null; state.plan=null; state.logs=[]; state.modal=null;
    state.milestonesShown = {halfway:false, arrived:false, firstRun:false, weeksHit:[]};
    state.stravaAuth = null;
    state.view='onboarding'; state.onboardDraft = defaultDraft(); state.onboardStep = 1;
    render(); window.scrollTo(0,0); return;
  }
  if(act==='close-modal'){ state.modal=null; state.moveFrom=null; render(); return; }
}

function onInput(e){
  if(e.target.id==='in-name'){
    state.onboardDraft.name = e.target.value;
    const n = e.target.value.trim().toLowerCase();
    if(n==='lexi' || n==='lexi willis') showNameBadge("That's a hot girl name 💋");
  }
  if(e.target.id==='in-custom-dist'){
    const v = Number(e.target.value);
    if(v>0){
      state.onboardDraft.raceKey='custom'; state.onboardDraft.raceDistanceKm = unitToKm(v, state.onboardDraft.units);
      document.querySelectorAll('[data-act="pick-race"]').forEach(c=>c.classList.remove('active'));
    }
  }
  if(e.target.id==='in-recent-time'){
    const formatted = formatDurationDigits(e.target.value);
    e.target.value = formatted;
    state.onboardDraft.recentTime = formatted;
    // Debounced: a partial value like "2:23" mid-type into "22:30" parses as a real
    // (wrong) duration, so showing the derived pace/animal on every keystroke flashes
    // nonsense. Wait for a short pause in typing before computing it for real.
    const hintEl = document.getElementById('recent-pace-hint');
    if(hintEl){
      hintEl.textContent = 'Enter a finish time to see your pace per mile.';
      clearTimeout(recentPaceHintTimer);
      recentPaceHintTimer = setTimeout(()=>{
        const el2 = document.getElementById('recent-pace-hint');
        if(el2) el2.textContent = recentPaceHint(state.onboardDraft);
      }, PACE_HINT_DEBOUNCE_MS);
    }
  }
  if(state.modal && state.modal.type==='log-run'){
    const d = state.modal.data;
    if(e.target.id==='lr-time'){
      const formatted = formatDurationDigits(e.target.value);
      e.target.value = formatted;
      d.time = formatted;
    }
    if(e.target.id==='lr-dist'){ d.dist = e.target.value; }
    if(e.target.id==='lr-notes'){ d.notes = e.target.value; }
    if(e.target.id==='lr-time' || e.target.id==='lr-dist'){
      const hintEl = document.getElementById('lr-pace-hint');
      if(hintEl){
        hintEl.textContent = 'Enter distance and time to see your pace per mile.';
        clearTimeout(lrPaceHintTimer);
        lrPaceHintTimer = setTimeout(()=>{
          const el2 = document.getElementById('lr-pace-hint');
          if(el2) el2.textContent = logPaceHint(d, state.setup.units);
        }, PACE_HINT_DEBOUNCE_MS);
      }
    }
  }
}
function onChange(e){
  if(e.target.id==='in-race-date'){ state.onboardDraft.raceDate = e.target.value; render(); return; }
  if(e.target.id==='in-weekly'){ state.onboardDraft.currentWeeklyMi = e.target.value; }
  if(e.target.id==='in-goal-time'){ state.onboardDraft.goalTime = e.target.value; }
  if(e.target.id==='in-max-long'){ state.onboardDraft.maxLongRunMi = e.target.value; }
  if(e.target.id==='in-max-weekly'){ state.onboardDraft.maxWeeklyMi = e.target.value; }
  if(state.modal && state.modal.type==='log-run' && e.target.id==='lr-date'){
    state.modal.data.date = e.target.value;
    render(); return;
  }
  if(state.modal && state.modal.type==='edit-day'){
    const draft = state.modal.draft;
    const unit = state.setup.units;
    if(e.target.id==='ed-type'){ draft.type = e.target.value; render(); return; }
    if(e.target.id==='ed-km'){ draft.km = unitToKm(Number(e.target.value)||0, unit); render(); return; }
    if(e.target.id==='ed-strength'){ draft.strength = e.target.checked; render(); return; }
    if(e.target.id==='ed-strides'){ draft.strides = e.target.checked; render(); return; }
    if(e.target.id==='ed-pace'){
      const secPerKm = parsePaceInput(e.target.value, unit, state.paceFormat);
      if(secPerKm!=null) draft.paceOverrideSecPerKm = secPerKm;
      render(); return;
    }
  }
}

boot();
})();
</script>
</body>
</html>
