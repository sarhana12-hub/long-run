<style>
:root{
  color-scheme: light dark;
  --bg:#F3F5F0; --surface:#FFFFFF; --surface-2:#EAEEE4; --raised:#FFFFFF;
  --ink:#121A16; --ink-soft:#45524B; --muted:#6C776F; --line:#DBE3D8; --line-soft:#E8EDE3;
  --accent:#C3F53A; --accent-ink:#122006; --accent-soft:#E9FAC0; --accent-strong:#9FCE22;
  --z-easy:#29708C; --z-easy-bg:#E0EEF3;
  --z-long:#4A4E9E; --z-long-bg:#E7E7F6;
  --z-tempo:#945810; --z-tempo-bg:#F8E9D3;
  --z-intervals:#B33C28; --z-intervals-bg:#F8E1DA;
  --z-strength:#6F5D83; --z-strength-bg:#ECE6F2;
  --z-rest:#646B66; --z-rest-bg:#EBEFE8;
  --z-race:#806408; --z-race-bg:#F6EBC9;
  --z-hill:#A04C1B; --z-hill-bg:#F5E2D2;
  --shadow: 0 1px 2px rgba(18,26,22,.06), 0 8px 24px -12px rgba(18,26,22,.18);
  --radius: 16px;
  --font-display:'Bricolage Grotesque','Arial Black',sans-serif;
  --font-body:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono','SFMono-Regular',Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101511; --surface:#1A211C; --surface-2:#212922; --raised:#232B25;
    --ink:#EAEFE9; --ink-soft:#C2CCC4; --muted:#8B9790; --line:#2B342D; --line-soft:#242C26;
    --accent:#D4FA4D; --accent-ink:#0E1704; --accent-soft:#2C3712; --accent-strong:#BFEA36;
    --z-easy:#74C3E3; --z-easy-bg:#1B2E38;
    --z-long:#9B9FEF; --z-long-bg:#25274A;
    --z-tempo:#F0AC55; --z-tempo-bg:#3B2A14;
    --z-intervals:#F1836A; --z-intervals-bg:#3C231D;
    --z-strength:#C2A9D8; --z-strength-bg:#2E2638;
    --z-rest:#8B968D; --z-rest-bg:#20261F;
    --z-race:#E9C860; --z-race-bg:#3A2F0F;
    --z-hill:#E8935C; --z-hill-bg:#3A2416;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#101511; --surface:#1A211C; --surface-2:#212922; --raised:#232B25;
  --ink:#EAEFE9; --ink-soft:#C2CCC4; --muted:#8B9790; --line:#2B342D; --line-soft:#242C26;
  --accent:#D4FA4D; --accent-ink:#0E1704; --accent-soft:#2C3712; --accent-strong:#BFEA36;
  --z-easy:#74C3E3; --z-easy-bg:#1B2E38;
  --z-long:#9B9FEF; --z-long-bg:#25274A;
  --z-tempo:#F0AC55; --z-tempo-bg:#3B2A14;
  --z-intervals:#F1836A; --z-intervals-bg:#3C231D;
  --z-strength:#C2A9D8; --z-strength-bg:#2E2638;
  --z-rest:#8B968D; --z-rest-bg:#20261F;
  --z-race:#E9C860; --z-race-bg:#3A2F0F;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
}

*{box-sizing:border-box;}
html,body{margin:0; padding:0;}
/* html carries the page color too, so iOS rubber-band overscroll in a home-screen app shows
   the app's own background rather than white/black; text-size-adjust stops Safari inflating
   text after rotation. */
html{background:var(--bg); -webkit-text-size-adjust:100%; overscroll-behavior-y:none;}
html.modal-open, html.modal-open body{overflow:hidden;}
body{background:var(--bg); color:var(--ink); font-family:var(--font-body); -webkit-font-smoothing:antialiased;}
/* App chrome shouldn't behave like a web page: no grey tap flash, no 300ms double-tap zoom
   wait, no text selection or link callouts on controls. */
button, .day-card, .chip, .week-tab, .tab-btn, .dow-opt, .kind-card, .stat-tile, .fab, .settings-row[data-act]{-webkit-tap-highlight-color:transparent; touch-action:manipulation; -webkit-touch-callout:none;}
button, .pill, .tabbar, .topbar, .week-strip, .day-date, label, .section-title{-webkit-user-select:none; user-select:none;}
/* Press feedback on every tappable surface, not just .btn */
.day-card, .stat-tile, .kind-card, .chip, .week-tab, .dow-opt{transition:transform .12s ease, background-color .15s ease, border-color .15s ease;}
.day-card:active, .stat-tile:active, .kind-card:active{transform:scale(.985);}
.chip:active, .week-tab:active, .dow-opt:active{transform:scale(.96);}
.tab-btn svg{transition:transform .12s ease;}
.tab-btn:active svg{transform:scale(.88);}
.fab:active{transform:translateZ(0) scale(.96);}
h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0;}
.mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:16px;}
::selection{background:var(--accent-soft);}

#app{max-width:520px; margin:0 auto; min-height:100dvh; padding-bottom:calc(150px + env(safe-area-inset-bottom)); position:relative;}

/* Permanent status-bar scrim: a fixed strip, sibling of #app so re-renders never wipe
   it, painted the page background at exactly the safe-area-inset-top height. Padding on
   a normal (non-fixed) element like .topbar only protects that area while scrolled to
   the very top — the moment the page scrolls, whatever content is next in flow slides
   under the (fixed, OS-drawn) notch/Dynamic Island with no protection of its own. This
   sits above all scrolling content regardless of scroll position, on every view.
   translateZ(0) forces this (and every other position:fixed bar below - .fab, .tabbar)
   onto its own GPU compositing layer. Without it, iOS Safari running as a home-screen
   app (not a regular browser tab) has a long-documented WebKit bug where fixed elements
   are repainted with the document's normal scroll layer instead of the visual viewport,
   so during an active scroll gesture they visibly lag behind and only snap back to their
   real fixed position once the scroll settles - exactly what shows up as a bottom bar
   "floating" mid-page while scrolling. Promoting the element to its own layer make the
   OS composite it against the viewport directly every frame instead, which is the
   standard fix for this specific class of bug. Can't be verified from this dev
   environment - iOS WebKit's fixed-position scroll compositing doesn't reproduce in a
   desktop/Chromium preview - needs confirming on a real iPhone with the app already
   added to the home screen. */
.status-scrim{position:fixed; top:0; left:0; right:0; height:env(safe-area-inset-top); background:var(--bg); z-index:100; pointer-events:none; transform:translateZ(0);}

/* ---------- top bar ---------- */
.topbar{display:flex; align-items:center; justify-content:space-between; padding:calc(16px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) 8px calc(18px + env(safe-area-inset-left));}
.brand{display:flex; align-items:center; gap:8px;}
.brand-mark{width:30px; height:30px; border-radius:9px; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; flex:none;}
.brand-mark svg{width:17px; height:17px;}
.brand-name{font-family:var(--font-display); font-weight:800; font-size:19px; letter-spacing:-.01em;}

/* ---------- generic ---------- */
.container{padding:0 calc(18px + env(safe-area-inset-right)) 0 calc(18px + env(safe-area-inset-left));}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-weight:700; font-size:14px; padding:11px 16px; transition:transform .1s ease;}
.btn:active{transform:scale(.97);}
.btn[disabled]{opacity:.45; cursor:not-allowed;}
.btn[disabled]:active{transform:none;}
/* An inline icon SVG with no width/height of its own sizes unpredictably in a flex
   button — fine in a narrow, content-width button, but a wide .btn-block with short
   text can blow it up to fill the available space. Pin it explicitly everywhere. */
.btn svg{width:16px; height:16px; flex:none;}
.fab svg{width:18px; height:18px; flex:none;}
.btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
.btn-ghost{border-color:transparent; background:transparent;}
.btn-block{width:100%;}
.btn-sm{padding:7px 12px; font-size:12.5px; border-radius:10px;}
.btn-danger{color:#C4432E; border-color:#C4432E33;}
label.field-label{display:block; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:6px;}
.input, select.input, textarea.input{width:100%; padding:11px 13px; border-radius:11px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink);}
.input:focus, select.input:focus, textarea.input:focus{outline:2px solid var(--accent); outline-offset:1px;}
/* Chrome's built-in calendar icon doesn't follow this page's own dark/light theme —
   left alone it renders dark-on-dark and disappears against --surface-2 in dark mode. */
input.input[type="date"]::-webkit-calendar-picker-indicator{ cursor:pointer; opacity:.85; }
@media (prefers-color-scheme: dark){
  input.input[type="date"]::-webkit-calendar-picker-indicator{ filter:invert(1); }
}
.field{margin-bottom:16px;}
.row{display:flex; gap:10px;}
.row > *{flex:1;}
.hint{font-size:12px; color:var(--muted); margin-top:6px; line-height:1.4;}
.section-title{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:22px 2px 10px;}
.pill{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;}
.chip-select{display:flex; flex-wrap:wrap; gap:8px;}
.chip{padding:8px 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface-2); font-size:13.5px; font-weight:600; color:var(--ink-soft);}
.chip.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
.kind-card{cursor:pointer;}
.kind-card.active{border-color:var(--accent); background:var(--accent-soft);}
a.link-btn{color:var(--ink-soft); font-size:13px; text-decoration:underline; text-underline-offset:2px;}

/* ---------- onboarding ---------- */
.hero-pad{padding:28px 18px 10px;}
.eyebrow{font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-strong);}
.step-indicator{display:flex; align-items:center; gap:10px; margin:2px 0 20px;}
.step-indicator .step-label{font-size:12px; font-weight:700; color:var(--muted); letter-spacing:.02em;}
.step-dots{display:flex; gap:6px;}
/* The Next/Back bar stays in view while a long step scrolls, then settles at the end. */
.onboard-nav{position:sticky; bottom:0; margin:22px 0 0; padding:12px 0 calc(14px + env(safe-area-inset-bottom)); background:linear-gradient(to top, var(--bg) 70%, transparent); z-index:5;}
.step-dot{width:7px; height:7px; border-radius:50%; background:var(--line);}
.step-dot.active{background:var(--accent-strong);}

/* ---------- week strip ---------- */
.week-strip{display:flex; gap:8px; overflow-x:auto; padding:2px 18px 14px; scrollbar-width:none;}
.week-strip::-webkit-scrollbar{display:none;}
.week-tab{flex:none; width:64px; border-radius:13px; border:1px solid var(--line); background:var(--surface); padding:8px 4px; text-align:center;}
.week-tab .wk{font-size:10.5px; color:var(--muted); font-weight:700; text-transform:uppercase;}
.week-tab .wn{font-family:var(--font-mono); font-weight:700; font-size:15px;}
.week-tab.active{border-color:var(--phase-color, var(--accent)); box-shadow:inset 0 -3px 0 var(--phase-color, var(--accent));}

.week-header{padding:4px 18px 14px; display:flex; align-items:flex-end; justify-content:space-between; gap:12px;}
.week-header h2{font-size:21px;}
.week-meta{font-size:12.5px; color:var(--muted); margin-top:3px;}
.week-stat{text-align:right;}
.week-stat .v{font-family:var(--font-mono); font-weight:700; font-size:18px; white-space:nowrap;}
.week-stat .l{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}

/* ---------- day cards ---------- */
.day-list{display:flex; flex-direction:column; gap:10px; padding:0 18px;}
.day-card{display:flex; align-items:center; gap:12px; padding:13px 14px; position:relative; width:100%; text-align:left; border:1px solid var(--line);}
.day-card.move-target{outline:2px dashed var(--accent-strong); outline-offset:2px;}
.day-card.move-source{outline:2px solid var(--accent-strong);}
.day-card.logged{background:var(--accent-soft); border-color:var(--accent-strong);}
.day-date{width:38px; flex:none; text-align:center;}
.day-date .dow{font-size:10.5px; font-weight:700; color:var(--muted); text-transform:uppercase;}
.day-date .dom{font-family:var(--font-mono); font-weight:700; font-size:17px;}
.day-main{flex:1; min-width:0;}
.day-top{display:flex; align-items:center; gap:8px; margin-bottom:4px; flex-wrap:wrap;}
.day-title{font-weight:700; font-size:14.5px;}
.day-desc{font-size:12.5px; color:var(--muted); line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.day-side{flex:none; text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:5px;}
.day-dist{font-family:var(--font-mono); font-weight:700; font-size:15px;}
.day-pace{font-family:var(--font-mono); font-size:11px; color:var(--muted);}
.day-check{width:19px; height:19px; border-radius:50%; background:var(--accent-strong); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; flex:none;}
.day-check svg{width:11px; height:11px;}
.strength-badge{font-size:10px; font-weight:700; color:var(--z-strength); background:var(--z-strength-bg); border-radius:6px; padding:2px 6px;}
.day-card{border-left:4px solid var(--card-edge, var(--line));}
.day-card.today{border-color:var(--accent-strong); border-left-color:var(--card-edge, var(--accent-strong));}
.pill .pill-ico{display:inline-flex; width:11px; height:11px;}
.pill .pill-ico svg{width:11px; height:11px;}
/* today card */
.today-card{margin:0 18px 14px; padding:14px 16px; border-color:var(--accent-strong);}
.today-card .tc-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px;}
.today-card .tc-label{font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-strong);}
.today-card .tc-date{font-size:12.5px; color:var(--muted); font-weight:600;}
.today-card .tc-title{font-family:var(--font-display); font-size:19px; font-weight:800; display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px;}
.today-card ul{margin:0 0 10px; padding-left:18px; font-size:13.5px; line-height:1.45; color:var(--ink-soft);}
.today-card .row .btn{padding:11px 10px;}
/* coach's notes callout */
.notes-callout{margin:0 18px 14px; border:1px solid var(--accent-strong); background:var(--accent-soft); border-radius:14px; padding:0 14px;}
.notes-callout summary{list-style:none; display:flex; align-items:center; gap:8px; padding:12px 0; font-weight:700; font-size:13.5px; cursor:pointer; -webkit-tap-highlight-color:transparent;}
.notes-callout summary::-webkit-details-marker{display:none;}
.notes-callout summary .count{margin-left:auto; font-family:var(--font-mono); font-size:12px; color:var(--muted);}
.notes-callout summary svg{width:15px; height:15px; flex:none;}
.notes-callout ul{margin:0; padding:0 0 12px 18px; font-size:13px; line-height:1.45; color:var(--ink);}
.notes-callout li{margin-bottom:6px;}
/* first-visit help card */
.help-card{margin:0 18px 14px; padding:14px 16px;}
.help-card ol{margin:6px 0 10px; padding-left:18px; font-size:13px; line-height:1.45; color:var(--ink-soft);}
/* strength rows */
.sx-row{display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-bottom:1px solid var(--line-soft);}
.sx-row:last-child{border-bottom:none;}
.sx-row input[type=checkbox]{width:22px; height:22px; flex:none; margin:2px 0 0; accent-color:var(--accent-strong);}
.sx-row details{flex:1; min-width:0;}
.sx-row summary{list-style:none; display:flex; align-items:baseline; justify-content:space-between; gap:10px; cursor:pointer; -webkit-tap-highlight-color:transparent;}
.sx-row summary::-webkit-details-marker{display:none;}
.sx-row .sx-name{font-weight:700; font-size:14px;}
.sx-row .sx-sets{font-family:var(--font-mono); font-weight:700; font-size:13.5px; white-space:nowrap; flex:none;}
.sx-row .sx-cue{font-size:12.5px; color:var(--muted); margin-top:2px; line-height:1.4;}
.sx-row .sx-more{font-size:12.5px; color:var(--ink-soft); margin-top:6px; line-height:1.45;}
.sx-row .sx-more b{color:var(--ink);}
.sx-row.done .sx-name{color:var(--muted); text-decoration:line-through;}
/* projection card */
.proj-row{display:grid; grid-template-columns:1fr auto; gap:2px 12px; align-items:baseline; padding:9px 0; border-bottom:1px solid var(--line-soft);}
.proj-row:last-child{border-bottom:none;}
.proj-row .proj-l{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);}
.proj-row .proj-v{font-family:var(--font-mono); font-weight:800; font-size:18px; text-align:right;}
.proj-row.now .proj-v{font-size:26px; color:var(--accent-strong);}
.proj-row .proj-r{grid-column:1 / -1; font-size:12.5px; color:var(--ink-soft);}
.proj-row.now .proj-r{color:var(--ink); font-weight:600;}
/* exercise library */
.sx-art{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:8px 0;}
.sx-art.one{grid-template-columns:minmax(0, 200px);}
.sx-art figure{margin:0; background:var(--surface-2); border-radius:12px; padding:6px;}
.sx-art svg{width:100%; height:auto; display:block;}
.sx-art figcaption{font-size:10.5px; color:var(--muted); text-align:center; margin-top:2px;}
.sx-info{font-size:12.5px; color:var(--ink-soft); line-height:1.45;}
.sx-info b{color:var(--ink);}
.sx-info ul{margin:2px 0 6px; padding-left:16px;}
.sx-info li{margin-bottom:2px;}
.sx-link{display:inline-flex; align-items:center; gap:6px; margin-top:4px; font-size:12.5px; font-weight:700; color:var(--accent-strong); text-decoration:none;}
.lib-row{padding:10px 0; border-bottom:1px solid var(--line-soft);}
.lib-row:last-child{border-bottom:none;}

<script>
(function(){
"use strict";
/* Plan generation, paces, race prediction and strength programming live in engine.js (plain

/* ============================= constants ============================= */

const STRAVA_CLIENT_ID = '278972';
const STRAVA_WORKER_URL = 'https://peakstravarelay.a-elsarhan.workers.dev';
const STRAVA_REDIRECT_URI = 'https://sarhana12-hub.github.io/long-run/';
const STRAVA_SCOPE = 'activity:read_all';
const DOW_LABELS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const RACE_PRESETS = [
  {key:'5k', label:'5K', km:5},
  {key:'10k', label:'10K', km:10},
  {key:'15k', label:'15K', km:15},
  {key:'10mi', label:'10 Miles', km:10*KM_PER_MI},
  {key:'half', label:'Half Marathon', km:21.0975},
  {key:'20mi', label:'20 Miles', km:20*KM_PER_MI},
  {key:'marathon', label:'Marathon', km:42.195},
];
const TYPE_META = {
  rest:{label:'Rest', bg:'--z-rest-bg', fg:'--z-rest'},
  easy:{label:'Easy Run', bg:'--z-easy-bg', fg:'--z-easy'},
  long:{label:'Long Run', bg:'--z-long-bg', fg:'--z-long'},
  tempo:{label:'Tempo', bg:'--z-tempo-bg', fg:'--z-tempo'},
  intervals:{label:'Intervals', bg:'--z-intervals-bg', fg:'--z-intervals'},
  reps:{label:'Repetitions', bg:'--z-intervals-bg', fg:'--z-intervals'},
  hills:{label:'Hill Repeats', bg:'--z-hill-bg', fg:'--z-hill'},
  fartlek:{label:'Fartlek', bg:'--z-hill-bg', fg:'--z-hill'},
  overunder:{label:'Over/Unders', bg:'--z-tempo-bg', fg:'--z-tempo'},
  progression:{label:'Progression Run', bg:'--z-tempo-bg', fg:'--z-tempo'},
  cruise:{label:'Cruise Intervals', bg:'--z-tempo-bg', fg:'--z-tempo'},
  racepace:{label:'Race Pace', bg:'--z-race-bg', fg:'--z-race'},
  race:{label:'Race Day', bg:'--z-race-bg', fg:'--z-race'},
};
// Plain-language training purpose + target effort per workout type, shown in the
// read-only day detail view so "why does this run exist" is answered without opening edit.
const WORKOUT_PURPOSE = {
  rest: {purpose:'Lets your body absorb the training and rebuild stronger.', effort:'None — full rest is best, but easy cross-training (bike, swim, elliptical) is fine if you want to stay active. Keep it light either way.'},
  easy: {purpose:'Builds aerobic endurance and recovery capacity without piling on fatigue.', effort:'Conversational — you should be able to hold a conversation the whole way.'},
  long: {purpose:'Extends your endurance, strengthens connective tissue and teaches your body to burn fat efficiently over long time on your feet.', effort:'Relaxed and aerobic — if a finishing segment at race pace is listed, that part is the only hard bit.'},
  tempo: {purpose:'Raises your lactate threshold — the pace you can hold before fatigue piles up fast.', effort:'Comfortably hard — sustainable with focus, not a sprint.'},
  intervals: {purpose:'Improves VO2 max — the engine — through repeated 3–5 minute efforts at about the pace you could race for 10–12 minutes.', effort:'Hard but even — the last rep should feel like the first, with an easy jog between.'},
  reps: {purpose:'Sharpens speed, running economy and form with short, fast repetitions and full recovery — the opposite of a grind.', effort:'Fast and relaxed, about mile race pace. Walk or jog until fully recovered before the next one.'},
  hills: {purpose:'Builds power, strength, and running form through resisted uphill effort.', effort:'Hard push uphill, easy jog back down to recover.'},
  fartlek: {purpose:'Blends speed and endurance with unstructured surges of faster running.', effort:'Surges run at roughly interval effort — hard and controlled, not a sprint. Everything else, including the recovery jog between surges, stays easy.'},
  overunder: {purpose:'Trains your body to clear lactate at race-relevant pace by riding just above and below threshold.', effort:'Alternates comfortably hard and hard, back and forth.'},
  progression: {purpose:'Trains pace control under fatigue — starting comfortable and finishing strong, rather than starting fast and fading.', effort:'Starts easy and gradually quickens; how hard the finish gets depends on the day — check the target pace above.'},
  cruise: {purpose:'Builds threshold volume in manageable chunks — same lactate-clearing benefit as tempo, easier to hold pace accurately over repeated reps than one continuous effort.', effort:'Comfortably hard, same as tempo — short jog recoveries keep the pace honest without fully resetting.'},
  racepace: {purpose:'Rehearses your actual goal pace and race-day rhythm before race day arrives.', effort:'Your goal race effort — not harder, not easier.'},
  race: {purpose:'This is race day — execute your goal-pace strategy.', effort:'Your target race effort.'},

function niceDate(d){ return d.toLocaleDateString(undefined,{month:'short', day:'numeric'}); }
function niceDateFull(d){ return d.toLocaleDateString(undefined,{weekday:'long', month:'short', day:'numeric', year:'numeric'}); }


/* Recalibration: blend the deterministic fitness projection with real performance
   from recently logged tempo/interval/over-under/cruise runs (the only workout types
   with a controlled, comparable target pace — easy/long/hills/fartlek are intentionally
   loose or terrain-dependent and aren't a clean fitness signal). Cruise intervals target
   the same tempoPerKm as continuous tempo, so they're just as clean a threshold signal.
   Progression runs are excluded despite finishing at tempo effort: paceKey reflects the
   easy majority of the run, not the harder finish, so there's no single clean number to
   compare against. Race-pace runs are excluded too, for a different reason: unlike
   tempo/interval pace, race pace has no single fixed %VO2max to invert through — the
   effort a given pace represents shifts with race distance/duration, which this system
   isn't set up to account for per-day. Only ever adjusts the current week onward; past
   weeks keep the paces that were actually prescribed. */
const RECALIBRATION_TYPES = ['tempo','intervals','overunder','cruise'];
function findPlanDay(plan, date){
  for(const week of plan.weeks){
    const day = week.days.find(d=>d.date===date);
    if(day) return day;
  }
  return null;
}
// Which %VO2max a logged pace should be inverted through, keyed by the same paceKey
// buildWorkoutMeta assigns to that workout type (overunder shares tempo's key already).
const RECALIBRATION_PCT = { tempoPerKm: THRESHOLD_PCT, intervalPerKm: INTERVAL_PCT };
// Recalibration and the pace tracker compare a logged run's pace against its planned
// per-km target - but for tempo/cruise/intervals/overunder, day.km now includes a
// warm-up (and possibly cool-down) at easy pace (see WARMUP_ELIGIBLE_TYPES), so the
// runner's one logged distance/time blends two very different paces together. Feeding
// that blended average straight into a pure-quality-pace comparison would read as
// slower than the runner's actual effort, understating fitness for no real reason. This
// backs the warm-up/cool-down distance out first - using the week's own BASELINE easy
// pace (not recalibrated, to avoid a circular dependency, since this feeds
// computeRecalibration itself) to estimate how much of the logged time that portion
// likely took - then returns the pace implied by whatever's left. Falls back to the
// plain blended pace when there's no meaningful warm-up/cool-down to account for, or the
// logged distance doesn't even cover it (e.g. the run was cut short).
function qualityEffortPaceSecPerKm(day, totalDistanceKm, totalDurationSec, plan){
  const blended = totalDurationSec/totalDistanceKm;
  const easyPortionKm = (day.warmupKm||0) + (day.cooldownKm||0);
  if(!(easyPortionKm>0.15) || !(totalDistanceKm>easyPortionKm) || plan.startVdot==null) return blended;
  const week = plan.weeks.find(w=>w.days.some(d=>d.id===day.id));
  if(!week) return blended;
  const baselineVdot = baselineVdotForWeek(plan, week);
  const easyPaceSecPerKm = zonesForPlanVdot(plan, baselineVdot).easyPerKm;
  const easyTimeSec = easyPortionKm*easyPaceSecPerKm;
  const qualityDistanceKm = totalDistanceKm-easyPortionKm;
  const qualityTimeSec = Math.max(0, totalDurationSec-easyTimeSec);
  return qualityTimeSec/qualityDistanceKm;
}
function computeRecalibration(plan, logs){
  const matches = [];
  for(const log of logs){
    const day = findPlanDay(plan, log.date);
    const pct = day && RECALIBRATION_TYPES.includes(day.type) ? RECALIBRATION_PCT[day.paceKey] : null;
    if(pct && log.distanceKm>0){
      const actualPaceSecPerKm = qualityEffortPaceSecPerKm(day, log.distanceKm, log.durationSec, plan);
      const impliedVdot = impliedVdotFromPace(actualPaceSecPerKm, pct);
      matches.push({date:log.date, impliedVdot});
    }
  }
  if(!matches.length) return null;
  matches.sort((a,b)=> a.date<b.date?1:-1);
  const recent = matches.slice(0,3);
  const perfImpliedVdot = recent.reduce((s,m)=>s+m.impliedVdot,0)/recent.length;
  const weight = recent.length===1?0.25:recent.length===2?0.35:0.45;
  return {perfImpliedVdot, weight, count:recent.length};
}
// Engine v2 plans store each week's baseline VDOT directly (paces follow current fitness
// and step up slowly through the quality phases); older plans interpolate start->end.
function baselineVdotForWeek(plan, week){
  if(week.baselineVdot!=null) return week.baselineVdot;
  const frac = week.weekIndex>=plan.buildWeeksCount ? 1 : clamp(week.weekIndex/plan.rampWeeks, 0, 1);
  return plan.startVdot + (plan.endVdot-plan.startVdot)*frac;
}
// The fitness model (engine: projectFitness) is computed once per render for the live plan
// and logs; other callers (a what-if without one log) compute their own.
let _fitnessMemo = {key:null, value:null};
function fitnessFor(plan, logs){
  const key = plan===state.plan && logs===state.logs
    ? [plan.generatedAt, plan.engineVersion, logs.length, logs[0] ? logs[0].id : '', fmtDate(todayDate())].join('|')
    : null;
  if(key && _fitnessMemo.key===key) return _fitnessMemo.value;
  const value = projectFitness(plan, logs);
  if(key) _fitnessMemo = {key, value};
  return value;
}
// Fitness the paces of a given week should follow: past weeks keep the baseline they were
// run at; the current week runs at today's evidence-led fitness; later weeks add the
// scheduled gain still to come between now and then (Daniels' rate), so training paces
// step up on schedule only from where the evidence says the runner is.
function fitnessVdotForWeek(plan, week, logs){
  const baselineVdot = baselineVdotForWeek(plan, week);
  const isPastWeek = addDays(parseDate(week.weekStart),6) < todayDate();
  if(isPastWeek) return baselineVdot;
  const f = fitnessFor(plan, logs);
  if(f.nowVdot==null) return baselineVdot;
  const ti = todayWeekIndex(plan);
  const rampWeeks = plan.weeks.filter(w=>w.phase==='build' || w.phase==='peak');
  const gPerWeek = rampWeeks.length ? Math.max(0, plan.endVdot-plan.startVdot)/rampWeeks.length : 0;
  const ahead = rampWeeks.filter(w=>w.weekIndex>ti && w.weekIndex<=week.weekIndex).length;
  return f.nowVdot + gPerWeek*ahead;
}
function getWeekPaces(plan, week, logs){
  if(plan.startVdot==null){
    return week.paces || plan.paces; // plans saved before the vdot model existed
  }
  const vdot = fitnessVdotForWeek(plan, week, logs);
  const zones = zonesForPlanVdot(plan, vdot);
  if(plan.raceDistanceKm==null) zones.racePerKm = null;
  else if(plan.goalRacePerKm!=null) zones.racePerKm = plan.goalRacePerKm;
  else {
    const f = fitnessFor(plan, logs);
    const peakKm = Math.max(plan.peakWeeklyKm||0, (plan.athlete&&plan.athlete.weeklyKm)||0) || undefined;
    zones.racePerKm = projectRaceTime(plan, f.potentialVdot!=null ? f.potentialVdot : plan.endVdot, plan.raceDistanceKm, peakKm).sec/plan.raceDistanceKm;
  }
  return zones;
}

// Whichever week's date range contains today, or the nearest edge week if today falls
// outside the plan entirely (before it starts, or after the last day already passed).
function findWeekForToday(plan){
  const today = todayDate();
  const found = plan.weeks.find(w=>{ const ws=parseDate(w.weekStart); return today>=ws && today<addDays(ws,7); });
  if(found) return found;
  return today < parseDate(plan.weeks[0].weekStart) ? plan.weeks[0] : plan.weeks[plan.weeks.length-1];
}
// The same baseline-plus-recalibration VDOT blend getWeekPaces() computes internally for
// today's week specifically - exposed standalone (duplicated rather than refactored out of
// getWeekPaces, to avoid touching that already-proven path for one extra caller) so Progress
// can answer "what would I run right now" independent of training-pace display.
function currentEffectiveVdot(plan, logs){
  if(plan.startVdot==null) return null;
  return fitnessFor(plan, logs).nowVdot;
}
// The plan's own end-of-plan VDOT, recalibrated the same way currentEffectiveVdot() is -
// "what this plan is on pace for by its final week, assuming you complete the rest of it."
// Deliberately still folds in real logged performance (the same recalibration signal that
// already adjusts the existing "Goal race pace" elsewhere) rather than a frozen day-one
// number - "full adherence" means finishing out the plan, not ignoring how it's gone so far.
function goalEffectiveVdot(plan, logs){
  if(plan.startVdot==null) return null;
  return fitnessFor(plan, logs).potentialVdot;
}
// Fixed distances general (non-race) plans project against, since there's no single race
// to headline the way a race plan has.
const PROJECTION_DISTANCES = [
  {key:'5k', label:'5K', km:5},
  {key:'half', label:'Half Marathon', km:21.0975},
  {key:'marathon', label:'Marathon', km:42.195},
];
function raceProjectionFor(vdot, km){
  if(vdot==null) return null;
  const r = projectRaceTime(state.plan, vdot, km);
  return {timeSec: r.sec, lowSec: r.lowSec, highSec: r.highSec, paceSecPerKm: r.sec/km};
}


// Reps/cycles-based workouts (hills, intervals, cruise, over/unders) don't always add up
// to the day's full prescribed distance on their own - buildWorkoutMeta splits whatever's
// left into day.warmupKm/day.cooldownKm (see warmupCooldownKm). These two functions turn
// that into an ordered sequence - warm-up, then the main structured effort, then cool-down
// - rather than a single undifferentiated "run the rest easy" tacked on at the end, so a
// runner always knows WHEN to run every mile, not just that it exists. Same ~0.1mi
// threshold both use to skip noise from rounding when the leftover is negligible.
function warmupClause(day, weekPaces, unit, fmt){
  if(!(day.warmupKm>0.15)) return null;
  const pace = weekPaces && weekPaces.easyPerKm;
  return `Warm up ${fmtDist(day.warmupKm, unit)} easy${pace!=null?` @ ${paceOrSpeedStr(pace,unit,fmt)}`:''}`;
}
function cooldownClause(day, weekPaces, unit, fmt){
  if(!(day.cooldownKm>0.15)) return null;
  const pace = weekPaces && weekPaces.easyPerKm;
  return `cool down ${fmtDist(day.cooldownKm, unit)} easy${pace!=null?` @ ${paceOrSpeedStr(pace,unit,fmt)}`:''}`;
}
// Tempo/Race Pace have no reps/cycles structure of their own to imply a distance (unlike
// hills' rep count or intervals' "N × Rm"), so once they carry a warm-up, the quality
// segment's own distance needs to be stated explicitly too - otherwise the only distance
// visible is day.km's combined total, leaving the same "which miles are which pace"
// ambiguity this whole fix exists to close.
function qualityDistancePrefix(day, unit){
  if(!(day.type==='tempo' || day.type==='racepace')) return '';
  if(!(day.warmupKm>0.15)) return '';
  const qualityKm = Math.max(0, day.km-(day.warmupKm||0)-(day.cooldownKm||0));
  return qualityKm>0.15 ? `${fmtDist(qualityKm, unit)} ` : '';
}
// A prefixed descBase ("4.3 mi Continuous, comfortably hard") reads oddly mid-sentence
// with its normal leading capital - lowercase it only when qualityDistancePrefix actually
// added something before it.
function lowercaseFirst(s){ return s.charAt(0).toLowerCase()+s.slice(1); }
// Warm-up is a real, always-present part of these types now; cool-down is left to the
// runner's own judgment rather than auto-generated, per design - naming that explicitly
// (instead of just omitting any mention of it) avoids reading as an oversight.
function optionalCooldownNote(day){
  return WARMUP_ELIGIBLE_TYPES.includes(day.type) ? 'an optional easy cool-down, as preferred' : null;
}
// day.km already has STRIDES_EXTRA_KM (or HILL_STRIDES_EXTRA_KM for hill strides - a
// genuinely different, shorter activity, see that constant) baked in whenever day.strides
// is true (see generatePlan/buildGeneralWeekDays), so this names that portion explicitly
// rather than leaving the runner to wonder whether strides are included in the distance
// shown or tacked on beyond it - same "all miles accounted for" principle as the warm-up/
// cool-down clauses above.
function stridesDetail(day, unit){
  if(day.hillStrides){
    const extra = fmtDist(HILL_STRIDES_EXTRA_KM, unit);
    // One notch steeper than the Hill Repeats grade (see structuredEffort's hills case) -
    // real practice supports going steeper for a short, sharp rep than a sustained 60-90s
    // one, since a 10s rep never runs into the "unsustainable at this grade" problem a
    // longer effort would - part of how short hill sprints get their power-focused
    // stimulus in the first place.
    return day.treadmillHills
      ? `${STRIDES_REPS} × 10s hard effort at 7% incline, then flat and an easy walk to recover, about ${extra} of the total above`
      : `${STRIDES_REPS} × 10s hard effort uphill, walk back down to recover, about ${extra} of the total above`;
  }
  const extra = fmtDist(STRIDES_EXTRA_KM, unit);
  return `${STRIDES_REPS} × 20s relaxed, full recovery, about ${extra} of the total above`;
}
// Workout text carries {pace} (the session's own pace, honouring a manual override) and
// {easy} (the easy pace) where the pace belongs mid-sentence; older descriptions without
// placeholders get the pace appended as before.
function fillPacePlaceholders(text, day, weekPaces, unit, fmt){
  const own = day.paceKey ? (day.paceOverrideSecPerKm!=null ? day.paceOverrideSecPerKm : (weekPaces && weekPaces[day.paceKey])) : null;
  const easy = weekPaces && weekPaces.easyPerKm;
  const hasPlaceholder = /\{pace\}|\{easy\}/.test(text);
  let out = text.replace(/\{pace\}/g, own!=null ? paceOrSpeedStr(own, unit, fmt) : 'the target pace').replace(/\{easy\}/g, easy!=null ? paceOrSpeedStr(easy, unit, fmt) : 'easy');
  return {text: out, hasPlaceholder};
}
function renderWorkoutText(day, weekPaces, unit, fmt){
  if(!day.descBase) return '';
  const segs = [];
  const warmup = warmupClause(day, weekPaces, unit, fmt);
  if(warmup) segs.push(warmup);
  const qtyPrefix = qualityDistancePrefix(day, unit);
  const filled = fillPacePlaceholders(day.descBase, day, weekPaces, unit, fmt);
  let main = qtyPrefix + (qtyPrefix ? lowercaseFirst(filled.text) : filled.text);
  if(day.paceKey && !filled.hasPlaceholder){
    const p = day.paceOverrideSecPerKm!=null ? day.paceOverrideSecPerKm : (weekPaces && weekPaces[day.paceKey]);
    if(p!=null) main += ` @ ${paceOrSpeedStr(p, unit, fmt)}`;
  }
  const desc2 = (day.type==='long' && day.racePaceKm>0.5) ? `final ${fmtDist(day.racePaceKm, unit)}` : day.desc2;
  if(day.paceKey2 && weekPaces && weekPaces[day.paceKey2]!=null) main += ` (${desc2} @ ${paceOrSpeedStr(weekPaces[day.paceKey2], unit, fmt)})`;
  segs.push(main);
  const cooldown = cooldownClause(day, weekPaces, unit, fmt);
  if(cooldown) segs.push(cooldown);
  else { const note = optionalCooldownNote(day); if(note) segs.push(note); }
  let text = segs.join(', then ');
  if(day.strides) text += day.hillStrides ? ` + hill strides (${stridesDetail(day, unit)})` : ` + strides (${stridesDetail(day, unit)})`;
  if(day.terrain==='hilly') text += day.treadmillHills ? ' — set a 1–2% incline throughout to mimic the terrain' : ' — rolling hills, run by effort not pace';
  else if(day.terrain==='suggested') text += day.treadmillHills ? ' — a 1% incline offsets the lack of wind resistance indoors, if you’d like' : ' — rolling terrain if you have it';
  return text;
}
// One-line summary for the Plan tab's day cards - what the session IS and the one pace
// that matters. The full warm-up/main/cool-down walk-through stays in the day sheet.
function daySummaryText(day, weekPaces, unit, fmt){
  if(day.descBase==null && day.notes!=null) return day.notes;
  const p = k => { if(!k || !weekPaces || weekPaces[k]==null) return null; const v = (day.paceOverrideSecPerKm!=null && k===day.paceKey) ? day.paceOverrideSecPerKm : weekPaces[k]; return paceOrSpeedStr(v, unit, fmt); };
  const at = k => p(k) ? ` @ ${p(k)}` : '';
  const parts = [];
  const d = day.descBase||'';
  switch(day.type){
    case 'rest': return day.strength ? 'No running — strength session today' : 'Full rest, or easy cross-training';
    case 'race': return `Race day${at('racePerKm')}`;
    case 'easy': parts.push((day.easyRole==='recovery' ? 'Very easy recovery jog' : day.easyRole==='aerobic' ? 'Medium-long, conversational' : day.label==='Shakeout Jog' ? 'Short shakeout' : 'Conversational') + at('easyPerKm')); if(day.strides) parts.push(day.hillStrides ? '+ hill strides' : '+ strides'); break;
    case 'long': parts.push('Relaxed aerobic' + at('longPerKm')); if(day.racePaceKm>0.5 && p('racePerKm')) parts.push(`final ${fmtDist(day.racePaceKm, unit)} @ ${p('racePerKm')}`); break;
    case 'tempo': case 'racepace': { const q = Math.max(0, day.km-(day.warmupKm||0)-(day.cooldownKm||0)); parts.push(`${fmtDist(q, unit)} ${day.type==='tempo' ? 'at threshold' : 'at race pace'}${at(day.paceKey)}`); if(day.warmupKm>0.15) parts.push('warm-up & cool-down included'); break; }
    case 'overunder': { const m = d.match(/(\d+) ×/); parts.push(`${m ? m[1]+' × ' : ''}2 min over / 1 min under${at('tempoPerKm')}`); if(day.warmupKm>0.15) parts.push('warm-up & cool-down included'); break; }
    case 'intervals': case 'cruise': case 'reps': case 'hills': {
      const head = d.replace(/^(Cruise intervals|Over\/unders) — /,'').split(/,| \(| — /)[0].trim();
      const filled = fillPacePlaceholders(head, day, weekPaces, unit, fmt);
      parts.push(filled.text.replace(/ at threshold pace$/,'') + (filled.hasPlaceholder ? '' : at(day.paceKey)));
      if(day.warmupKm>0.15) parts.push('warm-up & cool-down included'); break; }
    case 'fartlek': parts.push('Easy run with surges' + at('easyPerKm')); break;
    case 'progression': parts.push(`Easy start, ${day.progressionEasy ? 'steady' : 'tempo'} finish${at('easyPerKm')}`); break;
    default: return dayDisplayText(day, weekPaces, unit, fmt);
  }
  if(day.terrain==='hilly') parts.push('rolling hills');
  return parts.join(' · ');
}
function dayDisplayText(day, weekPaces, unit, fmt){
  if(day.descBase==null && day.notes!=null) return day.notes; // plans saved before this update
  return renderWorkoutText(day, weekPaces, unit, fmt);
}
// Same underlying pieces as renderWorkoutText, but as separate ordered steps instead of one
// run-on sentence - for a multi-part workout (e.g. a hill session with a warm-up/cool-down,
// or an aerobic run with strides and a terrain note tacked on), a single dense paragraph
// makes it hard to tell what's part of the day's distance, and in what order, versus an
// add-on tacked onto the end. Used only in the read-only day detail view; the compact
// Plan-tab day card keeps the single-line renderWorkoutText version, where a multi-line
// list would blow up the at-a-glance weekly layout.
function workoutPartsFor(day, weekPaces, unit, fmt){
  if(!day.descBase) return [];
  const parts = [];
  const warmup = warmupClause(day, weekPaces, unit, fmt);
  if(warmup) parts.push(warmup);
  const qtyPrefix = qualityDistancePrefix(day, unit);
  const filled = fillPacePlaceholders(day.descBase, day, weekPaces, unit, fmt);
  let main = qtyPrefix + (qtyPrefix ? lowercaseFirst(filled.text) : filled.text);
  if(day.paceKey && !filled.hasPlaceholder){
    const p = day.paceOverrideSecPerKm!=null ? day.paceOverrideSecPerKm : (weekPaces && weekPaces[day.paceKey]);
    if(p!=null) main += ` @ ${paceOrSpeedStr(p, unit, fmt)}`;
  }
  parts.push(main);
  if(day.paceKey2 && weekPaces && weekPaces[day.paceKey2]!=null){
    const d2 = (day.type==='long' && day.racePaceKm>0.5) ? `final ${fmtDist(day.racePaceKm, unit)}` : day.desc2;
    const label = d2.charAt(0).toUpperCase()+d2.slice(1);
    parts.push(`${label} @ ${paceOrSpeedStr(weekPaces[day.paceKey2], unit, fmt)}`);
  }
  const cooldown = cooldownClause(day, weekPaces, unit, fmt);
  if(cooldown) parts.push(cooldown.charAt(0).toUpperCase()+cooldown.slice(1));
  else { const note = optionalCooldownNote(day); if(note) parts.push(note.charAt(0).toUpperCase()+note.slice(1)); }
  if(day.strides) parts.push((day.hillStrides ? 'Finish with hill strides — ' : 'Finish with strides — ') + stridesDetail(day, unit));
  if(day.terrain==='hilly') parts.push(day.treadmillHills ? 'Course: set a 1–2% incline throughout to mimic the terrain' : 'Course: rolling hills — run by effort, not pace');
  else if(day.terrain==='suggested') parts.push(day.treadmillHills ? 'Course: a 1% incline offsets the lack of wind resistance indoors, if you’d like' : 'Rolling terrain if you have it');
  return parts;
}
function paceInputValue(effectiveSecPerKm, unit, fmt){
  if(effectiveSecPerKm==null) return '';
  const secPerUnit = unit==='mi' ? effectiveSecPerKm*KM_PER_MI : effectiveSecPerKm;
  if(fmt==='speed') return (3600/secPerUnit).toFixed(1);
  return secToClock(secPerUnit);
}
function parsePaceInput(val, unit, fmt){
  if(fmt==='speed'){
    const mph = Number(val);
    if(!mph || mph<=0) return null;
    const secPerUnit = 3600/mph;
    return unit==='mi' ? secPerUnit/KM_PER_MI : secPerUnit;
  }
  const secPerUnit = parseDurationToSec(val);
  if(secPerUnit==null) return null;
  return unit==='mi' ? secPerUnit/KM_PER_MI : secPerUnit;
}



/* ============================= storage layer (local only) ============================= */
const Store = {
  _get(key, fallback){ try{ const v = localStorage.getItem(key); return v==null? fallback : JSON.parse(v); }catch(e){ return fallback; } },
  _set(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} },

  getName(){ return this._get('lr_name', ''); },
  setName(name){ this._set('lr_name', name); },
  getPaceFormat(){ return this._get('lr_pace_format', 'pace'); },
  setPaceFormat(fmt){ this._set('lr_pace_format', fmt); },
  getSetup(){ return this._get('lr_setup', null); },
  setSetup(setup){ this._set('lr_setup', setup); },
  getPlan(){ return this._get('lr_plan', null); },
  setPlan(plan){ this._set('lr_plan', plan); },
  getLogs(){ return this._get('lr_logs', []); },
  addLog(entry){
    const logs = this.getLogs();
    const item = {id:'l_'+uid(), ...entry};
    logs.unshift(item);
    this._set('lr_logs', logs);
    return item;
  },
  deleteLog(id){
    const logs = this.getLogs().filter(l=>l.id!==id);
    this._set('lr_logs', logs);
  },
  setLogs(logs){ this._set('lr_logs', logs); },
  // Legacy boolean-flag milestone tracker, superseded by getAchievementLog below - kept
  // only so loadState can migrate a device that already has one into the new system
  // without re-firing popups for things already celebrated once.
  getMilestonesShown(){ return this._get('lr_milestones', {halfway:false, arrived:false, firstRun:false, weeksHit:[]}); },
  // Dates (YYYY-MM-DD) the user has explicitly marked a strength session as actually
  // completed - day.strength on the plan itself only ever means "scheduled," this is the
  // separate "did it happen" record, since a strength day (including a rest day with
  // strength attached) has no run to log against.
  getStrengthDone(){ return this._get('lr_strength_done', []); },
  // Per-exercise ticks inside a strength session: {date: [bool,...]} in exercise order.
  getStrengthItems(){ return this._get('lr_strength_items', {}); },
  setStrengthItems(v){ this._set('lr_strength_items', v); },
  getFlag(key){ return this._get('lr_flag_'+key, false); },
  setFlag(key, v){ this._set('lr_flag_'+key, !!v); },
  setStrengthDone(v){ this._set('lr_strength_done', v); },
  // One entry per time an achievement fires: {key, date, detail?}. Repeatable
  // achievements (a new PR, a new week hit) simply get another entry with the same key -
  // this is a log, not a set, so the gallery can show full history if it ever wants to.
  getAchievementLog(){ return this._get('lr_achievement_log', []); },
  setAchievementLog(v){ this._set('lr_achievement_log', v); },
  getStravaAuth(){ return this._get('lr_strava_auth', null); },
  setStravaAuth(auth){ this._set('lr_strava_auth', auth); },
  clearStravaAuth(){ localStorage.removeItem('lr_strava_auth'); },
  resetAll(){
    localStorage.removeItem('lr_name');
    localStorage.removeItem('lr_setup');
    localStorage.removeItem('lr_plan');
    localStorage.removeItem('lr_logs');
    localStorage.removeItem('lr_milestones');
    localStorage.removeItem('lr_strength_done');
    localStorage.removeItem('lr_strength_items');
    localStorage.removeItem('lr_flag_help_seen');
    localStorage.removeItem('lr_flag_notes_seen');
    localStorage.removeItem('lr_achievement_log');
    localStorage.removeItem('lr_strava_auth');
  }
};

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg, undo){ state.toast = msg; state.toastUndo = undo || null; render(); setTimeout(()=>{ state.toast=null; state.toastUndo=null; render(); }, 2200); }
// Flashes a message inline next to the "Your name" label (the lexi-badge span) instead of
// a floating toast — a fixed-position popup kept landing either behind the Dynamic Island
// or under the keyboard depending on how far up the screen it sat. Bypasses render()
// entirely, same reason as before: a normal showToast() would steal focus mid-keystroke.
function showNameBadge(msg){
  const el = document.getElementById('lexi-badge');
  if(!el) return;
  el.textContent = msg;
  el.style.display = 'inline';
  clearTimeout(el._hideTimer);
  el._hideTimer = setTimeout(()=>{ el.style.display = 'none'; }, 4400);
}

// derived pace — avoids flashing a nonsense pace off a duration that's still mid-type.

/* ============================= bootstrap ============================= */
function boot(){
  if('serviceWorker' in navigator){
    // updateViaCache:'none' bypasses GitHub Pages' Cache-Control: max-age=600
    // when checking sw.js for changes; reg.update() forces an immediate
    // check; auto-reload on controllerchange applies an update as soon as
    // it activates, instead of requiring a manual reopen.
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg)=>{
      reg.update();
      let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', ()=>{
        if (reloaded) return;
        reloaded = true;
        location.reload();
      });
    }).catch(()=>{});
  }
  state.name = Store.getName();
  state.paceFormat = Store.getPaceFormat();
  const setup = Store.getSetup();
  let plan = Store.getPlan();
  state.logs = Store.getLogs();
  state.strengthDone = Store.getStrengthDone();
  state.strengthItems = Store.getStrengthItems();
  state.helpSeen = Store.getFlag('help_seen');
  state.notesSeen = Store.getFlag('notes_seen');
  state.achievementLog = Store.getAchievementLog();
  // One-time migration from the old boolean-flag milestone tracker: a device that already
  // celebrated these under the old system shouldn't see them pop up again just because the
  // new achievement log starts empty. Backfilled entries use today's date as a stand-in
  // since the old system never recorded when something was actually earned.
  if(state.achievementLog.length===0){
    const legacy = Store.getMilestonesShown();
    const todayStr = fmtDate(todayDate());
    const migrated = [];
    if(legacy.firstRun) migrated.push({key:'first-run', date:todayStr});
    if(legacy.halfway) migrated.push({key:'halfway', date:todayStr});
    if(legacy.arrived) migrated.push({key:'plan-complete', date:todayStr});
    (legacy.weeksHit||[]).forEach(ws=>migrated.push({key:'week-fully-hit', date:ws}));
    if(migrated.length){ state.achievementLog = migrated; Store.setAchievementLog(migrated); }
  }
  state.stravaAuth = Store.getStravaAuth();
  let rebuilt = false;
  if(setup && plan && plan.engineVersion!==ENGINE_VERSION && plan.weeks && plan.weeks.length){
    // A plan built by the previous generator: rebuild it with the current engine from the
    // same inputs, anchored to the original day one so elapsed weeks keep their place.
    // Logged runs are untouched.
    try{
      const dayOne = parseDate(plan.weeks[0].weekStart);
      const fresh = isGeneralPlan(setup) ? generateGeneralPlan(setup, dayOne) : generatePlan(setup, dayOne);
      Store.setPlan(fresh); plan = fresh; rebuilt = true;
    }catch(err){ console.error('plan rebuild failed', err); }
  }
  if(setup && plan){
    state.setup = setup; state.plan = plan;
    const today = todayDate();
    let idx = plan.weeks.findIndex(w=>{ const ws=parseDate(w.weekStart); return today>=ws && today<addDays(ws,7); });
    state.currentWeekIndex = idx===-1?0:idx;
    state.view = 'app'; state.tab='plan';
  } else {
    state.view = 'onboarding';
    state.onboardDraft = defaultDraft();
    state.onboardStep = 1;
  }
  render();
  if(rebuilt) showToast('Your plan was rebuilt with the updated training engine');
  handleStravaRedirect();
}

/* ============================= strava ============================= */
function stravaConnectUrl(){
  const params = new URLSearchParams({
    client_id: STRAVA_CLIENT_ID,
    redirect_uri: STRAVA_REDIRECT_URI,
    response_type: 'code',
    approval_prompt: 'auto',
    scope: STRAVA_SCOPE,
  });
  return `https://www.strava.com/oauth/authorize?${params.toString()}`;
}

async function stravaTokenRequest(body){
  const res = await fetch(STRAVA_WORKER_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(()=>null);
  if(!res.ok || !data || !data.access_token) throw new Error((data && data.error) || 'Strava connection failed');
  return {access_token:data.access_token, refresh_token:data.refresh_token, expires_at:data.expires_at};
}

// After Strava redirects back with ?code=..., exchange it via the worker and store the
// result exactly like any other local data — nothing about a connected account lives
// anywhere but this browser.
async function handleStravaRedirect(){
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  if(!code) return;
  window.history.replaceState({}, '', window.location.origin + window.location.pathname);
  try{
    const auth = await stravaTokenRequest({action:'exchange', code});
    state.stravaAuth = auth;
    Store.setStravaAuth(auth);
    showToast('Connected to Strava');
  }catch(e){
    showToast('Could not connect to Strava — try again');
  }
}

// Returns a usable access token, silently refreshing first if the stored one has
// expired (or is about to) - the only network round trip the user should ever notice
// is the one this piggybacks on (opening the import list).
async function ensureStravaToken(){
  const auth = state.stravaAuth;
  if(!auth) return null;
  const nowSec = Math.floor(Date.now()/1000);
  if(auth.expires_at && auth.expires_at > nowSec+60) return auth.access_token;
  try{
    const fresh = await stravaTokenRequest({action:'refresh', refresh_token:auth.refresh_token});
    state.stravaAuth = fresh;
    Store.setStravaAuth(fresh);
    return fresh.access_token;
  }catch(e){
    return null;
  }
}

// Recent running activities from Strava, mapped into this app's own log shape and
// filtered to runs not already imported (by stravaId) so a picked run can't be
// double-logged just by showing up in the list twice.
async function fetchStravaRuns(){
  const token = await ensureStravaToken();
  if(!token) throw new Error('not-connected');
  const res = await fetch('https://www.strava.com/api/v3/athlete/activities?per_page=15', {
    headers:{ Authorization:`Bearer ${token}` },
  });
  if(!res.ok) throw new Error('strava-request-failed');
  const activities = await res.json();
  const importedIds = new Set(state.logs.map(l=>l.stravaId).filter(Boolean));
  return activities
    .filter(a => (a.type==='Run' || a.sport_type==='Run') && !importedIds.has(a.id))
    .map(a => ({
      id: a.id,
      name: a.name,
      date: a.start_date_local.slice(0,10), // local wall-clock date, no timezone math needed
      distanceKm: a.distance/1000,
      durationSec: a.moving_time,
    }));
}

// Average rep time from an activity's laps: laps within 25% of the planned rep distance are
// taken as the reps (recovery jogs and the warm-up are a different length), and their mean
// pace is scaled to the rep distance. null when fewer than two laps match.
async function fetchStravaRepSec(activityId, repMeters){
  const token = await ensureStravaToken();
  if(!token || !repMeters) return null;
  const res = await fetch(`https://www.strava.com/api/v3/activities/${activityId}/laps`, {headers:{Authorization:`Bearer ${token}`}});
  if(!res.ok) return null;
  const laps = await res.json();
  const reps = (laps||[]).filter(l=>l.distance>0 && l.moving_time>0 && Math.abs(l.distance-repMeters)/repMeters<=0.25);
  if(reps.length<2) return null;
  const paceSecPerM = reps.reduce((s,l)=>s+l.moving_time/l.distance,0)/reps.length;
  return Math.round(paceSecPerM*repMeters);
}
function defaultDraft(){
  return {
    name: state.name || '',
    goalMode: 'race', // 'race' | 'general'
    raceKey:'half', raceDistanceKm:21.0975, raceDate:'', currentWeeklyMi: 20,
    units:'mi', recentDistanceKey:'5k', recentTime:'', goalTime:'',
    longestRecentMi:'', recent2DistanceKey:'', recent2Time:'',
    longDow:0, weekStartDow:0, trainingStartDate:'', trackFromToday:false,
    restDays: clamp(7 - runsPerWeekFor(unitToKm(20,'mi')), 1, 4),
    maxLongRunMi: '', maxWeeklyMi: '',
    longRunEmphasis: 'balanced', speedEmphasis: 'balanced', strengthPerWeek: 2,
    hillsMode: 'flat', // 'flat' | 'hilly' - race plans only, see generatePlan()
    taperMode: 'full', // 'full' | 'light' | 'none' - race plans only
    buildPace: 'standard', // 'standard' (Daniels' step rule) | 'faster' (10% a week) - race plans only
    equipment: DEFAULT_EQUIPMENT.slice(),
    skipBase: false, // race plans only - skip straight to build phase, see generatePlan()
    // General (non-race) plan fields
    planKind: 'speed', weeks: PLAN_KIND_META.speed.weeksDefault,
    distanceGoalMetric: 'weekly', distanceGoalCurrentMi: '', distanceGoalTargetMi: '',
  };
}
// Reverse of submitOnboarding's setup-building - rebuilds an onboarding draft from an
// existing setup, for the "Change plan" flow (re-enter onboarding prefilled with current
// values rather than starting from scratch, and without touching state.logs at all).
function draftFromSetup(setup){
  const matchedRecent = RACE_PRESETS.slice(0,5).find(r=>setup.recentDistanceKm && Math.abs(r.km-setup.recentDistanceKm)<0.05);
  const common = {
    ...defaultDraft(),
    units: setup.units,
    currentWeeklyMi: round1(kmToUnit(setup.currentWeeklyKm, setup.units)),
    recentDistanceKey: matchedRecent ? matchedRecent.key : '5k',
    recentTime: setup.recentTimeSec ? secToClock(setup.recentTimeSec) : '',
    longestRecentMi: setup.longestRecentRunKm ? round1(kmToUnit(setup.longestRecentRunKm, setup.units)) : '',
    recent2DistanceKey: (()=>{ const m = RACE_PRESETS.slice(0,5).find(r=>setup.recent2DistanceKm && Math.abs(r.km-setup.recent2DistanceKm)<0.05); return m ? m.key : ''; })(),
    recent2Time: setup.recent2TimeSec ? secToClock(setup.recent2TimeSec) : '',
    longDow: setup.longDow, weekStartDow: setup.weekStartDow || 0,
    restDays: clamp(7 - (setup.runsPerWeek || runsPerWeekFor(setup.currentWeeklyKm)), 1, 4),
    equipment: (setup.equipment && setup.equipment.length) ? setup.equipment.slice() : DEFAULT_EQUIPMENT.slice(),
  };
  if(isGeneralPlan(setup)){
    const draft = {...common, goalMode:'general', planKind:setup.planKind, weeks:setup.weeks};
    if(setup.planKind==='distance'){
      draft.distanceGoalMetric = setup.distanceGoalMetric;
      draft.distanceGoalCurrentMi = round1(kmToUnit(setup.distanceGoalCurrentKm, setup.units));
      draft.distanceGoalTargetMi = round1(kmToUnit(setup.distanceGoalTargetKm, setup.units));
    }
    return draft;
  }
  return {
    ...common, goalMode:'race',
    raceKey: setup.raceKey, raceDistanceKm: setup.raceDistanceKm, raceDate: setup.raceDate,
    goalTime: setup.goalTimeSec ? secToClock(setup.goalTimeSec) : '',
    maxLongRunMi: setup.maxLongRunKm ? round1(kmToUnit(setup.maxLongRunKm,setup.units)) : '',
    maxWeeklyMi: setup.maxWeeklyKm ? round1(kmToUnit(setup.maxWeeklyKm,setup.units)) : '',
    longRunEmphasis: setup.longRunEmphasis || 'balanced', speedEmphasis: setup.speedEmphasis || 'balanced',
    strengthPerWeek: setup.strengthPerWeek==null ? 2 : setup.strengthPerWeek,
    hillsMode: setup.hillsMode || 'flat',
    taperMode: setup.taperMode || 'full',
    buildPace: setup.buildPace || 'standard',
    skipBase: !!setup.skipBase,
  };
}
const LONG_DISTANCE_CAP_THRESHOLD_KM = 21.0975; // half marathon and up get optional long-run/volume caps

// Same required-field checks submitOnboarding() makes at the end, run per-step so
// "Next" catches a missing name/date on step 1 instead of bouncing back from step 3.
function onboardStepError(step){
  const d = state.onboardDraft;
  if(step===1){
    if(!d.name || !d.name.trim()) return 'Enter your name';
    if(d.goalMode==='race'){
      if(!d.raceDate) return 'Pick a race date first';
    } else {
      const meta = PLAN_KIND_META[d.planKind];
      const weeks = Number(d.weeks);
      if(!weeks || weeks<meta.weeksMin) return `Enter at least ${meta.weeksMin} week${meta.weeksMin===1?'':'s'}`;
    }
  }
  if(step===2 && d.goalMode==='general' && d.planKind==='distance'){
    if(!d.distanceGoalTargetMi) return 'Enter a target to build toward';
  }
  return null;
}

/* ============================= onboarding submit ============================= */
function submitOnboarding(){
  const d = state.onboardDraft;
  if(!d.name || !d.name.trim()){ showToast('Enter your name'); return; }
  const recentPreset = RACE_PRESETS.find(r=>r.key===d.recentDistanceKey);
  const recentSec = parseDurationToSec(d.recentTime);
  const recent2Preset = d.recent2DistanceKey ? RACE_PRESETS.find(r=>r.key===d.recent2DistanceKey) : null;
  const recent2Sec = recent2Preset ? parseDurationToSec(d.recent2Time) : null;
  const longestKm = Number(d.longestRecentMi)>0 ? unitToKm(Number(d.longestRecentMi), d.units) : null;
  const fitnessFields = {
    recentDistanceKm: recentPreset ? recentPreset.km : null, recentTimeSec: recentSec,
    recent2DistanceKm: (recent2Preset && recent2Sec) ? recent2Preset.km : null, recent2TimeSec: (recent2Preset && recent2Sec) ? recent2Sec : null,
    longestRecentRunKm: longestKm,
  };
  let setup, plan;
  // Reconfiguring (not a first-time plan, not Start over) resumes from the OLD plan's own
  // day one instead of always starting week 1 today, so someone five weeks into training
  // doesn't get dropped back into a beginner base phase just for tweaking a setting - see
  // the fallback/splice step below this if/else for what actually makes that real.
  const isSwitch = state.onboardMode==='switch';
  const oldPlan = isSwitch ? state.plan : null;
  // A first-time onboarding can ALSO backdate day-one, via the optional "already been
  // training?" field - same override mechanism, just user-supplied instead of read off an
  // old plan. Switch mode's own old-plan resume always wins if both were somehow set, since
  // that's the more authoritative "what actually happened" source.
  const parsedTrainingStart = (!isSwitch && d.trainingStartDate) ? parseDate(d.trainingStartDate) : null;
  const trainingStartOverride = (parsedTrainingStart && parsedTrainingStart<=todayDate()) ? parsedTrainingStart : null;
  const dayOneOverride = (oldPlan && oldPlan.weeks && oldPlan.weeks.length)
    ? parseDate(oldPlan.weeks[0].weekStart)
    : trainingStartOverride;

  if(d.goalMode==='general'){
    const weeks = clamp(Number(d.weeks)||PLAN_KIND_META[d.planKind].weeksDefault, PLAN_KIND_META[d.planKind].weeksMin, PLAN_KIND_META[d.planKind].weeksMax);
    setup = {
      planKind: d.planKind, units: d.units, weeks,
      currentWeeklyKm: unitToKm(Number(d.currentWeeklyMi)||0, d.units),
      ...fitnessFields,
      longDow: d.longDow, weekStartDow: d.weekStartDow||0, ...deriveScheduleFromLongDow(d.longDow, d.planKind==='speed'?2:1),
      runsPerWeek: clamp(7 - d.restDays, 3, 6), strengthPerWeek: d.strengthPerWeek, equipment: (d.equipment||DEFAULT_EQUIPMENT).slice(),
    };
    if(d.planKind==='distance'){
      if(!d.distanceGoalTargetMi){ showToast('Enter a target to build toward'); return; }
      const currentVal = d.distanceGoalMetric==='weekly' ? d.currentWeeklyMi : d.distanceGoalCurrentMi;
      setup.distanceGoalMetric = d.distanceGoalMetric;
      setup.distanceGoalCurrentKm = unitToKm(Number(currentVal)||0, d.units);
      setup.distanceGoalTargetKm = unitToKm(Number(d.distanceGoalTargetMi)||0, d.units);
    }
    plan = generateGeneralPlan(setup, dayOneOverride);
  } else {
    if(!d.raceDate){ showToast('Pick a race date first'); return; }
    const goalSec = parseDurationToSec(d.goalTime);
    setup = {
      units: d.units,
      raceKey: d.raceKey,
      raceDistanceKm: d.raceDistanceKm,
      raceDate: d.raceDate,
      currentWeeklyKm: unitToKm(Number(d.currentWeeklyMi)||0, d.units),
      ...fitnessFields,
      goalTimeSec: goalSec,
      longDow: d.longDow, weekStartDow: d.weekStartDow||0, ...deriveScheduleFromLongDow(d.longDow, d.strengthPerWeek),
      runsPerWeek: clamp(7 - d.restDays, 3, 6), strengthPerWeek: d.strengthPerWeek,
      maxLongRunKm: (d.raceDistanceKm>=LONG_DISTANCE_CAP_THRESHOLD_KM && d.maxLongRunMi) ? unitToKm(Number(d.maxLongRunMi), d.units) : null,
      maxWeeklyKm: (d.raceDistanceKm>=LONG_DISTANCE_CAP_THRESHOLD_KM && d.maxWeeklyMi) ? unitToKm(Number(d.maxWeeklyMi), d.units) : null,
      longRunEmphasis: d.longRunEmphasis, speedEmphasis: d.speedEmphasis,
      hillsMode: d.hillsMode, skipBase: d.skipBase, taperMode: d.taperMode || 'full', buildPace: d.buildPace || 'standard',
      equipment: (d.equipment||DEFAULT_EQUIPMENT).slice(),
    };
    plan = generatePlan(setup, dayOneOverride);
  }
  let backdateApplied = !!dayOneOverride;
  if(dayOneOverride){
    const today = todayDate();
    const todayInRange = plan.weeks.some(w=>{ const ws=parseDate(w.weekStart); return today>=ws && today<addDays(ws,7); });
    if(!todayInRange){
      // The new settings don't leave room for today within a plan anchored to the old
      // start - e.g. the race date moved in close enough that "N weeks already elapsed"
      // would already be past where the new plan should end. Resuming mid-plan doesn't
      // make sense here, so fall back to exactly today's plain behavior: a clean restart
      // from today, no frozen weeks, same as a first-time plan.
      plan = d.goalMode==='general' ? generateGeneralPlan(setup) : generatePlan(setup);
      backdateApplied = false;
    } else if(oldPlan){
      // Freeze every already-elapsed week exactly as it was actually lived - the same day
      // objects, same phase/cutback labels, nothing reinterpreted through the new settings.
      // Only today's week and everything after gets the freshly generated structure. A
      // first-time onboarding backdated via trainingStartOverride has no old plan to freeze
      // from - the plan generatePlan/generateGeneralPlan already built, anchored straight to
      // that start date, is exactly right as-is, nothing to splice.
      const oldByStart = Object.fromEntries(oldPlan.weeks.map(w=>[w.weekStart, w]));
      const todayWeekStart = startOfWeek(today, setup.weekStartDow);
      plan.weeks = plan.weeks.map(w => (parseDate(w.weekStart)<todayWeekStart && oldByStart[w.weekStart]) ? oldByStart[w.weekStart] : w);
    }
  }
  // Whether "on track" stats (adherence, mi ahead/behind, % of training miles logged) count
  // from the plan's real day-one, or only from today on for someone who backdated their
  // start but isn't going to log the runs in between - see computeProgressStats/
  // planMileageProgress, which both fall back to this in place of the plan's own weekStart
  // whenever it's set. A reconfigure keeps whatever the ORIGINAL choice was (never silently
  // reverting someone who opted out of back-logging to being judged against their true day
  // one again just because they changed a setting); a genuine first-time backdated
  // onboarding sets it fresh from what was just chosen; anything else (no backdating, or
  // the compatibility fallback above discarded the backdated anchor) leaves it unset, which
  // means "use the plan's real start" - the original, still-correct default.
  if(isSwitch && state.setup && state.setup.trackingStartDate){
    setup.trackingStartDate = state.setup.trackingStartDate;
  } else {
    // No backdating: the first week usually started before the plan existed, so the
    // days before today must not count as missed. Count from today.
    const firstWeekStart = plan.weeks && plan.weeks.length ? parseDate(plan.weeks[0].weekStart) : null;
    const madeMidWeek = !backdateApplied && firstWeekStart && todayDate() > firstWeekStart;
    setup.trackingStartDate = (backdateApplied && trainingStartOverride && d.trackFromToday) ? fmtDate(todayDate()) : (madeMidWeek ? fmtDate(todayDate()) : null);
  }
  state.name = d.name.trim();
  Store.setName(state.name);
  Store.setSetup(setup);
  Store.setPlan(plan);
  state.setup = setup; state.plan = plan;
  const today = todayDate();
  let idx = plan.weeks.findIndex(w=>{ const ws=parseDate(w.weekStart); return today>=ws && today<addDays(ws,7); });
  state.currentWeekIndex = idx===-1?0:idx;
  // Switching plans (not a first-time/Start-over onboarding) keeps every logged run as-is -
  // nothing above touches state.logs or Store's saved logs. Plan-scoped achievements (see
  // isAchievementEarned) naturally become re-earnable against the new plan without any
  // reset here, since they're checked against entries dated on/after the new plan's own
  // generatedAt - "first run logged" and every other lifetime achievement stay earned,
  // since that's genuinely already happened regardless of which plan is active.
  const wasSwitch = state.onboardMode==='switch';
  state.onboardMode = 'new';
  state.view='app'; state.tab='plan';
  window.scrollTo(0,0);
  if(wasSwitch) showToast('Plan updated — your logged runs are still here');
  else render();
}

/* ============================= render: root ============================= */
function render(){
  const app = document.getElementById('app');
  let html;
  if(state.view==='loading') html = renderLoading();
  else if(state.view==='onboarding') html = renderOnboarding();
  else html = renderApp();
  if(state.view!=='loading'){
    html += (state.modal ? renderModal() : '') + (state.toast ? `<div class="toast">${esc(state.toast)}${state.toastUndo ? ` · <a data-act="undo-log" data-id="${state.toastUndo.logId}" style="color:inherit; text-decoration:underline; cursor:pointer;">Undo</a>` : ''}</div>` : '');
  }
  app.innerHTML = html;
  document.documentElement.classList.toggle('modal-open', !!state.modal && state.view!=='loading');
  bindGlobal();
  if(state.view==='app' && state.tab==='plan') keepActiveWeekTabVisible();
  if(state.modal && state.modal.type==='peek-the-peak') startPeekAnimation();
}
// The week strip is its own horizontal scroller, freshly re-rendered (and reset to
// scrollLeft 0) on every render — so without this, jumping to a week beyond what fits on
// screen (goto-week, reopening the app mid-plan, switching tabs and back) leaves the
// active week's tab scrolled off to the right with no indication anything is selected.
// Only nudges the scroll when the active tab genuinely isn't visible, and only ever
// touches the strip's own horizontal scroll — never the page's vertical position.
function keepActiveWeekTabVisible(){
  const strip = document.querySelector('.week-strip');
  const activeBtn = strip && strip.querySelector('.week-tab.active');
  if(!strip || !activeBtn) return;
  const stripRect = strip.getBoundingClientRect();
  const activeRect = activeBtn.getBoundingClientRect();
  if(activeRect.left>=stripRect.left && activeRect.right<=stripRect.right) return;
  const targetScrollLeft = strip.scrollLeft + (activeRect.left-stripRect.left) - (stripRect.width-activeRect.width)/2;
  strip.scrollLeft = Math.max(0, targetScrollLeft);
}

// Works for either kind of plan: a real race's distance label, or the general plan's
// kind name (Build Speed, Maintenance, etc.) - the one thing every setup has a name for.
function planLabel(setup){
  return isGeneralPlan(setup) ? PLAN_KIND_META[setup.planKind].label : raceLabel(setup);
}
function isGeneralPlan(setup){ return !!(setup && setup.planKind); }
function raceLabel(setup){
  const preset = RACE_PRESETS.find(r=>r.key===setup.raceKey);
  if(preset && Math.abs(preset.km-setup.raceDistanceKm)<0.05) return preset.label;
  return fmtDist(setup.raceDistanceKm, setup.units||'mi',1);
}
// Distance + time for the "recent race" the user entered at onboarding, in the same
// preset-matching style raceLabel/draftFromSetup already use - null when none was given.
function recentRaceLabel(setup, unit){
  if(!setup.recentDistanceKm) return null;
  const preset = RACE_PRESETS.slice(0,5).find(r=>Math.abs(r.km-setup.recentDistanceKm)<0.05);
  const distLabel = preset ? preset.label : fmtDist(setup.recentDistanceKm, unit, 1);
  return setup.recentTimeSec ? `${distLabel} — ${secToClock(setup.recentTimeSec)}` : distLabel;
}

// Auto-inserts colons as the user types digits, so "2230" becomes "22:30" and
// "34500" becomes "3:45:00" without anyone having to type ':' themselves.
function formatDurationDigits(raw){
  const digits = String(raw).replace(/\D/g,'').slice(0,6);
  if(digits.length<=2) return digits;
  if(digits.length<=4){
    const mmLen = digits.length-2;
    return digits.slice(0,mmLen)+':'+digits.slice(mmLen);
  }
  const hhLen = digits.length-4;
  return digits.slice(0,hhLen)+':'+digits.slice(hhLen,hhLen+2)+':'+digits.slice(hhLen+2);
}

// in for variety, each with its own one-line editorial comment.
const ANIMAL_PACES_MPH = [

  {name:'a hedgehog', mph:4, quip:'Small legs, big effort, does not care what you think.'},
  {name:'a caffeinated toddler', mph:5, quip:'Unpredictable, occasionally airborne, will not pace themselves.'},

// Picks from among the closest few matches (not always the single nearest) so entering a
// similar pace twice doesn't always name the same thing.
function animalPaceComparison(mph){
  if(!mph || mph<=0) return '';
  const closest = ANIMAL_PACES_MPH.map(a=>({...a, diff:Math.abs(a.mph-mph)})).sort((a,b)=>a.diff-b.diff);
  const pool = closest.slice(0, Math.min(3, closest.length));
  const pick = pool[Math.floor(Math.random()*pool.length)];
  return `about the running pace of ${pick.name}. ${pick.quip}`;
}
function recentPaceHint(d){
  const preset = RACE_PRESETS.find(r=>r.key===d.recentDistanceKey);
  const sec = parseDurationToSec(d.recentTime);
  if(!preset || !sec) return 'Enter a finish time to see your pace per mile.';
  const secPerKm = sec/preset.km;
  const mph = 3600/(secPerKm*KM_PER_MI);
  void mph;
  return `That's about ${paceStr(secPerKm,'mi')} pace.`;
}

function renderOnboardStep2(d){
  const recentChips = RACE_PRESETS.slice(0,5).map(r=>`<button class="chip ${d.recentDistanceKey===r.key?'active':''}" data-act="pick-recent" data-key="${r.key}">${r.label}</button>`).join('');
  const isGeneral = d.goalMode==='general';
  const isDistance = isGeneral && d.planKind==='distance';

  const distanceGoalHtml = !isDistance ? '' : (()=>{
    const metricChips = `
      <div class="chip-select" style="margin-bottom:10px;">

    const currentVal = d.distanceGoalMetric==='weekly' ? d.currentWeeklyMi : d.distanceGoalCurrentMi;
    const fromKm = unitToKm(Number(currentVal)||0, d.units);
    const toKm = unitToKm(Number(d.distanceGoalTargetMi)||0, d.units);
    const warning = distanceGoalWarning(fromKm, toKm, Number(d.weeks)||0);
    return `

  })();

  // In switch/reconfigure mode the "already been training?" field is deliberately hidden
  // (see renderOnboardStep1) - the plan actually resumes from the OLD plan's own real start
  // date via a separate mechanism (submitOnboarding's dayOneOverride), not this field, so
  // d.trainingStartDate stays empty here. This warning needs that same real anchor though,
  // or it silently computes "weeks available" as just today-to-race-day - the remaining
  // runway only - ignoring every week already actually trained, making a mid-plan
  // reconfigure look like a far shorter, riskier build than it really is (e.g. warning that
  // "5 weeks isn't enough" when 5 weeks is only what's left, not the whole build).
  const isSwitch = state.onboardMode==='switch';
  const effectiveTrainingStart = (isSwitch && state.plan && state.plan.weeks && state.plan.weeks.length)
    ? state.plan.weeks[0].weekStart

  const longRunWarning = isGeneral ? null : raceLongRunWarning(
    d.raceDistanceKm, d.raceDate, effectiveTrainingStart,
    unitToKm(Number(d.currentWeeklyMi)||0, d.units), d.longRunEmphasis, d.units,
    Number(d.longestRecentMi)>0 ? unitToKm(Number(d.longestRecentMi), d.units) : null, clamp(7 - d.restDays, 3, 6)
  );
  // Live race projection + goal check from the same model the plan will use.
  const recentPresetP = RACE_PRESETS.find(r=>r.key===d.recentDistanceKey);
  const recentSecP = parseDurationToSec(d.recentTime);
  const recent2PresetP = d.recent2DistanceKey ? RACE_PRESETS.find(r=>r.key===d.recent2DistanceKey) : null;
  const recent2SecP = recent2PresetP ? parseDurationToSec(d.recent2Time) : null;
  const racesP = [];
  if(recentPresetP && recentSecP) racesP.push({km:recentPresetP.km, sec:recentSecP});
  if(recent2PresetP && recent2SecP) racesP.push({km:recent2PresetP.km, sec:recent2SecP});
  const predictionP = (!isGeneral && racesP.length && d.raceDistanceKm) ? predictRace({races:racesP, weeklyKm:unitToKm(Number(d.currentWeeklyMi)||0, d.units), longestKm: Number(d.longestRecentMi)>0 ? unitToKm(Number(d.longestRecentMi), d.units) : null}, d.raceDistanceKm) : null;
  const goalP = predictionP ? assessGoal(predictionP, parseDurationToSec(d.goalTime)) : {status:'none'};
  const predictionHint = predictionP
    ? `Your recent result projects to about <b>${secToClock(predictionP.lowSec)}–${secToClock(predictionP.highSec)}</b> for this race, ${esc(predictionP.basis)}.${goalP.status==='beyond' ? ' That goal is well beyond this range — the plan will set race pace to the fast end of the range instead, and say so.' : goalP.status==='ambitious' ? ' Your goal sits at the optimistic end — worth chasing, but expect race-pace work to feel like work.' : goalP.status==='realistic' ? ' Your goal is within reach.' : ''}`
    : '';
  const recent2Chips = RACE_PRESETS.slice(0,5).map(r=>`<button class="chip ${d.recent2DistanceKey===r.key?'active':''}" data-act="pick-recent2" data-key="${r.key}">${r.label}</button>`).join('');

  return `
    <div class="section-title" style="margin-top:0;">Current fitness</div>
    <div class="field">
      <label class="field-label">Current weekly mileage (${d.units})</label>
      <input class="input" type="number" min="0" step="1" id="in-weekly" value="${d.currentWeeklyMi}">
      <div class="hint">Rough average over the last few weeks is fine.</div>
      ${longRunWarning ? `<div class="banner" style="margin-top:10px;">${esc(longRunWarning)}</div>` : ''}
    </div>
    <div class="field">
      <label class="field-label">Longest run in the last few weeks (${d.units}, optional)</label>
      <input class="input" type="number" inputmode="decimal" min="0" step="0.5" id="in-longest" value="${esc(d.longestRecentMi)}" placeholder="e.g. 8">
      <div class="hint">Sets where your long run starts and how far it can safely build.</div>
    </div>
    ${!isGeneral ? `
    <div class="field">
      <label class="field-label">Base phase</label>
      <div class="chip-select">
        <button class="chip ${d.skipBase?'':'active'}" data-act="pick-skip-base" data-mode="0">Build up gradually</button>
        <button class="chip ${d.skipBase?'active':''}" data-act="pick-skip-base" data-mode="1">Skip straight to speed work</button>
      </div>
      <div class="hint">${d.skipBase ? "You'll go straight into structured speed sessions instead of easy-only base weeks — good if you're already running consistently and comfortable with quality workouts." : "Daniels' Phase I: a few weeks of easy running with strides before speed work starts. Its length follows the weeks you have, not your mileage."}</div>

    <div class="field">
      <label class="field-label">Most recent race (optional, calibrates your paces)</label>
      <div class="chip-select" style="margin-bottom:10px;">${recentChips}</div>
      <input class="input" type="text" inputmode="numeric" id="in-recent-time" placeholder="e.g. 25:30" value="${esc(d.recentTime)}">

      <div class="chip-select" style="margin-bottom:10px;"><button class="chip ${!d.recent2DistanceKey?'active':''}" data-act="pick-recent2" data-key="">None</button>${recent2Chips}</div>
      ${d.recent2DistanceKey ? `<input class="input" type="text" inputmode="numeric" id="in-recent2-time" placeholder="e.g. 25:30" value="${esc(d.recent2Time)}">` : ''}
      <div class="hint">Two distances pin down how your speed carries over to longer races — the single biggest accuracy gain for marathon and half projections.</div>

      <div class="hint">Leave blank to let your paces guide you.</div>

    </div>`}
    ${isDistance ? `<div class="section-title">Your goal</div>${distanceGoalHtml}` : ''}
