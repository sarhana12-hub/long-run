<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peak</title>
<meta name="description" content="A personalized week-by-week running training plan and tracker.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101511">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Peak">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: light dark;
  --bg:#F3F5F0; --surface:#FFFFFF; --surface-2:#EAEEE4; --raised:#FFFFFF;
  --ink:#121A16; --ink-soft:#45524B; --muted:#6C776F; --line:#DBE3D8; --line-soft:#E8EDE3;
  --accent:#C3F53A; --accent-ink:#122006; --accent-soft:#E9FAC0; --accent-strong:#9FCE22;
  --z-easy:#29708C; --z-easy-bg:#E0EEF3;
  --z-long:#4A4E9E; --z-long-bg:#E7E7F6;
  --z-tempo:#945810; --z-tempo-bg:#F8E9D3;
  --z-intervals:#B33C28; --z-intervals-bg:#F8E1DA;
  --z-strength:#6F5D83; --z-strength-bg:#ECE6F2;
  --z-rest:#646B66; --z-rest-bg:#EBEFE8;
  --z-race:#806408; --z-race-bg:#F6EBC9;
  --z-hill:#A04C1B; --z-hill-bg:#F5E2D2;
  --shadow: 0 1px 2px rgba(18,26,22,.06), 0 8px 24px -12px rgba(18,26,22,.18);
  --radius: 16px;
  --font-display:'Bricolage Grotesque','Arial Black',sans-serif;
  --font-body:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono','SFMono-Regular',Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101511; --surface:#1A211C; --surface-2:#212922; --raised:#232B25;
    --ink:#EAEFE9; --ink-soft:#C2CCC4; --muted:#8B9790; --line:#2B342D; --line-soft:#242C26;
    --accent:#D4FA4D; --accent-ink:#0E1704; --accent-soft:#2C3712; --accent-strong:#BFEA36;
    --z-easy:#74C3E3; --z-easy-bg:#1B2E38;
    --z-long:#9B9FEF; --z-long-bg:#25274A;
    --z-tempo:#F0AC55; --z-tempo-bg:#3B2A14;
    --z-intervals:#F1836A; --z-intervals-bg:#3C231D;
    --z-strength:#C2A9D8; --z-strength-bg:#2E2638;
    --z-rest:#8B968D; --z-rest-bg:#20261F;
    --z-race:#E9C860; --z-race-bg:#3A2F0F;
    --z-hill:#E8935C; --z-hill-bg:#3A2416;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#101511; --surface:#1A211C; --surface-2:#212922; --raised:#232B25;
  --ink:#EAEFE9; --ink-soft:#C2CCC4; --muted:#8B9790; --line:#2B342D; --line-soft:#242C26;
  --accent:#D4FA4D; --accent-ink:#0E1704; --accent-soft:#2C3712; --accent-strong:#BFEA36;
  --z-easy:#74C3E3; --z-easy-bg:#1B2E38;
  --z-long:#9B9FEF; --z-long-bg:#25274A;
  --z-tempo:#F0AC55; --z-tempo-bg:#3B2A14;
  --z-intervals:#F1836A; --z-intervals-bg:#3C231D;
  --z-strength:#C2A9D8; --z-strength-bg:#2E2638;
  --z-rest:#8B968D; --z-rest-bg:#20261F;
  --z-race:#E9C860; --z-race-bg:#3A2F0F;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
}

*{box-sizing:border-box;}
html,body{margin:0; padding:0;}
body{background:var(--bg); color:var(--ink); font-family:var(--font-body); -webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0;}
.mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:15px;}
::selection{background:var(--accent-soft);}

#app{max-width:520px; margin:0 auto; min-height:100dvh; padding-bottom:calc(150px + env(safe-area-inset-bottom)); position:relative;}

/* Permanent status-bar scrim: a fixed strip, sibling of #app so re-renders never wipe
   it, painted the page background at exactly the safe-area-inset-top height. Padding on
   a normal (non-fixed) element like .topbar only protects that area while scrolled to
   the very top — the moment the page scrolls, whatever content is next in flow slides
   under the (fixed, OS-drawn) notch/Dynamic Island with no protection of its own. This
   sits above all scrolling content regardless of scroll position, on every view. */
.status-scrim{position:fixed; top:0; left:0; right:0; height:env(safe-area-inset-top); background:var(--bg); z-index:100; pointer-events:none;}

/* ---------- top bar ---------- */
.topbar{display:flex; align-items:center; justify-content:space-between; padding:calc(16px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) 8px calc(18px + env(safe-area-inset-left));}
.brand{display:flex; align-items:center; gap:8px;}
.brand-mark{width:30px; height:30px; border-radius:9px; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; flex:none;}
.brand-mark svg{width:17px; height:17px;}
.brand-name{font-family:var(--font-display); font-weight:800; font-size:19px; letter-spacing:-.01em;}

/* ---------- generic ---------- */
.container{padding:0 calc(18px + env(safe-area-inset-right)) 0 calc(18px + env(safe-area-inset-left));}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-weight:700; font-size:14px; padding:11px 16px; transition:transform .1s ease;}
.btn:active{transform:scale(.97);}
/* An inline icon SVG with no width/height of its own sizes unpredictably in a flex
   button — fine in a narrow, content-width button, but a wide .btn-block with short
   text can blow it up to fill the available space. Pin it explicitly everywhere. */
.btn svg{width:16px; height:16px; flex:none;}
.fab svg{width:18px; height:18px; flex:none;}
.btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
.btn-ghost{border-color:transparent; background:transparent;}
.btn-block{width:100%;}
.btn-sm{padding:7px 12px; font-size:12.5px; border-radius:10px;}
.btn-danger{color:#C4432E; border-color:#C4432E33;}
label.field-label{display:block; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:6px;}
.input, select.input, textarea.input{width:100%; padding:11px 13px; border-radius:11px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink);}
.input:focus, select.input:focus, textarea.input:focus{outline:2px solid var(--accent); outline-offset:1px;}
/* Chrome's built-in calendar icon doesn't follow this page's own dark/light theme —
   left alone it renders dark-on-dark and disappears against --surface-2 in dark mode. */
input.input[type="date"]::-webkit-calendar-picker-indicator{ cursor:pointer; opacity:.85; }
@media (prefers-color-scheme: dark){
  input.input[type="date"]::-webkit-calendar-picker-indicator{ filter:invert(1); }
}
.field{margin-bottom:16px;}
.row{display:flex; gap:10px;}
.row > *{flex:1;}
.hint{font-size:12px; color:var(--muted); margin-top:6px; line-height:1.4;}
.section-title{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:22px 2px 10px;}
.pill{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;}
.chip-select{display:flex; flex-wrap:wrap; gap:8px;}
.chip{padding:8px 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface-2); font-size:13.5px; font-weight:600; color:var(--ink-soft);}
.chip.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
a.link-btn{color:var(--ink-soft); font-size:13px; text-decoration:underline; text-underline-offset:2px;}

/* ---------- onboarding ---------- */
.hero-pad{padding:28px 18px 10px;}
.eyebrow{font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-strong);}
.step-indicator{display:flex; align-items:center; gap:10px; margin:2px 0 20px;}
.step-indicator .step-label{font-size:12px; font-weight:700; color:var(--muted); letter-spacing:.02em;}
.step-dots{display:flex; gap:6px;}
.step-dot{width:7px; height:7px; border-radius:50%; background:var(--line);}
.step-dot.active{background:var(--accent-strong);}

/* ---------- week strip ---------- */
.week-strip{display:flex; gap:8px; overflow-x:auto; padding:2px 18px 14px; scrollbar-width:none;}
.week-strip::-webkit-scrollbar{display:none;}
.week-tab{flex:none; width:64px; border-radius:13px; border:1px solid var(--line); background:var(--surface); padding:8px 4px; text-align:center;}
.week-tab .wk{font-size:10.5px; color:var(--muted); font-weight:700; text-transform:uppercase;}
.week-tab .wn{font-family:var(--font-mono); font-weight:700; font-size:15px;}
.week-tab.active{border-color:var(--phase-color, var(--accent)); box-shadow:inset 0 -3px 0 var(--phase-color, var(--accent));}

.week-header{padding:4px 18px 14px; display:flex; align-items:flex-end; justify-content:space-between; gap:12px;}
.week-header h2{font-size:21px;}
.week-meta{font-size:12.5px; color:var(--muted); margin-top:3px;}
.week-stat{text-align:right;}
.week-stat .v{font-family:var(--font-mono); font-weight:700; font-size:18px;}
.week-stat .l{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}

/* ---------- day cards ---------- */
.day-list{display:flex; flex-direction:column; gap:10px; padding:0 18px;}
.day-card{display:flex; align-items:center; gap:12px; padding:13px 14px; position:relative; width:100%; text-align:left; border:1px solid var(--line);}
.day-card.move-target{outline:2px dashed var(--accent-strong); outline-offset:2px;}
.day-card.move-source{outline:2px solid var(--accent-strong);}
.day-card.logged{background:var(--accent-soft); border-color:var(--accent-strong);}
.day-date{width:38px; flex:none; text-align:center;}
.day-date .dow{font-size:10.5px; font-weight:700; color:var(--muted); text-transform:uppercase;}
.day-date .dom{font-family:var(--font-mono); font-weight:700; font-size:17px;}
.day-main{flex:1; min-width:0;}
.day-top{display:flex; align-items:center; gap:8px; margin-bottom:4px; flex-wrap:wrap;}
.day-title{font-weight:700; font-size:14.5px;}
.day-desc{font-size:12.5px; color:var(--muted); line-height:1.4;}
.day-side{flex:none; text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:5px;}
.day-dist{font-family:var(--font-mono); font-weight:700; font-size:15px;}
.day-pace{font-family:var(--font-mono); font-size:11px; color:var(--muted);}
.day-check{width:19px; height:19px; border-radius:50%; background:var(--accent-strong); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; flex:none;}
.day-check svg{width:11px; height:11px;}
.strength-badge{font-size:10px; font-weight:700; color:var(--z-strength); background:var(--z-strength-bg); border-radius:6px; padding:2px 6px;}

/* ---------- FAB & tabbar ---------- */
.fab{position:fixed; right:calc(20px + env(safe-area-inset-right)); bottom:calc(80px + env(safe-area-inset-bottom)); z-index:20; background:var(--accent); color:var(--accent-ink); border:none; border-radius:999px; padding:14px 20px 14px 16px; font-weight:800; font-size:14px; display:flex; align-items:center; gap:7px; box-shadow:0 10px 24px -8px rgba(0,0,0,.35); max-width:460px; margin:0 auto;}
.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:15; background:var(--surface); border-top:1px solid var(--line); display:flex; padding:8px calc(10px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));}
.tabbar-inner{max-width:520px; margin:0 auto; display:flex; width:100%;}
.tab-btn{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:var(--muted); font-size:10.5px; font-weight:700; padding:6px 0;}
.tab-btn svg{width:20px; height:20px;}
.tab-btn.active{color:var(--ink);}
.tab-btn.active svg{color:var(--accent-strong);}

/* ---------- modal / sheet ---------- */
.overlay{position:fixed; inset:0; background:rgba(10,14,11,.45); z-index:40; display:flex; align-items:flex-end; justify-content:center;}
.sheet{background:var(--surface); width:100%; max-width:520px; border-radius:20px 20px 0 0; padding:18px calc(18px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left)); max-height:88dvh; overflow-y:auto; box-shadow:var(--shadow); position:relative;}
.sheet-handle{width:36px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 14px;}
.sheet-title{font-size:19px; margin-bottom:16px;}
.sheet-close{position:absolute; top:14px; right:14px; background:var(--surface-2); border-radius:50%; width:40px; height:40px; border:none; display:flex; align-items:center; justify-content:center; color:var(--muted);}
.sheet-close svg{width:24px; height:24px;}
.sheet.milestone{ text-align:center; }
.badge-ring{ width:84px; height:84px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; }
.badge-ring svg{ width:44px; height:44px; }
.milestone-hero{ width:220px; margin:0 auto 18px; }
.milestone-hero svg{ width:100%; height:auto; display:block; }
.sheet-title.milestone{ font-family:var(--font-display); font-weight:800; font-size:22px; margin-bottom:8px; }
.sheet-body{ font-size:14.5px; line-height:1.55; color:var(--ink-soft); margin-bottom:22px; }

/* ---------- progress ---------- */
.stat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; padding:0 18px;}
.stat-tile{padding:14px 12px; display:block; width:100%; text-align:left;}
.stat-tile .v{font-family:var(--font-mono); font-weight:800; font-size:20px;}
.stat-tile .l{font-size:11px; color:var(--muted); margin-top:2px;}
.chart-card{margin:0 18px; padding:18px 16px 8px;}
.chart-rows{display:flex; align-items:flex-end; gap:6px; height:168px; padding-top:8px;}
.chart-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px; height:100%; position:relative;}
.bar-label{font-size:9px; font-weight:700; white-space:nowrap;}
/* Matches the surrounding card's own background (not --surface-2) so the unfilled
   headroom above a below-max week's planned bar reads as empty space, not a third,
   unlabeled color — the chart only ever means to show two series: planned and logged. */
.bar-track{width:100%; max-width:26px; height:130px; border-radius:6px; background:var(--surface); display:flex; align-items:flex-end; overflow:hidden; position:relative;}
.bar-planned{width:100%; background:var(--line); border-radius:6px 6px 0 0;}
.bar-actual{position:absolute; bottom:0; left:0; width:100%; background:var(--accent-strong); border-radius:6px 6px 0 0;}
.chart-col .wl{font-size:9.5px; color:var(--muted); font-weight:700;}
.legend{display:flex; gap:16px; padding:10px 4px 14px; font-size:11.5px; color:var(--muted);}
.legend span{display:inline-flex; align-items:center; gap:5px;}
.legend i{width:9px; height:9px; border-radius:3px; display:inline-block;}
.log-row{display:flex; align-items:center; gap:12px; padding:12px 14px; cursor:pointer;}
.log-row + .log-row{border-top:1px solid var(--line-soft);}
.log-row .btn-sm{padding:13px 12px;}
.log-row .btn-sm svg{width:16px; height:16px;}
.log-date{width:46px; flex:none; font-size:11.5px; color:var(--muted); font-weight:700;}
.log-mid{flex:1;}
.log-mid .d{font-weight:700; font-size:14px;}
.log-mid .t{font-size:12px; color:var(--muted);}
.log-pace{font-family:var(--font-mono); font-weight:700; font-size:13.5px; text-align:right;}
.empty{padding:30px 20px; text-align:center; color:var(--muted); font-size:13.5px;}

.center-screen{min-height:100dvh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; padding:20px;}
.banner{margin:8px 18px 0; padding:10px 13px; border-radius:12px; background:var(--z-tempo-bg); color:var(--z-tempo); font-size:12.5px; font-weight:600; display:flex; gap:8px; align-items:flex-start;}
.toast{position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:13px; font-weight:700; z-index:60; box-shadow:var(--shadow);}
.dow-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
.dow-opt{padding:8px 0; text-align:center; border-radius:9px; border:1px solid var(--line); background:var(--surface-2); font-size:11.5px; font-weight:700; color:var(--muted);}
.dow-opt.sel{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
.settings-row{display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--line-soft); gap:12px;}
.settings-row:last-child{border-bottom:none;}
.settings-row .lbl{font-weight:700; font-size:14px;}
.settings-row .sub{font-size:12px; color:var(--muted); margin-top:2px;}
</style>
</head>
<body>
<div class="status-scrim"></div>
<div id="app"></div>

<script>
(function(){
"use strict";

/* ============================= constants ============================= */
const KM_PER_MI = 1.609344;
// Client secret never appears here — it lives only in the Cloudflare Worker's own
// encrypted settings. The worker's sole job is the one step Strava requires off the
// browser (exchanging a code/refresh token using that secret); everything else, this
// app talks to Strava directly.
const STRAVA_CLIENT_ID = '278972';
const STRAVA_WORKER_URL = 'https://peakstravarelay.a-elsarhan.workers.dev';
const STRAVA_REDIRECT_URI = 'https://sarhana12-hub.github.io/long-run/';
const STRAVA_SCOPE = 'activity:read_all';
const DOW_LABELS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const RACE_PRESETS = [
  {key:'5k', label:'5K', km:5},
  {key:'10k', label:'10K', km:10},
  {key:'15k', label:'15K', km:15},
  {key:'10mi', label:'10 Miles', km:10*KM_PER_MI},
  {key:'half', label:'Half Marathon', km:21.0975},
  {key:'20mi', label:'20 Miles', km:20*KM_PER_MI},
  {key:'marathon', label:'Marathon', km:42.195},
];
const TYPE_META = {
  rest:{label:'Rest', bg:'--z-rest-bg', fg:'--z-rest'},
  easy:{label:'Easy Run', bg:'--z-easy-bg', fg:'--z-easy'},
  long:{label:'Long Run', bg:'--z-long-bg', fg:'--z-long'},
  tempo:{label:'Tempo', bg:'--z-tempo-bg', fg:'--z-tempo'},
  intervals:{label:'Intervals', bg:'--z-intervals-bg', fg:'--z-intervals'},
  hills:{label:'Hill Repeats', bg:'--z-hill-bg', fg:'--z-hill'},
  fartlek:{label:'Fartlek', bg:'--z-hill-bg', fg:'--z-hill'},
  overunder:{label:'Over/Unders', bg:'--z-tempo-bg', fg:'--z-tempo'},
  race:{label:'Race Day', bg:'--z-race-bg', fg:'--z-race'},
};
const QUALITY_TYPES = ['long','tempo','intervals','hills','fartlek','overunder'];
// Plain-language training purpose + target effort per workout type, shown in the
// read-only day detail view so "why does this run exist" is answered without opening edit.
const WORKOUT_PURPOSE = {
  rest: {purpose:'Lets your body absorb the training and rebuild stronger.', effort:'None — or light mobility if paired with strength.'},
  easy: {purpose:'Builds aerobic endurance and recovery capacity without piling on fatigue.', effort:'Conversational — you should be able to hold a conversation the whole way.'},
  long: {purpose:'Extends your endurance and trains your body to use fat efficiently over long time on your feet.', effort:'Steady and aerobic — comfortably sustainable, not a grind.'},
  tempo: {purpose:'Raises your lactate threshold — the pace you can hold before fatigue piles up fast.', effort:'Comfortably hard — sustainable with focus, not a sprint.'},
  intervals: {purpose:'Improves VO2 max and running economy through repeated hard efforts.', effort:'Hard — close to max sustainable effort for each rep, with easy jog recovery between.'},
  hills: {purpose:'Builds power, strength, and running form through resisted uphill effort.', effort:'Hard push uphill, easy jog back down to recover.'},
  fartlek: {purpose:'Blends speed and endurance with unstructured surges of faster running.', effort:'Alternates moderately hard surges with easy jogging in between.'},
  overunder: {purpose:'Trains your body to clear lactate at race-relevant pace by riding just above and below threshold.', effort:'Alternates comfortably hard and hard, back and forth.'},
  race: {purpose:'This is race day — execute your goal-pace strategy.', effort:'Your target race effort.'},
};
const BUILD_ROTATION = ['tempo','hills','fartlek'];
const PEAK_ROTATION_SHORT = ['intervals','hills','fartlek','tempo'];
const PEAK_ROTATION_LONG = ['tempo','overunder','intervals'];
const LONG_EMPHASIS_PARAMS = {
  low:      { peakScale:0.85, fractionScale:0.80 },
  balanced: { peakScale:1.00, fractionScale:1.00 },
  high:     { peakScale:1.30, fractionScale:1.25 },
};
const SPEED_EMPHASIS_PARAMS = {
  low:      { sessionScale:0.70, secondSession:false, introducePhase:'peak' },
  balanced: { sessionScale:1.00, secondSession:false, introducePhase:'build' },
  high:     { sessionScale:1.30, secondSession:true,  introducePhase:'build' },
};

/* ============================= tiny utils ============================= */
function pad2(n){ return String(n).padStart(2,'0'); }
function uid(){ return Math.random().toString(36).slice(2,10); }
function clamp(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }
function round1(v){ return Math.round(v*10)/10; }
function fmtDate(d){ const dt = (d instanceof Date)? d : new Date(d+'T00:00:00'); return `${dt.getFullYear()}-${pad2(dt.getMonth()+1)}-${pad2(dt.getDate())}`; }
function parseDate(s){ return new Date(s+'T00:00:00'); }
function addDays(d,n){ const nd = new Date(d); nd.setDate(nd.getDate()+n); return nd; }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }
function startOfWeek(d){ const nd=new Date(d); const dow=nd.getDay(); return addDays(nd,-dow); }
function todayDate(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
function niceDate(d){ return d.toLocaleDateString(undefined,{month:'short', day:'numeric'}); }
function niceDateFull(d){ return d.toLocaleDateString(undefined,{weekday:'long', month:'short', day:'numeric', year:'numeric'}); }

function interp(anchors, x){
  if(x<=anchors[0][0]) return anchors[0][1];
  for(let i=0;i<anchors.length-1;i++){
    const [x0,y0]=anchors[i], [x1,y1]=anchors[i+1];
    if(x<=x1){ const t=(x-x0)/(x1-x0); return y0+t*(y1-y0); }
  }
  return anchors[anchors.length-1][1];
}
/* Jack Daniels' VDOT model — two published equations tie one fitness number (VDOT) to
   every training pace:
     VO2 (ml/kg/min) sustained at velocity v (m/min):  VO2 = -4.60 + 0.182258v + 0.000104v^2
     %VO2max sustainable racing for t minutes:          %max(t) = 0.8 + 0.1894393e^(-0.012778t)
                                                                      + 0.2989558e^(-0.1932605t)
   VDOT = VO2(race velocity) / %max(race time). Everything below is a straight application of
   those two equations — no flat percentage guesses. */
function vo2FromVelocity(vMetersPerMin){ return -4.60 + 0.182258*vMetersPerMin + 0.000104*vMetersPerMin*vMetersPerMin; }
function velocityFromVO2(vo2){
  const a=0.000104, b=0.182258, c=-(4.60+vo2);
  return (-b + Math.sqrt(b*b - 4*a*c)) / (2*a); // meters per minute
}
function pctMaxForDurationMin(tMin){ return 0.8 + 0.1894393*Math.exp(-0.012778*tMin) + 0.2989558*Math.exp(-0.1932605*tMin); }
function vdotFromRace(distanceKm, timeSec){
  const tMin = timeSec/60;
  const v = (distanceKm*1000)/tMin;
  return vo2FromVelocity(v) / pctMaxForDurationMin(tMin);
}
function paceSecPerKmFromVdotPct(vdot, pct){
  const v = velocityFromVO2(vdot*pct); // m/min
  return (1000/v)*60; // sec/km
}
// The time it'd take to race `distanceKm` at this VDOT — solved by fixed-point iteration
// since %max depends on the very time being solved for (a handful of iterations converges,
// the %max(t) curve is smooth and well-behaved over realistic race durations).
function predictedTimeMinFromVdot(vdot, distanceKm){
  let tMin = distanceKm*4.5;
  for(let i=0;i<8;i++){
    const v = velocityFromVO2(vdot*pctMaxForDurationMin(tMin));
    tMin = (distanceKm*1000)/v;
  }
  return tMin;
}
function predictedPaceSecPerKmFromVdot(vdot, distanceKm){
  return (predictedTimeMinFromVdot(vdot, distanceKm)*60)/distanceKm;
}

function parseDurationToSec(str){
  if(!str) return null;
  const parts = str.trim().split(':').map(s=>Number(s));
  if(parts.some(n=>isNaN(n))) return null;
  if(parts.length===2) return parts[0]*60+parts[1];
  if(parts.length===3) return parts[0]*3600+parts[1]*60+parts[2];
  return null;
}
function secToClock(totalSec){
  totalSec = Math.max(0, Math.round(totalSec));
  const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = totalSec%60;
  if(h>0) return `${h}:${pad2(m)}:${pad2(s)}`;
  return `${m}:${pad2(s)}`;
}
function paceStr(secPerKm, unit){
  const secPerUnit = unit==='mi' ? secPerKm*KM_PER_MI : secPerKm;
  return `${secToClock(secPerUnit)}/${unit}`;
}
function speedStr(secPerKm, unit){
  const secPerUnit = unit==='mi' ? secPerKm*KM_PER_MI : secPerKm;
  const perHour = 3600/secPerUnit;
  return `${perHour.toFixed(1)} ${unit==='mi'?'mph':'km/h'}`;
}
function paceOrSpeedStr(secPerKm, unit, fmt){
  return fmt==='speed' ? speedStr(secPerKm, unit) : paceStr(secPerKm, unit);
}
function kmToUnit(km, unit){ return unit==='mi' ? km/KM_PER_MI : km; }
function unitToKm(v, unit){ return unit==='mi' ? v*KM_PER_MI : v; }
function fmtDist(km, unit, digits){ digits = digits==null?1:digits; return `${kmToUnit(km,unit).toFixed(digits)} ${unit}`; }

/* ============================= plan generation ============================= */
function runsPerWeekFor(currentKm){
  if(currentKm < 32) return 3;
  if(currentKm < 56) return 4;
  return 5;
}
// Speed day and strength days are derived from the one day the user actually picks (long
// run), rather than asked for separately: speed day sits opposite the long run in the
// week (circular offset of 3, giving 48+ hours' separation both directions — the real
// coaching guideline, vs. any specific day-of-week), and strength lands on the recovery
// day right after the long run and right after the speed day. Anyone can still move
// things around afterward with the day-swap feature.
function deriveScheduleFromLongDow(longDow, strengthPerWeek){
  const speedDow = (longDow+3) % 7;
  if(strengthPerWeek==null) strengthPerWeek = 2;
  // Prefer the day right after the long run, then the day right after the speed day —
  // both pair strength with a recovery day rather than a hard one. If more are wanted,
  // fill in from whatever's left, skipping the day immediately before either hard day.
  const idealOrder = [(longDow+1)%7, (speedDow+1)%7];
  const badDows = new Set([longDow, speedDow, (longDow+6)%7, (speedDow+6)%7]);
  const strengthDows = [];
  idealOrder.forEach(dw=>{ if(strengthDows.length<strengthPerWeek && !strengthDows.includes(dw)) strengthDows.push(dw); });
  for(let offset=0; offset<7 && strengthDows.length<strengthPerWeek; offset++){
    const dw = (longDow+offset)%7;
    if(!strengthDows.includes(dw) && !badDows.has(dw)) strengthDows.push(dw);
  }
  return { speedDow, strengthDows };
}

function circularDayDist(a,b){ const diff=Math.abs(a-b); return Math.min(diff,7-diff); }

/* Flags — never blocks — spacing that runs against common coaching guidance: hard
   efforts (the long run and any quality workout) less than 48h apart, and strength
   sessions landing the day before a hard effort (or stacked onto one) rather than
   paired with recovery. Users can rearrange freely; this just keeps them informed. */
function scheduleWarnings(week){
  const warnings = [];
  const longDay = week.days.find(d=>d.type==='long');
  const qualityDays = week.days.filter(d=>QUALITY_TYPES.includes(d.type) && d.type!=='long');
  const hardDays = longDay ? [longDay, ...qualityDays] : qualityDays;

  if(longDay){
    qualityDays.forEach(q=>{
      if(circularDayDist(q.dow, longDay.dow)<2){
        warnings.push(`${q.label} (${DOW_LABELS[q.dow]}) is only a day from your Long Run (${DOW_LABELS[longDay.dow]}) — most coaches recommend 48+ hours between hard efforts.`);
      }
    });
  }
  for(let i=0;i<qualityDays.length;i++){
    for(let j=i+1;j<qualityDays.length;j++){
      if(circularDayDist(qualityDays[i].dow, qualityDays[j].dow)<2){
        warnings.push(`${qualityDays[i].label} and ${qualityDays[j].label} are back-to-back — most coaches recommend 48+ hours between hard efforts.`);
      }
    }
  }
  week.days.filter(d=>d.strength).forEach(s=>{
    hardDays.forEach(h=>{
      if(h.id===s.id){
        warnings.push(`Strength is stacked on top of ${h.label} (${DOW_LABELS[h.dow]}) — pairing it with an easier day instead lets both sessions actually recover.`);
      } else if(((h.dow-1+7)%7)===s.dow){
        warnings.push(`Strength on ${DOW_LABELS[s.dow]} falls right before ${h.label} (${DOW_LABELS[h.dow]}) — many coaches keep the day before a hard effort fresh instead.`);
      }
    });
  });
  return warnings;
}

function baseVdot(setup){
  if(setup.recentDistanceKm && setup.recentTimeSec){
    return vdotFromRace(setup.recentDistanceKm, setup.recentTimeSec);
  }
  // No recent race given: fall back to a rough 5K-equivalent time by weekly mileage
  // tier, then convert that into the same VDOT currency as everything else.
  const tierPace = interp([[10,7.5*60],[30,6.6*60],[50,5.9*60],[80,5.3*60]], setup.currentWeeklyKm||20);
  return vdotFromRace(5, tierPace*5);
}
// Every training pace comes from the SAME vdot number, so easy/tempo/interval/long-run
// paces stay correctly related to each other for any fitness level — not four separate
// formulas that can drift apart. %VO2max targets are Daniels' own definitions of each pace,
// not guessed constants: Threshold = the pace sustainable for ~60 minutes of racing,
// Interval = ~11 minutes (both run through the same %max(t) curve above), Easy = his
// textbook reference point (59-74% range; 70% is the standard single-value pick), and
// Marathon = %max at THIS runner's own predicted marathon time — solved from their vdot,
// so a fast marathoner's M-pace sits closer to threshold than a slower marathoner's, the
// way Daniels' published tables actually behave (not one fixed percent for everyone).
const EASY_PCT = 0.70;
const THRESHOLD_PCT = pctMaxForDurationMin(60);
const INTERVAL_PCT = 0.975;
const LONG_VS_MARATHON = 1.03;
function paceZonesFromVdot(vdot){
  const marathonPct = pctMaxForDurationMin(predictedTimeMinFromVdot(vdot, 42.195));
  const marathonPerKm = paceSecPerKmFromVdotPct(vdot, marathonPct);
  return {
    easyPerKm: paceSecPerKmFromVdotPct(vdot, EASY_PCT),
    tempoPerKm: paceSecPerKmFromVdotPct(vdot, THRESHOLD_PCT),
    intervalPerKm: paceSecPerKmFromVdotPct(vdot, INTERVAL_PCT),
    marathonPerKm,
    longPerKm: marathonPerKm*LONG_VS_MARATHON,
  };
}

/* Recalibration: blend the deterministic fitness projection with real performance
   from recently logged tempo/interval/over-under runs (the only workout types with
   a controlled, comparable target pace — easy/long/hills/fartlek are intentionally
   loose or terrain-dependent and aren't a clean fitness signal). Only ever adjusts
   the current week onward; past weeks keep the paces that were actually prescribed. */
const RECALIBRATION_TYPES = ['tempo','intervals','overunder'];
function findPlanDay(plan, date){
  for(const week of plan.weeks){
    const day = week.days.find(d=>d.date===date);
    if(day) return day;
  }
  return null;
}
// Which %VO2max a logged pace should be inverted through, keyed by the same paceKey
// buildWorkoutMeta assigns to that workout type (overunder shares tempo's key already).
const RECALIBRATION_PCT = { tempoPerKm: THRESHOLD_PCT, intervalPerKm: INTERVAL_PCT };
function impliedVdotFromPace(actualPaceSecPerKm, pct){
  const vMetersPerMin = 60000/actualPaceSecPerKm;
  return vo2FromVelocity(vMetersPerMin)/pct;
}
function computeRecalibration(plan, logs){
  const matches = [];
  for(const log of logs){
    const day = findPlanDay(plan, log.date);
    const pct = day && RECALIBRATION_TYPES.includes(day.type) ? RECALIBRATION_PCT[day.paceKey] : null;
    if(pct && log.distanceKm>0){
      const actualPaceSecPerKm = log.durationSec/log.distanceKm;
      const impliedVdot = impliedVdotFromPace(actualPaceSecPerKm, pct);
      matches.push({date:log.date, impliedVdot});
    }
  }
  if(!matches.length) return null;
  matches.sort((a,b)=> a.date<b.date?1:-1);
  const recent = matches.slice(0,3);
  const perfImpliedVdot = recent.reduce((s,m)=>s+m.impliedVdot,0)/recent.length;
  const weight = recent.length===1?0.25:recent.length===2?0.35:0.45;
  return {perfImpliedVdot, weight, count:recent.length};
}
function getWeekPaces(plan, week, logs){
  if(plan.startVdot==null){
    return week.paces || plan.paces; // plans saved before the vdot model existed
  }
  const frac = week.weekIndex>=plan.buildWeeksCount ? 1 : clamp(week.weekIndex/plan.rampWeeks, 0, 1);
  const baselineVdot = plan.startVdot + (plan.endVdot-plan.startVdot)*frac;
  const weekStartDate = parseDate(week.weekStart);
  const isPastWeek = addDays(weekStartDate,6) < todayDate();

  let effectiveVdot = baselineVdot;
  let effectiveEndVdot = plan.endVdot;
  const recal = isPastWeek ? null : computeRecalibration(plan, logs);
  if(recal){
    effectiveVdot = baselineVdot*(1-recal.weight) + recal.perfImpliedVdot*recal.weight;
    effectiveEndVdot = plan.endVdot*(1-recal.weight) + recal.perfImpliedVdot*recal.weight;
  }
  const zones = paceZonesFromVdot(effectiveVdot);
  zones.racePerKm = plan.goalRacePerKm!=null ? plan.goalRacePerKm : predictedPaceSecPerKmFromVdot(effectiveEndVdot, plan.raceDistanceKm);
  return zones;
}

/* Workout description is split from pace: descBase/paceKey are stored on the day,
   the pace string itself is rendered live so unit/mph-toggle and the week's
   progressively-faster paces always stay in sync without regenerating the plan. */
function buildWorkoutMeta(day, raceDistanceKm){
  switch(day.type){
    case 'long':{
      const meta = {descBase:'Steady, aerobic effort', paceKey:'longPerKm'};
      if(raceDistanceKm>15 && day.km >= raceDistanceKm*0.5){ meta.paceKey2='marathonPerKm'; meta.desc2='last quarter'; }
      return meta;
    }
    case 'easy':{
      const descBase = day.easyRole==='recovery' ? 'Very easy, short recovery jog'
        : day.easyRole==='aerobic' ? 'Longer aerobic effort, conversational pace'
        : 'Conversational, easy effort';
      return {descBase, paceKey:'easyPerKm'};
    }
    case 'tempo': return {descBase:'Continuous, comfortably hard', paceKey:'tempoPerKm'};
    case 'intervals':{
      const repM = raceDistanceKm<=10 ? 800 : 1000;
      const reps = Math.max(4, Math.round((day.km*1000)/(repM*1.4)));
      return {descBase:`${reps} × ${repM}m intervals, jog ${Math.round(repM*0.5)}m recovery`, paceKey:'intervalPerKm'};
    }
    case 'hills':{
      const reps = clamp(Math.round(day.km/0.3), 6, 12);
      return {descBase:`${reps} hill reps — 60–90s hard uphill effort, jog back down to recover`, paceKey:null};
    }
    case 'fartlek':{
      const surges = clamp(Math.round(day.km/1.5), 4, 8);
      return {descBase:`Fartlek — ${surges} × 2 min surge / 2 min easy jog, rest of the run`, paceKey:'easyPerKm'};
    }
    case 'overunder':{
      const cycles = clamp(Math.round(day.km/1.2), 4, 7);
      return {descBase:`Over/unders — ${cycles} × (2 min above / 1 min below) around tempo pace`, paceKey:'tempoPerKm', paceKey2:null};
    }
    case 'race': return {descBase:'Goal pace effort', paceKey:'racePerKm'};
    case 'rest': return day.strength ? {descBase:'Rest day — mobility & light stretching', paceKey:null} : {descBase:'Full rest — recovery day', paceKey:null};
    default: return {descBase:'', paceKey:null};
  }
}

function renderWorkoutText(day, weekPaces, unit, fmt){
  if(!day.descBase) return '';
  let text = day.descBase;
  if(day.paceKey){
    const p = day.paceOverrideSecPerKm!=null ? day.paceOverrideSecPerKm : (weekPaces && weekPaces[day.paceKey]);
    if(p!=null) text += ` @ ${paceOrSpeedStr(p, unit, fmt)}`;
  }
  if(day.paceKey2 && weekPaces && weekPaces[day.paceKey2]!=null) text += ` (${day.desc2} @ ${paceOrSpeedStr(weekPaces[day.paceKey2], unit, fmt)})`;
  if(day.strides) text += ' + strides (6 × 20s relaxed, full recovery)';
  return text;
}
function dayDisplayText(day, weekPaces, unit, fmt){
  if(day.descBase==null && day.notes!=null) return day.notes; // plans saved before this update
  return renderWorkoutText(day, weekPaces, unit, fmt);
}
function paceInputValue(effectiveSecPerKm, unit, fmt){
  if(effectiveSecPerKm==null) return '';
  const secPerUnit = unit==='mi' ? effectiveSecPerKm*KM_PER_MI : effectiveSecPerKm;
  if(fmt==='speed') return (3600/secPerUnit).toFixed(1);
  return secToClock(secPerUnit);
}
function parsePaceInput(val, unit, fmt){
  if(fmt==='speed'){
    const mph = Number(val);
    if(!mph || mph<=0) return null;
    const secPerUnit = 3600/mph;
    return unit==='mi' ? secPerUnit/KM_PER_MI : secPerUnit;
  }
  const secPerUnit = parseDurationToSec(val);
  if(secPerUnit==null) return null;
  return unit==='mi' ? secPerUnit/KM_PER_MI : secPerUnit;
}

function generatePlan(setup){
  const today = todayDate();
  const raceDate = parseDate(setup.raceDate);
  const totalDays = daysBetween(startOfWeek(today), raceDate);
  const totalWeeks = Math.max(1, Math.ceil((totalDays+1)/7));
  const currentKm = setup.currentWeeklyKm;
  const raceKm = setup.raceDistanceKm;

  // Long run and speed-work emphasis: different, equally legitimate schools of thought
  // (Daniels-style capped long runs vs. Lydiard-style high-mileage long runs; race-specific
  // speed work vs. minimal speed work) scale the same underlying knobs rather than
  // branching into separate plan-generation logic.
  const longEmphasis = LONG_EMPHASIS_PARAMS[setup.longRunEmphasis] || LONG_EMPHASIS_PARAMS.balanced;
  const speedEmphasis = SPEED_EMPHASIS_PARAMS[setup.speedEmphasis] || SPEED_EMPHASIS_PARAMS.balanced;

  const peakLongKm = interp([[5,9],[10,13],[15,14.5],[21.0975,18],[32.19,26],[42.195,32]], raceKm) * longEmphasis.peakScale;
  // Long run as a fraction of that week's total volume. Kept roughly flat (not
  // dropping steeply with race distance) since an already-well-built-up runner
  // shouldn't be forced into a token long run just because the fraction table says so —
  // that was capping long runs well short of common real-world guidance for half marathons.
  const longFraction = interp([[5,0.35],[10,0.32],[15,0.30],[21.0975,0.30],[32.19,0.24],[42.195,0.20]], raceKm) * longEmphasis.fractionScale;
  // Ideal peak week implied by wanting the long run at exactly `longFraction` of it —
  // but never demand more than a safe 35% growth over current mileage just to hit that
  // ratio (a 25mi/week runner doesn't need a 45mi/week peak for a half marathon).
  const idealPeakWeeklyKm = peakLongKm/longFraction;
  let peakWeeklyKm = clamp(idealPeakWeeklyKm, currentKm*1.10, currentKm*1.35);
  // With peak week capped, let the long run be a larger share of it (up to 34%) rather
  // than silently shrinking the peak long run itself below the race-distance target.
  let achievablePeakLongKm = Math.min(peakLongKm, peakWeeklyKm*0.34*longEmphasis.fractionScale);
  // User-supplied caps (half marathon+ only) scale the whole plan down to fit — applied
  // as a ceiling on the peak targets, so the existing week-by-week ramp (which already
  // never exceeds these) respects them automatically without a separate pass.
  if(setup.maxWeeklyKm){ peakWeeklyKm = Math.max(Math.min(peakWeeklyKm, setup.maxWeeklyKm), Math.min(currentKm, setup.maxWeeklyKm)); }
  if(setup.maxLongRunKm){ achievablePeakLongKm = Math.min(achievablePeakLongKm, setup.maxLongRunKm); }
  // The long run ramps toward achievablePeakLongKm on its own track, rather than as a flat
  // fraction of that week's total volume — a flat fraction can mathematically never reach
  // the peak target once weekly volume is capped well below peakLongKm/longFraction (this
  // is exactly what happens once maxWeeklyKm or the safe-growth cap above kicks in).
  const startLongKm = Math.min(currentKm*longFraction, achievablePeakLongKm);

  let taperWeeks = Math.round(interp([[5,1],[10,1],[15,1],[21.0975,2],[32.19,2],[42.195,3]], raceKm));
  taperWeeks = clamp(taperWeeks, 1, Math.max(1,totalWeeks-1));
  if(totalWeeks<=2) taperWeeks = totalWeeks;

  const buildWeeksCount = Math.max(0, totalWeeks - taperWeeks);

  const buildVols = [];
  const cutbackFlags = [];
  let vol = currentKm;
  for(let i=0;i<buildWeeksCount;i++){
    const isCutback = i>0 && (i % 4 === 3);
    if(isCutback){
      vol = Math.max(currentKm, buildVols[i-1]*0.8);
    } else if(i>0){
      vol = Math.min(buildVols[i-1]*1.10, peakWeeklyKm);
    }
    buildVols.push(round1(vol));
    cutbackFlags.push(isCutback);
  }
  const taperCurves = {1:[0.55], 2:[0.7,0.45], 3:[0.75,0.6,0.4]};
  const taperCurve = taperCurves[taperWeeks] || taperCurves[3].slice(-taperWeeks);
  const lastBuild = buildVols.length ? buildVols[buildVols.length-1] : Math.max(currentKm, peakWeeklyKm*0.5);
  const taperVols = taperCurve.map(m=>round1(lastBuild*m));
  const weeklyVols = buildVols.concat(taperVols).slice(0, totalWeeks);
  while(weeklyVols.length<totalWeeks) weeklyVols.push(weeklyVols[weeklyVols.length-1]||currentKm);

  // How much base-building someone needs depends on how close their CURRENT mileage
  // already is to the race's IDEAL peak (uncapped) — a runner already at 75%+ of that
  // has already built the aerobic engine base phase is for, and can move into quality
  // work much sooner; someone starting well below it genuinely needs more weeks of pure
  // volume before that's safe. Deliberately measured against idealPeakWeeklyKm, not the
  // safety-clamped peakWeeklyKm, since that clamp keeps peak within 1.10-1.35x current
  // mileage by construction — comparing against it would make every runner look
  // "nearly at peak" regardless of actual fitness.
  const fitnessRatio = idealPeakWeeklyKm>0 ? clamp(currentKm/idealPeakWeeklyKm, 0, 1) : 0;
  const baseFraction = interp([[0,0.55],[0.5,0.45],[0.75,0.25],[1,0.10]], fitnessRatio);
  const baseCount = Math.max(buildWeeksCount>=3?Math.round(buildWeeksCount*baseFraction):buildWeeksCount, buildWeeksCount>0?1:0);
  const buildCount = Math.max(buildWeeksCount-baseCount>=2? Math.round(buildWeeksCount*0.35):Math.max(0,buildWeeksCount-baseCount), 0);
  function phaseFor(i){
    if(i>=buildWeeksCount) return 'taper';
    if(i<baseCount) return 'base';
    if(i<baseCount+buildCount) return 'build';
    return 'peak';
  }

  // Pace progression: training paces ramp from current fitness (start) toward a
  // fitter projection (end) across base/build/peak, then hold flat through taper —
  // tapering makes you fresher, not fitter, so peak-week paces carry through.
  const startVdot = baseVdot(setup);
  let endVdot;
  if(setup.goalTimeSec && raceKm){
    // A goal implies a vdot; fitness can't regress just because the goal is modest, so
    // end-of-plan vdot is never allowed to fall below where the runner already is.
    endVdot = Math.max(vdotFromRace(raceKm, setup.goalTimeSec), startVdot);
  } else {
    const improvementFrac = clamp(buildWeeksCount*0.006, 0, 0.08);
    endVdot = startVdot*(1+improvementFrac);
  }
  const racePerKm = (setup.goalTimeSec && raceKm) ? setup.goalTimeSec/raceKm : predictedPaceSecPerKmFromVdot(endVdot, raceKm);
  const rampWeeks = Math.max(buildWeeksCount-1, 1);

  const longDow = setup.longDow ?? 0;
  const speedDow = setup.speedDow ?? 3;
  const strengthDows = setup.strengthDows ?? [1,4];
  const runsPerWeek = setup.runsPerWeek || runsPerWeekFor(currentKm);
  const weekStart0 = startOfWeek(today);

  const weeks = [];
  for(let w=0; w<totalWeeks; w++){
    const weekStart = addDays(weekStart0, w*7);
    const phase = phaseFor(w);
    const weeklyKm = weeklyVols[w];
    const isRaceWeek = (w===totalWeeks-1);
    const longProgressFrac = peakWeeklyKm>currentKm ? clamp((weeklyKm-currentKm)/(peakWeeklyKm-currentKm), 0, 1) : 1;
    const rampedLongKm = startLongKm + (achievablePeakLongKm-startLongKm)*longProgressFrac;
    const longKm = isRaceWeek ? Math.min(achievablePeakLongKm*0.3, weeklyKm*0.3) : Math.min(rampedLongKm, weeklyKm*0.5);

    const frac = w>=buildWeeksCount ? 1 : clamp(w/rampWeeks, 0, 1);
    const weekVdot = startVdot + (endVdot-startVdot)*frac;
    const weekPaces = paceZonesFromVdot(weekVdot);
    weekPaces.racePerKm = racePerKm;

    const days = [];
    for(let d=0; d<7; d++){
      const date = addDays(weekStart, d);
      days.push({id:uid(), date:fmtDate(date), dow:date.getDay(), type:'rest', km:0, strength:false, label:'Rest', notesOverride:null});
    }
    const longIdx = days.findIndex(x=>x.dow===longDow);
    let speedIdx = days.findIndex(x=>x.dow===speedDow);
    if(speedIdx===longIdx) speedIdx = -1;

    let remaining = Math.max(0, weeklyKm-longKm);
    const speedAllowedPhases = speedEmphasis.introducePhase==='peak' ? ['peak','taper'] : ['build','peak','taper'];
    const wantsSpeed = speedAllowedPhases.includes(phase) && speedIdx!==-1;
    let speedKm = 0, speedType = 'tempo';
    const weekWithinPhase = phase==='build' ? (w-baseCount) : phase==='peak' ? (w-baseCount-buildCount) : 0;
    if(wantsSpeed){
      if(phase==='build'){
        speedType = BUILD_ROTATION[weekWithinPhase % BUILD_ROTATION.length];
      } else if(phase==='peak'){
        const rotation = raceKm<=10 ? PEAK_ROTATION_SHORT : PEAK_ROTATION_LONG;
        speedType = rotation[weekWithinPhase % rotation.length];
      } else {
        speedType = 'tempo';
      }
      speedKm = round1(Math.min(remaining*0.4, raceKm<=10?8:9) * speedEmphasis.sessionScale);
      remaining = Math.max(0, remaining-speedKm);
    }
    // "High" speed emphasis adds a second, lighter quality session in build/peak weeks
    // (never taper — tapering stays light regardless of philosophy), placed on whichever
    // remaining day sits furthest from the primary speed day.
    let secondSpeedIdx = -1, secondSpeedKm = 0, secondSpeedType = null;
    if(wantsSpeed && speedEmphasis.secondSession && (phase==='build' || phase==='peak')){
      const dayDist = (a,b)=>{ const diff=Math.abs(a-b); return Math.min(diff,7-diff); };
      const candidates = days.map((x,i)=>i).filter(i=>i!==longIdx && i!==speedIdx);
      candidates.sort((a,b)=> dayDist(days[b].dow,speedDow)-dayDist(days[a].dow,speedDow));
      if(candidates.length){
        secondSpeedIdx = candidates[0];
        const rotation2 = phase==='build' ? BUILD_ROTATION : (raceKm<=10 ? PEAK_ROTATION_SHORT : PEAK_ROTATION_LONG);
        secondSpeedType = rotation2[(weekWithinPhase+1) % rotation2.length];
        secondSpeedKm = round1(speedKm*0.6);
        remaining = Math.max(0, remaining-secondSpeedKm);
      }
    }
    const usedRunDays = 1 + (wantsSpeed?1:0) + (secondSpeedIdx!==-1?1:0);
    const easyDaysNeeded = Math.max(0, runsPerWeek-usedRunDays);
    const candidateIdxs = days.map((x,i)=>i).filter(i=>i!==longIdx && i!==speedIdx && i!==secondSpeedIdx);
    const easyIdxs = candidateIdxs.slice(0, easyDaysNeeded);

    // Easy days aren't run at one flat distance: the day right after the long run is a
    // short recovery jog, and (when there's a third easy day) the one placed farthest from
    // the long run is a longer "aerobic" run — real coaching practice, not evenly split miles.
    const recoveryIdx = easyIdxs.find(i=>days[i].dow===(longDow+1)%7);
    let aerobicIdx = null;
    if(easyIdxs.length>=2){
      const aerobicCandidates = easyIdxs.filter(i=>i!==recoveryIdx);
      aerobicIdx = aerobicCandidates.reduce((best,i)=> circularDayDist(days[i].dow,longDow) > circularDayDist(days[best].dow,longDow) ? i : best, aerobicCandidates[0]);
    }
    const easyWeight = i => easyIdxs.length<2 ? 1 : (i===recoveryIdx ? 0.7 : i===aerobicIdx ? 1.3 : 1.0);
    const totalEasyWeight = easyIdxs.reduce((s,i)=>s+easyWeight(i), 0);
    const easyKmFor = i => totalEasyWeight>0 ? round1(remaining*easyWeight(i)/totalEasyWeight) : 0;
    const easyLabelFor = i => i===recoveryIdx ? 'Recovery Run' : i===aerobicIdx ? 'Aerobic Run' : 'Easy Run';
    const easyRoleFor = i => i===recoveryIdx ? 'recovery' : i===aerobicIdx ? 'aerobic' : 'easy';

    // Strides (short relaxed accelerations) go on up to two easy days a week — skipping the
    // recovery jog right after the long run, which should stay fully easy.
    const stridesEligible = easyIdxs.filter(i=>i!==recoveryIdx);
    const stridesIdxs = [];
    if(aerobicIdx!=null) stridesIdxs.push(aerobicIdx);
    stridesEligible.forEach(i=>{ if(stridesIdxs.length<2 && !stridesIdxs.includes(i)) stridesIdxs.push(i); });

    days[longIdx] = {...days[longIdx], type:'long', km:round1(longKm), label:'Long Run'};
    if(wantsSpeed){ days[speedIdx] = {...days[speedIdx], type:speedType, km:speedKm, label:TYPE_META[speedType].label}; }
    if(secondSpeedIdx!==-1){ days[secondSpeedIdx] = {...days[secondSpeedIdx], type:secondSpeedType, km:secondSpeedKm, label:TYPE_META[secondSpeedType].label}; }
    easyIdxs.forEach(i=>{ days[i] = {...days[i], type:'easy', km:easyKmFor(i), label:easyLabelFor(i), easyRole:easyRoleFor(i), strides:stridesIdxs.includes(i)}; });

    let strengthLeft = setup.strengthPerWeek==null?2:setup.strengthPerWeek;
    strengthDows.forEach(dw=>{
      if(strengthLeft<=0) return;
      const idx = days.findIndex(x=>x.dow===dw && !QUALITY_TYPES.includes(x.type));
      if(idx!==-1){ days[idx].strength = true; strengthLeft--; }
    });

    if(isRaceWeek){
      const raceIdx = days.findIndex(x=>x.date===fmtDate(raceDate));
      const targetIdx = raceIdx!==-1 ? raceIdx : 6;
      for(let i=0;i<7;i++){
        const diff = daysBetween(parseDate(days[i].date), raceDate);
        if(i===targetIdx){ days[i] = {...days[i], type:'race', km:raceKm, label:'Race Day', strength:false, strides:false, easyRole:null}; }
        else if(diff>0 && diff<=2){ days[i] = {...days[i], type:diff===1?'rest':'easy', km:diff===1?0:round1(Math.min(3,achievablePeakLongKm*0.15)), strength:false, strides:false, easyRole:null, label:diff===1?'Rest':'Shakeout Jog'}; }
        else if(diff<0){ days[i] = {...days[i], type:'rest', km:0, strength:false, strides:false, easyRole:null, label:'Rest'}; }
      }
    }

    days.forEach(day=>{ Object.assign(day, buildWorkoutMeta(day, raceKm)); });

    weeks.push({weekIndex:w, phase, isCutback: w<buildWeeksCount && !!cutbackFlags[w], weekStart:fmtDate(weekStart), targetKm:round1(days.reduce((s,d)=>s+d.km,0)), paces:weekPaces, days});
  }

  return {
    generatedAt:new Date().toISOString(), raceDate:setup.raceDate, raceDistanceKm:raceKm, totalWeeks,
    startVdot, endVdot, buildWeeksCount, rampWeeks,
    goalRacePerKm: (setup.goalTimeSec && raceKm) ? setup.goalTimeSec/raceKm : null,
    paces:weeks[0].paces, weeks,
  };
}

/* ============================= storage layer (local only) ============================= */
const Store = {
  _get(key, fallback){ try{ const v = localStorage.getItem(key); return v==null? fallback : JSON.parse(v); }catch(e){ return fallback; } },
  _set(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} },

  getName(){ return this._get('lr_name', ''); },
  setName(name){ this._set('lr_name', name); },
  getPaceFormat(){ return this._get('lr_pace_format', 'pace'); },
  setPaceFormat(fmt){ this._set('lr_pace_format', fmt); },
  getSetup(){ return this._get('lr_setup', null); },
  setSetup(setup){ this._set('lr_setup', setup); },
  getPlan(){ return this._get('lr_plan', null); },
  setPlan(plan){ this._set('lr_plan', plan); },
  getLogs(){ return this._get('lr_logs', []); },
  addLog(entry){
    const logs = this.getLogs();
    const item = {id:'l_'+uid(), ...entry};
    logs.unshift(item);
    this._set('lr_logs', logs);
    return item;
  },
  deleteLog(id){
    const logs = this.getLogs().filter(l=>l.id!==id);
    this._set('lr_logs', logs);
  },
  getMilestonesShown(){ return this._get('lr_milestones', {halfway:false, arrived:false, firstRun:false, weeksHit:[]}); },
  setMilestonesShown(v){ this._set('lr_milestones', v); },
  getStravaAuth(){ return this._get('lr_strava_auth', null); },
  setStravaAuth(auth){ this._set('lr_strava_auth', auth); },
  clearStravaAuth(){ localStorage.removeItem('lr_strava_auth'); },
  resetAll(){
    localStorage.removeItem('lr_name');
    localStorage.removeItem('lr_setup');
    localStorage.removeItem('lr_plan');
    localStorage.removeItem('lr_logs');
    localStorage.removeItem('lr_milestones');
    localStorage.removeItem('lr_strava_auth');
  }
};

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg){ state.toast = msg; render(); setTimeout(()=>{ state.toast=null; render(); }, 2200); }
// Flashes a message inline next to the "Your name" label (the lexi-badge span) instead of
// a floating toast — a fixed-position popup kept landing either behind the Dynamic Island
// or under the keyboard depending on how far up the screen it sat. Bypasses render()
// entirely, same reason as before: a normal showToast() would steal focus mid-keystroke.
function showNameBadge(msg){
  const el = document.getElementById('lexi-badge');
  if(!el) return;
  el.textContent = msg;
  el.style.display = 'inline';
  clearTimeout(el._hideTimer);
  el._hideTimer = setTimeout(()=>{ el.style.display = 'none'; }, 4400);
}
// How long a pace-hint field waits for a pause in typing before computing/showing the

/* ============================= bootstrap ============================= */
function boot(){
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
  state.name = Store.getName();
  state.paceFormat = Store.getPaceFormat();
  const setup = Store.getSetup();
  const plan = Store.getPlan();
  state.logs = Store.getLogs();
  state.milestonesShown = Store.getMilestonesShown();
  state.stravaAuth = Store.getStravaAuth();
  if(setup && plan){
    state.setup = setup; state.plan = plan;
    const today = todayDate();
    let idx = plan.weeks.findIndex(w=>{ const ws=parseDate(w.weekStart); return today>=ws && today<addDays(ws,7); });
    state.currentWeekIndex = idx===-1?0:idx;
    state.view = 'app'; state.tab='plan';
  } else {
    state.view = 'onboarding';
    state.onboardDraft = defaultDraft();
    state.onboardStep = 1;
  }
  render();
  handleStravaRedirect();
}

/* ============================= strava ============================= */
function stravaConnectUrl(){
  const params = new URLSearchParams({
    client_id: STRAVA_CLIENT_ID,
    redirect_uri: STRAVA_REDIRECT_URI,
    response_type: 'code',
    approval_prompt: 'auto',
    scope: STRAVA_SCOPE,
  });
  return `https://www.strava.com/oauth/authorize?${params.toString()}`;
}

async function stravaTokenRequest(body){
  const res = await fetch(STRAVA_WORKER_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(()=>null);
  if(!res.ok || !data || !data.access_token) throw new Error((data && data.error) || 'Strava connection failed');
  return {access_token:data.access_token, refresh_token:data.refresh_token, expires_at:data.expires_at};
}

// After Strava redirects back with ?code=..., exchange it via the worker and store the
// result exactly like any other local data — nothing about a connected account lives
// anywhere but this browser.
async function handleStravaRedirect(){
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  if(!code) return;
  window.history.replaceState({}, '', window.location.origin + window.location.pathname);
  try{
    const auth = await stravaTokenRequest({action:'exchange', code});
    state.stravaAuth = auth;
    Store.setStravaAuth(auth);
    showToast('Connected to Strava');
  }catch(e){
    showToast('Could not connect to Strava — try again');
  }
}

// Returns a usable access token, silently refreshing first if the stored one has
// expired (or is about to) - the only network round trip the user should ever notice
// is the one this piggybacks on (opening the import list).
async function ensureStravaToken(){
  const auth = state.stravaAuth;
  if(!auth) return null;
  const nowSec = Math.floor(Date.now()/1000);
  if(auth.expires_at && auth.expires_at > nowSec+60) return auth.access_token;
  try{
    const fresh = await stravaTokenRequest({action:'refresh', refresh_token:auth.refresh_token});
    state.stravaAuth = fresh;
    Store.setStravaAuth(fresh);
    return fresh.access_token;
  }catch(e){
    return null;
  }
}

// Recent running activities from Strava, mapped into this app's own log shape and
// filtered to runs not already imported (by stravaId) so a picked run can't be
// double-logged just by showing up in the list twice.
async function fetchStravaRuns(){
  const token = await ensureStravaToken();
  if(!token) throw new Error('not-connected');
  const res = await fetch('https://www.strava.com/api/v3/athlete/activities?per_page=15', {
    headers:{ Authorization:`Bearer ${token}` },
  });
  if(!res.ok) throw new Error('strava-request-failed');
  const activities = await res.json();
  const importedIds = new Set(state.logs.map(l=>l.stravaId).filter(Boolean));
  return activities
    .filter(a => (a.type==='Run' || a.sport_type==='Run') && !importedIds.has(a.id))
    .map(a => ({
      id: a.id,
      name: a.name,
      date: a.start_date_local.slice(0,10), // local wall-clock date, no timezone math needed
      distanceKm: a.distance/1000,
      durationSec: a.moving_time,
    }));
}

  const setup = {

    recentDistanceKm: recentPreset? recentPreset.km : null,
    recentTimeSec: recentSec,
    goalTimeSec: goalSec,
    longDow: d.longDow, ...deriveScheduleFromLongDow(d.longDow, d.strengthPerWeek),
    runsPerWeek: clamp(7 - d.restDays, 3, 6), strengthPerWeek: d.strengthPerWeek,
    maxLongRunKm: (d.raceDistanceKm>=LONG_DISTANCE_CAP_THRESHOLD_KM && d.maxLongRunMi) ? unitToKm(Number(d.maxLongRunMi), d.units) : null,
    maxWeeklyKm: (d.raceDistanceKm>=LONG_DISTANCE_CAP_THRESHOLD_KM && d.maxWeeklyMi) ? unitToKm(Number(d.maxWeeklyMi), d.units) : null,
    longRunEmphasis: d.longRunEmphasis, speedEmphasis: d.speedEmphasis,
  };
  const plan = generatePlan(setup);
  state.name = d.name.trim();
  Store.setName(state.name);
  Store.setSetup(setup);
  Store.setPlan(plan);
  state.setup = setup; state.plan = plan;
  const today = todayDate();
  let idx = plan.weeks.findIndex(w=>{ const ws=parseDate(w.weekStart); return today>=ws && today<addDays(ws,7); });
  state.currentWeekIndex = idx===-1?0:idx;
  state.view='app'; state.tab='plan';
  render();
  window.scrollTo(0,0);
}

// The week strip is its own horizontal scroller, freshly re-rendered (and reset to
// scrollLeft 0) on every render — so without this, jumping to a week beyond what fits on
// screen (goto-week, reopening the app mid-plan, switching tabs and back) leaves the
// active week's tab scrolled off to the right with no indication anything is selected.
// Only nudges the scroll when the active tab genuinely isn't visible, and only ever
// touches the strip's own horizontal scroll — never the page's vertical position.
function keepActiveWeekTabVisible(){
  const strip = document.querySelector('.week-strip');
  const activeBtn = strip && strip.querySelector('.week-tab.active');
  if(!strip || !activeBtn) return;
  const stripRect = strip.getBoundingClientRect();
  const activeRect = activeBtn.getBoundingClientRect();
  if(activeRect.left>=stripRect.left && activeRect.right<=stripRect.right) return;
  const targetScrollLeft = strip.scrollLeft + (activeRect.left-stripRect.left) - (stripRect.width-activeRect.width)/2;
  strip.scrollLeft = Math.max(0, targetScrollLeft);
}

// Auto-inserts colons as the user types digits, so "2230" becomes "22:30" and
// "34500" becomes "3:45:00" without anyone having to type ':' themselves.
function formatDurationDigits(raw){
  const digits = String(raw).replace(/\D/g,'').slice(0,6);
  if(digits.length<=2) return digits;
  if(digits.length<=4){
    const mmLen = digits.length-2;
    return digits.slice(0,mmLen)+':'+digits.slice(mmLen);
  }
  const hhLen = digits.length-4;
  return digits.slice(0,hhLen)+':'+digits.slice(hhLen,hhLen+2)+':'+digits.slice(hhLen+2);
}

// Picks from among the closest few matches (not always the single nearest) so entering a
// similar pace twice doesn't always name the same thing.
function animalPaceComparison(mph){
  if(!mph || mph<=0) return '';
  const closest = ANIMAL_PACES_MPH.map(a=>({...a, diff:Math.abs(a.mph-mph)})).sort((a,b)=>a.diff-b.diff);
  const pool = closest.slice(0, Math.min(3, closest.length));
  const pick = pool[Math.floor(Math.random()*pool.length)];
  return `about the running pace of ${pick.name}. ${pick.quip}`;
}
function recentPaceHint(d){
  const preset = RACE_PRESETS.find(r=>r.key===d.recentDistanceKey);
  const sec = parseDurationToSec(d.recentTime);
  if(!preset || !sec) return 'Enter a finish time to see your pace per mile.';
  const secPerKm = sec/preset.km;
  const mph = 3600/(secPerKm*KM_PER_MI);
  return `That's about ${paceStr(secPerKm,'mi')} pace — ${animalPaceComparison(mph)}`;
}

function renderPlanTab(week, plan){
  const unit = state.setup.units;

  const loggedThisWeek = logsInWeek(week);

  const dayCards = week.days.map((day,di)=>{
