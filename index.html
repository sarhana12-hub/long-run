function renderLibraryModal(q){
  const names = Object.keys(EXERCISE_LIBRARY).filter(n=>!q || n.toLowerCase().includes(q.toLowerCase()));
  const rows = names.map(n=>`<details class="lib-row"><summary><span>${esc(n)}<span class="sum">${esc(EXERCISE_LIBRARY[n].summary)}</span></span><span class="chev" style="color:var(--muted);">${ICONS.chevron}</span></summary>${exerciseLibraryHtml(n)}</details>`).join('');
  return modalShell('Exercise library', `
    <input class="input" type="search" id="lib-q" placeholder="Search exercises" value="${esc(q)}" style="margin-bottom:10px;">
    <div class="hint" style="margin-bottom:10px;">${names.length} exercise${names.length===1?'':'s'}. Tap one to open it.</div>
    <div class="card" style="padding:0 14px;">${rows || '<div class="empty">Nothing matches.</div>'}</div>
  `);
}
function renderHelpModal(tab){
  const help = TAB_HELP[tab] || TAB_HELP.plan;
  return modalShell(help.title, `<div class="modal-body-text">${help.body}</div>`);
}

// Badge-tier celebrations (frequent, small) pass no `hero` and get the 84px badge-ring
// with a category glyph (see badgeGlyph) instead of always the plain mountain icon, so a
// streak feels visually distinct from a PR or a strength badge even in the popup, not
// just in the gallery; summit-tier celebrations (rare, plan-defining) pass a hero
// illustration shown larger in its place. Same sheet either way.
function modalMilestone(data){
  const { hero, icon, title, message, extraCount } = data;
  const artHtml = hero
    ? `<div class="milestone-hero">${hero}</div>`
    : `<div class="badge-ring">${icon || ICONS.summitBadge}</div>`;
  // A single action (logging a run, marking strength done) can satisfy more than one
  // achievement at once, but only the first gets this popup - the rest are still recorded
  // in state.achievementLog and visible in the gallery, just easy to miss otherwise. This
  // link is the only signal that there's more to see, so it has to be here, not just left
  // for someone to stumble onto later.
  const extraHtml = extraCount>0
    ? `<div class="hint" style="margin-top:2px;">+${extraCount} more milestone${extraCount===1?'':'s'} earned just now — <a class="link-btn" data-act="open-achievements" style="cursor:pointer;">see them all</a></div>`
    : '';
  return `<div class="overlay" data-act="close-modal-overlay">
    <div class="sheet milestone" data-stop="1">
      <div class="sheet-handle"></div>
      <button class="sheet-close" data-act="close-modal">${ICONS.close}</button>
      ${artHtml}
      <div class="sheet-title milestone">${esc(title)}</div>
      <div class="sheet-body">${esc(message)}</div>
      ${extraHtml}
      <button class="btn btn-primary btn-block" data-act="close-modal">Nice!</button>
    </div>
  </div>`;
}

// The persistent gallery of every achievement - earned ones show their date, locked ones
// show how to earn them, so nothing that pops up once is ever gone for good afterward.
function renderAchievementsScreen(){
  const summit = ACHIEVEMENTS.filter(a=>a.tier==='summit');
  const badges = ACHIEVEMENTS.filter(a=>a.tier==='badge');
  const earnedCount = ACHIEVEMENTS.filter(a=>isAchievementEarned(a.key)).length;
  const rowFor = (a, i, arr, big) => {
    const earned = isAchievementEarned(a.key);
    const date = earned ? achievementEarnedDate(a.key) : null;
    const icon = big ? (ICONS[a.hero] || ICONS.summitBadge) : badgeGlyph(a.key);
    const size = big ? 50 : 38, iconSize = big ? 26 : 20;
    return `<div style="display:flex; align-items:center; gap:12px; padding:12px 0; ${i<arr.length-1?'border-bottom:1px solid var(--line-soft);':''} opacity:${earned?1:0.5};">
      <div style="width:${size}px; height:${size}px; border-radius:50%; background:${earned?'var(--accent)':'var(--surface-2)'}; color:${earned?'var(--accent-ink)':'var(--muted)'}; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <div style="width:${iconSize}px; height:${iconSize}px;">${icon}</div>
      </div>
      <div style="flex:1; min-width:0;">
        <div style="font-weight:700; font-size:14px;">${esc(a.title)}</div>
        <div style="font-size:12.5px; color:var(--muted);">${earned ? `Earned${date?' '+niceDate(parseDate(date)):''}` : esc(a.locked)}</div>
        ${earned ? '' : achievementProgressHtml(a.key)}
      </div>
    </div>`;
  };
  return modalShell('Milestones &amp; badges', `
    <div class="hint" style="margin:-8px 0 16px;">${earnedCount} of ${ACHIEVEMENTS.length} earned so far.</div>
    <div class="section-title" style="margin-top:0;">Summit milestones</div>
    <div class="card" style="padding:0 16px;">${summit.map((a,i)=>rowFor(a,i,summit,true)).join('')}</div>
    <div class="section-title">Badges</div>
    <div class="card" style="padding:0 16px;">${badges.map((a,i)=>rowFor(a,i,badges,false)).join('')}</div>
    <div style="height:12px"></div>
  `);
}

// A big number with a small caption under it — the building block for the stat detail
// graphics below (numbers first, not sentences).
function statNumberHtml(value, label, opts){
  opts = opts || {};
  const size = opts.size || 26;
  const color = opts.color || 'var(--ink)';
  return `<div style="text-align:center;">
    <div class="mono" style="font-size:${size}px; font-weight:800; color:${color}; line-height:1.1;">${value}</div>
    <div class="hint" style="margin-top:3px;">${label}</div>
  </div>`;
}
// Two input numbers side by side with "vs" between them.
function statCompareRowHtml(leftVal, leftLabel, rightVal, rightLabel, connector){
  return `<div style="display:flex; align-items:center; justify-content:center; gap:16px;">
    ${statNumberHtml(leftVal, leftLabel)}
    <div style="font-size:13px; color:var(--muted); font-weight:700;">${connector||'vs'}</div>
    ${statNumberHtml(rightVal, rightLabel)}
  </div>`;
}
// The derived result, set off below the comparison with a divider so it visually reads
// as "= this" rather than a third unrelated number.
function statResultHtml(value, label, color){
  return `<div style="text-align:center; margin-top:18px; padding-top:16px; border-top:1px solid var(--line-soft);">
    ${statNumberHtml(value, label, {size:32, color})}
  </div>`;
}

// The "show your work" behind each Progress stat tile — the exact numbers that produced
// the tile, as a graphic (big numbers + small captions) rather than a sentence.
function renderStatDetailModal(statKey){
  const s = computeProgressStats();
  const unit = s.unit;
  let title, content, footnote = '';
  if(statKey==='total-logged'){
    title = 'Total logged';
    content = statCompareRowHtml(
      fmtDist(s.totalLoggedKm,unit,1), 'miles logged',
      s.totalLoggedCount, `run${s.totalLoggedCount===1?'':'s'} logged`, 'in'
    );
    footnote = 'Every logged run counts here — any workout type, any date.';
  } else if(statKey==='training-miles'){
    title = 'Training miles logged';
    content = statCompareRowHtml(
      fmtDist(s.planScopedLoggedKm,unit,1), 'logged',
      fmtDist(s.totalPlanTrainingKm,unit,0), 'total plan training'
    ) + statResultHtml(`${s.pctPlanMilesLogged}%`, 'of training miles logged', 'var(--accent-strong)');
    footnote = "Race day itself isn't counted — that's the event, not training.";
  } else if(statKey==='adherence'){
    title = 'Plan adherence';
    content = statCompareRowHtml(
      s.completedPlannedRuns, 'days with a run completed',
      s.plannedRunDatesToDateCount, 'days with a run scheduled'
    ) + statResultHtml(`${s.adherence}%`, 'plan adherence', 'var(--accent-strong)');
    footnote = "Counts through yesterday until you log something today — once you do, today counts too, both what was scheduled and what you ran.";
  } else if(statKey==='mileage-delta'){
    title = s.mileageStatusLabel==='behind plan' ? 'Behind plan' : s.mileageStatusLabel==='ahead of plan' ? 'Ahead of plan' : 'On plan';
    const resultColor = s.mileageStatusLabel==='behind plan' ? 'var(--z-tempo)' : (s.mileageStatusLabel==='ahead of plan' ? 'var(--accent-strong)' : 'var(--muted)');
    content = statCompareRowHtml(
      fmtDist(s.plannedToDateKm,unit,1), 'planned to date',
      fmtDist(s.loggedKmToDate,unit,1), 'logged to date'
    ) + statResultHtml(fmtDist(Math.abs(s.mileageDeltaKm),unit,1), s.mileageStatusLabel, resultColor);
    footnote = "Compares through yesterday until you log a run today — the moment you do, today's own planned distance and logged distance both count too, so it's always an apples-to-apples comparison.";
  } else if(statKey==='race-projection' || (statKey && statKey.startsWith('general-projection-'))){
    const p = statKey==='race-projection' ? s.raceProjection : s.generalProjections.find(x=>statKey===`general-projection-${x.key}`);
    title = statKey==='race-projection' ? 'Projected race performance' : `Projected ${p.label} performance`;
    content = `<div class="card" style="padding:4px 14px; margin-bottom:14px;">${projectionRowsHtml(p, unit, state.paceFormat)}</div>`
      + statResultHtml(projectionDeltaText(p.start.sec, p.current.sec), 'change since you started', 'var(--accent-strong)')
      + (p.goalCheck ? `<div class="hint" style="text-align:center; margin-top:10px; color:var(--ink);">${esc(goalCheckText(p.goalCheck, p.goal))}</div>` : '')
      + `<div class="hint" style="margin-top:14px;">${esc(projectionEvidenceText(p.fitness))}</div>`;
    footnote = `How it moves: a logged race resets the number (Daniels). Logged tempo, cruise and interval sessions nudge it — intervals and cruise reps count once you enter the average rep time — and a single session can only move it a fraction. Two weeks of running under half the plan starts a slow decline (Mujika & Padilla). "If you complete the plan" adds the fitness the remaining quality weeks are expected to bring, about one point per six weeks (Daniels). Times come from the same model as setup: Vickers & Vertosick for the half and marathon, Riegel for shorter races. The range is the reliable part.`;
  }
  return modalShell(title, `${content}${footnote?`<div class="hint" style="text-align:center; margin-top:16px;">${footnote}</div>`:''}`);
}

// how far into the race they fall rather than a fixed mile number, so a 5K and a marathon

// nothing here is invented. `mile` is always in real miles regardless of the runner's
// display unit - converted at render time. `hilly:true` on a landmark means THAT specific
// stretch, not the whole course - most of these majors are flat except for one or two real

const RACE_COURSES_BY_KEY = Object.fromEntries(RACE_COURSES.map(c=>[c.key,c]));
// Splits + cumulative clock time for the whole race, in the runner's own display unit.
// strategy 'even' holds goal pace flat throughout - a reasonable baseline ONLY on a
// genuinely flat/rolling course. 'negative' eases from ~3% slower than goal pace at the
// start to ~3% faster at the finish (averaging to exactly the goal pace either way) - a
// well-established pattern most coaches actually recommend as the smarter default even on
// a flat course, since most runners' real attempt at "even" quietly drifts positive
// (fades) as fatigue sets in, not because flat pacing is wrong in principle. 'hilly' is NOT
// a third pace curve - it uses the same flat average as 'even' for the cumulative time
// budget (the only honest estimate available without this specific course's real mile-by-
// mile elevation, which this app doesn't have), but the render function below flags every
// split's own pace number as nominal rather than a real target, because holding one fixed
// pace on a hilly course is close to bad advice - the real target is even EFFORT, slower
// uphill and faster downhill at consistent exertion, the same "run by effort, not pace"
// principle this app already applies to hilly long runs elsewhere in the plan.
function computePacingSheet(plan, setup, unit, strategy, courseKey){
  const goalPaceSecPerKm = getWeekPaces(plan, findWeekForToday(plan), state.logs).racePerKm;
  if(goalPaceSecPerKm==null) return null;
  const raceDistUnit = kmToUnit(plan.raceDistanceKm, unit);
  const numFull = Math.floor(raceDistUnit + 1e-9);
  const remainder = raceDistUnit - numFull;
  const dists = [];
  for(let i=0;i<numFull;i++) dists.push((i===numFull-1 && remainder<=0.05) ? 1+remainder : 1);
  if(remainder>0.05) dists.push(remainder);
  const total = dists.length;
  let cumDist = 0, cumSec = 0;
  const splits = dists.map((d,i)=>{
    // Everything pace/time stays in per-km terms throughout (same convention as every other
    // pace value in this app), so paceOrSpeedStr can render it directly with no separate
    // unit-conversion math duplicated here - only the split's own distance is unit-native,
    // since "mile splits" are inherently a display-unit concept.
    const splitPaceSecPerKm = goalPaceSecPerKm * (strategy==='negative' && total>1 ? (1.03 - 0.06*(i/(total-1))) : 1);
    const splitSec = splitPaceSecPerKm * unitToKm(d, unit);
    cumDist += d; cumSec += splitSec;
    return {i, distThis:d, cumDist, splitPaceSecPerKm, cumSec};
  });
  const claimed = new Set();
  const checkpoints = {};
  const course = courseKey ? RACE_COURSES_BY_KEY[courseKey] : null;
  if(course){
    // A real, sourced course beats a generic percentage-based checkpoint - use its actual
    // named landmarks instead, snapped to the nearest split. `mile` on a landmark is always
    // real miles regardless of display unit, so it's converted here, once.
    course.landmarks.forEach(l=>{
      const landmarkDistUnit = unit==='mi' ? l.mile : l.mile*KM_PER_MI;
      let best=-1, bestDiff=Infinity;
      splits.forEach(s=>{
        if(claimed.has(s.i)) return;
        const diff = Math.abs(s.cumDist-landmarkDistUnit);
        if(diff<bestDiff){ bestDiff=diff; best=s.i; }
      });
      if(best!==-1){ claimed.add(best); checkpoints[best] = {tag:'landmark', label:l.label, cue:l.note, hilly:!!l.hilly}; }
    });
  } else {
    // Snap each generic checkpoint fraction to the nearest split, skipping one that would
    // land on a split already claimed by an earlier checkpoint - short races (a 5K,
    // especially in km) can otherwise put "early" and "half" on the very same split.
    PACING_CHECKPOINTS.forEach(cp=>{
      let best=-1, bestDiff=Infinity;
      splits.forEach(s=>{
        if(claimed.has(s.i)) return;
        const diff = Math.abs(s.cumDist/raceDistUnit - cp.frac);
        if(diff<bestDiff){ bestDiff=diff; best=s.i; }
      });
      if(best!==-1){ claimed.add(best); checkpoints[best]=cp; }
    });
  }
  return {goalPaceSecPerKm, raceDistUnit, splits, checkpoints, hasExplicitGoal: setup.goalTimeSec!=null, isHilly: setup.hillsMode==='hilly', course};
}

function renderPacingSheet(strategy, courseKey){
  const plan = state.plan, setup = state.setup, unit = setup.units, fmt = state.paceFormat;
  const sheet = computePacingSheet(plan, setup, unit, strategy, courseKey);
  if(!sheet){
    return modalShell('Race-day pacing sheet', `<div class="hint">Set a goal time in Settings, or log a recent race, so there's a pace to build splits from.</div>`);
  }
  const isHillyStrategy = strategy==='hilly';
  const rows = sheet.splits.map(s=>{
    const cp = sheet.checkpoints[s.i];
    const splitIsHilly = isHillyStrategy || (cp && cp.hilly);
    const isLast = s.i===sheet.splits.length-1;
    const distLabel = isLast && Math.abs(s.cumDist-Math.round(s.cumDist))>0.02 ? s.cumDist.toFixed(1) : Math.round(s.cumDist);
    const paceLine = splitIsHilly
      ? `${paceOrSpeedStr(s.splitPaceSecPerKm,unit,fmt)} avg pace — go by effort, not this number`
      : `${paceOrSpeedStr(s.splitPaceSecPerKm,unit,fmt)} this ${unit==='mi'?'mile':'km'}`;
    const cueHtml = cp ? `<div class="split-cue">${cp.label?`<div style="font-weight:800; color:var(--ink); margin-bottom:2px;">${esc(cp.label)}</div>`:''}${esc(cp.cue)}</div>` : '';
    return `<div class="split-row ${cp?'checkpoint':''}">
      <div class="split-i">${unit==='mi'?'MI':'KM'}<br>${distLabel}</div>
      <div style="flex:1;">
        <div class="split-p">${paceLine}</div>
      </div>
      <div class="split-t mono">${secToClock(s.cumSec)}</div>
    </div>${cueHtml}`;
  }).join('');
  const finishSec = sheet.splits[sheet.splits.length-1].cumSec;
  const strategyNote = isHillyStrategy
    ? "Uses your average goal pace as a time budget, but a fixed per-mile pace isn't real advice on a hilly course — target effort instead: slower on the climbs, faster on the descents, same exertion throughout. Use the cumulative time on the right to check yourself against the clock, not the pace on the left."
    : strategy==='negative'
      ? "Starts about 3% slower than goal pace and eases to about 3% faster by the finish — same average time, run smarter instead of just holding on."
      : "Holds your goal pace the entire way. A reasonable baseline, but most coaches recommend Negative split as the smarter default — most people's real attempt at even pace quietly fades anyway.";
  const courseBannerText = sheet.course ? sheet.course.elevationNote : (sheet.isHilly ? "Hilly course — a single fixed pace was never going to be great advice here. \"Run by effort\" below is the recommended choice; Even/Negative pace are still there as a flat-course reference if you want one." : null);
  const coursePicker = setup.raceKey==='marathon' ? `
      <div class="field" style="margin-bottom:14px;">
        <label class="field-label">Running one of these?</label>
        <select class="input" id="ps-course">
          <option value="">Not listed / skip</option>
          ${RACE_COURSES.map(c=>`<option value="${c.key}" ${courseKey===c.key?'selected':''}>${esc(c.name)}</option>`).join('')}
        </select>
        <div class="hint" style="margin-top:4px;">Swaps the generic checkpoints below for that course's real landmarks and elevation, sourced from published course guides.</div>
      </div>` : '';
  return modalShell('Race-day pacing sheet', `
    <div class="pacing-print">
      <div class="hint" style="margin:-8px 0 4px;">${esc(planLabel(setup))} · ${sheet.hasExplicitGoal?'your stated goal':"your current projected pace — set a goal time in Settings to target a specific one"}</div>
      <div style="text-align:center; margin:10px 0 18px;">
        <div class="mono" style="font-size:34px; font-weight:800;">${secToClock(finishSec)}</div>
        <div class="hint" style="margin-top:2px;">${paceOrSpeedStr(sheet.goalPaceSecPerKm,unit,fmt)} average</div>
      </div>
      ${coursePicker}
      ${courseBannerText ? `<div class="banner">${ICONS.bolt}<span>${esc(courseBannerText)}</span></div>` : ''}
      <div class="chip-select" style="margin-bottom:10px; flex-wrap:wrap;">
        ${sheet.isHilly ? `<button class="chip ${strategy==='hilly'?'active':''}" data-act="set-pacing-strategy" data-strategy="hilly">Run by effort</button>` : ''}
        <button class="chip ${strategy==='even'?'active':''}" data-act="set-pacing-strategy" data-strategy="even">Even pace</button>
        <button class="chip ${strategy==='negative'?'active':''}" data-act="set-pacing-strategy" data-strategy="negative">Negative split${!sheet.isHilly?' ★':''}</button>
      </div>
      <div class="hint" style="margin-bottom:14px;">${strategyNote}</div>
      <div class="card" style="padding:0 16px; margin-bottom:14px;">${rows}</div>
      <button class="btn btn-block" data-act="print-pacing-sheet">Print / save as PDF</button>
    </div>
  `);
}

function modalShell(title, innerHtml, headerButtonHtml){
  return `<div class="overlay" data-act="close-modal-overlay">
    <div class="sheet" data-stop="1">
      <div class="sheet-handle"></div>
      ${headerButtonHtml || ''}
      <button class="sheet-close" data-act="close-modal" aria-label="Close">${ICONS.close}</button>
      <h3 class="sheet-title">${title}</h3>
      ${innerHtml}
    </div>
  </div>`;
}

// The plan day (and its own week, for pace lookup) matching a given date, if any.
function plannedWorkoutForDate(dateStr){
  if(!state.plan || !dateStr) return null;
  for(const week of state.plan.weeks){
    const day = week.days.find(x=>x.date===dateStr);
    if(day) return {day, week};
  }
  return null;
}
// Same lookup, but returning the indices the day-detail modal needs to address the day.
function planDayIndexForDate(dateStr){
  if(!state.plan || !dateStr) return null;
  for(let wi=0; wi<state.plan.weeks.length; wi++){
    const di = state.plan.weeks[wi].days.findIndex(x=>x.date===dateStr);
    if(di!==-1) return {weekIndex:wi, dayIndex:di};
  }
  return null;
}
function plannedWorkoutHtml(dateStr){
  const found = plannedWorkoutForDate(dateStr);
  if(!found){
    return `<div class="field"><label class="field-label">Planned for this day</label><div class="input" style="color:var(--ink-soft);">No planned workout for this date.</div></div>`;
  }
  const {day, week} = found;
  const meta = TYPE_META[day.type];
  const unit = state.setup.units, fmt = state.paceFormat;
  const weekPaces = getWeekPaces(state.plan, week, state.logs);
  const desc = dayDisplayText(day, weekPaces, unit, fmt);
  return `<div class="field">
    <label class="field-label">Planned for this day</label>
    <div class="input" style="height:auto; display:flex; flex-direction:column; gap:6px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="pill" style="background:var(${meta.bg}); color:var(${meta.fg})">${day.label}</span>
        ${day.km>0?`<span class="mono" style="font-size:12.5px; color:var(--ink-soft);">${fmtDist(day.km,unit)}</span>`:''}
      </div>
      ${desc?`<div style="color:var(--ink-soft); font-size:13px;">${esc(desc)}</div>`:''}
    </div>
  </div>`;
}
function logPaceHint(d, unit){
  const distV = Number(d.dist);
  const durSec = parseDurationToSec(d.time);
  if(!distV || !durSec) return 'Enter distance and time to see your pace per mile.';
  const paceSecPerKm = durSec/unitToKm(distV, unit);
  return `That's about ${paceStr(paceSecPerKm,'mi')} pace.`;
}

function modalLogRun(){
  const m = state.modal;
  if(!m.data) m.data = {date:fmtDate(todayDate()), dist:'', time:'', notes:''};
  if(!m.mode) m.mode = state.stravaAuth ? 'strava' : 'manual';

  // Kicks off exactly once per modal open — switching modes back and forth afterward
  // reuses the same fetched list rather than re-requesting it.
  if(m.mode==='strava' && !m.strava){
    m.strava = {loading:true, error:null, items:null};
    fetchStravaRuns().then(items=>{
      if(state.modal && state.modal.type==='log-run' && state.modal.strava){
        state.modal.strava = {loading:false, error:null, items};
        render();
      }
    }).catch(()=>{
      if(state.modal && state.modal.type==='log-run' && state.modal.strava){
        state.modal.strava = {loading:false, error:"Couldn't load your Strava runs.", items:null};
        render();
      }
    });
  }

  const switcher = state.stravaAuth ? `
    <div class="chip-select" style="margin-bottom:16px;">
      <button class="chip ${m.mode==='strava'?'active':''}" data-act="log-mode-strava">From Strava</button>
      <button class="chip ${m.mode==='manual'?'active':''}" data-act="log-mode-manual">Manual entry</button>
    </div>` : '';

  const body = m.mode==='strava' ? modalLogFromStravaHtml(m.strava) : modalLogManualHtml(m.data);
  return modalShell('Log a run', switcher + body);
}

// Interval-type planned days ask for the average rep time; that is the only honest way to
// read fitness off a session whose whole-run time blends reps with recovery jogs.
function repFieldHtml(dateStr, repValue, idPrefix){
  const found = plannedWorkoutForDate(dateStr);
  const day = found && found.day;
  if(!day || !['intervals','cruise','reps'].includes(day.type)) return '';
  const repM = repMetersForDay(day);
  if(!repM) return '';
  return `<div class="field"><label class="field-label">Average time per ${repM} m rep (m:ss)</label><input class="input" type="text" inputmode="numeric" id="${idPrefix}-rep" value="${esc(repValue||'')}" placeholder="e.g. 3:45"><div class="hint">Your reps feed the fitness projection; the whole-run time alone can't, because it includes the recovery jogs.</div></div>`;
}
function modalLogManualHtml(d){
  const unit = state.setup.units;
  return `
    <div class="field"><label class="field-label">Date</label><input class="input" type="date" id="lr-date" value="${d.date}"></div>
    <div class="chip-select" style="margin-bottom:14px;">
      <button class="chip ${d.kind!=='race'?'active':''}" data-act="log-kind" data-kind="run">Training run</button>

    </div>
    ${d.kind==='race' ? `<div class="hint" style="margin:-6px 0 14px;">A race result resets your fitness number and every training pace from here on.</div>` : ''}

    ${d.kind==='race' ? '' : repFieldHtml(d.date, d.rep, 'lr')}

      <div class="field"><label class="field-label">Time (h:mm:ss)</label><input class="input" type="text" inputmode="numeric" id="lr-time" value="${d.time}" placeholder="e.g. 45:30"></div>

    <button class="btn btn-primary btn-block" data-act="save-log" style="padding:13px;">Save run</button>
  `;
}

function modalLogFromStravaHtml(strava){
  const unit = state.setup.units;
  if(!strava || strava.loading){
    return `<div class="hint" style="padding:24px 0; text-align:center;">Loading your recent Strava runs…</div>`;
  }
  if(strava.error){
    return `<div class="hint" style="padding:6px 0 16px;">${esc(strava.error)}</div>
      <button class="btn btn-block" data-act="log-mode-manual">Enter manually instead</button>`;
  }
  if(!strava.items.length){
    return `<div class="hint" style="padding:6px 0 16px;">No new runs found on Strava — anything recent may already be imported.</div>
      <button class="btn btn-block" data-act="log-mode-manual">Enter manually instead</button>`;
  }
  // Picking a row doesn't import immediately anymore - it opens this one-field confirm
  // step first, defaulted to the date Strava itself reports for the activity (real data,
  // not a guess) but editable, since Strava's date can be wrong for the runner's own
  // purposes (a treadmill run logged the next morning, watch clock drift, etc.) and there
  // was previously no way to see or correct it before it got saved.
  if(strava.confirm){
    const a = strava.confirm.item;
    const paceSecPerKm = a.distanceKm>0 ? a.durationSec/a.distanceKm : null;
    return `
      <div class="log-row" style="margin-bottom:14px;">
        <div class="log-date">${niceDate(parseDate(a.date))}</div>
        <div class="log-mid"><div class="d">${fmtDist(a.distanceKm,unit)} · ${secToClock(a.durationSec)}</div>${a.name?`<div class="t">${esc(a.name)}</div>`:''}</div>
        <div class="log-pace mono">${paceSecPerKm!=null?paceOrSpeedStr(paceSecPerKm,unit,state.paceFormat):''}</div>
      </div>
      <div class="field"><label class="field-label">Log this run as</label><input class="input" type="date" id="lr-strava-date" value="${strava.confirm.date}"></div>
      <div class="hint" style="margin-bottom:14px;">${strava.confirm.date===a.date ? "This is the date Strava recorded for this run." : "Changed from the date Strava recorded for this run."}</div>
      <div class="chip-select" style="margin-bottom:14px;">
        <button class="chip ${strava.confirm.kind!=='race'?'active':''}" data-act="strava-kind" data-kind="run">Training run</button>
        <button class="chip ${strava.confirm.kind==='race'?'active':''}" data-act="strava-kind" data-kind="race">This was a race</button>
      </div>
      ${strava.confirm.kind==='race' ? '' : repFieldHtml(strava.confirm.date, strava.confirm.rep, 'lr-strava').replace('Your reps feed', (strava.confirm.rep && strava.confirm.lapsTried ? 'Read from your Strava laps — change it if that looks wrong. ' : '') + 'Your reps feed')}
      <button class="btn btn-primary btn-block" data-act="confirm-import-strava" style="margin-bottom:8px; padding:13px;">Log run</button>
      <button class="btn btn-block" data-act="cancel-import-strava">Back to list</button>
    `;
  }
  const rows = strava.items.map(a=>{
    const paceSecPerKm = a.distanceKm>0 ? a.durationSec/a.distanceKm : null;
    return `<div class="log-row" data-act="pick-strava-activity" data-id="${a.id}">
      <div class="log-date">${niceDate(parseDate(a.date))}</div>
      <div class="log-mid"><div class="d">${fmtDist(a.distanceKm,unit)} · ${secToClock(a.durationSec)}</div>${a.name?`<div class="t">${esc(a.name)}</div>`:''}</div>
      <div class="log-pace mono">${paceSecPerKm!=null?paceOrSpeedStr(paceSecPerKm,unit,state.paceFormat):''}</div>
    </div>`;
  }).join('');
  return `<div style="border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; margin-bottom:14px;">${rows}</div>
    <button class="btn btn-block" data-act="log-mode-manual">Enter manually instead</button>`;
}

// Shared "how does actual pace compare to planned" phrasing — used both for a single
// logged run and for the aggregated pace tracker in Progress.
function paceDeltaLine(actualPaceSecPerKm, plannedPaceSecPerKm, unit, fmt){
  if(plannedPaceSecPerKm==null || actualPaceSecPerKm==null) return '';
  const deltaSecPerKm = actualPaceSecPerKm-plannedPaceSecPerKm;
  const deltaDisplayPerUnit = unit==='mi' ? deltaSecPerKm*KM_PER_MI : deltaSecPerKm;
  if(Math.abs(deltaDisplayPerUnit)<3) return 'right on target pace';
  if(fmt==='speed'){
    const actualSpeed = 3600/(unit==='mi'?actualPaceSecPerKm*KM_PER_MI:actualPaceSecPerKm);
    const plannedSpeed = 3600/(unit==='mi'?plannedPaceSecPerKm*KM_PER_MI:plannedPaceSecPerKm);
    return `${Math.abs(actualSpeed-plannedSpeed).toFixed(1)} ${unit==='mi'?'mph':'km/h'} ${actualSpeed<plannedSpeed?'slower':'faster'} than planned`;
  }
  return `${secToClock(Math.abs(deltaDisplayPerUnit))}/${unit} ${deltaDisplayPerUnit>0?'slower':'faster'} than planned`;
}

function renderLoggedComparisonHtml(day, log, plan, week, logs, unit, fmt){
  const plannedKm = day.km;
  const plannedPaceSecPerKm = day.paceKey ? (day.paceOverrideSecPerKm!=null ? day.paceOverrideSecPerKm : getWeekPaces(plan, week, logs)[day.paceKey]) : null;
  // The pace shown next to duration is always the plain logged average (matches the
  // distance/time the runner actually entered) - but for a day with a warm-up baked in,
  // comparing THAT blended average directly against the pure quality-pace target would
  // make the runner look slower than they were during the quality portion itself. The
  // comparison line uses the warm-up-backed-out estimate instead, and says so explicitly
  // so the two numbers on screen don't look like they're contradicting each other.
  const actualPaceSecPerKm = log.distanceKm>0 ? log.durationSec/log.distanceKm : null;
  const totalEasyKm = (day.warmupKm||0) + (day.cooldownKm||0);
  const warmupAdjusted = totalEasyKm>0.15 && log.distanceKm>totalEasyKm;
  const comparisonPaceSecPerKm = warmupAdjusted ? qualityEffortPaceSecPerKm(day, log.distanceKm, log.durationSec, plan) : actualPaceSecPerKm;

  const distLine = plannedKm>0
    ? `${fmtDist(log.distanceKm,unit)} logged vs ${fmtDist(plannedKm,unit)} planned`
    : `${fmtDist(log.distanceKm,unit)} logged — nothing was planned this day`;

  const paceCompareLine = paceDeltaLine(comparisonPaceSecPerKm, plannedPaceSecPerKm, unit, fmt);

  const NONELIGIBLE_NOUNS = {easy:'easy runs', long:'long runs', rest:'rest days', hills:'hill repeats', fartlek:'fartlek runs', progression:'progression runs', racepace:'race-pace runs', race:'race-day runs'};
  const repBased = ['intervals','cruise','reps'].includes(day.type);
  const eligible = log.kind==='race' || day.type==='tempo' || day.type==='overunder' || (repBased && log.repSec>0);
  let impactLine;
  if(log.kind==='race'){
    impactLine = `A race result: it resets your fitness number and the training paces from here on.`;
  } else if(!eligible){
    const noun = NONELIGIBLE_NOUNS[day.type];
    impactLine = repBased ? `Not used for the projection: enter the average rep time to count this session.` : (noun ? `No impact on the projection — ${noun} aren't used for it.` : `No impact on the projection — this run type isn't used for it.`);
  } else {
    const withPaces = getWeekPaces(plan, week, logs);
    const withoutPaces = getWeekPaces(plan, week, logs.filter(l=>l.id!==log.id));
    const deltaSecPerKm = withPaces.tempoPerKm - withoutPaces.tempoPerKm;
    const deltaPerUnit = unit==='mi' ? deltaSecPerKm*KM_PER_MI : deltaSecPerKm;
    const repNote = log.repSec>0 && log.repMeters>0 ? ` Reps averaged ${secToClock(log.repSec)} per ${log.repMeters} m.` : '';
    if(Math.abs(deltaPerUnit)<1){
      impactLine = `Counted toward your fitness projection; no meaningful change to training paces from this run alone.${repNote}`;
    } else {
      impactLine = `Counted toward your fitness projection — training paces moved about ${Math.round(Math.abs(deltaPerUnit))} sec/${unit} ${deltaPerUnit>0?'slower':'faster'}.${repNote}`;
    }
  }

  return `<div class="card" style="padding:14px 16px; margin-bottom:16px; background:var(--accent-soft); border-color:var(--accent-strong);">
    <div style="display:flex; align-items:center; gap:6px; font-weight:800; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink); margin-bottom:8px;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      Logged
    </div>
    <div style="font-weight:700; font-size:14.5px;">${esc(distLine)}</div>
    <div style="font-size:13px; color:var(--ink-soft); margin-top:2px;">${secToClock(log.durationSec)}${actualPaceSecPerKm!=null?' · '+paceOrSpeedStr(actualPaceSecPerKm,unit,fmt):''}${paceCompareLine?' · '+(warmupAdjusted?'excluding warm-up, ':'')+paceCompareLine:''}</div>
    <div class="hint" style="margin-top:8px; color:var(--ink-soft);">${impactLine}</div>
    <button class="btn btn-ghost btn-sm" data-act="delete-log" data-id="${log.id}" style="margin-top:10px; color:#C4432E;">Remove this log</button>
  </div>`;
}

// Tapping a day opens this read-only view first — pace, purpose, and effort for the run,
// plus how it actually went if it's already logged. Editing (type, distance, pace override,
// swap) lives behind the Edit button so a casual "what's today's run again?" tap never risks
// accidentally changing the plan.
function renderDayDetail(){
  const {weekIndex, dayIndex} = state.modal;
  const week = state.plan.weeks[weekIndex];
  const day = week.days[dayIndex];
  const unit = state.setup.units, fmt = state.paceFormat;

  const weekPaces = getWeekPaces(state.plan, week, state.logs);
  const descriptionParts = (day.descBase==null && day.notes!=null) ? [day.notes] : workoutPartsFor(day, weekPaces, unit, dayFmt(day, fmt));
  const purpose = WORKOUT_PURPOSE[day.type];
  const strengthFocusNote = day.strengthFocus==='upper'
    ? (day.type==='rest'
      ? `Upper body/core focus — no run today, so it's still a genuine day off for your legs.`
      : isLegDemandingDay(day)
        ? `Upper body/core focus today — this day already carries a demanding run, so keep legs light.`
        : `Upper body/core focus — keeps legs fresh for ${week.days[(dayIndex+1)%7].label} (${DOW_LABELS[week.days[(dayIndex+1)%7].dow]}).`)

  const tmNote = treadmillNote(day);

  void meta;

  return modalShell(`${DOW_LABELS[day.dow]}, ${niceDate(parseDate(day.date))}`, `
    <div style="display:flex; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:14px;">
      ${dayPill(day, true)}
      ${day.km>0?`<span class="mono" style="font-size:15px; font-weight:700;">${fmtDist(day.km,unit)}</span>`:''}
      ${day.strength?`<span class="strength-badge">+ Strength${day.strengthFocus==='upper'?' (upper/core)':''}</span>`:''}
      ${canTreadmill ? `<button class="chip ${day.treadmill?'active':''}" data-act="toggle-treadmill" data-wi="${weekIndex}" data-di="${dayIndex}" style="margin-left:auto; display:inline-flex; align-items:center; gap:6px; padding:6px 12px;"><span style="width:14px; height:14px; display:inline-flex;">${ICONS.treadmill}</span>Treadmill</button>` : ''}
    </div>
    ${descriptionParts.length>1
      ? `<ul style="font-size:14.5px; color:var(--ink-soft); margin:0 0 16px; padding-left:20px; line-height:1.5;">${descriptionParts.map(p=>`<li style="margin-bottom:4px;">${esc(p)}</li>`).join('')}</ul>`
      : descriptionParts.length===1 ? `<div style="font-size:14.5px; color:var(--ink-soft); margin-bottom:16px;">${esc(descriptionParts[0])}</div>` : ''}
    ${strengthFocusNote ? `<div class="hint" style="margin:-10px 0 16px;">${esc(strengthFocusNote)}</div>` : ''}
    ${day.strength && day.strengthExercises && day.strengthExercises.length ? `
    <div class="field-label" style="margin-bottom:8px;">Strength${day.strengthTimeMin ? ` — about ${day.strengthTimeMin} min${day.strengthExpress ? ', kept short because it shares a workout day — do it after the run' : ''}` : ''}</div>
    <div class="card" style="padding:2px 14px; margin-bottom:12px;">${strengthRowsHtml(day.strengthExercises, day.date, day.strengthHowTo, false)}</div>
    <div class="hint" style="margin:0 0 12px;">Tap an exercise for the effort, rest and how to do it. Tick each one as you go.</div>
    ${day.strengthLoadNote ? `<div class="hint" style="margin:-4px 0 14px;">${esc(day.strengthLoadNote)}</div>` : ''}
    ${day.strengthOptional && day.strengthOptional.length ? `
    <div class="field-label" style="margin-bottom:6px;">Optional extras — only if you have time</div>
    <div class="card" style="padding:2px 14px; margin-bottom:12px; opacity:.85;">${strengthRowsHtml(day.strengthOptional, day.date, day.strengthHowTo, true)}</div>` : ''}
    ${day.strength ? `<div class="hint" style="margin:-4px 0 12px;">Built for the gym equipment ticked in Settings.</div>` : ''}
    ` : ''}
    ${day.strength ? `<button class="btn btn-block" data-act="toggle-strength-done" data-date="${day.date}" style="margin-bottom:16px; ${isStrengthDone?'color:var(--accent-strong); border-color:var(--accent-strong);':''}">${isStrengthDone?`${ICONS.check} Strength completed`:'Mark strength completed'}</button>` : ''}
    ${day.type==='race' ? `<button class="btn btn-primary btn-block" data-act="open-pacing-sheet" style="margin-bottom:16px;">${ICONS.flag} View pacing sheet</button>` : ''}
    ${matchedLogs.map(log=>renderLoggedComparisonHtml(day, log, state.plan, week, state.logs, unit, fmt)).join('')}
    ${purpose ? `
    <div class="field">
      <label class="field-label">Purpose</label>
      <div class="input" style="height:auto; color:var(--ink-soft);">${esc(purpose.purpose)}</div>
    </div>

      <div class="input" style="height:auto; color:var(--ink-soft);">${esc(purpose.effort)}</div>

    <button class="btn btn-primary btn-block" data-act="open-log-for-day" style="padding:13px; margin-top:6px;">${ICONS.plus} Log ${matchedLogs.length?'another':'a'} run</button>

}

function modalEditDay(){
  const {weekIndex, dayIndex, draft} = state.modal;
  const week = state.plan.weeks[weekIndex];
  const day = week.days[dayIndex];
  const unit = state.setup.units, fmt = state.paceFormat;
  const matchedLogs = state.logs.filter(l=>l.date===day.date);
  const typeOpts = Object.keys(TYPE_META).map(t=>`<option value="${t}" ${draft.type===t?'selected':''}>${TYPE_META[t].label}</option>`).join('');
  const weekPaces = getWeekPaces(state.plan, week, state.logs);
  const meta = buildWorkoutMeta({type:draft.type, km:draft.km, strength:draft.strength, easyRole:draft.easyRole, progressionEasy:draft.progressionEasy, warmupKm:draft.warmupKm, cooldownKm:draft.cooldownKm, treadmillHills: draft.treadmillHills}, state.plan.raceDistanceKm);
  // Same strides/terrain/hillStrides eligibility as the save handler (see save-day) - the
  // live preview shouldn't show a stale strides or terrain note for a type the user has
  // switched to but not saved yet either (previously it used draft.strides raw here,
  // showing "+ strides" even for a type like Rest that can never actually save with it).
  const previewStrides = STRIDES_ELIGIBLE_TYPES.includes(draft.type) && !!draft.strides;
  const previewTerrainEligible = draft.type==='long' || (draft.type==='easy' && day.easyRole==='aerobic');
  const previewHillStridesEligible = draft.type==='easy' && day.easyRole==='aerobic' && previewStrides;
  const previewDay = {...meta, type:draft.type, km:draft.km, paceOverrideSecPerKm: draft.paceOverrideSecPerKm, strides:previewStrides, hillStrides: previewHillStridesEligible ? day.hillStrides : false, terrain: previewTerrainEligible ? day.terrain : null, treadmillHills: draft.treadmillHills};
  // Treadmill is a per-workout choice (see the day-skeleton comment in generatePlan) -
  // only surfaced here when this specific day could actually show hill-specific content:
  // a dedicated Hill Repeats session, or the week's aerobic easy day (the one hill strides
  // can land on). Every other day type never reads treadmillHills at all, so showing the
  // toggle there would just be a control with no visible effect.
  const treadmillEligible = draft.type!=='rest' && draft.type!=='race';
  const description = renderWorkoutText(previewDay, weekPaces, unit, draft.treadmillHills ? 'speed' : fmt) || 'No planned distance for this day.';
  const recommendedSecPerKm = meta.paceKey ? weekPaces[meta.paceKey] : null;
  const effectiveSecPerKm = draft.paceOverrideSecPerKm!=null ? draft.paceOverrideSecPerKm : recommendedSecPerKm;
  const speedUnitLabel = unit==='mi' ? 'mph' : 'km/h';
  const previewDays = week.days.map((wd,i)=> i===dayIndex ? {...wd, type:draft.type, strength:draft.strength, label:TYPE_META[draft.type].label} : wd);
  const previewWarnings = scheduleWarnings({...week, days:previewDays});

  return modalShell(`Edit ${DOW_LABELS[day.dow]}, ${niceDate(parseDate(day.date))}`, `
    ${matchedLogs.map(log=>renderLoggedComparisonHtml(day, log, state.plan, week, state.logs, unit, fmt)).join('')}
    <div class="field"><label class="field-label">Workout type</label><select class="input" id="ed-type">${typeOpts}</select></div>
    <div class="field"><label class="field-label">Distance (${unit})</label><input class="input" type="number" step="0.1" min="0" id="ed-km" value="${round1(kmToUnit(draft.km,unit))}"></div>
    <div class="field">
      <label class="field-label">Today's run</label>
      <div class="input" style="color:var(--ink-soft); background:var(--surface-2);">${esc(description)}</div>
    </div>
    ${meta.paceKey ? `
    <div class="field">
      <label class="field-label">Target ${fmt==='speed'?`speed (${speedUnitLabel})`:'pace'}</label>
      <input class="input" type="${fmt==='speed'?'number':'text'}" ${fmt==='speed'?'step="0.1" min="0"':''} id="ed-pace" value="${paceInputValue(effectiveSecPerKm, unit, fmt)}" placeholder="${fmt==='speed'?'e.g. 7.1':'e.g. 8:30'}">
      <div class="hint">Recommended: ${recommendedSecPerKm!=null?paceOrSpeedStr(recommendedSecPerKm,unit,fmt):'—'}${draft.paceOverrideSecPerKm!=null?' · <a class="link-btn" data-act="reset-day-pace" style="cursor:pointer;">Reset to recommended</a>':''}</div>
    </div>` : ''}
    <div class="field" style="display:flex; align-items:center; justify-content:space-between;">
      <label class="field-label" style="margin:0;">Add strength session</label>
      <input type="checkbox" id="ed-strength" ${draft.strength?'checked':''} style="width:20px; height:20px;">
    </div>
    ${STRIDES_ELIGIBLE_TYPES.includes(draft.type) ? `
    <div class="field" style="display:flex; align-items:center; justify-content:space-between;">
      <label class="field-label" style="margin:0;">Add strides</label>
      <input type="checkbox" id="ed-strides" ${draft.strides?'checked':''} style="width:20px; height:20px;">
    </div>` : ''}
    ${treadmillEligible ? `
    <div class="field" style="display:flex; align-items:center; justify-content:space-between;">
      <label class="field-label" style="margin:0;">Treadmill (belt speed and incline instead of pace)</label>
      <input type="checkbox" id="ed-treadmill-hills" ${draft.treadmillHills?'checked':''} style="width:20px; height:20px;">
    </div>` : ''}
    ${draft.type==='progression' ? `
    <div class="field" style="display:flex; align-items:center; justify-content:space-between;">
      <label class="field-label" style="margin:0;">Keep it easy (finish at steady effort, not tempo)</label>
      <input type="checkbox" id="ed-progression-easy" ${draft.progressionEasy?'checked':''} style="width:20px; height:20px;">
    </div>` : ''}
    ${previewWarnings.length ? `<div class="banner" style="margin:0 0 16px;">${ICONS.bolt}<span>${previewWarnings.map(w=>esc(w)).join('<br>')}</span></div>` : ''}
    <div class="row" style="margin-top:6px;">
      <button class="btn" data-act="start-move" data-di="${dayIndex}">${ICONS.move} Swap with another day</button>
      <button class="btn btn-primary" data-act="save-day" data-wi="${weekIndex}" data-di="${dayIndex}">Save</button>
    </div>
  `);
}

function modalConfirmSwap(data){
  const week = state.plan.weeks[data.weekIndex];
  const da = week.days[data.dayIndexA], db_ = week.days[data.dayIndexB];
  const lineFor = d => `${DOW_LABELS[d.dow]}, ${niceDate(parseDate(d.date))} — ${TYPE_META[d.type].label}`;
  // Same scheduleWarnings check modalEditDay already runs live while changing a single
  // day's type, but computed against what this SWAP would actually produce (both days'
  // workouts trading places) - previously a swap could land a long run and a quality
  // session back-to-back, or strength right before a hard effort, with zero warning
  // until the user happened to reopen one of the affected days afterward. Mirrors
  // do-swap-days' own mutation exactly (date/dow/id stay put, everything else trades)
  // so this preview never disagrees with what actually gets saved.
  const keepA = {date:da.date, dow:da.dow, id:da.id}, keepB = {date:db_.date, dow:db_.dow, id:db_.id};
  const previewDays = week.days.map((d,i)=> i===data.dayIndexA ? {...db_, ...keepA} : i===data.dayIndexB ? {...da, ...keepB} : d);
  const swapWarnings = scheduleWarnings({...week, days:previewDays});
  const ack = !!data.ack;
  return modalShell('Swap these two days?', `
    <div class="hint" style="margin:-8px 0 14px;">Each day keeps its own date — only the workouts trade places.</div>
    <div class="settings-row"><div class="lbl">${esc(lineFor(da))}</div></div>
    <div class="settings-row" style="border-bottom:none;"><div class="lbl">${esc(lineFor(db_))}</div></div>
    ${swapWarnings.length ? `
    <div class="banner" style="margin:16px 0 0;">${ICONS.bolt}<span>${swapWarnings.map(w=>esc(w)).join('<br>')}</span></div>
    <label class="field" style="display:flex; align-items:center; gap:10px; margin:14px 0 0; cursor:pointer;">
      <input type="checkbox" id="swap-ack" ${ack?'checked':''} style="width:20px; height:20px; flex:none;">
      <span style="font-size:13.5px; color:var(--ink-soft);">I understand, swap anyway</span>
    </label>` : ''}
    <div class="row" style="margin-top:18px;"><button class="btn btn-block" data-act="close-modal">Cancel</button><button class="btn btn-primary btn-block" data-act="do-swap-days" ${swapWarnings.length && !ack ? 'disabled':''}>Swap</button></div>
  `);
}

function modalConfirmReset(){

    <div class="row"><button class="btn btn-block" data-act="close-modal">Cancel</button><button class="btn btn-danger btn-block" data-act="do-reset">Erase & start over</button></div>

function modalConfirmImport(data){
  const raceLine = isGeneralPlan(data.setup)
    ? `${planLabel(data.setup)} · ${data.setup.weeks} week${data.setup.weeks===1?'':'s'}`
    : `${planLabel(data.setup)} · ${niceDateFull(parseDate(data.setup.raceDate))}`;
  const runCount = data.logs.length;

  const replaceLine = currentRunCount>0
    ? `This replaces your current plan and ${currentRunCount} logged run${currentRunCount===1?'':'s'} on this device.`
    : `This rebuilds your plan from the backup and restores its logged runs.`;
  return modalShell('Import backup?', `
    <div class="hint" style="margin-bottom:4px;">Backup from ${esc(niceDateFull(new Date(data.exportedAt)))}</div>
    <div class="settings-row" style="border-bottom:none;">
      <div><div class="lbl">${esc(raceLine)}</div><div class="sub">${runCount} logged run${runCount===1?'':'s'} in this backup</div></div>
    </div>
    <div class="hint" style="margin:14px 0 18px;">${replaceLine} This can't be undone. The plan is rebuilt fresh from your original inputs, so any one-off day edits, added strides, or day swaps you'd made won't carry over — logged runs, strength completions, and badges all will.</div>
    <div class="row"><button class="btn btn-block" data-act="close-modal">Cancel</button><button class="btn btn-primary btn-block" data-act="do-import-backup">Import backup</button></div>
  `);
}

/* ============================= backup / restore ============================= */
// Exports everything needed to pick back up on a fresh install: the onboarding inputs
// (to rebuild the plan, since the plan itself is a derived, regeneratable artifact) plus
// every logged run and small bits of profile state. Deliberately NOT the generated plan
// object itself - regenerating from setup means an import always rebuilds against the
// app's current plan-generation logic rather than replaying a possibly-outdated one.
// One all-day calendar event per planned day, so the plan shows up next to real life.
function icsEscape(t){ return String(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
function icsFold(line){ const out=[]; let l=line; while(l.length>72){ out.push(l.slice(0,72)); l=' '+l.slice(72); } out.push(l); return out.join('\r\n'); }
function exportCalendar(){
  const plan = state.plan, unit = state.setup.units, fmt = state.paceFormat;
  const stamp = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z');
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Peak//Training plan//EN','CALSCALE:GREGORIAN','X-WR-CALNAME:Peak training plan'];
  plan.weeks.forEach(week=>{
    const paces = getWeekPaces(plan, week, state.logs);
    week.days.forEach(day=>{
      if(!(day.km>0) && !day.strength) return;
      const d = day.date.replace(/-/g,''); const next = fmtDate(addDays(parseDate(day.date),1)).replace(/-/g,'');
      const title = day.km>0 ? `${day.label} ${fmtDist(day.km,unit)}` : 'Strength session';
      const parts = day.km>0 ? workoutPartsFor(day, paces, unit, dayFmt(day, fmt)) : [];
      if(day.strength) parts.push(`Strength${day.strengthFocus==='upper'?' (upper body/core)':''}${day.strengthTimeMin?` — about ${day.strengthTimeMin} min`:''}${day.strengthExercises?': '+day.strengthExercises.join('; '):''}`);
      lines.push('BEGIN:VEVENT', `UID:${day.id}@peak`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${next}`, icsFold(`SUMMARY:Peak: ${icsEscape(title)}`), icsFold(`DESCRIPTION:${icsEscape(parts.join('\n'))}`), 'END:VEVENT');
    });
  });
  lines.push('END:VCALENDAR');
  const blob = new Blob([lines.join('\r\n')], {type:'text/calendar'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'peak-plan.ics'; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  showToast('Calendar file ready — open it to add the plan');
}
function exportBackupData(){
  const payload = {
    schema: 'peak-backup-v1',
    exportedAt: new Date().toISOString(),
    name: state.name,
    paceFormat: state.paceFormat,
    setup: state.setup,
    logs: state.logs,
    strengthDone: state.strengthDone,
    achievementLog: state.achievementLog,
  };
  const json = JSON.stringify(payload, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `peak-backup-${fmtDate(todayDate())}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function handleImportFile(file){
  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){ showToast('That file is not valid backup data'); return; }
    const hasValidSetup = parsed && parsed.setup && parsed.setup.units && (parsed.setup.raceDate || (parsed.setup.planKind && parsed.setup.weeks));
    if(!hasValidSetup || !Array.isArray(parsed.logs)){
      showToast('That file is not a Peak backup'); return;
    }
    state.modal = {type:'confirm-import', data:parsed};
    render();
  };
  reader.onerror = () => showToast("Couldn't read that file");
  reader.readAsText(file);
}

function doImportBackup(data){
  const plan = isGeneralPlan(data.setup) ? generateGeneralPlan(data.setup) : generatePlan(data.setup);
  state.name = data.name || '';
  state.paceFormat = data.paceFormat || 'pace';
  state.setup = data.setup;
  state.plan = plan;
  state.logs = data.logs;
  state.strengthDone = data.strengthDone || [];
  state.achievementLog = data.achievementLog || [];
  Store.setName(state.name);
  Store.setPaceFormat(state.paceFormat);
  Store.setSetup(state.setup);
  Store.setPlan(state.plan);
  Store.setLogs(state.logs);
  Store.setStrengthDone(state.strengthDone);
  Store.setAchievementLog(state.achievementLog);
  const today = todayDate();
  const idx = plan.weeks.findIndex(w=>{ const ws=parseDate(w.weekStart); return today>=ws && today<addDays(ws,7); });
  state.currentWeekIndex = idx===-1?0:idx;
  state.view = 'app'; state.tab = 'plan';
  state.modal = null;
  showToast('Backup imported');
  window.scrollTo(0,0);
}

/* ============================= events ============================= */
function bindGlobal(){
  const app = document.getElementById('app');
  app.onclick = onClick;
  app.oninput = onInput;
  app.onchange = onChange;
  // Pull a sheet down (from its top) to close it, the way iOS sheets behave.
  let drag = null;
  app.ontouchstart = e=>{
    const sheet = e.target.closest && e.target.closest('.sheet');
    if(!sheet || sheet.scrollTop>0 || e.target.closest('input,select,textarea')) { drag=null; return; }
    drag = {sheet, y0:e.touches[0].clientY, dy:0};
  };
  app.ontouchmove = e=>{
    if(!drag) return;
    drag.dy = Math.max(0, e.touches[0].clientY - drag.y0);
    if(drag.sheet.scrollTop>0){ drag.sheet.style.transform=''; drag=null; return; }
    drag.sheet.style.transition='none'; drag.sheet.style.transform = drag.dy>0 ? `translateY(${drag.dy}px)` : '';
  };
  app.ontouchend = ()=>{
    if(!drag) return;
    const {sheet, dy} = drag; drag = null;
    if(dy>90){ state.modal=null; state.moveFrom=null; render(); return; }
    sheet.style.transition='transform .18s ease'; sheet.style.transform='';
  };
}

function findAct(el){
  while(el && el!==document){ if(el.dataset && el.dataset.act) return el; el = el.parentElement; }
  return null;
}

function onClick(e){
  if(e.target.classList && e.target.classList.contains('overlay')){

    const wi = Number(el.dataset.wi), di = Number(el.dataset.di);

    Object.assign(day, {treadmill:on, treadmillHills:on, descBase:meta.descBase, paceKey:meta.paceKey, qualityKm: meta.qualityKm!=null ? meta.qualityKm : day.qualityKm});

    state.strengthItems = items; Store.setStrengthItems(items);
    const day = findPlanDay(state.plan, date);
    const total = day && day.strengthExercises ? day.strengthExercises.length : 0;
    const allDone = total>0 && arr.filter(Boolean).length>=total;
    if(allDone && !state.strengthDone.includes(date)){
      state.strengthDone = [...state.strengthDone, date]; Store.setStrengthDone(state.strengthDone);

  if(act==='toggle-draft-equipment'){
    const id = el.dataset.id; const list = new Set(state.onboardDraft.equipment || DEFAULT_EQUIPMENT);

  if(act==='pick-plan-kind'){

  if(act==='pick-distance-metric'){ state.onboardDraft.distanceGoalMetric = el.dataset.m; render(); return; }
  if(act==='pick-restdays'){ state.onboardDraft.restDays = Number(el.dataset.n); render(); return; }
  if(act==='pick-week-start'){ state.onboardDraft.weekStartDow = Number(el.dataset.n); render(); return; }
  if(act==='pick-track-from'){ state.onboardDraft.trackFromToday = el.dataset.mode==='today'; render(); return; }
  if(act==='pick-long-emphasis'){ state.onboardDraft.longRunEmphasis = el.dataset.key; render(); return; }
  if(act==='pick-speed-emphasis'){ state.onboardDraft.speedEmphasis = el.dataset.key; render(); return; }

  if(act==='pick-dow'){

    if(multi){

  if(act==='onboard-back'){ state.onboardStep = Math.max(1, state.onboardStep-1); render(); window.scrollTo(0,0); return; }

  if(act==='generate-plan'){ submitOnboarding(); return; }

  if(act==='open-log'){
    state.modal = {
      type:'log-run',

    };
    render(); return;
  }
  if(act==='log-kind'){ state.modal.data.kind = el.dataset.kind; render(); return; }
  if(act==='log-mode-manual'){ state.modal.mode='manual'; render(); return; }
  if(act==='log-mode-strava'){ state.modal.mode='strava'; render(); return; }
  if(act==='connect-strava'){ window.location.href = stravaConnectUrl(); return; }
  if(act==='disconnect-strava'){
    Store.clearStravaAuth();

    showToast('Disconnected from Strava');
    return;
  }
  if(act==='save-log'){
    const unit = state.setup.units;
    const d = state.modal.data;
    const durSec = parseDurationToSec(d.time);
    const distV = Number(d.dist);
    if(!d.date || !distV || !durSec){ showToast('Enter date, distance and time'); return; }
    const entry = {date:d.date, distanceKm:unitToKm(distV,unit), durationSec:durSec, notes:d.notes, createdAt:new Date().toISOString()};
    if(d.kind==='race') entry.kind = 'race';
    else { const found = plannedWorkoutForDate(d.date); const repM = found ? repMetersForDay(found.day) : null; const repSec = parseDurationToSec(d.rep); if(repM && repSec>0){ entry.repSec = repSec; entry.repMeters = repM; } }
    commitLogEntry(entry);

  }
  if(act==='pick-strava-activity'){
    const id = Number(el.dataset.id);
    const items = (state.modal.strava && state.modal.strava.items) || [];
    const a = items.find(x=>x.id===id);
    if(!a) return;
    state.modal.strava.confirm = {item:a, date:a.date, kind:'run', rep:'', lapsTried:false};
    render();
    // interval-type planned day: try the activity's laps for the rep time
    const found = plannedWorkoutForDate(a.date); const repM = found ? repMetersForDay(found.day) : null;
    if(repM && ['intervals','cruise','reps'].includes(found.day.type)){
      fetchStravaRepSec(a.id, repM).then(sec=>{ const c = state.modal && state.modal.strava && state.modal.strava.confirm; if(c && c.item.id===a.id){ c.lapsTried = true; if(sec && !c.rep) c.rep = secToClock(sec); render(); } }).catch(()=>{});
    }

  }
  if(act==='strava-kind'){ state.modal.strava.confirm.kind = el.dataset.kind; render(); return; }
  if(act==='cancel-import-strava'){

    render(); return;
  }
  if(act==='confirm-import-strava'){
    const c = state.modal.strava.confirm; const {item:a, date} = c;
    const entry = {date, distanceKm:a.distanceKm, durationSec:a.durationSec, notes:a.name||'', createdAt:new Date().toISOString(), stravaId:a.id};
    if(c.kind==='race') entry.kind = 'race';
    else { const found = plannedWorkoutForDate(date); const repM = found ? repMetersForDay(found.day) : null; const repSec = parseDurationToSec(c.rep); if(repM && repSec>0){ entry.repSec = repSec; entry.repMeters = repM; } }

  if(act==='delete-log'){

  }
  if(act==='open-day-edit'){

    week.days[a] = {...db_, ...keepA};

  if(act==='cancel-move'){ state.moveFrom=null; render(); return; }
  if(act==='start-move'){
    state.moveFrom = {weekIndex:state.currentWeekIndex, dayIndex:Number(el.dataset.di)};
    state.modal=null; render(); return;
  }
  if(act==='save-day'){
    const wi = Number(el.dataset.wi), di = Number(el.dataset.di);
    const draft = state.modal.draft;
    const day = state.plan.weeks[wi].days[di];
    const strides = STRIDES_ELIGIBLE_TYPES.includes(draft.type) && !!draft.strides;
    const progressionEasy = draft.type==='progression' && !!draft.progressionEasy;
    // treadmillHills is only ever editable when treadmillEligible would show its checkbox
    // (see modalEditDay) - for any other type, draft.treadmillHills is whatever it was
    // initialized to and was never presented as a choice, so fall back to the day's
    // existing value rather than accidentally reset it via an untouched draft field.
    const treadmillEligible = draft.type!=='rest' && draft.type!=='race';
    const treadmillHills = treadmillEligible ? !!draft.treadmillHills : false;
    const meta = buildWorkoutMeta({type:draft.type, km:draft.km, strength:draft.strength, easyRole:draft.easyRole, progressionEasy, warmupKm:draft.warmupKm, cooldownKm:draft.cooldownKm, treadmillHills}, state.plan.raceDistanceKm);
    // terrain/hillStrides are generatePlan-assigned, role-based fields (the long run, and
    // the week's "aerobic" easy day - see easyIdxs.forEach), not something the edit modal
    // lets the user set directly. Only keep them when the day's (possibly just-changed)
    // type is still one where they'd apply - easyRole itself can't change here, so a day
    // edited away from Long/aerobic-Easy into anything else drops its stale terrain note
    // instead of carrying it forward onto a workout it no longer describes.
    const terrainEligible = draft.type==='long' || (draft.type==='easy' && day.easyRole==='aerobic');
    const hillStridesEligible = draft.type==='easy' && day.easyRole==='aerobic' && strides;
    state.plan.weeks[wi].days[di] = {...day, type:draft.type, km:round1(draft.km), label:TYPE_META[draft.type].label, strength:draft.strength, strides, progressionEasy, paceOverrideSecPerKm: meta.paceKey?draft.paceOverrideSecPerKm:null, ...meta, warmupKm: meta.warmupKm||0, cooldownKm: meta.cooldownKm||0, easyVariety:false, terrain: terrainEligible ? day.terrain : null, hillStrides: hillStridesEligible ? day.hillStrides : false, treadmillHills, treadmill: treadmillHills};
    const week = state.plan.weeks[wi];
    week.targetKm = round1(week.days.reduce((s,d)=>s+d.km,0));
    recomputeStrengthFocus(week.days);
    refreshStrengthWorkouts(week.days, week.phase, week.weekIndex, strengthOptsFor(week));
    Store.setPlan(state.plan);
    state.modal=null; showToast('Day updated'); return;
  }

  if(act==='set-unit'){
    const u = el.dataset.u;
    if(u===state.setup.units) return;
    state.setup.units = u;
    Store.setSetup(state.setup);
    render(); return;
  }
  if(act==='set-pace-format'){
    const f = el.dataset.f;
    if(f===state.paceFormat) return;
    state.paceFormat = f;
    Store.setPaceFormat(f);
    render(); return;
  }
  if(act==='open-switch-plan'){
    state.onboardMode = 'switch';
    state.onboardDraft = draftFromSetup(state.setup);
    state.onboardStep = 1;
    state.view = 'onboarding';
    render(); window.scrollTo(0,0); return;
  }
  if(act==='cancel-switch-plan'){
    state.onboardMode = 'new';
    state.onboardDraft = null;
    state.view = 'app'; state.tab = 'settings';
    render(); window.scrollTo(0,0); return;
  }
  if(act==='confirm-reset'){ state.modal={type:'confirm-reset'}; render(); return; }
  if(act==='do-reset'){
    Store.resetAll();
    state.name=''; state.setup=null; state.plan=null; state.logs=[]; state.modal=null;
    state.strengthDone = []; state.achievementLog = []; state.strengthItems = {}; state.helpSeen = false; state.notesSeen = false;
    state.stravaAuth = null;
    state.view='onboarding'; state.onboardDraft = defaultDraft(); state.onboardStep = 1;
    render(); window.scrollTo(0,0); return;
  }
  if(act==='close-modal'){ state.modal=null; state.moveFrom=null; render(); return; }

  if(act==='export-data'){ exportBackupData(); return; }
  if(act==='import-data'){ document.getElementById('import-file-input').click(); return; }
  if(act==='do-import-backup'){ doImportBackup(state.modal.data); return; }
}

function onInput(e){
  if(e.target.id==='in-name'){
    state.onboardDraft.name = e.target.value;
    const n = e.target.value.trim().toLowerCase();
    if(n==='lexi' || n==='lexi willis') showNameBadge("That's a hot girl name 💋");
  }
  if(e.target.id==='in-custom-dist'){
    const v = Number(e.target.value);
    if(v>0){
      state.onboardDraft.raceKey='custom'; state.onboardDraft.raceDistanceKm = unitToKm(v, state.onboardDraft.units);
      document.querySelectorAll('[data-act="pick-race"]').forEach(c=>c.classList.remove('active'));
    }
  }
  if(e.target.id==='in-recent2-time'){
    const formatted = formatDurationDigits(e.target.value);
    e.target.value = formatted;
    state.onboardDraft.recent2Time = formatted;
  }
  if(e.target.id==='in-recent-time'){
    const formatted = formatDurationDigits(e.target.value);
    e.target.value = formatted;
    state.onboardDraft.recentTime = formatted;
    // Debounced: a partial value like "2:23" mid-type into "22:30" parses as a real
    // (wrong) duration, so showing the derived pace/animal on every keystroke flashes
    // nonsense. Wait for a short pause in typing before computing it for real.
    const hintEl = document.getElementById('recent-pace-hint');
    if(hintEl){
      hintEl.textContent = 'Enter a finish time to see your pace per mile.';
      clearTimeout(recentPaceHintTimer);
      recentPaceHintTimer = setTimeout(()=>{
        const el2 = document.getElementById('recent-pace-hint');
        if(el2) el2.textContent = recentPaceHint(state.onboardDraft);
      }, PACE_HINT_DEBOUNCE_MS);
    }
  }
  if(state.modal && state.modal.type==='library' && e.target.id==='lib-q'){
    state.modal.q = e.target.value; const sheet = document.querySelector('.sheet'); const y = sheet ? sheet.scrollTop : 0; render(); const i = document.getElementById('lib-q'); if(i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); } const s2 = document.querySelector('.sheet'); if(s2) s2.scrollTop = y; return;
  }
  if(state.modal && state.modal.type==='log-run'){
    const d = state.modal.data;
    if(e.target.id==='lr-time'){
      const formatted = formatDurationDigits(e.target.value);
      e.target.value = formatted;
      d.time = formatted;
    }
    if(e.target.id==='lr-dist'){ d.dist = e.target.value; }
    if(e.target.id==='lr-notes'){ d.notes = e.target.value; }
    if(e.target.id==='lr-rep'){ const f = formatDurationDigits(e.target.value); e.target.value = f; d.rep = f; }
    if(e.target.id==='lr-strava-rep' && state.modal.strava && state.modal.strava.confirm){ const f = formatDurationDigits(e.target.value); e.target.value = f; state.modal.strava.confirm.rep = f; }
    if(e.target.id==='lr-time' || e.target.id==='lr-dist'){
      const hintEl = document.getElementById('lr-pace-hint');
      if(hintEl){
        hintEl.textContent = 'Enter distance and time to see your pace per mile.';
        clearTimeout(lrPaceHintTimer);
        lrPaceHintTimer = setTimeout(()=>{
          const el2 = document.getElementById('lr-pace-hint');
          if(el2) el2.textContent = logPaceHint(d, state.setup.units);
        }, PACE_HINT_DEBOUNCE_MS);
      }
    }
  }
}
function onChange(e){
  if(e.target.id==='import-file-input'){
    const file = e.target.files[0];
    e.target.value = '';
    if(file) handleImportFile(file);
    return;
  }
  if(e.target.id==='in-race-date'){
    state.onboardDraft.raceDate = e.target.value;
    // Deliberately not render() here: this app re-renders by regenerating innerHTML, which
    // destroys and recreates the date input itself. On iOS, opening an empty date field
    // fires a premature change event with today's date the instant the picker appears,
    // before the user has actually chosen anything - re-rendering right then yanks the
    // input out from under the still-open native picker and forcibly closes it. Patching
    // just the two small bits of UI that depend on raceDate, and leaving the input node
    // itself untouched, keeps the picker open through that spurious event so the user's
    // real selection (the change event that follows) lands normally.
    const placeholder = document.getElementById('race-date-placeholder');
    if(placeholder) placeholder.style.display = e.target.value ? 'none' : 'flex';
    const hintEl = document.getElementById('race-date-hint');
    if(hintEl){
      const weeksToRace = e.target.value ? Math.max(1,Math.ceil((parseDate(e.target.value)-todayDate())/86400000/7)) : null;
      hintEl.style.display = weeksToRace ? '' : 'none';
      hintEl.textContent = weeksToRace ? `${weeksToRace} week${weeksToRace===1?'':'s'} from today.` : '';
    }
    return;
  }
  if(e.target.id==='in-training-start'){
    // Same type="date" iOS picker-closing quirk as in-race-date above - no dependent UI
    // reads this value anywhere else on the step, so simply not calling render() here is
    // enough to keep the native picker from being yanked out from under itself.
    state.onboardDraft.trainingStartDate = e.target.value;
    return;
  }
  if(e.target.id==='in-weekly'){ state.onboardDraft.currentWeeklyMi = e.target.value; render(); return; }
  if(e.target.id==='in-goal-time'){ state.onboardDraft.goalTime = e.target.value; render(); return; }
  if(e.target.id==='in-longest'){ state.onboardDraft.longestRecentMi = e.target.value; render(); return; }
  if(e.target.id==='in-recent-time' || e.target.id==='in-recent2-time'){ render(); return; }
  if(e.target.id==='in-max-long'){ state.onboardDraft.maxLongRunMi = e.target.value; }
  if(e.target.id==='in-max-weekly'){ state.onboardDraft.maxWeeklyMi = e.target.value; render(); return; }
  if(e.target.id==='in-weeks'){ state.onboardDraft.weeks = e.target.value; render(); return; }
  if(e.target.id==='in-distance-current'){ state.onboardDraft.distanceGoalCurrentMi = e.target.value; render(); return; }
  if(e.target.id==='in-distance-target'){ state.onboardDraft.distanceGoalTargetMi = e.target.value; render(); return; }
  if(state.modal && state.modal.type==='pacing-sheet' && e.target.id==='ps-course'){
    state.modal.courseKey = e.target.value || null;
    render(); return;
  }
  if(state.modal && state.modal.type==='log-run' && e.target.id==='lr-date'){
    state.modal.data.date = e.target.value;
    render(); return;
  }
  if(state.modal && state.modal.type==='log-run' && e.target.id==='lr-strava-date' && state.modal.strava && state.modal.strava.confirm){
    state.modal.strava.confirm.date = e.target.value;
    render(); return;
  }
  if(state.modal && state.modal.type==='confirm-swap' && e.target.id==='swap-ack'){
    state.modal.data.ack = e.target.checked;
    render(); return;
  }
  if(state.modal && state.modal.type==='edit-day'){
    const draft = state.modal.draft;
    const unit = state.setup.units;
    if(e.target.id==='ed-type'){ draft.type = e.target.value; render(); return; }
    if(e.target.id==='ed-km'){ draft.km = unitToKm(Number(e.target.value)||0, unit); render(); return; }
    if(e.target.id==='ed-strength'){ draft.strength = e.target.checked; render(); return; }
    if(e.target.id==='ed-strides'){ draft.strides = e.target.checked; render(); return; }
    if(e.target.id==='ed-treadmill-hills'){ draft.treadmillHills = e.target.checked; render(); return; }
    if(e.target.id==='ed-progression-easy'){ draft.progressionEasy = e.target.checked; render(); return; }
    if(e.target.id==='ed-pace'){
      const secPerKm = parsePaceInput(e.target.value, unit, state.paceFormat);
      if(secPerKm!=null) draft.paceOverrideSecPerKm = secPerKm;
      render(); return;
    }
  }
}

boot();
})();
</script>
</body>
</html>
