function renderOnboarding(){
  const d = state.onboardDraft;
  const step = state.onboardStep || 1;
  const meta = onboardStepMeta(step, d);
  const stepHtml = step===1 ? renderOnboardStep1(d) : step===2 ? renderOnboardStep2(d) : renderOnboardStep3(d);
  const dotsHtml = ONBOARD_STEPS.map((s,i)=>`<span class="step-dot ${i+1<=step?'active':''}"></span>`).join('');
  const isSwitch = state.onboardMode==='switch';
  const backOrCancelHtml = step>1
    ? '<button class="btn btn-block" style="padding:14px;" data-act="onboard-back">Back</button>'
    : (isSwitch ? '<button class="btn btn-block" style="padding:14px;" data-act="cancel-switch-plan">Cancel</button>' : '');
  const navHtml = step<3 ? `
    <div class="row onboard-nav">
      ${backOrCancelHtml}
      <button class="btn btn-primary btn-block" style="padding:14px;" data-act="onboard-next">Next</button>
    </div>
  ` : `
    <div class="row onboard-nav">
      ${backOrCancelHtml}
      <button class="btn btn-primary btn-block" style="padding:14px;" data-act="generate-plan">${isSwitch?'Update my plan':'Generate my plan'}</button>
    </div>
  `;

  return `
  <div class="topbar">
    <div class="brand"><div class="brand-mark">${ICONS.peak}</div><div class="brand-name">Peak</div></div>
  </div>
  <div class="container">
    ${step===1 ? `<div class="eyebrow" style="margin-top:6px;">Training plans, tailored to race day</div>` : ''}
    <h1 style="font-size:${step===1?24:21}px; margin:6px 0 4px;">${meta.title}</h1>
    <div class="hint" style="margin-bottom:14px;">${meta.hint}</div>
    ${isSwitch ? `<div class="hint" style="margin:-8px 0 14px; color:var(--accent-strong); font-weight:600;">Changing your plan — your logged runs stay exactly as they are.</div>` : ''}

}

function equipmentSummary(selected){
  const names = EQUIPMENT.filter(e=>(selected||[]).includes(e.id)).map(e=>e.label.split(/ with | \(| or |, | \/ /)[0]);
  if(!names.length) return 'nothing ticked — bodyweight sessions';
  return names.slice(0,3).join(', ') + (names.length>3 ? ` +${names.length-3}` : '');
}
function equipmentChipsHtml(selected, act){
  const sel = new Set(selected||[]);
  const groups = [];
  EQUIPMENT.forEach(e=>{ let g = groups.find(x=>x.name===e.group); if(!g){ g={name:e.group, items:[]}; groups.push(g); } g.items.push(e); });

    <div class="chip-select">${g.items.map(e=>`<button class="chip ${sel.has(e.id)?'active':''}" data-act="${act}" data-id="${e.id}">${esc(e.label)}</button>`).join('')}</div>`).join('');
}
// Options every post-generation strength refresh needs (edits, swaps, equipment changes).
function strengthOptsFor(week){

function refreshStrengthFromThisWeek(){

function phaseColorVar(phase){

}
function phaseLabel(phase){ return {base:'Base', build:'Build', peak:'Peak', taper:'Taper', maintenance:'Maintenance', recovery:'Recovery'}[phase]||phase; }
// Cutback weeks display as their own label/color rather than whatever phase they fall
// in — the underlying phase still drives workout selection, this is display-only. The
// very last week (the one race day actually falls in) displays as "Race Week" rather
// than "Taper" even though it's still internally the taper phase.
function weekDisplayLabel(week, totalWeeks, planKind){
  if(!planKind){
    if(week.daysToRaceAtStart!=null){
      if(week.daysToRaceAtStart===0) return totalWeeks>1 ? 'Race Day' : 'Race Week';
      if(week.daysToRaceAtStart>0 && week.daysToRaceAtStart<=7) return 'Race Week';
      if(week.daysToRaceAtStart<0) return 'After';
    } else if(week.weekIndex===totalWeeks-1) return 'Race Week';

}

// One short, high-signal sentence about what's different this week vs. last, shown at the
// top of the Plan tab - deliberately quiet (returns null) when nothing stands out, rather
// than restating "similar to last week" every single time. Checked in priority order: the
// biggest-picture thing worth knowing first, mileage-jump last since it's the most routine.
function computeCoachNote(plan, week, unit){
  const isRacePlan = !plan.planKind;
  const isFinalWeek = week.weekIndex===plan.totalWeeks-1;
  if(isRacePlan && isFinalWeek){
    return "Race week. Taper the last few days and trust the training you've already banked — this isn't the week to chase anything new.";
  }
  if(week.isCutback){
    return "Scheduled cutback week — lighter mileage on purpose, so your body can absorb the work you've already put in before the next push.";
  }
  const prev = week.weekIndex>0 ? plan.weeks[week.weekIndex-1] : null;
  if(!prev) return null;
  if(week.phase==='taper' && prev.phase!=='taper'){
    return "Taper starts this week — mileage eases off on purpose so you show up to race day fresh, not just rested.";
  }
  if(week.phase!==prev.phase){
    return `Moving from ${phaseLabel(prev.phase)} into ${phaseLabel(week.phase)} phase this week.`;
  }
  if(prev.isCutback && week.targetKm>prev.targetKm*1.08){
    return `Back up to full volume after last week's cutback — ${fmtDist(week.targetKm,unit,1)} this week. That's the rhythm, not a jump.`;
  }
  if(prev.targetKm>0){
    const pctChange = (week.targetKm-prev.targetKm)/prev.targetKm*100;
    if(pctChange>=15){
      return `Weekly mileage steps up from ${fmtDist(prev.targetKm,unit,1)} to ${fmtDist(week.targetKm,unit,1)} this week — a bigger jump than usual, so prioritize sleep and fueling.`;
    }
  }
  return null;
}

function logsInWeek(week){
  const ws = parseDate(week.weekStart), we = addDays(ws,7);
  return state.logs.filter(l=>{ const d=parseDate(l.date); return d>=ws && d<we; });
}

// All four Progress stat-tile numbers in one place, so the tiles themselves and their
// tap-to-see-the-math detail views can never drift apart from computing things twice.
function computeProgressStats(){
  const plan = state.plan, unit = state.setup.units;
  const totalLoggedKm = state.logs.reduce((s,l)=>s+l.distanceKm,0);
  const totalLoggedCount = state.logs.length;
  // Deliberately lifetime, unlike almost everything else below this line - this is the one
  // pair of numbers actually meant to span every plan you've ever had (the "total logged"
  // tile and the mileage-ladder achievements both want your whole running history, not just
  // this plan's slice of it). Everything that's supposed to measure THIS plan specifically
  // needs its own lower bound - see planStart just below - a mistake this file made once
  // already (pctPlanMilesLogged and loggedKmToDate both used to read straight off
  // totalLoggedKm/an unbounded log filter, so switching plans without a lot of history would
  // silently carry old mileage into a brand new plan's "ahead of schedule" and "% of plan
  // logged" numbers even though not a single run had been logged against it yet).
  // Normally the plan's real first day - but a plan backdated from a real training-start
  // date (see the onboarding "Track progress from" choice) can instead track "on track"
  // status only from today on, for someone who isn't going to log the weeks of running they
  // already did before setting the plan up. setup.trackingStartDate carries that choice
  // through; unset (the common case) just falls back to the plan's own start, unchanged
  // from before this existed.
  const planStart = state.setup.trackingStartDate ? parseDate(state.setup.trackingStartDate) : parseDate(plan.weeks[0].weekStart);
  // "Behind/ahead of plan" and adherence both compare against a single as-of date, not
  // necessarily today - if nothing's logged for today yet, today gets the benefit of the
  // doubt (it's not "missed" just because it's still morning) and the cutoff holds at
  // yesterday; the moment today has a log, the cutoff advances to today and BOTH sides
  // (what's logged, what's planned) update together, so a logged run is never compared
  // against a stale "planned through yesterday" total - todayDate() itself is a valid
  // fallback since a plan never schedules dates before it, guarding future-dated logs the
  // same way the old today-only cutoff did.
  const today = todayDate();
  const hasLoggedToday = state.logs.some(l=>parseDate(l.date).getTime()===today.getTime());
  const statusCutoff = hasLoggedToday ? today : addDays(today,-1);
  const loggedKmToDate = state.logs.filter(l=>{ const d=parseDate(l.date); return d>=planStart && d<=statusCutoff; }).reduce((s,l)=>s+l.distanceKm,0);
  const plannedToDateWeeks = plan.weeks.filter(w=>parseDate(w.weekStart) <= statusCutoff);
  const plannedToDateKm = plannedToDateWeeks.reduce((s,w)=>{
    return s + w.days.filter(d=>{ const dd=parseDate(d.date); return dd>=planStart && dd<=statusCutoff; }).reduce((s2,d)=>s2+d.km,0);
  },0);
  // Positive means behind (planned more than you've logged); negative means you've
  // logged more than the plan called for so far — genuinely possible (extra volume, or
  // catching up after a missed week) and worth showing as "ahead", not just floored at 0.
  const mileageDeltaKm = plannedToDateKm - loggedKmToDate;
  const mileageStatusLabel = mileageDeltaKm > 0.1 ? 'behind plan' : (mileageDeltaKm < -0.1 ? 'ahead of plan' : 'on plan');
  // "Runs completed" is the fraction of already-past planned run days that have at
  // least one log against that specific date — not a raw log-entry count, which would
  // double-count a day logged in two pieces and would also count logs against future or
  // rest days that were never part of what "completed so far" should be measuring. Same
  // statusCutoff as plannedToDateKm above.
  const plannedRunDatesToDate = [];
  plannedToDateWeeks.forEach(w=>w.days.forEach(d=>{ const dd=parseDate(d.date); if(dd>=planStart && dd<=statusCutoff && d.km>0) plannedRunDatesToDate.push(d.date); }));
  const loggedDates = new Set(state.logs.map(l=>l.date));
  const completedPlannedRuns = plannedRunDatesToDate.filter(date=>loggedDates.has(date)).length;
  const adherence = plannedRunDatesToDate.length>0 ? Math.round(100*completedPlannedRuns/plannedRunDatesToDate.length) : 0;
  // Separate from adherence (did you run on the days the plan called for): what fraction
  // of the plan's training mileage from planStart on — every week from there, not just the
  // ones behind you — have you actually logged. Race day itself isn't "training" so it's
  // excluded. Scoped to planStart (not always week 0) so this can genuinely reach 100% for
  // someone tracking from today rather than being permanently capped below it by training
  // weeks they never intended to log.
  const totalPlanTrainingKm = plan.weeks.reduce((s,w)=> s + w.days.filter(d=>d.type!=='race' && parseDate(d.date)>=planStart).reduce((s2,d)=>s2+d.km,0), 0);
  const planScopedLoggedKm = state.logs.filter(l=>parseDate(l.date)>=planStart).reduce((s,l)=>s+l.distanceKm,0);
  const pctPlanMilesLogged = totalPlanTrainingKm>0 ? Math.round(100*Math.min(1, planScopedLoggedKm/totalPlanTrainingKm)) : 0;

  // Strength sessions get their own count instead of being folded into adherence above:
  // a run log carries real distance/duration data, while "mark strength completed" is a
  // single tap with nothing behind it, so blending the two into one percentage would make
  // adherence a murkier signal (an 80% could mean a skipped long run or two skipped taps).
  // Same planStart lower bound as everything plan-relative here; the upper bound is
  // yesterday unless today's own session is already marked done, mirroring how today gets
  // the benefit of the doubt for runs (not "missed" while it's still morning).
  const strengthDone = new Set(state.strengthDone);
  const strengthCutoff = strengthDone.has(fmtDate(today)) ? today : addDays(today,-1);
  const strengthDatesToDate = plan.weeks.flatMap(w=>w.days).filter(d=>d.strength && parseDate(d.date)>=planStart && parseDate(d.date)<=strengthCutoff).map(d=>d.date);
  const strengthPlannedToDate = strengthDatesToDate.length;
  const strengthCompletedToDate = strengthDatesToDate.filter(date=>strengthDone.has(date)).length;
  const strengthPlannedTotal = plan.weeks.flatMap(w=>w.days).filter(d=>d.strength && parseDate(d.date)>=planStart).length;

  // "What would I run right now" vs "what would I have run on day one" — current fitness
  // compared to starting fitness, not the plan's own future goal. Race plans headline their
  // actual race distance; general plans have no single race, so they project three fixed
  // reference distances instead.
  const currentVdot = currentEffectiveVdot(plan, state.logs);
  const goalVdot = goalEffectiveVdot(plan, state.logs);
  // Only worth showing as a third number when it's actually different from the start - for
  // Build Distance/Maintenance/Recovery, endVdot equals startVdot by design (those plans
  // don't project a speed improvement, only race plans and Build Speed do), so this stays
  // null there rather than repeating the same value a third time.
  const hasGoal = goalVdot!=null && plan.startVdot!=null && Math.abs(goalVdot-plan.startVdot) > 0.05;
  void hasGoal;
  const raceProjection = (!isGeneralPlan(state.setup) && plan.startVdot!=null && currentVdot!=null)
    ? (()=>{ const p = fitnessProjections(plan, state.logs, todayDate(), plan.raceDistanceKm, state.setup.goalTimeSec||0); return p ? { km: plan.raceDistanceKm, start:p.start, current:p.now, goal:p.potential, goalCheck:p.goal, fitness:p.fitness } : null; })()
    : null;
  const generalProjections = (isGeneralPlan(state.setup) && plan.startVdot!=null && currentVdot!=null)
    ? PROJECTION_DISTANCES.map(d=>{ const p = fitnessProjections(plan, state.logs, todayDate(), d.km, 0); return { ...d, start:p.start, current:p.now, goal: Math.abs(p.potential.vdot-p.now.vdot)>0.05 ? p.potential : null, fitness:p.fitness }; })
    : null;

  return {
    unit, totalLoggedKm, totalLoggedCount,
    loggedKmToDate, plannedToDateKm, mileageDeltaKm, mileageStatusLabel,
    plannedRunDatesToDateCount: plannedRunDatesToDate.length, completedPlannedRuns, adherence,
    totalPlanTrainingKm, planScopedLoggedKm, pctPlanMilesLogged,
    strengthPlannedToDate, strengthCompletedToDate, strengthPlannedTotal,
    raceProjection, generalProjections,
  };
}

// Shared by manual entry and Strava import — both end up with the same log shape, so
// both should go through the same save + achievement check rather than duplicating it.
function commitLogEntry(logData){
  const item = Store.addLog(logData);
  state.logs = [item, ...state.logs];
  state.modal = null;
  const fired = evaluateAndTriggerAchievements(item);
  // No inline Undo when an achievement fires - that flow already lands on its own
  // celebration screen instead of this toast, and deleting the run afterward is still
  // always reachable the normal way (open the day, Remove this log).
  if(fired) render(); else showToast('Run logged', {logId: item.id});
}

// The full catalog of every earnable achievement - the single source of truth for both
// the popup celebrations and the persistent gallery (renderAchievementsScreen).
// tier: 'summit' (rare, plan-defining, the big hero illustration) or 'badge' (frequent,
// small icon - see badgeGlyph()).
// scope: 'plan' (only counts as earned using log entries dated on/after the CURRENT
// plan's own generatedAt, so switching plans - Change plan in Settings - makes these
// re-earnable against the new one without deleting history) or 'lifetime' (counts
// forever regardless of plan changes, since it's really about the runner's own history -
// PRs, streaks, and totals all fall here).
// repeatable: can fire more than once (a new week hit, a new PR) - tracked by a distinct
// `instance` value per occurrence, rather than "has this key ever fired."
const ACHIEVEMENTS = [

  {key:'build-complete', tier:'summit', scope:'plan', hero:'summitBadge', title:'Build phase complete', locked:'Finish every week of your build phase.'},
  {key:'peak-complete', tier:'summit', scope:'plan', hero:'summitBadge', title:'Peak phase complete', locked:'Finish every week of your peak phase.'},
  {key:'peak-long-run', tier:'summit', scope:'plan', hero:'summitBadge', title:'Peak long run conquered', locked:"Complete this plan's single longest scheduled long run."},
  {key:'full-house', tier:'summit', scope:'plan', hero:'summitBadge', title:'Full house', locked:'Log at least one of every workout type this plan uses.'},

  {key:'first-run', tier:'badge', scope:'lifetime', glyph:'flag', title:'First run logged', locked:'Log your very first run.'},
  {key:'week-fully-hit', tier:'badge', scope:'plan', repeatable:true, glyph:'calendarCheck', title:'Week fully hit', locked:"Log at least as much as a completed week's mileage target."},

  {key:'longest-run', tier:'badge', scope:'lifetime', repeatable:true, glyph:'medal', title:'New longest run', locked:'Log a run longer than any you have logged before.'},
  {key:'double-digit-run', tier:'badge', scope:'lifetime', glyph:'flag', title:'First double-digit run', locked:'Log a run of 10+ miles (about 16km).'},
  {key:'miles-50', tier:'badge', scope:'lifetime', glyph:'trophy', title:'50 miles logged', locked:'Log 50 lifetime miles.'},
  {key:'miles-100', tier:'badge', scope:'lifetime', glyph:'trophy', title:'100 miles logged', locked:'Log 100 lifetime miles.'},
  {key:'miles-250', tier:'badge', scope:'lifetime', glyph:'trophy', title:'250 miles logged', locked:'Log 250 lifetime miles.'},
  {key:'miles-500', tier:'badge', scope:'lifetime', glyph:'trophy', title:'500 miles logged', locked:'Log 500 lifetime miles.'},
  {key:'streak-7', tier:'badge', scope:'lifetime', glyph:'flame', title:'7-day streak', locked:'Log a run on 7 consecutive days.'},
  {key:'hill-climber', tier:'badge', scope:'lifetime', glyph:'peak', title:'Hill climber', locked:'Complete your first Hill Repeats session.'},
  {key:'bounced-back', tier:'badge', scope:'lifetime', repeatable:true, glyph:'flame', title:'Bounced back', locked:'Log a run within 2 days of missing a scheduled one.'},
  {key:'fitness-gains', tier:'badge', scope:'plan', glyph:'chart', title:'Fitness gains', locked:"Improve your current fitness meaningfully since this plan's start."},
  {key:'strength-logged', tier:'badge', scope:'lifetime', glyph:'dumbbell', title:'Strength session logged', locked:'Mark a strength session as completed.'},
  {key:'strength-streak', tier:'badge', scope:'lifetime', repeatable:true, glyph:'dumbbell', title:'Strength streak', locked:'Complete 4 scheduled strength sessions in a row.'},
];
const ACHIEVEMENTS_BY_KEY = Object.fromEntries(ACHIEVEMENTS.map(a=>[a.key,a]));
function badgeGlyph(key){ return ICONS[ACHIEVEMENTS_BY_KEY[key] && ACHIEVEMENTS_BY_KEY[key].glyph || 'summitBadge']; }

function isAchievementEarned(key){
  const def = ACHIEVEMENTS_BY_KEY[key];
  if(!def) return false;
  const entries = state.achievementLog.filter(e=>e.key===key);
  if(!entries.length) return false;
  if(def.scope!=='plan') return true;
  const planStart = state.plan && state.plan.generatedAt ? state.plan.generatedAt.slice(0,10) : null;
  return planStart==null || entries.some(e=>e.date>=planStart);
}
// Most recent qualifying date for a key, honoring the same plan-scope rule as
// isAchievementEarned - used by the gallery to show "earned Sep 14" under a badge.
function achievementEarnedDate(key){
  const def = ACHIEVEMENTS_BY_KEY[key];
  let entries = state.achievementLog.filter(e=>e.key===key);
  if(def && def.scope==='plan' && state.plan && state.plan.generatedAt){
    const planStart = state.plan.generatedAt.slice(0,10);
    entries = entries.filter(e=>e.date>=planStart);
  }
  if(!entries.length) return null;
  return entries.map(e=>e.date).sort().slice(-1)[0];
}
function recordAchievement(key, date, message, instance, logId){
  state.achievementLog = [...state.achievementLog, {key, date, message, instance: instance || date, logId: logId || null}];
  Store.setAchievementLog(state.achievementLog);
}
// Re-checks every currently-earned, log-tied achievement against the CURRENT set of logs,
// rather than only ever un-earning the exact log each was originally tagged with. That
// narrower approach missed real cases - e.g. a "week fully hit" earned by one log in a
// week, where a DIFFERENT log from that same week gets deleted and the week's total no
// longer clears the target: the achievement's own tagged logId is untouched, but the
// condition it represents no longer holds. Run after every deletion. For each log-tied
// entry, re-runs that achievement's own check function against every remaining log (plus
// once with no log, for checks that only look at aggregate state) - if none reproduce a
// matching result, the entry is dropped; it can always be earned again for real later,
// since isAchievementEarned just goes false. Entries with no logId (not tied to any one
// run - strength-completion ones) are left untouched, since deleting a run never affects
// what those measure.
function revalidateAchievements(){
  const candidates = [...state.logs, null];
  const stillValid = state.achievementLog.filter(entry=>{
    const def = ACHIEVEMENTS_BY_KEY[entry.key];
    const check = ACHIEVEMENT_CHECKS[entry.key];
    if(!entry.logId || !def || !check) return true;
    return candidates.some(log=>{
      const result = check(log);
      if(!result) return false;
      return !def.repeatable || (result.date || fmtDate(todayDate())) === entry.instance;
    });
  });
  if(stillValid.length!==state.achievementLog.length){
    state.achievementLog = stillValid;
    Store.setAchievementLog(state.achievementLog);
  }
}

// Longest run of consecutive calendar days with at least one log - powers the 7-day
// streak badge.
function longestLoggingStreakDays(){
  const dates = [...new Set(state.logs.map(l=>l.date))].map(d=>parseDate(d)).sort((a,b)=>a-b);
  let best=0, cur=0, prev=null;
  for(const d of dates){
    cur = (prev && daysBetween(prev,d)===1) ? cur+1 : 1;
    best = Math.max(best,cur);
    prev = d;
  }
  return best;
}
function findWeekForLog(log){
  return state.plan.weeks.find(w=>{
    const ws = parseDate(w.weekStart);
    return parseDate(log.date) >= ws && parseDate(log.date) < addDays(ws,7);
  });
}
// A completed week (its date range has fully passed) whose phase is `phaseName`, or null
// if that phase hasn't finished yet - or the plan never has one (general plans have no
// 'peak' phase, for instance, so this naturally never fires for them).
function phaseCompleteCheck(phaseName, message){
  const weeksInPhase = state.plan.weeks.filter(w=>w.phase===phaseName);
  if(!weeksInPhase.length) return null;
  const lastWeek = weeksInPhase[weeksInPhase.length-1];
  if(todayDate() < addDays(parseDate(lastWeek.weekStart),7)) return null;
  return {message};
}

// Each check takes the just-logged run (null when triggered by something else, like
// marking strength done) and returns null or {message, date?} when its condition newly
// holds - `date` is only needed for repeatable achievements, as the instance key that
// tells a later, different occurrence apart from this one.
const ACHIEVEMENT_CHECKS = {
  'plan-complete': (newLog)=>{
    const plan = state.plan;
    if(!newLog || !plan.raceDate || parseDate(newLog.date) < parseDate(plan.raceDate)) return null;
    return plan.planKind
      ? {message:"You made it through every week. However this stretch went, you earned this."}
      : {message:"Every training week led here. However today went, you earned this."};
  },
  'beat-goal': (newLog)=>{
    const setup = state.setup, plan = state.plan;
    if(!newLog || isGeneralPlan(setup) || !setup.goalTimeSec || !plan.raceDate || newLog.date!==plan.raceDate) return null;
    if(!(newLog.distanceKm>0)) return null;
    const actualPace = newLog.durationSec/newLog.distanceKm;
    const goalPace = setup.goalTimeSec/plan.raceDistanceKm;
    if(actualPace>=goalPace) return null;
    return {message:`You crossed the line at ${paceOrSpeedStr(actualPace,setup.units,state.paceFormat)} — faster than the goal pace you set out with.`};
  },
  'halfway': ()=>{
    if(computeProgressStats().pctPlanMilesLogged<50) return null;
    return {message:"You've logged half of this plan's training miles. The summit is closer than the trailhead now."};
  },
  'base-complete': ()=>phaseCompleteCheck('base', "Every base week, done — the real building starts now."),
  'build-complete': ()=>phaseCompleteCheck('build', "Build phase complete — peak weeks are next."),
  'peak-complete': ()=>phaseCompleteCheck('peak', "Peak phase complete. Taper time — the hard work is already banked."),
  'peak-long-run': ()=>{
    const longRuns = state.plan.weeks.flatMap(w=>w.days).filter(d=>d.type==='long' && d.km>0);
    if(!longRuns.length) return null;
    const maxKm = Math.max(...longRuns.map(d=>d.km));
    const peakDay = longRuns.find(d=>d.km===maxKm);
    if(!state.logs.some(l=>l.date===peakDay.date)) return null;
    return {message:`You completed this plan's longest scheduled long run — ${fmtDist(maxKm,state.setup.units,1)}.`};
  },
  'full-house': ()=>{
    const planTypes = new Set();
    state.plan.weeks.forEach(w=>w.days.forEach(d=>{ if(d.type!=='rest' && d.km>0) planTypes.add(d.type); }));
    if(planTypes.size<2) return null;
    const loggedDates = new Set(state.logs.map(l=>l.date));
    const loggedTypes = new Set();
    state.plan.weeks.forEach(w=>w.days.forEach(d=>{ if(loggedDates.has(d.date)) loggedTypes.add(d.type); }));
    if(![...planTypes].every(t=>loggedTypes.has(t))) return null;
    return {message:"You've now logged every workout type this plan calls for."};
  },
  'first-run': ()=>{
    if(state.logs.length!==1) return null;
    return {message:"You've started tracking. Every run from here builds toward the plan."};
  },
  'week-fully-hit': (newLog)=>{
    if(!newLog) return null;
    const week = findWeekForLog(newLog);
    if(!week || todayDate() < addDays(parseDate(week.weekStart),7)) return null;
    const actual = weekActualKm(week);
    if(actual < week.targetKm) return null;
    return {message:`You logged ${fmtDist(actual,state.setup.units,1)} against a ${fmtDist(week.targetKm,state.setup.units,1)} target for the week of ${niceDate(parseDate(week.weekStart))}.`, date: week.weekStart};
  },
  'perfect-week': (newLog)=>{
    if(!newLog) return null;
    const week = findWeekForLog(newLog);
    if(!week || todayDate() < addDays(parseDate(week.weekStart),7)) return null;
    const scheduledDates = week.days.filter(d=>d.km>0).map(d=>d.date);
    if(!scheduledDates.length) return null;
    const loggedDates = new Set(state.logs.map(l=>l.date));
    if(!scheduledDates.every(d=>loggedDates.has(d))) return null;
    return {message:`You ran every single scheduled day for the week of ${niceDate(parseDate(week.weekStart))} — nothing skipped.`, date: week.weekStart};
  },
  // A "new fastest"/"new longest" requires an earlier run of the same kind to beat - the
  // very first one ever logged has nothing to compare against, so it's excluded rather
  // than trivially counted as a PR.
  'fastest-tempo': (newLog)=>{
    if(!newLog) return null;
    const week = findWeekForLog(newLog);
    const day = week ? week.days.find(d=>d.date===newLog.date) : null;
    if(!day || day.type!=='tempo' || !day.paceKey) return null;
    const runs = paceRunsForType('tempo');
    const todayRun = runs.find(r=>r.date===newLog.date);
    const priorRuns = runs.filter(r=>r.date!==newLog.date);
    if(!todayRun || !priorRuns.length) return null;
    const bestPrior = Math.min(...priorRuns.map(r=>r.actualPaceSecPerKm));
    if(todayRun.actualPaceSecPerKm>=bestPrior) return null;
    return {message:`You ran today's tempo effort at ${paceOrSpeedStr(todayRun.actualPaceSecPerKm,state.setup.units,state.paceFormat)} — your best yet.`, date: newLog.date};
  },
  'fastest-long-run': (newLog)=>{
    if(!newLog) return null;
    const week = findWeekForLog(newLog);
    const day = week ? week.days.find(d=>d.date===newLog.date) : null;
    if(!day || day.type!=='long' || !day.paceKey) return null;
    const runs = paceRunsForType('long');
    const todayRun = runs.find(r=>r.date===newLog.date);
    const priorRuns = runs.filter(r=>r.date!==newLog.date);
    if(!todayRun || !priorRuns.length) return null;
    const bestPrior = Math.min(...priorRuns.map(r=>r.actualPaceSecPerKm));
    if(todayRun.actualPaceSecPerKm>=bestPrior) return null;
    return {message:`You ran today's long run at ${paceOrSpeedStr(todayRun.actualPaceSecPerKm,state.setup.units,state.paceFormat)} — your best yet.`, date: newLog.date};
  },
  'longest-run': (newLog)=>{
    if(!newLog || !(newLog.distanceKm>0)) return null;
    const priorMax = Math.max(0, ...state.logs.filter(l=>l.id!==newLog.id).map(l=>l.distanceKm));
    if(!priorMax || newLog.distanceKm<=priorMax) return null;
    return {message:`${fmtDist(newLog.distanceKm,state.setup.units,1)} — longer than anything you've logged before.`, date: newLog.date};
  },
  'double-digit-run': (newLog)=>{
    if(!newLog || !(newLog.distanceKm>0)) return null;
    if(newLog.distanceKm < unitToKm(10,'mi')) return null;
    return {message:`You logged ${fmtDist(newLog.distanceKm,state.setup.units,1)} — your first double-digit-mile run.`};
  },
  'miles-500': ()=>mileageMilestoneCheck(500),
  'miles-250': ()=>mileageMilestoneCheck(250),
  'miles-100': ()=>mileageMilestoneCheck(100),
  'miles-50': ()=>mileageMilestoneCheck(50),
  'streak-7': ()=>{
    if(longestLoggingStreakDays()<7) return null;
    return {message:"Seven days in a row, logged. That's a real habit forming."};
  },
  'hill-climber': ()=>{
    const loggedDates = new Set(state.logs.map(l=>l.date));
    const hillDay = state.plan.weeks.flatMap(w=>w.days).find(d=>d.type==='hills' && loggedDates.has(d.date));
    if(!hillDay) return null;
    return {message:"You completed your first dedicated Hill Repeats session."};
  },
  'bounced-back': (newLog)=>{
    if(!newLog) return null;
    const loggedDates = new Set(state.logs.map(l=>l.date));
    // Only a genuine "miss" if a run was already logged before it - otherwise this fires
    // trivially on day one of a brand-new plan (the very first scheduled day almost never
    // gets logged, since the plan didn't exist yet when that day started), which isn't a
    // real bounce-back, just onboarding timing.
    const missedDays = state.plan.weeks.flatMap(w=>w.days).filter(d=>
      d.km>0 && parseDate(d.date)<todayDate() && !loggedDates.has(d.date)
      && state.logs.some(l=>l.date<d.date)
    );
    for(const d of missedDays){
      for(let offset=1; offset<=2; offset++){
        if(fmtDate(addDays(parseDate(d.date),offset))===newLog.date){
          return {message:'A day got missed, and you got right back to it within two days. That consistency is what actually builds fitness.', date: newLog.date};
        }
      }
    }
    return null;
  },
  'fitness-gains': ()=>{
    const plan = state.plan;
    if(plan.startVdot==null) return null;
    const currentVdot = currentEffectiveVdot(plan, state.logs);
    if(currentVdot==null || currentVdot < plan.startVdot*1.03) return null;
    return {message:"Your current fitness has meaningfully improved since this plan's first day."};
  },
  'strength-logged': ()=>{
    if(!state.strengthDone.length) return null;
    return {message:"You marked a strength session complete. The unglamorous work counts too."};
  },
  'strength-streak': ()=>{
    const strengthDays = state.plan.weeks.flatMap(w=>w.days).filter(d=>d.strength).map(d=>d.date).sort();
    const done = new Set(state.strengthDone);
    let best=0, cur=0, endDate=null;
    for(const date of strengthDays){
      if(parseDate(date)>=todayDate()) break;
      if(done.has(date)){ cur++; if(cur>=4) endDate=date; } else cur=0;
      best = Math.max(best,cur);
    }
    if(best<4 || !endDate) return null;
    return {message:'Four scheduled strength sessions in a row, completed. That consistency is what actually prevents injury.', date: endDate};
  },
};
function mileageMilestoneCheck(miles){
  if(computeProgressStats().totalLoggedKm < unitToKm(miles,'mi')) return null;
  return {message:`You've logged ${miles} lifetime miles across every run you've tracked in this app.`};
}

// Only achievements with a genuine "getting closer" number get a progress bar in the
// gallery - most of the catalog is event-based (log one specific run, finish one specific
// phase) with nothing meaningful to show partway through, so those just keep their plain
// locked hint. Each entry returns {current, target, unitLabel} or null.
const ACHIEVEMENT_PROGRESS = {
  'miles-50': ()=>mileageProgress(50),
  'miles-100': ()=>mileageProgress(100),
  'miles-250': ()=>mileageProgress(250),
  'miles-500': ()=>mileageProgress(500),
  'streak-7': ()=>({current: longestLoggingStreakDays(), target: 7, unitLabel: 'day streak'}),
  'strength-streak': ()=>({current: currentStrengthStreak(), target: 4, unitLabel: 'in a row'}),
  'halfway': ()=>({current: computeProgressStats().pctPlanMilesLogged, target: 50, unitLabel: '%'}),
  'full-house': ()=>fullHouseProgress(),
};
function mileageProgress(miles){
  return {current: Math.round(kmToUnit(computeProgressStats().totalLoggedKm,'mi')), target: miles, unitLabel: 'mi'};
}
// Same consecutive-completed-strength-days count the strength-streak check itself uses,
// minus that check's >=4 early-exit and endDate bookkeeping (only needed there, for the
// repeat-instance key) - this just needs the plain current-best number for the bar.
function currentStrengthStreak(){
  const strengthDays = state.plan.weeks.flatMap(w=>w.days).filter(d=>d.strength).map(d=>d.date).sort();
  const done = new Set(state.strengthDone);
  let best=0, cur=0;
  for(const date of strengthDays){
    if(parseDate(date)>=todayDate()) break;
    cur = done.has(date) ? cur+1 : 0;
    best = Math.max(best,cur);
  }
  return best;
}
function fullHouseProgress(){
  const planTypes = new Set();
  state.plan.weeks.forEach(w=>w.days.forEach(d=>{ if(d.type!=='rest' && d.km>0) planTypes.add(d.type); }));
  if(planTypes.size<2) return null;
  const loggedDates = new Set(state.logs.map(l=>l.date));
  const loggedTypes = new Set();
  state.plan.weeks.forEach(w=>w.days.forEach(d=>{ if(loggedDates.has(d.date)) loggedTypes.add(d.type); }));
  const matched = [...planTypes].filter(t=>loggedTypes.has(t)).length;
  return {current: matched, target: planTypes.size, unitLabel: 'workout types'};
}
// A thin fill bar + "X of Y" caption, shown under a locked achievement's hint text. Clamps
// the visual fill just short of full even if rounding makes current reach target, since
// the achievement is by definition still locked at this point - a full-looking bar next to
// "still locked" would read as a bug, not a coincidence of rounding.
function achievementProgressHtml(key){
  const fn = ACHIEVEMENT_PROGRESS[key];
  if(!fn) return '';
  const p = fn();
  if(!p || p.target<=0) return '';
  const pct = clamp(Math.round(p.current/p.target*100), 0, 98);
  return `<div style="margin-top:6px;">
    <div style="height:4px; border-radius:2px; background:var(--surface-2); overflow:hidden;"><div style="height:100%; width:${pct}%; background:var(--accent);"></div></div>
    <div class="hint" style="margin-top:4px;">${Math.min(p.current,p.target)} of ${p.target} ${p.unitLabel}</div>
  </div>`;
}

// Runs every achievement check in catalog order (biggest/rarest first), records every one
// that newly qualifies (so nothing is ever silently lost even if one action satisfies
// several at once), but only pops up a celebration for the first - the rest are still
// earned and visible in the gallery, just without their own modal this time.
function evaluateAndTriggerAchievements(newLog){
  const earned = [];
  for(const def of ACHIEVEMENTS){
    const check = ACHIEVEMENT_CHECKS[def.key];
    if(!check) continue;
    if(!def.repeatable && isAchievementEarned(def.key)) continue;
    const result = check(newLog);
    if(!result) continue;
    const instance = result.date || fmtDate(todayDate());
    if(def.repeatable && state.achievementLog.some(e=>e.key===def.key && e.instance===instance)) continue;
    recordAchievement(def.key, fmtDate(todayDate()), result.message, instance, newLog ? newLog.id : null);
    earned.push({def, message: result.message});
  }
  if(!earned.length) return false;
  const top = earned[0];
  state.modal = {type:'milestone', data:{
    hero: top.def.tier==='summit' ? ICONS[top.def.hero] : null,
    icon: top.def.tier==='badge' ? badgeGlyph(top.def.key) : null,
    title: top.def.title,
    message: top.message,
    extraCount: earned.length-1,
  }};
  return true;
}

// "X faster/slower than at the start" — shared phrasing for every current-vs-start
// comparison below, both the race-plan tile and each general-plan distance row.
function projectionDeltaText(startTimeSec, currentTimeSec){
  const deltaSec = startTimeSec - currentTimeSec; // positive = current is the faster (lower) time
  if(Math.abs(deltaSec) < 5) return 'No change yet — moves as you log quality sessions and races';
  return `${secToClock(Math.abs(deltaSec))} ${deltaSec>0?'faster':'slower'} than at the start`;
}
// What the "now" number rests on, in one line.
function projectionEvidenceText(f){
  if(!f) return '';
  const bits = [];
  if(f.anchor && f.anchor.kind==='race'){ const r = f.raceLogs[0]; bits.push(`your ${raceLabelKm(r.distanceKm)} on ${niceDate(parseDate(r.date))}`); }
  else bits.push('your race result at setup');
  if(f.evidence.length) bits.push(`${f.evidence.length} logged quality session${f.evidence.length===1?'':'s'}`);
  if(f.sessionsDue>0) bits.push(`${f.sessionsDone} of ${f.sessionsDue} quality sessions done`);
  let text = 'Based on ' + bits.join(', ') + '.';
  if(f.decay>0) text += ` Easing after ${f.lowDays} days of light training.`;
  return text;
}
function goalCheckText(goalCheck, potential){
  if(!goalCheck) return '';
  const goal = secToClock(goalCheck.sec);
  if(goalCheck.status==='inside') return `Your goal of ${goal} sits inside what this plan can reach.`;
  if(goalCheck.status==='edge') return `Your goal of ${goal} is at the fast edge of the range — possible, not assured.`;
  return `Your goal of ${goal} is beyond what this plan supports; the realistic range is ${secToClock(potential.lowSec)}–${secToClock(potential.highSec)}.`;
}
function projectionRowsHtml(p, unit, fmt){
  const range = x => `${secToClock(x.lowSec)}–${secToClock(x.highSec)}`;
  return `
    <div class="proj-row"><div class="proj-l">At the start</div><div class="proj-v">${secToClock(p.start.sec)}</div><div class="proj-r">${paceOrSpeedStr(p.start.paceSecPerKm,unit,fmt)} · range ${range(p.start)}</div></div>
    <div class="proj-row now"><div class="proj-l">Now</div><div class="proj-v">${secToClock(p.current.sec)}</div><div class="proj-r">${paceOrSpeedStr(p.current.paceSecPerKm,unit,fmt)} · likely ${range(p.current)}</div></div>
    ${p.goal ? `<div class="proj-row"><div class="proj-l">If you complete the plan</div><div class="proj-v">${secToClock(p.goal.sec)}</div><div class="proj-r">${paceOrSpeedStr(p.goal.paceSecPerKm,unit,fmt)} · likely ${range(p.goal)}</div></div>` : ''}`;
}
// Race plans headline their one actual race distance as a tappable tile, matching the
// existing 4-tile stat pattern; general plans show three fixed reference distances as
// compact rows instead, since there's no single race to headline. Returns '' for legacy
// plans saved before the vdot model existed (no startVdot to compare against).
function renderRaceProjectionSection(stats, unit, fmt){
  if(stats.raceProjection){
    const p = stats.raceProjection;
    return `
    <div class="section-title" style="padding:0; margin-top:0;">Projected race performance</div>
    <button class="card stat-tile" data-act="open-stat-detail" data-stat="race-projection" style="padding:6px 16px 12px; margin-bottom:16px;">
      ${projectionRowsHtml(p, unit, fmt)}
      <div class="hint" style="margin-top:8px;">${projectionDeltaText(p.start.sec, p.current.sec)}. The range is the reliable part; the headline is its middle.</div>
      <div class="hint" style="margin-top:4px;">${esc(projectionEvidenceText(p.fitness))}</div>
      ${p.goalCheck ? `<div class="hint" style="margin-top:4px; color:${p.goalCheck.status==='beyond' ? 'var(--z-tempo)' : 'var(--accent-strong)'};">${esc(goalCheckText(p.goalCheck, p.goal))}</div>` : ''}
    </button>`;
  }
  if(stats.generalProjections){
    const rows = stats.generalProjections.map(p=>`
      <div class="settings-row" data-act="open-stat-detail" data-stat="general-projection-${p.key}" style="cursor:pointer;">
        <div><div class="lbl">${p.label}</div><div class="sub">${projectionDeltaText(p.start.sec, p.current.sec)}<br>likely ${secToClock(p.current.lowSec)}–${secToClock(p.current.highSec)}${p.goal ? `<br>Could reach about ${secToClock(p.goal.sec)} by the plan's end if training goes to plan` : ''}</div></div>
        <div style="text-align:right;">
          <div class="mono" style="font-weight:700;">${secToClock(p.current.sec)}</div>
          <div class="hint" style="margin:0;">${paceOrSpeedStr(p.current.paceSecPerKm,unit,fmt)}</div>
        </div>
      </div>`).join('');
    return `
    <div class="section-title" style="padding:0; margin-top:0;">Projected race performance</div>
    <div class="card" style="padding:0 16px; margin-bottom:16px;">${rows}</div>`;
  }
  return '';
}

// Every logged long run matched to its plan day, oldest first, with both distance and pace
// (paceRunsForType only tracks pace, for the trend chart - this needs distance too, to tell
// the "you used to run X, now you run Y" story). Same current-plan scoping as everywhere
// else that reads plan-matched history - a switched-away-from plan's days no longer exist
// to match logs against, so there's no reliable way to know what type an old log even was.
function longRunHistory(){
  const runs = [];
  for(const week of state.plan.weeks){
    for(const day of week.days){
      if(day.type!=='long') continue;
      const dayLogs = state.logs.filter(l=>l.date===day.date);
      if(!dayLogs.length) continue;
      const totalKm = dayLogs.reduce((s,l)=>s+l.distanceKm,0);
      const totalSec = dayLogs.reduce((s,l)=>s+l.durationSec,0);
      if(totalKm<=0) continue;
      runs.push({date:day.date, distanceKm:totalKm, paceSecPerKm: totalSec/totalKm});
    }
  }
  runs.sort((a,b)=> a.date<b.date?-1:1);
  return runs;
}
// A quiet, occasional "look how far you've come" card - the kind of thing worth noticing
// but easy to never think to check yourself, since nothing else in the app puts your first
// long run next to your most recent one. Only shows once there's real time between them
// (under 2 weeks apart reads as "this week vs. last," which the mileage chart already
// covers, not a real then-vs-now story) and only when there's actually a story to tell -
// no card is better than a flat "nothing's changed" one.
function renderTrainingFlashback(unit, fmt){
  const runs = longRunHistory();
  if(runs.length<2) return '';
  const first = runs[0], last = runs[runs.length-1];
  if(daysBetween(parseDate(first.date), parseDate(last.date)) < 14) return '';
  const distGrew = last.distanceKm > first.distanceKm*1.05;
  const paceGrew = last.paceSecPerKm < first.paceSecPerKm*0.98;
  if(!distGrew && !paceGrew) return '';
  return `<div class="section-title" style="padding:0 20px;">Then vs. now</div>
  <div class="card" style="padding:16px; margin:0 18px 24px;">
    <div class="hint" style="margin:-2px 0 14px;">Your long runs, ${niceDate(parseDate(first.date))} to now.</div>
    ${statCompareRowHtml(
      `${fmtDist(first.distanceKm,unit,1)}<div style="font-size:11px; font-weight:600; color:var(--muted); margin-top:2px;">${paceOrSpeedStr(first.paceSecPerKm,unit,fmt)}</div>`,
      'first long run',
      `${fmtDist(last.distanceKm,unit,1)}<div style="font-size:11px; font-weight:600; color:var(--muted); margin-top:2px;">${paceOrSpeedStr(last.paceSecPerKm,unit,fmt)}</div>`,
      'most recent',
      '→'
    )}
  </div>`;
}

// Total planned mileage across the whole plan, and how much of that has actually been
// logged so far (through today, scoped to this plan's own start date the same way every
// other plan-relative stat in this app is) - the one shared "how far along is the climb,
// really" figure, so the trail chart and Peek the Peak can never quietly disagree with
// each other over what should be the same number. Respects trackingStartDate (see
// computeProgressStats) the same way that function does: for a backdated plan tracked from
// today, the total is scoped down to only what's actually being tracked, so 100% is a real,
// reachable number - not permanently out of reach because of training weeks that were never
// going to be logged in the first place.
function planMileageProgress(plan){
  const planStart = state.setup.trackingStartDate ? parseDate(state.setup.trackingStartDate) : parseDate(plan.weeks[0].weekStart);
  const totalPlanKm = Math.max(1, plan.weeks.reduce((s,w)=> s + w.days.filter(d=>parseDate(d.date)>=planStart).reduce((s2,d)=>s2+d.km,0), 0));
  const today = todayDate();
  const loggedKm = state.logs.filter(l=>{ const d=parseDate(l.date); return d>=planStart && d<=today; }).reduce((s,l)=>s+l.distanceKm,0);
  const rawFrac = loggedKm/totalPlanKm;
  // `frac` stays clamped to 0-1 for anything positioning a marker on a bounded chart (the
  // trail's y-axis, Peek the Peak's climb path - neither can physically place something
  // past their own top edge); `rawFrac` is the real, uncapped ratio for anywhere that wants
  // to say something honest about actually beating the plan's total mileage.
  return {loggedKm, totalPlanKm, frac: clamp(rawFrac,0,1), rawFrac};
}

// A persistent trail map of the plan itself, not a one-off illustration: elevation is
// drawn from each week's real target mileage (not a generic ramp), so a cutback week shows
// as a genuine dip and the climb into peak phase genuinely steepens - the trail's shape IS
// this specific plan's shape, not decoration laid on top of it. A marker sits at today's
// exact position, moving smoothly day to day rather than jumping once a week. Turns the
// "Peak" branding and the halfway-up-the-mountain achievement art into something you see
// every time you check progress, not just once when it's earned.
function renderTrainingTrail(plan, unit, stats){
  const weeks = plan.weeks;
  const n = weeks.length;
  if(n<2) return '';
  const W = 340, H = 148, padX = 16, topY = 30, baseY = 108;
  const xFor = i => padX + (W-padX*2) * (i/(n-1));

  // Cumulative planned mileage through the end of each week, not that week's own mileage -
  // this is what climbs the mountain. A cutback or taper week has a smaller weekly total,
  // so it shows up as a gentler stretch of trail, not a dip back down the slope: you never
  // lose ground you've already banked. (The first version of this read elevation as
  // "how hard is this week," which is a different thing and reasonably got called out as
  // reading like backsliding during a cutback - this fixes that by making the climb
  // strictly cumulative, while still keeping the terrain shaped by real numbers: steeper
  // where the weeks are bigger, flatter where they're lighter.) Filtered the same way
  // planMileageProgress's own totalPlanKm is - a week entirely before trackingStartDate
  // (see computeProgressStats) contributes nothing to the climb, so a backdated plan
  // tracked from today reads as a flat stretch through the untracked weeks, then a real
  // climb starting exactly where tracking does, reaching the same total either way.
  const trackingStart = state.setup.trackingStartDate ? parseDate(state.setup.trackingStartDate) : parseDate(weeks[0].weekStart);
  let running = 0;
  const plannedCum = weeks.map(w => (running += w.days.filter(d=>parseDate(d.date)>=trackingStart).reduce((s,d)=>s+d.km,0)));
  const totalPlanKm = planMileageProgress(plan).totalPlanKm;
  const yFor = km => baseY - clamp(km/totalPlanKm,0,1) * (baseY-topY);
  const plannedPts = weeks.map((w,i)=>({x:xFor(i), y:yFor(plannedCum[i])}));

  const today = todayDate();
  let idx = weeks.findIndex(w=>{ const ws=parseDate(w.weekStart); return today>=ws && today<addDays(ws,7); });
  let cont;
  if(idx!==-1){
    cont = idx + clamp(daysBetween(parseDate(weeks[idx].weekStart),today)/7, 0, 0.999);
  } else if(today < parseDate(weeks[0].weekStart)){
    idx = 0; cont = 0;
  } else {
    idx = n-1; cont = n-1;
  }
  const loIdx = Math.min(n-2, Math.floor(cont));
  const frac = cont-loIdx;
  // The marker sits ON the planned line itself, at today's interpolated point along it -
  // literally tracing the one visible trail, not a second near-invisible line of its own.
  // An earlier version plotted actual-logged-so-far as a separate path against the SAME
  // total-plan-mileage scale, which was honest but read as confusing: early in a long plan
  // that line is necessarily short and nearly flat (a runner is right to expect a visible
  // "you are here" for a low-percent state, not something that looks like it's barely
  // moved), and it left the obvious diagonal with no marker on it at all.
  const youAreHere = {
    x: plannedPts[loIdx].x + (plannedPts[loIdx+1].x-plannedPts[loIdx].x)*frac,
    y: plannedPts[loIdx].y + (plannedPts[loIdx+1].y-plannedPts[loIdx].y)*frac,
  };
  // Ahead/behind still shown, just as the marker's own color now rather than a second line -
  // deliberately reuses the SAME mileageStatusLabel the "mi ahead/behind" stat tile below
  // already computes precisely (real day-by-day planned mileage vs. logged, not a linear
  // approximation across a whole week) rather than re-deriving a second, cruder estimate
  // here. An earlier version compared actual-to-date against `plannedCum[loIdx]` interpolated
  // toward `plannedCum[loIdx+1]` - loIdx/frac are indices into the CURRENT week's own
  // checkpoint pair (used below for the marker's on-trail position), so that comparison
  // silently counted the entire current week's target as already "due" from the moment the
  // week began, making early progress read as behind when it was genuinely ahead. Sourcing
  // this from the shared stats object guarantees the trail can never disagree with the tile
  // right below it about the same underlying fact.
  const onPaceOrAhead = stats.mileageStatusLabel !== 'behind plan';
  const markerColor = onPaceOrAhead ? 'var(--accent)' : 'var(--z-tempo)';
  const markerRingColor = onPaceOrAhead ? 'var(--accent-strong)' : 'var(--z-tempo)';

  // A quadratic curve through each pair's midpoint reads as a smooth trail rather than a
  // jagged connect-the-dots line, without needing full Catmull-Rom math for what's really a
  // stylized elevation impression, not a precision chart.
  const smooth = ps => {
    if(ps.length<2) return '';
    let d = `M ${ps[0].x.toFixed(1)} ${ps[0].y.toFixed(1)}`;
    for(let i=0;i<ps.length-1;i++){
      const a=ps[i], b=ps[i+1], mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
      d += ` Q ${a.x.toFixed(1)} ${a.y.toFixed(1)} ${mx.toFixed(1)} ${my.toFixed(1)}`;
    }
    const last = ps[ps.length-1];
    d += ` L ${last.x.toFixed(1)} ${last.y.toFixed(1)}`;
    return d;
  };

  // The planned trail is drawn as one segment per phase, reusing weekColorVar - the exact
  // color each week's own tab already uses in the week strip above - so the color language
  // matches across the app instead of introducing a second palette. Each segment overlaps
  // its neighbor by one point so there's no visible seam at a phase boundary.
  const segments = [];
  let segStart = 0;
  for(let i=1;i<=n;i++){
    if(i===n || weekColorVar(weeks[i])!==weekColorVar(weeks[segStart])){
      segments.push({from:segStart, to:Math.min(n-1,i)});
      segStart = i;
    }
  }
  const segPaths = segments.map(seg => ({ d: smooth(plannedPts.slice(seg.from, seg.to+1)), color: weekColorVar(weeks[seg.from]) }));

  const finishColor = plan.planKind ? 'var(--accent-strong)' : 'var(--z-race)';
  const last = plannedPts[n-1];
  const hx = youAreHere.x.toFixed(1), hy = youAreHere.y.toFixed(1);
  const label = `Week ${idx+1} of ${n} · ${weekDisplayLabel(weeks[idx], plan.totalWeeks, plan.planKind)}`;
  const paceNote = onPaceOrAhead ? 'on pace or ahead' : 'a bit behind pace';

  // Axis reference labels - the total planned mileage at the peak gives the y-axis a real
  // scale, the week/zero labels at the baseline give the x-axis one, so the shape can be read
  // as actual data instead of only as a mood. "Wk 1" and "0 mi" share one line below the
  // baseline (rather than "0 mi" sitting just above it) specifically so nothing occupies the
  // above-baseline space near the trailhead - that's exactly where the "you are here" marker
  // and its own delta label sit during the whole first week of a plan, and an early version
  // of this had them overlapping.
  const zeroLabel = esc(fmtDist(0,unit,0)), totalLabel = esc(fmtDist(totalPlanKm,unit,0));
  const axisLabels = `
    <text x="${(W-padX).toFixed(1)}" y="${(topY-16).toFixed(1)}" text-anchor="end" style="font-size:8px; font-family:var(--font-body); fill:var(--muted);">${totalLabel}</text>
    <text x="${padX}" y="${(baseY+16).toFixed(1)}" style="font-size:8px; font-family:var(--font-body); fill:var(--muted);">Wk 1 · ${zeroLabel}</text>
    <text x="${(W-padX).toFixed(1)}" y="${(baseY+16).toFixed(1)}" text-anchor="end" style="font-size:8px; font-family:var(--font-body); fill:var(--muted);">Wk ${n}</text>`;

  // The "you are here" marker gets its own numeric callout (real miles ahead/behind, not
  // just a color) right on the chart, reusing the exact same stats the caption and the stat
  // tile below already agree on. Anchor flips near either edge so the label can't run off the
  // canvas; the label drops below the dot instead of above it when the dot itself is close
  // enough to the top edge that an above-label would clip out of the viewBox.
  const hxNum = parseFloat(hx), hyNum = parseFloat(hy);
  const deltaAnchor = hxNum < padX+34 ? 'start' : (hxNum > W-padX-34 ? 'end' : 'middle');
  const deltaBelowDot = hyNum < topY+22;
  const deltaY = (deltaBelowDot ? hyNum+20 : hyNum-12).toFixed(1);
  const deltaLabel = esc(`${onPaceOrAhead?'+':'−'}${fmtDist(Math.abs(stats.mileageDeltaKm),unit,0)}`);

  // Legend - only the phases THIS plan actually uses (a Maintenance plan never shows
  // Peak/Taper, say), same colors as weekColorVar/the week-strip tabs above, so the color
  // language is explained once on the chart itself rather than left for the caption's
  // "colored by phase" to gesture at without ever saying which color is which.
  const PHASE_ORDER = ['base','build','peak','taper','maintenance','recovery','cutback'];
  const seenPhaseKeys = new Set();
  const legendItems = [];
  weeks.forEach(w=>{
    const key = w.isCutback ? 'cutback' : w.phase;
    if(seenPhaseKeys.has(key)) return;
    seenPhaseKeys.add(key);
    legendItems.push({key, color: weekColorVar(w), phaseLabel: w.isCutback ? 'Cutback' : phaseLabel(w.phase)});
  });
  legendItems.sort((a,b)=>PHASE_ORDER.indexOf(a.key)-PHASE_ORDER.indexOf(b.key));
  const legendHtml = `<div style="display:flex; flex-wrap:wrap; gap:10px 14px; margin-top:10px;">${legendItems.map(li=>
    `<div style="display:flex; align-items:center; gap:5px;"><span style="width:8px; height:8px; border-radius:50%; background:${li.color}; flex:none;"></span><span style="font-size:12px; color:var(--muted);">${esc(li.phaseLabel)}</span></div>`
  ).join('')}</div>`;

  return `<div class="section-title" style="padding:0 20px;">Your trail</div>
  <button class="card" data-act="open-trail-week" style="display:block; text-align:left; padding:14px 14px 10px; margin:0 18px 24px; cursor:pointer;">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block;">
      <style>@media (prefers-reduced-motion: reduce){ .trail-pulse{ display:none; } }</style>
      <line x1="${padX}" y1="${baseY}" x2="${W-padX}" y2="${baseY}" stroke="var(--line-soft)" stroke-width="1"/>
      ${segPaths.map(sp=>`<path d="${sp.d}" fill="none" stroke="${sp.color}" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>`).join('')}
      <circle cx="${plannedPts[0].x.toFixed(1)}" cy="${plannedPts[0].y.toFixed(1)}" r="3" fill="var(--muted)"/>
      <path d="M ${last.x.toFixed(1)} ${(last.y-11).toFixed(1)} L ${(last.x-6).toFixed(1)} ${(last.y-1).toFixed(1)} L ${(last.x+6).toFixed(1)} ${(last.y-1).toFixed(1)} Z" fill="${finishColor}"/>
      ${axisLabels}
      <line x1="${hx}" y1="${hy}" x2="${hx}" y2="${baseY}" stroke="${markerRingColor}" stroke-width="1" stroke-dasharray="2 3"/>
      <circle class="trail-pulse" cx="${hx}" cy="${hy}" r="5" fill="none" stroke="${markerRingColor}" stroke-width="2" opacity="0.6">
        <animate attributeName="r" values="5;12;5" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="${hx}" cy="${hy}" r="5" fill="${markerColor}" stroke="var(--surface)" stroke-width="2"/>
      <text x="${hx}" y="${deltaY}" text-anchor="${deltaAnchor}" style="font-size:9px; font-weight:700; font-family:var(--font-body); fill:${markerColor};">${deltaLabel}</text>
    </svg>
    <div class="hint" style="margin-top:6px;">${esc(label)} — steeper sections are bigger weeks, colored by phase. You're ${paceNote} on real logged miles. Tap to jump to this week.</div>
    ${legendHtml}
  </button>`;
}

// A big, purely-for-fun illustrated climb - unlike the trail above, this one's jagged edges
// carry no real data at all (they're stylized on purpose, per the user's own brief: "the
// jagged edges don't matter insofar as they go up and down"). The one real number is the
// runner's position, placed by actual arc-length along the hand-drawn climb path so it
// genuinely looks like climbing rather than jumping in a straight line - see
// startPeekAnimation() for the runtime half of this (path.getTotalLength() needs a real
// mounted DOM node, so the animation itself can't be precomputed into static markup the way
// everything else in this app is).
const PEEK_CLIMB_PTS = [[15,540],[70,486],[30,444],[85,402],[48,352],[105,310],[72,258],[128,216],[98,164],[145,122],[128,80],[160,42]];
const PEEK_DESCENT_PTS = [[215,108],[195,180],[240,252],[210,334],[260,416],[225,478],[305,540]];
// A staircase off the summit, offset relative to it (0,0 = summit) - only drawn once
// there's real mileage beyond the plan's own total to justify it. Deliberately NOT another
// data-driven axis: the runner always lands exactly halfway up it regardless of how far
// past 100% the real number goes (101% and 1000% look identical here) - the user's own
// call ("there's no more calculation"), since past the summit this is celebration, not a
// second chart.
const PEEK_STAIR_OFFSETS = [[0,0],[0,-16],[10,-16],[10,-32],[20,-32],[20,-48],[30,-48],[30,-64],[40,-64],[40,-80],[50,-80],[50,-96],[60,-96],[60,-112],[70,-112],[70,-128],[80,-128]];
function renderPeekThePeak(){
  const plan = state.plan, unit = state.setup.units;
  const progress = planMileageProgress(plan);
  const isOvershoot = progress.rawFrac>1;
  const climbD = 'M ' + PEEK_CLIMB_PTS.map(p=>p.join(' ')).join(' L ');
  const mountainD = climbD + ' L ' + PEEK_DESCENT_PTS.map(p=>p.join(' ')).join(' L ') + ' Z';
  const capPts = PEEK_CLIMB_PTS.slice(6).concat(PEEK_DESCENT_PTS.slice(0,3));
  const capD = 'M ' + capPts.map(p=>p.join(' ')).join(' L ') + ' Z';
  const summit = PEEK_CLIMB_PTS[PEEK_CLIMB_PTS.length-1];
  const flagLabel = plan.planKind ? 'FINISH' : 'RACE DAY';
  const pctDisplay = Math.round(progress.rawFrac*100);
  const overshootKm = Math.max(0, progress.loggedKm-progress.totalPlanKm);
  const captionSub = isOvershoot
    ? `${fmtDist(overshootKm,unit,1)} beyond this plan's ${fmtDist(progress.totalPlanKm,unit,0)} planned miles`
    : `${fmtDist(progress.loggedKm,unit,1)} of ${fmtDist(progress.totalPlanKm,unit,0)} planned miles for this plan`;
  // Extra sky above the summit only exists when it's needed - the normal viewBox is
  // unchanged for everyone still climbing the mountain itself.
  const topY = isOvershoot ? -160 : 0;
  const stairPts = PEEK_STAIR_OFFSETS.map(([dx,dy])=>[summit[0]+dx, summit[1]+dy]);
  const stairD = isOvershoot ? 'M ' + stairPts.map(p=>p.join(' ')).join(' L ') : '';
  const notes = isOvershoot ? [
    {x:summit[0]+18, y:summit[1]-55, s:18, o:0.85, g:'♪'},
    {x:summit[0]+62, y:summit[1]-100, s:22, o:0.7, g:'♫'},
    {x:summit[0]+38, y:summit[1]-135, s:15, o:0.9, g:'♪'},
  ] : [];
  return `<div class="overlay peek-overlay" data-act="close-modal-overlay">
    <div class="peek-card" data-stop="1">
      <button class="peek-close" data-act="close-modal" aria-label="Close">${ICONS.close}</button>

// Animates #peek-runner from the base of #peek-climb-path to its real progress point, by
// actual arc length along the path rather than a straight line - needs the SVG already
// mounted (getTotalLength/getPointAtLength are real DOM measurements), so this runs from
// render()'s post-render hook, not as part of the static markup above. Guarded by a data
// attribute so re-renders while the modal is already open (a toast elsewhere, say) don't
// restart the climb from the bottom again.
function startPeekAnimation(){
  const svg = document.getElementById('peek-svg');
  const path = document.getElementById('peek-climb-path');
  const runner = document.getElementById('peek-runner');
  if(!svg || !path || !runner || svg.dataset.animated) return;
  svg.dataset.animated = '1';
  const frac = Number(svg.dataset.frac)||0;
  const climbLen = path.getTotalLength();
  // Past 100%, the runner finishes the real mountain climb (frac is clamped to 1, so this
  // always reaches the summit) and then continues onto the staircase - fixed exactly
  // halfway up it, not proportional to how far past the summit the real mileage goes.
  const stairPath = svg.dataset.overshoot ? document.getElementById('peek-stair-path') : null;
  const stairLen = stairPath ? stairPath.getTotalLength() : 0;
  const targetLen = stairPath ? climbLen + stairLen*0.5 : climbLen*frac;
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const place = len => {
    const pt = len<=climbLen ? path.getPointAtLength(len) : stairPath.getPointAtLength(len-climbLen);
    runner.setAttribute('transform', `translate(${pt.x} ${pt.y})`);
  };
  // The staircase, its notes, and the playful caption line all stay hidden until the
  // runner's animated position actually reaches the summit - revealed here as one small
  // moment instead of being visible the instant the modal opens, so beating the plan is a
  // surprise you climb into, not something spoiled before the runner has taken a step.
  let revealed = false;
  const reveal = () => {
    if(revealed || !stairPath) return;
    revealed = true;
    stairPath.style.opacity = '1';
    const notes = document.getElementById('peek-notes');
    if(notes) notes.style.opacity = '1';
    const pctEl = document.getElementById('peek-pct');
    if(pctEl){ pctEl.textContent = pctEl.dataset.stairwayText; pctEl.style.fontSize = '19px'; }
  };
  runner.setAttribute('opacity','1');
  if(reduceMotion || targetLen<=0){ place(targetLen); if(targetLen>=climbLen) reveal(); return; }
  const durationMs = stairPath ? 3600 : 2800;
  const start = performance.now();
  function step(now){
    const t = clamp((now-start)/durationMs, 0, 1);
    const eased = 1 - Math.pow(1-t, 3);
    const len = eased*targetLen;
    place(len);
    if(len>=climbLen) reveal();
    if(t<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function weekActualKm(week){
  return logsInWeek(week).reduce((s,l)=>s+l.distanceKm,0);
}
function chartWeekLabel(week){
  const dt = parseDate(week.weekStart);
  return `${dt.getMonth()+1}/${dt.getDate()}`;
}

// Every logged-vs-planned pace pairing for `type`, oldest first — the raw material for
// the pace tracker's trend line. Only long/tempo (each with one clean, structured target
// pace) are shown in the UI — easy/hills/fartlek are intentionally run by feel with no
// single "right" pace, and rest/race aren't training-pace days at all. actualPaceSecPerKm
// already backs out any warm-up/cool-down portion via qualityEffortPaceSecPerKm, so a
// tempo day's trend point reflects the tempo effort itself, not a blend with easy miles.
function paceRunsForType(type){
  const matches = [];
  for(const week of state.plan.weeks){
    for(const day of week.days){
      if(day.type!==type || !day.paceKey) continue;
      // Logging two runs against the same plan day (a split effort, or a correction)
      // shouldn't silently drop one of them — combine every log on that date into a
      // single actual pace for the day, rather than matching only the first found.
      const dayLogs = state.logs.filter(l=>l.date===day.date);
      if(!dayLogs.length) continue;
      const totalKm = dayLogs.reduce((s,l)=>s+l.distanceKm,0);
      const totalSec = dayLogs.reduce((s,l)=>s+l.durationSec,0);
      if(totalKm<=0) continue;
      const weekPaces = getWeekPaces(state.plan, week, state.logs);
      const plannedPaceSecPerKm = day.paceOverrideSecPerKm!=null ? day.paceOverrideSecPerKm : weekPaces[day.paceKey];
      if(plannedPaceSecPerKm==null) continue;
      const actualPaceSecPerKm = qualityEffortPaceSecPerKm(day, totalKm, totalSec, state.plan);
      matches.push({date:day.date, actualPaceSecPerKm, plannedPaceSecPerKm});
    }
  }
  matches.sort((a,b)=> a.date<b.date?-1:1);
  return matches;
}
// A delta this big (12% of that run's own target pace) or more maxes out the trend
// line's vertical scale, so one outlier can't flatten the rest of the chart.
const PACE_TREND_CAP_FRAC = 0.12;
const PACE_ON_TARGET_SEC_PER_KM = 2;
function paceRunColor(run){
  const deltaSecPerKm = run.actualPaceSecPerKm - run.plannedPaceSecPerKm;
  if(Math.abs(deltaSecPerKm)<PACE_ON_TARGET_SEC_PER_KM) return 'var(--muted)';
  return deltaSecPerKm>=0 ? 'var(--z-tempo)' : 'var(--accent-strong)';
}
// Same math/formatting as paceDeltaLine (see below, actual-vs-that-day's-target), but
// comparing two actual runs against each other instead - used by the then-vs-now header
// to say "how much have you actually improved" in the same units and phrasing the rest
// of the pace tracker already uses. Returns direction alongside the text so callers can
// color it without re-parsing the string.
function paceGainLine(fromSecPerKm, toSecPerKm, unit, fmt){
  const deltaSecPerKm = toSecPerKm - fromSecPerKm; // negative = got faster
  const deltaDisplayPerUnit = unit==='mi' ? deltaSecPerKm*KM_PER_MI : deltaSecPerKm;
  if(Math.abs(deltaDisplayPerUnit)<3) return {text:'Holding steady', direction:'steady'};
  if(fmt==='speed'){
    const fromSpeed = 3600/(unit==='mi'?fromSecPerKm*KM_PER_MI:fromSecPerKm);
    const toSpeed = 3600/(unit==='mi'?toSecPerKm*KM_PER_MI:toSecPerKm);
    const faster = toSpeed>fromSpeed;
    return {text:`${Math.abs(toSpeed-fromSpeed).toFixed(1)} ${unit==='mi'?'mph':'km/h'} ${faster?'faster':'slower'}`, direction: faster?'faster':'slower'};
  }
  const faster = deltaDisplayPerUnit<0;
  return {text:`${secToClock(Math.abs(deltaDisplayPerUnit))}/${unit} ${faster?'faster':'slower'}`, direction: faster?'faster':'slower'};
}
// Headline comparison: the very first logged run of this type against the latest, so the
// card tells a "since you started" story even with just two points - the same reasoning
// as the Projected Race Performance tile's start-vs-now framing above it on this same
// tab, reused here rather than invented fresh. Complements the trend bars below it, which
// show each run against THAT DAY's own target instead of against the first run. Only
// shown once there are at least two logged runs - with just one there's no "since" yet.
function paceThenVsNowHtml(allRuns, unit, fmt){
  if(allRuns.length<2) return '';
  const first = allRuns[0], last = allRuns[allRuns.length-1];
  const gain = paceGainLine(first.actualPaceSecPerKm, last.actualPaceSecPerKm, unit, fmt);
  const color = gain.direction==='steady' ? 'var(--muted)' : (gain.direction==='faster' ? 'var(--accent-strong)' : 'var(--z-tempo)');
  const bg = gain.direction==='steady' ? 'var(--surface-2)' : (gain.direction==='faster' ? 'var(--accent-soft)' : 'var(--z-tempo-bg)');
  const arrow = `<svg class="tn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;
  const dateLabel = d => { const dt = parseDate(d); return `${dt.getMonth()+1}/${dt.getDate()}`; };
  return `
    <div class="tn-row">
      <div class="tn-col"><div class="tn-label">First logged</div><div class="tn-pace mono">${paceOrSpeedStr(first.actualPaceSecPerKm,unit,fmt)}</div><div class="tn-date mono">${dateLabel(first.date)}</div></div>
      ${arrow}
      <div class="tn-col"><div class="tn-label">Most recent</div><div class="tn-pace mono">${paceOrSpeedStr(last.actualPaceSecPerKm,unit,fmt)}</div><div class="tn-date mono">${dateLabel(last.date)}</div></div>
    </div>
    <div class="tn-badge" style="color:${color}; background:${bg};">${gain.text} · ${allRuns.length} logged</div>
  `;
}
// Each logged run as a bar growing from a zero line - length is how far off THAT DAY's
// own target pace it was (capped at PACE_TREND_CAP_FRAC, the same cap the old line chart
// used, so one outlier can't flatten the rest), direction is immediate, no slope to read.
// Unlike a line, a single bar is still a meaningful statement on its own - this reads
// fine from the very first logged run, not only once enough points exist to draw a trend.
function paceTrendBarsHtml(runs, unit, fmt){
  return runs.map(r=>{
    const deltaSecPerKm = r.actualPaceSecPerKm - r.plannedPaceSecPerKm; // positive = slower
    const deltaFrac = clamp(deltaSecPerKm/r.plannedPaceSecPerKm, -PACE_TREND_CAP_FRAC, PACE_TREND_CAP_FRAC);
    const pct = Math.abs(deltaFrac/PACE_TREND_CAP_FRAC)*50;
    const color = paceRunColor(r);
    const onTarget = Math.abs(deltaSecPerKm) < PACE_ON_TARGET_SEC_PER_KM;
    const fillStyle = deltaSecPerKm<0 ? `left:50%; width:${pct.toFixed(1)}%;` : `right:50%; width:${pct.toFixed(1)}%;`;
    const dt = parseDate(r.date);
    const dateStr = `${dt.getMonth()+1}/${dt.getDate()}`;
    const deltaDisplayPerUnit = Math.abs(unit==='mi' ? deltaSecPerKm*KM_PER_MI : deltaSecPerKm);
    const deltaLabel = onTarget ? 'on pace' : `${deltaSecPerKm<0?'-':'+'}${Math.round(deltaDisplayPerUnit)}s`;
    return `<div class="trend-bar-row">
      <span class="trend-bar-date mono">${esc(dateStr)}</span>
      <div class="trend-bar-track"><div class="trend-bar-zero"></div>${onTarget?'':`<div class="trend-bar-fill" style="${fillStyle} background:${color};"></div>`}</div>
      <span class="trend-bar-delta mono" style="color:${color};">${esc(deltaLabel)}</span>
    </div>`;
  }).join('');
}
function paceTrackerRowHtml(type, label){
  const unit = state.setup.units, fmt = state.paceFormat;
  const allRuns = paceRunsForType(type);
  if(!allRuns.length){
    return `<div style="padding:14px 0; border-bottom:1px solid var(--line-soft);">
      <div style="font-weight:700; font-size:14px;">${label}</div>
      <div class="hint" style="margin:2px 0 0;">No logged ${label.toLowerCase()} yet.</div>
    </div>`;
  }
  const runs = allRuns.slice(-8);
  const mostRecent = runs[runs.length-1];

  return `<div style="padding:14px 0; border-bottom:1px solid var(--line-soft);">
    <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;">
      <span style="font-weight:700; font-size:14px;">${label}</span>
      <span class="mono" style="font-size:11px; color:var(--muted);">${allRuns.length} logged</span>
    </div>
    ${paceThenVsNowHtml(allRuns, unit, fmt)}
    ${paceTrendBarsHtml(runs, unit, fmt)}
    <div class="hint" style="margin-top:8px;">Target ${paceOrSpeedStr(mostRecent.plannedPaceSecPerKm,unit,fmt)}</div>
  </div>`;
}

function renderSettingsTab(){
  const s = state.setup, unit = s.units, fmt = state.paceFormat;
  const currentWeek = state.plan.weeks[state.currentWeekIndex];
  const cw = getWeekPaces(state.plan, currentWeek, state.logs);
  const fit = fitnessFor(state.plan, state.logs);
  const speedUnitLabel = unit==='mi' ? 'mph' : 'km/h';
  return `

/* ============================= modals ============================= */
function renderModal(){
  const m = state.modal;
  if(m.type==='day-detail') return renderDayDetail();
  if(m.type==='log-run') return modalLogRun();
  if(m.type==='edit-day') return modalEditDay();
  if(m.type==='confirm-swap') return modalConfirmSwap(m.data);
  if(m.type==='confirm-reset') return modalConfirmReset();
  if(m.type==='confirm-import') return modalConfirmImport(m.data);
  if(m.type==='stat-detail') return renderStatDetailModal(m.stat);
  if(m.type==='milestone') return modalMilestone(m.data);
  if(m.type==='achievements') return renderAchievementsScreen();
  if(m.type==='pacing-sheet') return renderPacingSheet(m.strategy||'even', m.courseKey||null);
  if(m.type==='peek-the-peak') return renderPeekThePeak();
  if(m.type==='help') return renderHelpModal(m.tab);
  if(m.type==='library') return renderLibraryModal(m.q||'');
  return '';
}

// One short explainer per tab, written for what's actually ON that screen right now rather
